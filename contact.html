<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обратная связь — Раджабов Шахром</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">⚕</div>
        <span>Шахром Раджабов</span>
      </a>
      <button class="burger" id="burger" aria-label="Меню">☰</button>
      <nav class="nav" id="nav">
        <a href="index.html">О себе</a>
        <a href="materials.html">Материалы</a>
        <a href="books.html">Книги</a>
        <a href="contact.html" class="active">Обратная связь</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h2 class="section-title">Обратная связь</h2>
      <p style="margin-bottom: 26px; color: var(--text-light); max-width: 520px;">
        Есть вопросы по материалам или предложения? Напишите — постараюсь ответить.
      </p>
      <form class="contact-form" id="contactForm" onsubmit="return handleSubmit(event)">
        <div class="form-group">
          <label for="name">Ваше имя</label>
          <input type="text" id="name" name="name" required placeholder="Как к вам обращаться">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="message">Сообщение</label>
          <textarea id="message" name="message" required placeholder="Ваш вопрос или предложение..."></textarea>
        </div>
        <button type="submit" class="btn">Отправить</button>
      </form>
      <p style="margin-top: 20px; font-size: 0.88rem; color: var(--text-light);">
        Форма сейчас в демо-режиме. Для реальной работы можно подключить Formspree или Netlify Forms.
      </p>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>© 2025–2026 Раджабов Шахром. Студент-медик.</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      alert('Спасибо, ' + name + '! Сообщение принято (демо-режим).');
      document.getElementById('contactForm').reset();
      return false;
    }
  </script>
</body>
</html>
