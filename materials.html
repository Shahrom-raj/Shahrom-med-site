<p style="margin:0 0 10px">## <b>Диагностика</b></p>
<p style="margin:0 0 10px">• <b>характерный признак</b> (Р.): отёчный участок мягких тканей с красновато-цианотичным цветом кожи над</p>
<p style="margin:0 0 10px">ним и <b>признаками флюктуации</b> ; общие симптомы --- нарастающий токсикоз, повышение температуры, ухудшение аппетита;</p>
<p style="margin:0 0 10px">• <b>динамика</b> (И.): красное пятно → багровая, затем цианотичная кожа → уплотнение и отёк → ко 2-м суткам</p>
<p style="margin:0 0 10px">флюктуация; быстрое распространение в течение часов;</p>
<p style="margin:0 0 10px">• <b>при вскрытии</b> : мутная серозная жидкость или жидкий гной с кусочками серой ткани (И.);</p>
<p style="margin:0 0 10px">• ребёнка переводят в отделение хирургии новорождённых (Р.);</p>
<p style="margin:0 0 10px">• <b>лабораторно</b> (по общим принципам): общий анализ крови (лейкоцитоз, сдвиг влево, СОЭ); посев гноя и</p>
<p style="margin:0 0 10px">крови на флору и чувствительность --- нужен для смены антибиотика; оценка тяжести токсикоза и признаков сепсиса.</p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                           <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Рожа новорождённых (И.)</b>                                                         медно-красная гиперемия с <b>чёткими фестончатыми границами</b> , склонность к распространению, зуд/жжение; чаще начинается вокруг пупка, на половых органах и в области заднего прохода; возбудитель --- β-гемолитический стрептококк группы А; <b>принципы лечения различаются</b> , поэтому важно строго отличать от флегмоны (рожа --- антибиотики, физиотерапия; флегмона --- разрезы)</p>
<p style="margin:0 0 10px"><b>Адипонекроз (склерема-подобный; асептический некроз подкожной клетчатки) (И.)</b>   результат сдавления тканей в родовых путях при патологических родах; нет общих и местных воспалительных симптомов; типична <b>бугристая инфильтрация</b> и <b>пятнистая гиперемия</b></p>
<p style="margin:0 0 10px"><b>Омфалит с флегмоной передней брюшной стенки (Р.)</b>                                очаг вокруг пупка; мокнущая пупочная ранка, фибринозные наложения, гной при надавливании</p>
<p style="margin:0 0 10px"><b>Гнойный мастит с флегмоной грудной клетки (Р., И.)</b>                              поражение грудной железы, физиологическое нагрубание, радиальные разрезы</p>
<p style="margin:0 0 10px"><b>Абсцесс, лимфаденит, остеомиелит с околокостной флегмоной (общие)</b>               очаг по ходу кости, ограничение движения, рентген/УЗИ</p>
<p style="margin:0 0 10px"><b>Псевдофурункулёз и пиодермии (общие)</b>                                            множественные узелки, поражение потовых желёз без быстрого некроза (вопросы 157--158)</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   насечки · некрэктомия · оксациллин · нетилмицин · гипертонический раствор · лазеротерапия</p>
<p style="margin:0 0 10px">## <b>Лечение</b></p>
<p style="margin:0 0 10px">Лечение <b>комплексное и своевременное</b> ; хирургическое (Р.), в операционной.</p>
<p style="margin:0 0 10px"><b>Компонент</b>            <b>Что делают</b></p>
<p style="margin:0 0 10px"><b>Хирургическое (Р.)</b>   после обработки кожи <b>насечки на глубину около 1 см</b> так, чтобы создать отток межуточной жидкости; сверху компресс: гипертонический раствор, спирт (пополам) и водорастворимая мазь; <b>повязку меняют через 2--4 ч</b> ; при распространении гиперемии насечки дополняют по краю изменённой кожи</p>
<p style="margin:0 0 10px"><b>Местное по Исакову</b>   множественные <b>мелкие разрезы</b> в зоне поражения и по границе со здоровыми участками (уменьшают отёк и отграничивают процесс); предварительно обкалывание 0,25 % прокаином с антибиотиками; влажная повязка с антисептиками (1 % хлорофиллипт, томицид, гипертонический NaCl); перевязка через 6--8 ч; при дальнейшем распространении --- новые разрезы</p>
<p style="margin:0 0 10px"><b>Некрэктомия</b>          при некрозах кожи и клетчатки --- после отграничения процесса (Р., И.)</p>
<p style="margin:0 0 10px"><b>Заживление раны</b>      физиотерапия, лазеротерапия, ультразвуковая обработка ран, общая стимулирующая терапия; <b>пластику кожи у новорождённых не делают</b> (Р.); грубые деформирующие рубцы --- пластическая операция в старшем возрасте (И.)</p>
<p style="margin:0 0 10px"><b>Антибиотики (И.)</b>     без признаков сепсиса: <b>оксациллин</b> внутримышечно 200 000 ЕД/кг в сутки; тяжелее --- + аминогликозид (нетилмицин в/в 6--8 мг/кг 1 раз в сутки); при позднем поступлении, неэффективности ранее начатой терапии, сепсисе --- <b>цефтазидим + ванкомицин</b></p>
<p style="margin:0 0 10px"><b>Общее лечение (И.)</b>   иммунотерапия, дезинтоксикационная и другая посиндромная терапия</p>
<p style="margin:0 0 10px"><b>Группа</b>         <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Местные</b>        <b>быстрое распространение процесса</b> и обширные дефекты мягких тканей; некроз кожи; <b>грубые деформирующие рубцы</b> после обширных некрозов (И.)</p>
<p style="margin:0 0 10px"><b>Общие</b>          токсикоз; <b>сепсис</b> (И. упоминает при выборе антибиотиков); метастатические очаги --- остеомиелит, пневмония, энтероколит (по общим принципам, как при омфалите --- Р.)</p>
<p style="margin:0 0 10px"><b>Прогноз (И.)</b>   <b>благоприятный</b> при своевременной диагностике и адекватном лечении</p>

<p style="margin:0 0 10px"><b>Псевдофурункулёз (Фингера; множественные абсцессы потовых желёз у детей)</b> --- гнойное поражение эккринных потовых желёз у новорождённых и детей до года. Относят к пиодермиям (гнойно-воспалительные заболевания кожи). Название --- за сходство с фурункулёзом, но у элементов <b>нет некротического стержня</b> .</p>
<p style="margin:0 0 10px">## <b>Этиология</b></p>
<p style="margin:0 0 10px">• чаще всего <b>золотистый стафилококк</b> ; реже протей, гемолитический стафилококк, кишечная палочка и</p>
<p style="margin:0 0 10px">др.;</p>
<p style="margin:0 0 10px">• <b>предрасполагающие факторы</b> : неправильный уход, грязное бельё, повышенная потливость,</p>
<p style="margin:0 0 10px">перегревание, диарея, инфекционные заболевания, ослабление организма (гипотрофия, рахит, анемия, гиповитаминозы, нарушения иммунитета, недоношенность).</p>
<p style="margin:0 0 10px">## <b>Патогенез</b></p>

<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Поражение клубочка потовой железы, подкожный узел</span><span>Размягчение, вскрытие, рубец; генерализация у ослабленных | Мацерация кожи, потливость, перегрев | Инфекция в устье протока: перипорит</span></div>
<p style="margin:0 0 10px">Инфекционный процесс захватывает не только протоки, но и клубочки потовых желёз; воспаление идёт в подкожной клетчатке при внешне здоровой коже.</p>
<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• <b>перипорит</b> (поражение только устьев протоков): мелкие поверхностные пустулы; после разрешения ---</p>
<p style="margin:0 0 10px">корочки, которые отпадают <b>без рубцов</b> и пигментации;</p>
<p style="margin:0 0 10px">• <b>псевдофурункулёз</b> : плотные подкожные узелки с внешне здоровой кожей над ними; узлы увеличиваются</p>
<p style="margin:0 0 10px">(до размера лесного ореха и более), кожа становится красно-синюшной, узел размягчается, появляется <b>флюктуация</b> , кожа истончается и прорывается жёлто-зелёным гноем; заживает <b>рубцом</b> ;</p>
<p style="margin:0 0 10px">• <b>локализация</b> : места, которые касаются постели --- спина, бёдра, ягодицы, затылок, волосистая часть</p>
<p style="margin:0 0 10px">головы;</p>
<p style="margin:0 0 10px">• <b>10 и более узлов</b> --- генерализованный процесс: температура, интоксикация, снижение аппетита; у</p>
<p style="margin:0 0 10px">ослабленных --- рецидивы с новыми элементами через 10--20 дней.</p>
<p style="margin:0 0 10px">## <b>Классификация (составлена по описанию)</b></p>
<p style="margin:0 0 10px"><b>Признак</b>                 <b>Варианты</b></p>
<p style="margin:0 0 10px"><b>По глубине поражения</b>    перипорит (поверхностный, устья протоков) → псевдофурункулёз (глубокое поражение желёз)</p>
<p style="margin:0 0 10px"><b>По стадии узла</b>          инфильтрат (плотный узелок) → абсцедирование (флюктуация) → вскрытие и рубцевание</p>
<p style="margin:0 0 10px"><b>По распространённости</b>   локализованный (единичные узлы) и генерализованный (10 и более, с интоксикацией)</p>
<p style="margin:0 0 10px"><b>По течению</b>              острое; рецидивирующее (у ослабленных)</p>
<p style="margin:0 0 10px">## <b>Диагностика и дифференциальная диагностика</b></p>
<p style="margin:0 0 10px">• диагноз ставят <b>по клинике и возрасту</b> : флюктуация самых крупных узлов, отсутствие видимых</p>
<p style="margin:0 0 10px">изменений кожи над другими; <b>посев отделяемого узлов</b> на флору и чувствительность к антибиотикам; общий анализ крови, по показаниям --- оценка иммунитета.</p>
<p style="margin:0 0 10px"><b>С чем</b>                                            <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Фурункулёз</b>                                       в центре фурункула --- <b>некротический стержень</b> ; при псевдофурункулёзе его нет</p>
<p style="margin:0 0 10px"><b>Гидраденит</b>                                       у детей грудного возраста не бывает; типичная локализация --- подмышечные впадины, паховая область</p>
<p style="margin:0 0 10px"><b>Скрофулодерма (колликвативный туберкулёз кожи)</b>   дети до года болеют редко; медленное развитие, свищи, изъязвления, мостикообразные рубцы</p>
<p style="margin:0 0 10px"><b>Некротическая флегмона новорождённых (общие)</b>     быстрое распространение, цианотичная кожа, тяжёлый токсикоз (вопросы 154--156)</p>`},
  {n:158, t:"Псевдофурункулёз у детей. Лечение и осложнение", a:`<p style="margin:0 0 10px">Справочник «Красота и Медицина» (2021), iDoctor.kz; для связи с хирургической тактикой --- Исаков, с. 546--547 (флегмона новорождённых). Дозы антибиотиков по возрасту в источниках не приведены --- по антибиотикограмме.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   антибиотикотерапия · вскрытие узлов · пробиотики · иммунотерапия · УВЧ · профилактика</p>
<p style="margin:0 0 10px"><b>Важно!</b> Источники --- справочники, не учебники по детской хирургии; тактику (особенно хирургическую) сверь с лекцией. Дозы не приводил.</p>
<p style="margin:0 0 10px">## <b>Лечение</b></p>
<p style="margin:0 0 10px">• <b>стационарное лечение</b> (грудные дети, генерализованный процесс);</p>
<p style="margin:0 0 10px">• <b>антибиотики</b> --- обязательно, с учётом антибиотикограммы: гентамицин, пенициллины, цефотаксим,</p>
<p style="margin:0 0 10px">цефазолин; одновременно <b>пробиотики</b> (профилактика дисбактериоза);</p>
<p style="margin:0 0 10px">• при интоксикации --- <b>детоксикация</b> : декстран, альбумин, солевые растворы, нативная плазма; витамины,</p>
<p style="margin:0 0 10px">общеукрепляющая терапия;</p>
<p style="margin:0 0 10px">• <b>иммунные препараты</b> : стафилококковый анатоксин, гамма-глобулин, антистафилококковая плазма;</p>
<p style="margin:0 0 10px">• <b>местно</b> : растворы анилиновых красителей, мази с антибиотиками (левомеколь), ихтиоловая мазь; кожу</p>
<p style="margin:0 0 10px">вокруг узлов обрабатывают камфорным спиртом; УВЧ-терапия;</p>
<p style="margin:0 0 10px">• <b>хирургическое вскрытие и дренирование</b> флюктуирующих узлов --- по показаниям (разрезы в виде</p>
<p style="margin:0 0 10px">небольших надрезов); принципы местной обработки такие же, как при других гнойных очагах новорождённых (И.).</p>
<p style="margin:0 0 10px">## <b>Профилактика</b></p>
<p style="margin:0 0 10px">Регулярная смена пелёнок и проглаживание после стирки, гигиена ухода, <b>избегание перегрева</b> и потливости, правильное вскармливание; своевременное лечение перипорита и диареи.</p>
<p style="margin:0 0 10px"><b>Группа</b>                               <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Местные</b>                              рубцы после вскрытия узлов; рецидивы с новыми элементами через 10--20 дней у ослабленных; переход в флегмону</p>
<p style="margin:0 0 10px"><b>Общие (у истощённых и ослабленных)</b>   конъюнктивит, отит, гайморит, пневмония; в тяжёлых случаях --- <b>гнойный менингит, остеомиелит, сепсис</b></p>
<p style="margin:0 0 10px"><b>Прогноз</b>                              при своевременном лечении благоприятный; хуже у ослабленных и недоношенных</p>

<p style="margin:0 0 10px"><b>Парапроктит</b> --- воспаление околопрямокишечной клетчатки (клетчатки вокруг прямой кишки и заднего прохода); синонимы: аноректальный, криптогландулярный абсцесс; МКБ-10: K61. Бывает острым и хроническим (параректальный свищ).</p>
<p style="margin:0 0 10px">## <b>Эпидемиология</b></p>
<p style="margin:0 0 10px">• у детей встречается реже, чем у взрослых, но <b>утверждение «дети почти не болеют парапроктитом»</b></p>
<p style="margin:0 0 10px"><b>неверно</b> (Р.);</p>
<p style="margin:0 0 10px">• чаще --- в <b>грудном возрасте</b> (период новорождённости и первые месяцы жизни, И.), одинаково у</p>
<p style="margin:0 0 10px">мальчиков и девочек; в старшем возрасте преобладают мальчики пре- и пубертатного периода (Р.). Исаков: мальчики болеют чаще --- девочки менее склонны из-за эластичности тазового дна (меньше давление в прямой кишке).</p>
<p style="margin:0 0 10px">## <b>Этиология и патогенез</b></p>
<p style="margin:0 0 10px">• <b>у взрослых</b> (и истинный парапроктит у детей) --- воспаление анальных крипт и желёз: микроорганизмы из</p>
<p style="margin:0 0 10px">просвета кишки проникают через <b>морганиевы крипты</b> (ходы Германа), закупорка протока → нагноившаяся ретенционная киста → абсцесс перианальной области (Р.);</p>
<p style="margin:0 0 10px">• <b>у детей Р. различает два процесса</b> : <b>абсцессы промежности</b> (инфекция через кожу --- легко ранима и</p>
<p style="margin:0 0 10px">мацерируется у новорождённых; может быть очагом при септикопиемии) и <b>истинный парапроктит</b> (из просвета кишки через крипты);</p>
<p style="margin:0 0 10px">• <b>врождённая предрасположенность</b> (Р.): необычно глубокие крипты, неправильное развитие протоков</p>
<p style="margin:0 0 10px">анальных желёз; И.: врождённые параректальные свищи и длинные мешочкообразные крипты (анальные пазухи);</p>
<p style="margin:0 0 10px">• <b>пусковые факторы</b> : диспепсические расстройства, дисбактериоз, изменение вирулентности микрофлоры</p>
<p style="margin:0 0 10px">(Р.); микротравма слизистой при запоре, диарее, нарушении пищеварения --- частицы кала застаиваются в криптах; растяжение прямой кишки калом, повышенный тонус сфинктера; реже --- наконечник клизмы, инородные тела, травма промежности; заболевания кожи промежности (мацерация, трещины) (И.);</p>
<p style="margin:0 0 10px">• микрофлора: <b>кишечная палочка в ассоциации со стафилококком или стрептококком</b> (И.).</p>

<p style="margin:0 0 10px">## <b>Клиническая картина (острый парапроктит)</b></p>
<p style="margin:0 0 10px">• <b>острое начало</b> (Р., И.): без видимой причины ребёнок беспокоен, теряет аппетит, температура 38--39 °С</p>
<p style="margin:0 0 10px">(иногда с ознобом); у маленьких беспокойство усиливается при пеленании и туалете промежности; у старших --- боли около заднего прохода в сидячем положении и при дефекации; при передней локализации --- дизурия; <b>задержка стула и мочеиспускания</b> тем чаще, чем младше ребёнок (боль);</p>
<p style="margin:0 0 10px">• <b>местно</b> : припухлость и застойная гиперемия кожи, сглаженность складок, анус приплюснут; резко</p>
<p style="margin:0 0 10px">болезненный инфильтрат, затем размягчение (флюктуация);</p>
<p style="margin:0 0 10px">• процесс идёт быстро: уже через 2--3 суток местные явления резко выражены; ребёнок малоактивен,</p>
<p style="margin:0 0 10px">крикливый, плохо ест и спит; лейкоцитоз, увеличение СОЭ; стул жидкий или запор; старшие сидят на здоровой ягодице;</p>
<p style="margin:0 0 10px">• <b>без помощи</b> воспаление и отёк переходят на здоровую сторону; к <b>6--8-м суткам гнойник сам</b></p>
<p style="margin:0 0 10px"><b>вскрывается</b> (чаще наружу, реже в кишку); расчёт на самоизлечение --- грубейшая ошибка (затёки, сепсис);</p>
<p style="margin:0 0 10px">• <b>особенности у детей</b> (Р.): глубокие гнойники редки; <b>95--97 % --- подкожный или подслизистый</b></p>
<p style="margin:0 0 10px"><b>абсцесс</b> , 3--5 % --- седалищно-прямокишечная форма; внутреннее отверстие, как правило, переднее или переднебоковое;</p>
<p style="margin:0 0 10px">• <b>глубокие формы</b> (И.): тяжесть в тазу, тупая боль, ранняя интоксикация, озноб; боль при мочеиспускании,</p>
<p style="margin:0 0 10px">парадоксальная ишурия, тенезмы (тазово-прямокишечный).</p>`},
  {n:160, t:"Парапроктит у детей. Классификация, диагностика и диф. диагностика", a:`<p style="margin:0 0 10px">Разумовский, гл. 24.6--24.7 (с. 404--407); Исаков, 5.19.5 (с. 415--418) и 7.13 (с. 627). Классификация составлена из описаний книг (единой таблицы в них нет).</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   подкожный · подслизистый · седалищно-прямокишечный · свищевой · бессвищевой · ректальное исследование</p>
<p style="margin:0 0 10px"><b>Признак</b>                               <b>Виды (по текстам Р., И.)</b></p>
<p style="margin:0 0 10px"><b>По течению</b>                            <b>острый</b> и <b>хронический</b> (параректальный свищ --- синоним хронического парапроктита, Р.)</p>
<p style="margin:0 0 10px"><b>По происхождению (Р.)</b>                 истинный парапроктит (из крипт) и абсцессы промежности (через кожу)</p>
<p style="margin:0 0 10px"><b>По локализации гнойника</b>               подкожный, подслизистый, подкожно-подслизистый; седалищно-прямокишечный (ишиоректальный); тазово-прямокишечный (пельвиоректальный) --- глубокие формы у детей редки; 95--97 % --- подкожные и подслизистые (Р.)</p>
<p style="margin:0 0 10px"><b>Хронический (Р.)</b>                      <b>свищевой</b> (95 %) --- полный (внутреннее и наружное отверстие) или неполный внутренний; <b>бессвищевой</b> (≈ 5 %) --- рецидивирующие абсцессы на том же месте</p>
<p style="margin:0 0 10px"><b>Свищи по отношению к сфинктеру (И.)</b>   внутрисфинктерные, чрессфинктерные, внесфинктерные; полные и неполные кожные</p>
<p style="margin:0 0 10px">## <b>Классификация</b></p>
<p style="margin:0 0 10px">## <b>Диагностика острого парапроктита</b></p>
<p style="margin:0 0 10px">• <b>клиника</b> (см. вопрос 159) --- основа диагноза в сравнительно короткие сроки (особенно подкожная и</p>
<p style="margin:0 0 10px">подслизистая формы);</p>
<p style="margin:0 0 10px">• <b>осмотр и пальпация</b> : припухлость, гиперемия, сглаженность складок, приплюснутая форма ануса; резко</p>
<p style="margin:0 0 10px">болезненный инфильтрат, затем флюктуация (Р.);</p>
<p style="margin:0 0 10px">• <b>ректальное пальцевое исследование</b> : при подслизистой форме --- округлое, болезненное, ограниченное</p>
<p style="margin:0 0 10px">образование выше гребешковой линии; при ишиоректальной --- инфильтрат, оттесняющий стенку кишки и выбухающий в просвет; при тазово-прямокишечном --- высоко расположенный участок инфильтрации, флюктуации и болезненности (И.);</p>
<p style="margin:0 0 10px">• <b>отёк ягодичной области</b> на стороне поражения помогает диагностике ишиоректального абсцесса (И.);</p>
<p style="margin:0 0 10px">• <b>типичная ошибка</b> (Р.): запоздалое выявление флюктуации --- у детей гнойник небольшой, отёк тканей</p>
<p style="margin:0 0 10px">выражен, поэтому ориентируются на резкую локальную болезненность («как при панариции») или размягчение в центре инфильтрата;</p>
<p style="margin:0 0 10px">• анализы: лейкоцитоз, ↑ СОЭ (Р.); ишиоректальная форма у детей может развиваться медленно ---</p>
<p style="margin:0 0 10px">ухудшение к 3--6-м суткам, внешние признаки к 5--6-м.</p>
<p style="margin:0 0 10px">## <b>Диагностика хронического парапроктита (Р.)</b></p>
<p style="margin:0 0 10px">• основа --- <b>анамнез, осмотр, пальпация, ректальное исследование</b> ; у <b>младенцев</b> зондирование свища,</p>
<p style="margin:0 0 10px">красители, рентгенофистулография «бессмысленны»; у старших --- в редких случаях по прямым показаниям;</p>
<p style="margin:0 0 10px">• <b>осмотр</b> : наружное отверстие, рубцы; <b>пальпация</b> : плотный чётко отграниченный <b>тяж</b> , идущий от кожи к</p>
<p style="margin:0 0 10px">анальному каналу, --- признак сформированного свищевого хода (по нему судят о форме и отношении к сфинктеру);</p>
<p style="margin:0 0 10px">• <b>осмотр анального канала детским вагинальным зеркалом</b> : внутреннее отверстие в одной из крипт ---</p>
<p style="margin:0 0 10px">по отёчности и гиперемии крипты, иногда капля гноя при надавливании на тяж;</p>
<p style="margin:0 0 10px">• симптоматика: периодические локальные обострения со скудным серозно-гнойным отделяемым;</p>
<p style="margin:0 0 10px">интервалы от недель до лет; у младенцев наружного отверстия обычно нет.</p>

<p style="margin:0 0 10px">## <b>Дифференциальная диагностика</b></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                              <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Осложнённая дермоидная киста, эпителиальные копчиковые ходы (И.)</b>   глубокие парапроктиты; расположение по средней линии, в области копчика; рентген, УЗИ, свищевой ход</p>
<p style="margin:0 0 10px"><b>Остеомиелит костей таза (И.)</b>                                       боль в костях, общие симптомы, рентген, УЗИ</p>
<p style="margin:0 0 10px"><b>Острый аппендицит (И.)</b>                                             тазово-прямокишечный парапроктит может напоминать острый аппендицит --- решающее ректальное исследование</p>
<p style="margin:0 0 10px"><b>Абсцесс промежности через кожу, фурункул (Р., общие)</b>               нет связи с криптой; кожные входные ворота; нет внутреннего отверстия</p>
<p style="margin:0 0 10px"><b>Болезнь Крона (Р.)</b>                                                 при затяжном течении, сложных и множественных свищах --- колоноскопия с биопсией, кальпротектин, признаки колита</p>
<p style="margin:0 0 10px"><b>Врождённые параректальные свищи (И.)</b>                               рецидивирующее течение с рождения; нагноение приводит к вторичному парапроктиту</p>
<p style="margin:0 0 10px"><b>Трещина, геморрой, пролапс (общие)</b>                                 боль и кровь при дефекации, нет гнойного очага</p>`},
  {n:161, t:"Парапроктит у детей. Лечение и осложнение", a:`<p style="margin:0 0 10px">Разумовский, гл. 24.6--24.7 (с. 402--408, рис. 24.15--24.16); Исаков, с. 413--418 и 626--630.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   парапроктит · вскрытие абсцесса · внутреннее отверстие · параректальный свищ · операция Габриэля</p>
<p style="margin:0 0 10px"><b>Парапроктит</b> --- воспаление клетчатки вокруг прямой кишки и заднего прохода (аноректальный, криптогландулярный абсцесс); МКБ-10: K61. Бывает острым и хроническим (параректальный свищ).</p>
<p style="margin:0 0 10px">## <b>Лечение острого парапроктита</b></p>
<p style="margin:0 0 10px">• <b>основной и единственно правильный метод --- операция</b> (Р.): вскрытие гнойника вместе с рассечением</p>
<p style="margin:0 0 10px"><b>внутреннего отверстия</b> (у основания крипты) и санация полости; обязательна ревизия полости, чтобы выпустить гной из карманов и затёков, и дренирование (И.);</p>
<p style="margin:0 0 10px">• <b>консервативное лечение</b> --- только в самом начале (инфильтрация), когда нельзя срочно доставить в</p>
<p style="margin:0 0 10px">стационар: тёплые ванны 38--38,5 °С, согревающий компресс на промежность, тёплые микроклизмы, антибиотики широкого спектра внутримышечно, лазеротерапия (Р.);</p>
<p style="margin:0 0 10px">• после операции (И.): УВЧ, сидячие тёплые ванны с перманганатом калия; антибиотик ---</p>
<p style="margin:0 0 10px">ингибитор-защищённый пенициллин (амоксициллин + клавулановая кислота); при глубоких формах --- интенсивное лечение как при острой хирургической инфекции;</p>
<p style="margin:0 0 10px">• <b>расчёт на самоизлечение --- грубейшая ошибка</b> (Р.): на 6--8-е сутки гнойник сам вскрывается (чаще</p>
<p style="margin:0 0 10px">наружу), но опасны обширные затёки и сепсис.</p>
<p style="margin:0 0 10px"><b>Метод</b>                                                                                                                                                                               <b>Суть, показания, результат</b></p>
<p style="margin:0 0 10px"><b>Консервативное (Р., И.)</b>                                                                                                                                                             диета без шлаков, регулирование стула, сидячие ванны с перманганатом, антибиотики при обострении, лазеротерапия, местно 20 % настой прополиса на рану. Самостоятельно оправдано редко (бессвищевой вариант); у детей старше 1 года рецидивы реже (5--10 %). Рентгенотерапию у детей не применяют (И.)</p>
<p style="margin:0 0 10px"><b>Склеротерапия хода (Р.)</b>                                                                                                                                                             через тонкий катетер вводят склерозант (10 % спиртовой раствор йодида калия, медицинские клеи, 96 % спирт); в холодном периоде при коротких поверхностных ходах; эффективность 80--90 % с учётом повторных курсов. И.: при неполном кожном свище 0,4--0,5 мл 10 % раствора нитрата серебра или 3 % спиртового йода раз в неделю 5--6 недель</p>
<p style="margin:0 0 10px"><b>Иссечение свища единым блоком (Р.)</b>                                                                                                                                                  радикальный метод: у детей преобладают короткие прямые внутрисфинктерные ходы (более 95 %); операция в холодном периоде, не раньше чем через 3 мес после формирования хода; рецидивы до 50 %</p>
<p style="margin:0 0 10px"><b>Рассечение передней стенки хода --- модифицированная операция Габриэля (Р., И.)</b>                                                                                                     при поверхностных подкожно-подслизистых непротяжённых ходах: ход рассекают до внутреннего отверстия, выстилку обрабатывают коагуляцией или склерозантом; эффективность 80--85 %, но нужны ежедневные перевязки (мазь Вишневского, с 3-х суток ванны)</p>
<p style="margin:0 0 10px"><b>Выбор операции по отношению к сфинктеру (И.)</b>                                                                                                                                        <b>внутрисфинктерные</b> --- рассечение + выскабливание или Габриэль; <b>неполные кожные внесфинктерные</b> --- иссечение хода по зонду; <b>полные внесфинктерные</b> --- иссечение со швами на слизистую; <b>чрессфинктерные</b> --- иссекают, не трогая часть в волокнах сфинктера, внутрисфинктерную часть выскабливают; сфинктер можно рассекать только по передней или задней стенке</p>
<p style="margin:0 0 10px"><b>Важно!</b> При длительном течении, устойчивости к лечению и множественных ходах исключают <b>болезнь Крона</b> (ректороманоскопия/колоноскопия с биопсией, кальпротектин) --- Р. с. 407.</p>
<p style="margin:0 0 10px">## <b>Лечение хронического парапроктита (свища)</b></p>

<p style="margin:0 0 10px">*Рис. 24.16 (Р., с. 405). Хронический парапроктит с множественными простыми свищами у грудного ребёнка. Скопировано из книги.*</p>
<p style="margin:0 0 10px"><b>Когда</b>                     <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Острый парапроктит (Р.)</b>   самопроизвольное вскрытие гнойника на 6--8-е сутки; распространение воспаления и отёка на здоровую сторону, <b>обширные затёки, сепсис</b> ; примерно в 50 % спонтанно дренируемых абсцессов формируется <b>параректальный свищ</b></p>
<p style="margin:0 0 10px"><b>Хронический (Р., И.)</b>      частые рецидивы (до 50 % после операций), периодические обострения; полное выздоровление происходит не всегда; нужно выбирать операцию дифференцированно</p>
<p style="margin:0 0 10px"><b>Операции (И.)</b>             <b>нарушение функции сфинктера</b> при его рассечении вне передней и задней стенки; расхождение раны, инфицирование параректальной клетчатки</p>
<p style="margin:0 0 10px">## <b>Осложнения</b></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Диагноз ставят рано: боль, температура, припухлость</span><span>Вскрытие абсцесса + рассечение внутреннего отверстия | Дренаж, ванны, антибиотики | Свищ → операция в холодном периоде</span></div>`},
  {n:162, t:"Язвенно-некротический энтероколит у детей. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">Разумовский, гл. 38 (с. 514--517, табл. 38.1); Исаков, 7.12.4 (с. 618--624, рис. 7-18, 7-19).</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   ЯНЭК · ишемия · недоношенные · пневматоз · стадии Bell · геморрагический инфаркт</p>
<p style="margin:0 0 10px"><b>Некротический (язвенно-некротический) энтероколит, ЯНЭК</b> --- тяжёлое приобретённое заболевание периода новорождённости, чаще у недоношенных: некроз стенки терминального отдела подвздошной и правой половины толстой кишки (чаще со стороны слизистой), который может дойти до перфорации и перитонита. МКБ-10: P77 (НЭК у плода и новорождённого), P78.0 (перфорация кишечника в перинатальном периоде).</p>
<p style="margin:0 0 10px">## <b>Эпидемиология</b></p>
<p style="margin:0 0 10px">• ЯНЭК болеют 2 из 1000 живорождённых и 10 из 1000 недоношенных; 2--7 % детей в отделениях</p>
<p style="margin:0 0 10px">интенсивной терапии новорождённых (Р.). Исаков: 0,25 % детей периода адаптации и 4 % нуждающихся в интенсивной терапии;</p>
<p style="margin:0 0 10px">• около 90 % --- недоношенные с массой менее 1500 г («болезнь выживших недоношенных», Р.);</p>
<p style="margin:0 0 10px">• одна из частых причин постнатального перфоративного перитонита --- <b>около 60 % всех перфораций</b> (И.).</p>
<p style="margin:0 0 10px">## <b>Этиология</b></p>
<p style="margin:0 0 10px"><b>Мультифакториальная</b> (Р.): главные составляющие --- ишемия, перенесённая в перинатальном периоде, аномальная колонизация кишечника и неадекватное питание в первые дни жизни.</p>
<p style="margin:0 0 10px"><b>Группа факторов</b>      <b>Что входит</b></p>
<p style="margin:0 0 10px"><b>Факторы риска (Р.)</b>   асфиксия в родах; синдром дыхательных расстройств; патология беременности и преждевременные роды; осложнения родов (кровотечение, эклампсия, ДВС); гипотермия ниже 35 °С, родовая спинальная травма и ЧМТ; синдром малого сердечного выброса; наркозависимость матери; плацентарная недостаточность; лекарства (индометацин, метилксантины, витамин Е)</p>
<p style="margin:0 0 10px"><b>Пороки ЖКТ (Р.)</b>      гастрошизис, болезнь Гиршпрунга, атрезии кишки (особенно «яблочная кожура»)</p>
<p style="margin:0 0 10px"><b>Исаков</b>               тяжёлая гипоксия и асфиксия; осложнение инфузионной терапии и заменного переливания крови через пупочную вену; декомпенсация ВПС и болезни Гиршпрунга; <b>нерациональные антибиотики</b> (ампициллин, тетрациклин) → дисбактериоз</p>
<p style="margin:0 0 10px"><b>Микрофлора (Р.)</b>      E. coli, Klebsiella, S. aureus, S. epidermidis, Enterococcus, Cl. perfringens, Pseudomonas, Proteus, Candida; вирусы (коронавирусы, ротавирусы, Коксаки В2), ЦМВ</p>
<p style="margin:0 0 10px">## <b>Патогенез</b></p>
<p style="margin:0 0 10px">В основе --- <b>тяжёлые микроциркуляторные нарушения в стенке ЖКТ</b> (И.). Недоношенные болеют чаще, потому что капилляры у них плохо выдерживают перепады давления.</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Гипоксия, асфиксия → централизация кровообращения</span><span>Спазм мезентериальных сосудов, ишемия стенки кишки | Парез, кровоизлияния, инфаркты; дисбиоз, инфекция | Некроз слизистой → вся стенка → перфорация</span></div>
<p style="margin:0 0 10px">• поражается чаще дистальный отдел подвздошной кишки и углы толстой (илеоцекальный, печёночный,</p>
<p style="margin:0 0 10px">селезёночный, сигмовидный) (И.); некроз идёт от слизистой к подслизистому, мышечному и серозному слоям (рис. 7-18, И.);</p>
<p style="margin:0 0 10px">• нарушение барьерной функции стенки → транслокация бактерий и токсикоз.</p>
<p style="margin:0 0 10px">![](media/image160.jpg){width="2.2916666666666665in" height="1.7453969816272965in"}                     |   ![](media/image161.jpg){width="2.2916666666666665in" height="1.5921751968503937in"}</p>
<p style="margin:0 0 10px">*Рис. 7-18 (И., с. 619). Некротический язвенный энтероколит у новорождённого (операционная картина).*   |   *Рис. 7-19 (И., с. 621). Макропрепарат: субмукозный пневматоз стенки толстой кишки.*</p>
<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">Первые симптомы у недоношенных появляются на 5--7-е сутки жизни, иногда позже --- на 2--3-й неделе (Р.): ребёнок плохо усваивает пищу, срыгивает, живот вздут, стул становится редким или исчезает; затем возможна частичная и полная непроходимость. Классификация Walsh и Kliegman (по Bell, Р., табл. 38.1):</p>
<p style="margin:0 0 10px"><b>Стадия</b>                                              <b>Общее состояние и ЖКТ</b>                                                                                                                <b>Рентген / УЗИ</b></p>
<p style="margin:0 0 10px"><b>I --- подозреваемый НЭК</b>                             неустойчивая температура, апноэ, брадикардия, вялость; небольшое вздутие, срыгивания, стаз в желудке, IB --- примесь алой крови в кале   петли расширены, возможны уровни</p>
<p style="margin:0 0 10px"><b>II --- явный НЭК (IIA обратимая, IIB необратимая)</b>   парез кишечника, болезненность при пальпации, стойкий ацидоз, тромбоцитопения, лейкопения; в IIB --- асцит                               множественные уровни, <b>пневматоз стенки</b> , ± газ в воротной вене</p>
<p style="margin:0 0 10px"><b>III --- прогрессирующий НЭК (IIIA, IIIB)</b>            перитонит, резкое вздутие, кровавый стул, артериальная гипотензия, ДВС, нейтропения, бактериальный шок, полиорганная недостаточность     обширный пневматоз, газ в воротной вене, асцит, в IIIB --- <b>пневмоперитонеум</b></p>
<p style="margin:0 0 10px"><b>По Исакову</b> --- четыре стадии:</p>
<p style="margin:0 0 10px"><b>Стадия (И.)</b>                                  <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>I --- продромальная</b>                          у детей группы риска: вялое прерывистое сосание, срыгивания (иногда жёлчью), аэрофагия, вздутие, беспокойство при поглаживании живота, задержка мекония, быстрая потеря массы тела; рентген --- равномерное повышенное газонаполнение</p>
<p style="margin:0 0 10px"><b>II --- клинических проявлений</b>                на 5--9-е сутки; нарастает динамическая непроходимость, дефицит массы 10--15 % (дегидратация), рвота с жёлчью, вздутие, болезненность в правой подвздошной области; стул учащён, скудный, со слизью и зеленью; рентген --- зона затенения, пневматоз, иногда газ в воротной вене (рис. 7-19, 7-20)</p>
<p style="margin:0 0 10px"><b>III --- предперфорации</b>                       не более 12--24 ч; парез кишечника, токсикоз и эксикоз, рвота жёлчью и «каловыми» массами, резкое вздутие, напряжение живота, из прямой кишки --- алая кровь</p>
<p style="margin:0 0 10px"><b>IV --- разлитого перфоративного перитонита</b>   перитонеальный шок, паралич кишечника; пневмоперитонеум умеренный; в трети случаев на фоне лечения перитонит отграничивается --- плотный инфильтрат в правой подвздошной области (похож на аппендицит) → рассасывание или абсцесс и кишечный свищ</p>
<p style="margin:0 0 10px"><b>Геморрагический инфаркт кишечника</b> (И.) --- наиболее тяжёлая форма, около 15 % всех энтероколитов: возникает после тяжёлой асфиксии в родах или введения препаратов в сосуды пуповины; с рождения вздутие, задержка мекония, на 2--3-и сутки --- рвота жёлчью, слизь с кровью из прямой кишки, перистальтики нет.</p>`},
  {n:163, t:"Язвенно-некротический энтероколит у детей. Диагностика и диф. диагностика", a:`<p style="margin:0 0 10px">Разумовский, гл. 38 (с. 515--520, рис. 38.1--38.3); Исаков, с. 620--624 (рис. 7-20--7-22).</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   УЗИ · пневматоз · газ в воротной вене · пневмоперитонеум · неподвижная петля · мекониевая непроходимость</p>
<p style="margin:0 0 10px">## <b>Диагностика (Р.)</b></p>
<p style="margin:0 0 10px">• диагноз в начале болезни основан на неспецифических клинических признаках --- правильно поставить его</p>
<p style="margin:0 0 10px">можно, <b>только учитывая весь комплекс симптомов</b> ; хирург должен осмотреть ребёнка при первых симптомах;</p>
<p style="margin:0 0 10px">• основные объективные методы --- <b>УЗИ и рентгенография</b> ; «золотой стандарт» при прогрессирующем НЭК</p>
<p style="margin:0 0 10px">• их сочетание;</p>
<p style="margin:0 0 10px">• у всех детей с подозрением на НЭК при консервативном лечении <b>УЗИ брюшной полости делают</b></p>
<p style="margin:0 0 10px"><b>ежедневно</b> : оно раньше и точнее рентгена показывает прогрессирование;</p>
<p style="margin:0 0 10px">• посев крови положителен только в 30--35 % случаев (Р.).</p>
<p style="margin:0 0 10px"><b>Изменения</b>                                <b>Признаки (Р.)</b></p>
<p style="margin:0 0 10px"><b>Обратимые</b>                                неравномерная пневматизация кишечных петель (не менее чем у 55 % больных, самый частый симптом); расширение желудка; отдельные паретические уровни; ограниченный пневматоз стенки → можно продолжать консервативную терапию с контролем</p>
<p style="margin:0 0 10px"><b>Необратимые --- нужна срочная операция</b>   обширный пневматоз стенки (чем больше, тем обширнее поражение); токсическая дилатация толстой кишки (чаще при БГ); <b>газ в воротной вене</b> (при клинике прогрессирующего НЭК --- абсолютное показание к операции); <b>неподвижная (статичная) петля</b> на повторных снимках через 2--3 ч --- ишемия; внезапный <b>гиперэхогенный асцит</b> --- возможна прикрытая перфорация; <b>пневмоперитонеум</b> --- перфорация полого органа</p>

<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">*Рис. 38.1 (Р., с. 518). Обширный пневматоз кишки.*</span><span>*Рис. 38.2 (Р., с. 519). УЗИ: гиперэхогенный асцит, пневматоз стенки (стрелка).* | *Рис. 38.3 (Р., с. 519). Пневмоперитонеум: серп воздуха под диафрагмой.*</span></div>
<p style="margin:0 0 10px">## <b>Показания к операции --- комплекс признаков (Р.)</b></p>
<p style="margin:0 0 10px">• пальпируемое образование в животе (абсцесс или конгломерат некротизированных петель);</p>
<p style="margin:0 0 10px">• воспалительные изменения брюшной стенки (перитонит, гангрена кишки, абсцесс);</p>
<p style="margin:0 0 10px">• рентгенологические признаки некроза: статичная петля, обширный пневматоз, газ в воротной вене,</p>
<p style="margin:0 0 10px">внезапный гиперэхогенный асцит, токсическая дилатация, пневмоперитонеум;</p>
<p style="margin:0 0 10px">• лабораторные: остро развившаяся тромбоцитопения, коагуляционные нарушения, тяжёлая гипонатриемия,</p>
<p style="margin:0 0 10px">стойкий ацидоз;</p>
<p style="margin:0 0 10px">• лапароцентез: мутная, коричневая или зеленоватая жидкость, много лейкоцитов, при окраске по Граму ---</p>
<p style="margin:0 0 10px">внеклеточные бактерии. <b>Контрастное исследование ЖКТ</b> --- только для дифференциальной диагностики (МИН, мальротация) и в раннем периоде, когда нет признаков хирургической стадии; используют <b>водорастворимый контраст</b> 3--5 мл (у недоношенных он не всасывается сутки и дольше) (Р.).</p>
<p style="margin:0 0 10px"><b>Стадия</b>                    <b>Рентгенограмма живота</b></p>
<p style="margin:0 0 10px"><b>I</b>                         повышенное равномерное газонаполнение всех отделов ЖКТ, небольшое утолщение стенок</p>
<p style="margin:0 0 10px"><b>II</b>                        неравномерное газонаполнение с зоной затенения над местом максимального поражения; желудок вздут с уровнем; утолщение стенок, выпрямление контуров; субмукозный кистозный <b>пневматоз</b> , в тяжёлых случаях газ в портальной системе (рис. 7-19, 7-20)</p>
<p style="margin:0 0 10px"><b>III</b>                       нарастающее затенение живота из-за гидроперитонеума, контуры петель нечёткие (рис. 7-21)</p>
<p style="margin:0 0 10px"><b>IV</b>                        умеренный пневмоперитонеум, выраженный спаечно-воспалительный процесс (рис. 7-22)</p>
<p style="margin:0 0 10px"><b>Геморрагический инфаркт</b>   затенение живота из-за гидроперитонеума; при перфорации --- свободный газ под куполом диафрагмы</p>
<p style="margin:0 0 10px">## <b>Рентгенологическая картина по стадиям (Исаков)</b></p>

<p style="margin:0 0 10px"><b>С чем</b>                                                     <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>МИН, не связанный с муковисцидозом (Р.)</b>                   ранее считали вариантом НЭК; клиника ранних стадий очень похожа --- различают клинически, УЗИ/рентгеном и водорастворимым контрастом</p>
<p style="margin:0 0 10px"><b>Мальротация и другие пороки ЖКТ (Р.)</b>                      контрастное исследование раннего периода, пассаж по кишке</p>
<p style="margin:0 0 10px"><b>Острый аппендицит (И.)</b>                                    отграниченный перитонит с инфильтратом в правой подвздошной области при НЭК дают сходную картину; «большие сложности»</p>
<p style="margin:0 0 10px"><b>Болезнь Гиршпрунга, осложнённая энтероколитом (Р.)</b>        токсическая дилатация толстой кишки; биопсия прямой кишки, ирригография</p>
<p style="margin:0 0 10px"><b>Другие причины перфорации и сепсис (по общим учебникам)</b>   спонтанная перфорация желудка/кишки без пневматоза, сепсис с парезом кишки --- не имеют типичного пневматоза и портального газа</p>
<p style="margin:0 0 10px">## <b>Дифференциальная диагностика</b></p>`},
  {n:164, t:"Язвенно-некротический энтероколит у детей. Лечение и осложнение", a:`<p style="margin:0 0 10px">Разумовский, гл. 38 (с. 518--524); Исаков, с. 624--625.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   энтеральный покой · декомпрессия · деконтаминация · стома · Clip and Drop-Back · синдром короткой кишки</p>
<p style="margin:0 0 10px">## <b>Консервативное лечение</b></p>
<p style="margin:0 0 10px">Показано при стадиях IA, IB, IIA по Walsh---Kliegman и у детей групп риска (Р.); у Исакова --- стадии I--III, пока нет показаний к операции.</p>
<p style="margin:0 0 10px"><b>Мера</b>                                                           <b>Что делают</b></p>
<p style="margin:0 0 10px"><b>Отмена энтерального питания; декомпрессия (Р., И.)</b>             постоянный назо- или орогастральный зонд (открытый); по Исакову: при II стадии пауза 6--12 ч, при III --- 12--24 ч без приёма жидкости через рот; кормить сцеженным молоком по 5--10 мл через 2 ч, когда восстановится пассаж. Покой у большинства --- 2--3 сут (Р.)</p>
<p style="margin:0 0 10px"><b>Инфузионная терапия (И.), полное парентеральное питание (Р.)</b>   регидратация, восстановление микроциркуляции, коррекция гомеостаза и КОС</p>
<p style="margin:0 0 10px"><b>Антибиотики (Р.)</b>                                               широкого спектра: ампициллин + гентамицин + метронидазол; ампициллин + цефотаксим + метронидазол; меропенем или пиперациллин/тазобактам; ванкомицин. Посев крови --- положителен только в 30--35 %</p>
<p style="margin:0 0 10px"><b>Деэскалация и деконтаминация (И.)</b>                              цефалоспорины последних поколений или карбапенемы; внутрь полимиксин М 10 мг/кг/сут или амикацин 20 мг/кг/сут (3 приёма) + фузидиевая кислота 60 мг/кг/сут или рифампицин 10 мг/кг/сут; метронидазол 15 мг/кг/сут; нистатин или флуконазол. Контроль посевами каждые 4--5 дней. *Р. не рекомендует оральные аминогликозиды (токсичность, резистентность, нет доказанного эффекта) --- уточни позицию кафедры*</p>
<p style="margin:0 0 10px"><b>Восстановление биоценоза и поддержка (И.)</b>                      бактисубтил, хилак форте, ацидофильные лактобактерии, ферменты; гипериммунная плазма, иммуноглобулины, витамины; при I стадии --- прометазин, дротаверин, неостигмин</p>
<p style="margin:0 0 10px">Если на фоне лечения нарастает парез, застой в желудке и нет стула --- повторяют рентген и УЗИ: ищут признаки перехода в хирургическую стадию (Р.). Энтеральное питание возобновляют, когда восстановлен пассаж, нет вздутия, улучшились анализы, рентген и УЗИ.</p>
<p style="margin:0 0 10px">## <b>Хирургическое лечение</b></p>
<p style="margin:0 0 10px">• оперируют в среднем <b>35--40 %</b> детей с НЭК, у которых консервативная терапия безуспешна (Р.);</p>
<p style="margin:0 0 10px">• <b>показания</b> (И.): IV стадия (перфоративный перитонит) и III стадия, если за 6--12 ч интенсивной терапии нет</p>
<p style="margin:0 0 10px">улучшения; Р. --- комплекс признаков (см. вопрос 163: газ в воротной вене, пневмоперитонеум, статичная петля, образование в животе и др.);</p>
<p style="margin:0 0 10px">• <b>предоперационная подготовка</b> (Р.): обезболивание, при необходимости ИВЛ; контроль температуры;</p>
<p style="margin:0 0 10px">стабилизация АД; коррекция электролитов, КОС, гиповолемии, диуреза; гемо- и плазмотрансфузия; усиление антибиотиков. О готовности судят по стабилизации гемодинамики и газообмена, диуреза и КОС;</p>
<p style="margin:0 0 10px">• <b>лапароцентез с дренированием</b> --- паллиативная мера в реанимационной палате при асците с</p>
<p style="margin:0 0 10px">сепарацией листков брюшины и/или пневмоперитонеуме (для облегчения состояния, при транспортировке, у крайне тяжёлых); <b>противопоказан</b> , когда живот увеличен из-за вздутия петель, а не выпота или газа (риск перфорации);</p>
<p style="margin:0 0 10px">• транспортировка --- в кувезе с поддержанием температуры, ИВЛ и инфузий; самых тяжёлых оперируют в</p>
<p style="margin:0 0 10px">реанимации.</p>
<p style="margin:0 0 10px"><b>Задачи и принципы</b> (Р.): декомпрессия ЖКТ и резекция <b>только нежизнеспособных</b> участков; сохранить максимум длины кишки и илеоцекальный клапан; щадящее обращение с тканями.</p>
<p style="margin:0 0 10px"><b>Вариант</b>                             <b>Суть (Р.)</b></p>
<p style="margin:0 0 10px"><b>Локальное поражение</b>                 поперечная лапаротомия справа в подвздошной области, резекция некроза, <b>двойная стома</b> (можно через операционную рану); при чётких границах --- резекция и анастомоз «конец в конец». И.: операция выбора --- колостома на здоровый вышележащий отдел; реконструкция через 1--2 мес</p>
<p style="margin:0 0 10px"><b>Мультисегментарное (≈ 55 %)</b>         резекция + одна или несколько энтеростом; или анастомоз «конец в конец»</p>
<p style="margin:0 0 10px"><b>Clip and Drop-Back</b>                  резекция некроза, клипирование краёв и погружение в брюшную полость, релапаротомия через 48--72 ч → реконструкция; сохраняет длину кишки, но опасна у детей с экстремально низкой массой</p>
<p style="margin:0 0 10px"><b>Patch, Drain and Wait</b>               санация брюшной полости, гастростома, ушивание перфораций (заплата из кишки или сальника), дренажи Penrose; ожидание около 2 мес → реконструкция</p>
<p style="margin:0 0 10px"><b>«Ожерелье» из кишечных фрагментов</b>   нежизнеспособное резецируют, предперфорации ушивают, фрагменты нанизывают на зонд № 8 и выводят в виде стом; повторная операция на 10--14-й день</p>
<p style="margin:0 0 10px"><b>Тотальный НЭК</b>                       прогноз неблагоприятен («не столько хирургическая, сколько этическая проблема»): ревизия, проксимальная стома, лапаростома, программная ревизия через 48--72 ч</p>
<p style="margin:0 0 10px"><b>Стома</b> быстро разгружает кишку, улучшает кровообращение и восстанавливает перистальтику, но требует повторной операции и даёт большие потери (инфузия, частичное ПП); у недоношенных стома предпочтительнее. Стому закрывают не ранее чем через 4--8 нед (Р.).</p>
<p style="margin:0 0 10px">## <b>Профилактика (Р.)</b></p>
<p style="margin:0 0 10px">Учёт факторов риска; <b>грудное молоко</b> (протективная роль доказана); кормление начинают с малых доз --- от орошения рта молозивом сразу после рождения до 1--3 мл на приём в первые сутки; наращивают постепенно, а при большом остаточном объёме в желудке и вздутии питание немедленно отменяют; избегать энтеральных гиперосмолярных препаратов при малых объёмах питания.</p>
<p style="margin:0 0 10px"><b>Группа</b>        <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Летальность</b>   по Р. 25--40 % (зависит от НЭК и сопутствующих проблем); по И. при консервативном излечении (I--III стадии) 17--34 %, главным образом у глубоко недоношенных; при разлитом перитоните <b>80--90 %</b></p>
<p style="margin:0 0 10px"><b>Частые (Р.)</b>   раневая инфекция, подкожная эвентрация петель, вентральная грыжа, холестаз, рецидив НЭК, <b>стеноз кишки</b> , вторичная мальабсорбция, <b>синдром короткой кишки</b> , несостоятельность или стеноз анастомоза</p>
<p style="margin:0 0 10px"><b>Поздние</b>       при «успешном» консервативном лечении (чаще дети с экстремально низкой массой) в 2,5--4 мес --- кишечная непроходимость из-за рубцового стеноза; нужно диспансерное наблюдение несколько лет (гастроэнтеролог, невролог, хирург)</p>

<p style="margin:0 0 10px"><b>Важно!</b> В книгах нет отдельных разделов про виды наркоза, стадии и постреанимационную болезнь --- это в основном из интернета (отмечено). Из Исакова --- принципы обезболивания, осложнения и сердечно-лёгочная реанимация.</p>
<p style="margin:0 0 10px">## <b>Виды обезболивания у детей</b></p>
<p style="margin:0 0 10px">• в подавляющем большинстве случаев детей оперируют <b>под общим обезболиванием (наркозом)</b> :</p>
<p style="margin:0 0 10px">ребёнок не должен «присутствовать на своей операции»; местную и регионарную анестезию надо шире применять, но как один из компонентов общего обезболивания (И.);</p>
<p style="margin:0 0 10px">• <b>комбинированный многокомпонентный наркоз (сбалансированная анестезия)</b> --- основной (И.):</p>
<p style="margin:0 0 10px">общие анестетики выключают сознание (чаще галотан с закисью азота), центральные анальгетики (морфин, тримеперидин) или регионарная анестезия дают обезболивание и блокаду патологических рефлексов, миорелаксанты --- расслабление мышц;</p>
<p style="margin:0 0 10px">• <b>однокомпонентный наркоз</b> (галотан, барбитураты, кетамин) --- при кратковременных малотравматичных</p>
<p style="margin:0 0 10px">операциях и манипуляциях (И.);</p>
<p style="margin:0 0 10px">• программа подготовки к операции и наркозу согласуется хирургом и анестезиологом (И.).</p>
<p style="margin:0 0 10px"><b>Вид (интернет)</b>                         <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Ингаляционный</b>                          анестетик поступает через дыхательные пути (маска, эндотрахеальная трубка)</p>
<p style="margin:0 0 10px"><b>Неингаляционный (внутривенный)</b>         анестетики вводят в вену; короткие вмешательства, индукция</p>
<p style="margin:0 0 10px"><b>Многокомпонентный (сбалансированный)</b>   сочетание ингаляционного и неингаляционного; компоненты: сон, амнезия, анальгезия, миорелаксация, нейровегетативная защита, поддержание функций и гомеостаза</p>
<p style="margin:0 0 10px"><b>Регионарная и местная</b>                  проводниковая, эпидуральная, спинальная; послеоперационное обезболивание --- эпидуральная анестезия очень эффективна (И.)</p>
<p style="margin:0 0 10px"><b>Стадия</b>                                            <b>Признаки</b></p>
<p style="margin:0 0 10px"><b>I --- анальгезии</b>                                  сознание угасает, болевая чувствительность снижается; дыхание ровное</p>
<p style="margin:0 0 10px"><b>II --- возбуждения</b>                                сознание выключено, двигательное и речевое возбуждение, мышечный тонус повышен, тахикардия, АД повышено, зрачки широкие, возможны рвота и ларингоспазм; операцию не начинают</p>
<p style="margin:0 0 10px"><b>III --- хирургическая (уровни III1--III4)</b>         сон, мышцы расслаблены, болевые и многие рефлексы угнетены, дыхание ровное; с углублением (III3--III4) падает тонус мышц, зрачок расширяется; нужная для операции</p>
<p style="margin:0 0 10px"><b>IV --- передозировки (агональная) / пробуждения</b>   угнетение дыхательного и сосудодвигательного центров: паралич дыхания, падение АД, расширенные зрачки, остановка сердца; при выходе из наркоза --- стадия пробуждения</p>
<p style="margin:0 0 10px">## <b>Стадии наркоза (по Гведелу, 1937, описаны для эфирного наркоза) --- интернет</b></p>
<p style="margin:0 0 10px">У современных анестетиков (галотан и др.) и при сбалансированной анестезии классическая картина стадий выражена нечётко; описание признаков сделано по общим учебникам --- сверь с лекцией.</p>
<p style="margin:0 0 10px">## <b>Осложнения наркоза и ближайшего периода</b></p>
<p style="margin:0 0 10px"><b>Группа</b>                           <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>ЦНС (И.)</b>                         угнетение сознания, возбуждение, судороги; озноб чаще после галотана, возбуждение --- после эфира; дезориентация после нейролептаналгезии; отёк мозга</p>
<p style="margin:0 0 10px"><b>Дыхание (И.)</b>                     гиповентиляция, гипоксия, гиперкапния, дыхательный ацидоз (остаточное действие анестетиков и релаксантов, нарушение проходимости, болевая гиповентиляция, пневмоторакс, ателектаз, пневмония)</p>
<p style="margin:0 0 10px"><b>Сердечно-сосудистые (И.)</b>         тахикардия, гипотензия, нарушения ритма, невосполненная кровопотеря, шок (геморрагический, анафилактический), отёк лёгких</p>
<p style="margin:0 0 10px"><b>Прочие (И.)</b>                      лихорадочные состояния и судороги; нарушения водно-электролитного обмена; метаболический ацидоз; парез ЖКТ</p>
<p style="margin:0 0 10px"><b>Анестезиологические (интернет)</b>   обструкция верхних дыхательных путей, <b>ларингоспазм</b> , бронхоспазм, аспирация; <b>злокачественная гипертермия</b> (чаще у детей; единственное средство лечения --- дантролен)</p>
<p style="margin:0 0 10px">## <b>Сердечно-лёгочная реанимация и постреанимационная болезнь</b></p>
<p style="margin:0 0 10px">• клиническая смерть: до необратимых изменений в коре мозга <b>3--6 мин</b> ; у детей в 60--80 % --- из-за</p>
<p style="margin:0 0 10px">нарушений дыхания; признаки --- нет сердечной деятельности, сознания и рефлексов, дыхания, зрачки расширены без реакции (И., с. 72);</p>
<p style="margin:0 0 10px">• реанимация (И.): A --- проходимость дыхательных путей, B --- ИВЛ (рот в рот, мешок), C --- закрытый массаж</p>
<p style="margin:0 0 10px">сердца (у новорождённых и грудных --- пальцами, середина грудины), D --- эпинефрин 10--20 мкг/кг, E --- ЭКГ, F --- дефибрилляция (2--4--4 Дж/кг); прекращают, если за 30 мин нет эффекта. *Соотношения и дозы в книге устарели --- возьми современные из лекции* .</p>
<p style="margin:0 0 10px"><b>Постреанимационная болезнь</b> --- новая нозологическая единица, выделенная В. А. Неговским и А. М. Гурвичем: патологические изменения формируются в организме не только при умирании, но и <b>в ходе самого постреанимационного процесса</b> ; в первую очередь страдает ЦНС, которая лимитирует сроки клинической смерти, после которых возможно полное восстановление (интернет, Аврущенко и др., 2009).</p>
<p style="margin:0 0 10px">• <b>ранимее всего</b> кора мозга, мозжечок, гиппокамп; изменения нервных клеток нарастают постепенно и</p>
<p style="margin:0 0 10px">зависят от длительности и тяжести гипоксии; возможна <b>отсроченная постгипоксическая энцефалопатия</b> ;</p>
<p style="margin:0 0 10px">• восстановление после клинической смерти может длиться <b>месяцами</b> (Неговский);</p>
<p style="margin:0 0 10px">• в патогенез входят гипоксия и реперфузионное повреждение, микроциркуляторные нарушения,</p>
<p style="margin:0 0 10px">эндотоксикоз, полиорганная недостаточность (общие учебники);</p>
<p style="margin:0 0 10px">• <b>принципы лечения</b> (общие учебники): поддержание вентиляции и оксигенации, гемодинамики;</p>
<p style="margin:0 0 10px">церебропротекция (борьба с отёком мозга и судорогами, нормализация температуры); коррекция КОС и электролитов; профилактика инфекции; детоксикация.</p>
<p style="margin:0 0 10px"><b>Не нашёл: Стадии постреанимационной болезни по Неговскому</b> (с временем от оживления) я не смог найти в проверенном источнике и не писал по памяти --- возьми их из лекции или учебника кафедры.</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   критическое состояние · посиндромная терапия · ИВЛ · кислотно-основное состояние · литическая смесь</p>
<p style="margin:0 0 10px">## <b>Определение и принципы (И.)</b></p>
<p style="margin:0 0 10px"><b>Интенсивная терапия</b> --- комплекс лечебных мероприятий у больного, у которого одна или несколько жизненно важных функций нарушены настолько, что без искусственной компенсации он существовать не может. У детей из-за анатомо-физиологических особенностей критические состояния возникают значительно чаще, чем у взрослых.</p>
<p style="margin:0 0 10px">• <b>первый принцип</b> --- замещение утраченной или резко нарушенной функции: управляемое или</p>
<p style="margin:0 0 10px">вспомогательное дыхание, искусственное кровообращение, внепочечный диализ, парентеральное питание и инфузионная терапия;</p>
<p style="margin:0 0 10px">• <b>второй принцип</b> --- посиндромный характер: сначала лечат наиболее тяжёлый синдром, потом переходят</p>
<p style="margin:0 0 10px">к патогенетической терапии;</p>
<p style="margin:0 0 10px">• тяжёлый синдром обычно создаёт <b>порочный круг</b> (гипоксия → возбуждение → стресс, гистамин →</p>
<p style="margin:0 0 10px">воспаление → ещё больший расход кислорода), поэтому лечат все звенья цепи.</p>
<p style="margin:0 0 10px">## <b>Показания</b></p>
<p style="margin:0 0 10px">• «послеоперационная болезнь»: неспецифические синдромы (боль, централизация кровообращения,</p>
<p style="margin:0 0 10px">гиповентиляция) и специфические для операции (дыхание после операций на груди, гемодинамика после операций на сердце и др.);</p>
<p style="margin:0 0 10px">• токсические пневмонии, токсикозы, нейроинфекции, тяжёлые интоксикации, шок (геморрагический,</p>
<p style="margin:0 0 10px">травматический, анафилактический), отёк мозга и отёк лёгких, судороги, лихорадочные состояния, острые нарушения дыхания, водно-электролитные и метаболические расстройства, парез кишечника;</p>
<p style="margin:0 0 10px">• нарушения функции ЦНС, дыхания, печени, почек и глубокие расстройства обмена («биохимическая и</p>
<p style="margin:0 0 10px">вегетативная буря», полиорганная патология).</p>
<p style="margin:0 0 10px">## <b>Основные синдромы и лечение (И.)</b></p>

<p style="margin:0 0 10px"><b>Нарушения ЦНС, отёк мозга</b>                устранить гипоксию, гиповолемию, ацидоз, боль; обезболивание (тримеперидин 0,1--1 мг/кг, фентанил, морфин; эпидуральная анестезия); при отёке мозга --- вентиляция и газообмен, маннитол 0,5--1 г/кг, альбумин или плазма 8--10 мл/кг/сут, фуросемид, глицерол, дексаметазон</p>

<p style="margin:0 0 10px">## <b>Противопоказания</b></p>
<p style="margin:0 0 10px">Абсолютных противопоказаний к самой интенсивной терапии практически нет. Ограничения (по общим принципам, не из книг): отказ законных представителей; биологическая смерть и состояния, несовместимые с жизнью --- решение консилиума. Есть ограничения к <b>отдельным методам</b> , описанные у Исакова:</p>
<p style="margin:0 0 10px">• калий --- не вводить без показаний в первые 2 суток после операции (риск гиперкалиемии);</p>
<p style="margin:0 0 10px">• канюлирование крупных вен у новорождённых и грудных --- только специалистом и по строгим</p>
<p style="margin:0 0 10px">показаниям;</p>
<p style="margin:0 0 10px">• внутрисердечное введение лекарств --- только если нет интубации и нет доступа к вене 90 с;</p>
<p style="margin:0 0 10px">• открытый массаж сердца --- только в стационаре; избыточное переливание крови опасно.</p>

<p style="margin:0 0 10px"><b>Гипо- и гиперкалиемия, гипонатриемия, алкалоз</b>   ошибки в дозах калия, гидрокарбоната, потери</p>
<p style="margin:0 0 10px"><b>Тромбозы, эмболии, сепсис</b>                       катетеризация крупных вен, особенно у новорождённых</p>

<p style="margin:0 0 10px">## <b>Противопоказания и ограничения</b></p>
<p style="margin:0 0 10px">Прямого перечня в книге нет. Из источников: <b>калий</b> --- в первые 2 суток после операции; <b>калий и гиперкалиемия, анурия</b> --- без контроля нельзя (общие принципы); при <b>гипергидратации, отёке лёгких, сердечной недостаточности</b> объём жидкости ограничивают (И.); <b>меглюмина натрия сукцинат противопоказан детям до 1 года</b> (КР 2015); крупные вены у новорождённых --- только специалисту; избыточное переливание крови опасно (И.).</p>

<p style="margin:0 0 10px"><b>Важно!</b> В Исакове и Разумовском нет раздела про острые отравления в общем виде: есть только ожоги пищевода прижигающими веществами. Основной текст --- из клинических рекомендаций Союза педиатров России и РОСМП. <b>Дозы не переписывал, кроме приведённых там в явном виде --- проверь по рекомендациям.</b></p>
<p style="margin:0 0 10px"><b>Отравление (интоксикация)</b> --- острое или хроническое угрожающее жизни состояние, развивающееся при взаимодействии организма и яда. У детей чаще всего <b>острые случайные</b> отравления; хронические и подострые крайне редки. Чаще всего лекарственные отравления --- у детей <b>от 1 года до 6 лет</b> и у подростков 14--18 лет.</p>

<p style="margin:0 0 10px"><b>По тяжести</b>            лёгкие, средней тяжести, тяжёлые, крайне тяжёлые, смертельные</p>
<p style="margin:0 0 10px"><b>Чаще всего у детей</b>    лекарства: наркотические анальгетики, трициклические антидепрессанты, антигипертензивные, бензодиазепины, дигоксин, препараты железа, парацетамол, препараты калия; бытовая химия: органические кислоты (уксусная), едкие щёлочи, перманганат калия; нафазолин; укусы змей (гадюка)</p>
<p style="margin:0 0 10px"><b>Исаков</b>                ожоги пищевода у детей 1--3 лет: чаще концентрированная уксусная кислота (70 %), технические кислоты, нашатырный спирт; кристаллы перманганата калия --- тяжёлые повреждения глотки</p>
<p style="margin:0 0 10px">## <b>Причины и классификация</b></p>
<p style="margin:0 0 10px">## <b>Диагностика и клиника</b></p>
<p style="margin:0 0 10px">• диагностика на догоспитальном этапе: <b>анамнез</b> (факт приёма, отсутствие родителей рядом), <b>осмотр</b></p>
<p style="margin:0 0 10px"><b>места происшествия</b> , физикальное обследование, выявление специфических симптомов и синдромов; собрать рвотные массы (не промывные воды!) и найденные таблетки на токсикологическую экспертизу;</p>
<p style="margin:0 0 10px">• в первую очередь оценить сознание, дыхание и гемодинамику; осмотреть рот и кожу вокруг рта на ожог,</p>
<p style="margin:0 0 10px">стридор --- возможный ожог дыхательных путей;</p>
<p style="margin:0 0 10px">• цель --- выявить ведущий <b>медиаторный синдром</b> и лечить патогенетически.</p>
<p style="margin:0 0 10px"><b>Синдром</b>                      <b>Типичные вещества и признаки</b></p>
<p style="margin:0 0 10px"><b>Холинергический</b>              фосфорорганические соединения: миоз, влажная кожа, гиперсаливация, бронхорея, брадикардия, непроизвольные мочеиспускание и дефекация</p>
<p style="margin:0 0 10px"><b>Антихолинергический</b>          атропин, антигистаминные, трициклические антидепрессанты: мидриаз, сухость кожи и слизистых, тахикардия, парез кишки, задержка мочи</p>
<p style="margin:0 0 10px"><b>Угнетение ЦНС / кома</b>         барбитураты, опиаты (миоз, апноэ), бензодиазепины, клофелин (брадикардия, гипотензия), этанол</p>
<p style="margin:0 0 10px"><b>Печёночная недостаточность</b>   <b>парацетамол</b> : сначала тошнота, рвота, потливость (12--24 ч), через 24--36 ч --- боль и увеличение печени, желтуха; тяжесть по начальным симптомам оценить нельзя; токсическая доза примерно 150 мг/кг</p>
<p style="margin:0 0 10px"><b>Желудочно-кишечные</b>           препараты железа (боль в животе, рвота с кровью, затем ацидоз, печёночная недостаточность, шок), салицилаты</p>
<p style="margin:0 0 10px"><b>Ожог ротоглотки, пищевода</b>    кислоты, щёлочи, перманганат калия: боль, слюнотечение, обструкция дыхательных путей; при тяжёлых --- желудочное кровотечение</p>
<p style="margin:0 0 10px"><b>Ожоги пищевода (И.)</b> : три степени (I --- катаральная, II --- некроз слизистой с фибрином, III --- глубокий некроз, язвы, затем рубцовое сужение); «период мнимого благополучия» с 5--6-го дня до начала рубцевания (4--6 нед); достоверный метод --- ФЭГДС; профилактика стеноза --- бужирование.</p>
<p style="margin:0 0 10px">## <b>Лечение (КР 2015)</b></p>
<p style="margin:0 0 10px">Четыре направления: <b>1) коррекция витальных нарушений</b> , 2) удаление невсосавшегося яда, 3) удаление всосавшегося яда, 4) антидоты.</p>
<p style="margin:0 0 10px">• <b>А --- витальные функции</b> : при коме любой степени --- интубация и ИВЛ; при гипотензии и шоке --- 0,9 %</p>
<p style="margin:0 0 10px">NaCl 20 мл/кг, при необходимости вазопрессоры;</p>
<p style="margin:0 0 10px">• <b>рвота</b> эффективна только в первые минуты (не позже 1 ч); <b>противопоказана</b> при угнетении сознания и</p>
<p style="margin:0 0 10px">при отравлении едкими веществами и нефтепродуктами; риск аспирации;</p>
<p style="margin:0 0 10px">• <b>промывание желудка</b> : тоже эффективно в первые минуты; зондовое, тёплая вода 10 мл/кг на порцию до</p>
<p style="margin:0 0 10px">чистых вод (не более 3 раз), общий объём <b>не более 150 мл/кг</b> (иначе отёк мозга); противопоказано при угнетении сознания (кроме как после интубации) и при отравлении кислотами, щёлочами, нефтепродуктами. Зонд Мошкина у детей запрещён;</p>
<p style="margin:0 0 10px">• <b>активированный уголь</b> : 1--2 г/кг, затем 0,25--0,5 г/кг каждые 4--6--12--24 ч; не нужен при кислотах,</p>
<p style="margin:0 0 10px">щелочах, железе, спиртах, цианидах, солях тяжёлых металлов; противопоказан при непроходимости ЖКТ и угнетении сознания без интубации;</p>
<p style="margin:0 0 10px">• <b>удаление всосавшегося яда на догоспитальном этапе</b> : инфузионная терапия 10 мл/кг в час</p>
<p style="margin:0 0 10px">(сбалансированные кристаллоиды); меглюмина натрия сукцинат --- противопоказан до 1 года;</p>
<p style="margin:0 0 10px">• <b>ожог кислотами и щелочами</b> : реанимация, венозный доступ, обезболивание (наркотические</p>
<p style="margin:0 0 10px">анальгетики), <b>зондовое</b> промывание водой после обезболивания (беззондовое и нейтрализация запрещены), преднизолон 5 мг/кг в/в, 0,9 % NaCl 10 мл/кг/ч. Кристаллы перманганата удаляют, рот промывают 5 % раствором аскорбиновой кислоты. Исаков: первая помощь --- вода и промывание зондом; бужирование с конца первой недели при II--III степени; пенициллины и парентеральное питание по показаниям.</p>

<p style="margin:0 0 10px">## <b>Осложнения и дальнейшее ведение</b></p>
<p style="margin:0 0 10px">• осложнения самого отравления: кома, дыхательная и сердечно-сосудистая недостаточность, шок,</p>
<p style="margin:0 0 10px">нарушения ритма, печёночная и почечная недостаточность, судороги, отёк мозга; при ожогах --- отёк гортани, аспирационная пневмония, <b>рубцовое сужение пищевода</b> (И.);</p>
<p style="margin:0 0 10px">• осложнения лечения: аспирация при рвоте и промывании, <b>гипоосмолярная гипергидратация и отёк</b></p>
<p style="margin:0 0 10px"><b>мозга</b> при объёме более 150 мл/кг, неукротимая рвота, отсроченный эффект препаратов;</p>
<p style="margin:0 0 10px">• госпитализируют <b>всех</b> с отравлением лекарствами, угнетением сознания, расстройствами гемодинамики и</p>
<p style="margin:0 0 10px">дыхания, суицидальными попытками, подозрением на ожог; выписывать в течение суток нельзя --- высок риск отсроченных осложнений; прогноз в большинстве случаев благоприятный.</p>
<p style="margin:0 0 10px"><b>Дифференциальная диагностика</b> (КР): нейроинфекция (менингит, энцефалит), гипо- и гипергликемия, тяжёлая ЧМТ.</p>`},
  {n:169, t:"Мочекаменная болезнь. Этиология и патогенез", a:`<p style="margin:0 0 10px">Разумовский, гл. 54 (с. 722--725); Исаков, 6.10 (с. 529--530).</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   уролитиаз · метаболические нарушения · инфекция · тубулопатии · кристаллизация · эндемичность</p>
<p style="margin:0 0 10px"><b>Мочекаменная болезнь (уролитиаз)</b> --- заболевание, при котором из-за нарушения обмена веществ (эндогенного или экзогенного) в моче образуется нерастворимый осадок в виде песка (до 1 мм) или камней (от 1 до 25 мм и больше). МКБ-10: N20, N21, N22.</p>
<p style="margin:0 0 10px">## <b>Эпидемиология</b></p>
<p style="margin:0 0 10px">• у детей встречается реже, чем у взрослых; <b>мальчики болеют в 3 раза чаще</b> ; преобладает</p>
<p style="margin:0 0 10px">правостороннее поражение, двустороннее --- около 20,5 % (Р.);</p>
<p style="margin:0 0 10px">• возраст --- <b>чаще от 3 до 10 лет</b> (незрелость регуляции, лабильность обмена, повышенная проницаемость</p>
<p style="margin:0 0 10px">барьеров);</p>
<p style="margin:0 0 10px">• заболевание <b>эндемично</b> : у нас --- Средняя Азия, Закавказье, Урал, Поволжье (И.); в РФ: Поволжье,</p>
<p style="margin:0 0 10px">бассейны Камы и Дона, Северный Кавказ, Алтай, Дальний Восток (Р.); за последние десятилетия число случаев у детей растёт;</p>
<p style="margin:0 0 10px">• камни у детей чаще в <b>лоханке</b> ; быстрый рост камней; важна роль аномалий мочевой системы и нарушения</p>
<p style="margin:0 0 10px">уродинамики (у взрослых преобладают первичные камни).</p>
<p style="margin:0 0 10px"><b>Группа</b>                           <b>Факторы</b></p>
<p style="margin:0 0 10px"><b>Экзогенные (Р.)</b>                  жаркий климат; состав воды (мало йода, избыток известковых солей); недостаток магния, йода, избыток кальция и стронция; дефицит витамина A, гипервитаминоз D; избыток или недостаток белка; растительная углеводная пища</p>
<p style="margin:0 0 10px"><b>Эндогенные</b>                       нарушение функции паращитовидных желез: гиперпаратиреоз --- этиологический фактор в 30--40 % (избыток кальция и фосфора в моче); <b>энзимопатии и тубулопатии</b> (врождённые и приобретённые); наследственность (Р., И.)</p>
<p style="margin:0 0 10px"><b>Местные</b>                          <b>инфекция мочевых путей</b> , <b>обструктивные уропатии и аномалии</b> (нарушена уродинамика), нарушения кровоснабжения почек при шоке и травме (И.)</p>
<p style="margin:0 0 10px"><b>Кальциноз мочевого пузыря (Р.)</b>   редок; у детей, которым при рождении проводили реанимацию с введением в сосуды пуповины препаратов (например, хлорида кальция)</p>
<p style="margin:0 0 10px">## <b>Этиология</b></p>
<p style="margin:0 0 10px"><b>Камни</b>                        <b>Частота и вид (Р.)</b></p>
<p style="margin:0 0 10px"><b>Оксалаты</b>                     темно-бурые, поверхность твёрдая с шипами («тутовая ягода»); неорганические соединения кальция --- 70--80 % всех</p>
<p style="margin:0 0 10px"><b>Фосфаты</b>                      белые, хрупкие, слегка шероховатые</p>
<p style="margin:0 0 10px"><b>Магнийсодержащие (струвит)</b>   5--10 %; часто с инфекцией мочевых путей</p>
<p style="margin:0 0 10px"><b>Мочекислые (ураты)</b>           10--15 %, жёлто-коричневые, гладкие; с возрастом чаще</p>
<p style="margin:0 0 10px"><b>Белковые (цистин, ксантин)</b>   0,4--0,6 %; нарушение обмена аминокислот</p>
<p style="margin:0 0 10px">## <b>Состав камней</b></p>
<p style="margin:0 0 10px">В чистом виде камни --- не более чем в половине случаев; чаще смешанные. По Исакову у детей чаще всего фосфатные, оксалатные, карбонатные и цистиновые.</p>
<p style="margin:0 0 10px">## <b>Патогенез</b></p>
<p style="margin:0 0 10px">Единой концепции нет, болезнь <b>полиэтиологична</b> (Р.). Наиболее совершенна <b>коллоидно-кристаллизационная теория (органической матрицы)</b> .</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 3</b> | <b>ШАГ 2</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Тубулопатия / энзимопатия: избыток литогенных веществ в моче</span><span>Кристаллизация и рост (мало ингибиторов); инфекция и застой | Перенасыщение солями → ядро, матрица | Камень → обструкция → колика, пиелонефрит</span></div>
<p style="margin:0 0 10px">• <b>инфекция усугубляет</b> : бактерии (особенно <b>Proteus</b> ) образуют уреазу → моча ощелачивается → бурно</p>
<p style="margin:0 0 10px">выпадают аморфные фосфаты и быстро растёт камень; поэтому лечат инфекцию в любом случае, независимо от титра бактерий;</p>
<p style="margin:0 0 10px">• <b>урокиназа и местный фибринолиз</b> : в норме активирует плазминоген → плазмин, который растворяет</p>
<p style="margin:0 0 10px">фибрин и участвует в защитных коллоидах мочи; её нарушение --- один из механизмов камнеобразования;</p>
<p style="margin:0 0 10px">• камни мочеточников, как правило, <b>вторичны</b> (спустились из почки); остановка в трёх физиологических</p>
<p style="margin:0 0 10px">сужениях: лоханочно-мочеточниковом, пузырно-мочеточниковом и в месте перекреста с подвздошными сосудами; камни уретры образуются редко (дивертикул уретры).</p>`},
  {n:170, t:"Мочекаменная болезнь. Клиника и классификация", a:`<p style="margin:0 0 10px">Разумовский, гл. 54 (с. 724--725); Исаков, 6.10 (с. 530--531, рис. 6-72). Отдельной классификации по тяжести в книгах нет --- привожу те, что даны в тексте.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   почечная колика · гематурия · лейкоцитурия · классификация · коралловидный камень</p>
<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• <b>боль</b> --- наиболее характерный симптом (И., Р.): постоянная или приступообразная, тупая или острая;</p>
<p style="margin:0 0 10px">локализация и иррадиация зависят от места камня. Большие гладкие и коралловидные камни малоподвижны --- тупая боль в пояснице или нет боли; мелкие шероховатые и подвижные дают <b>почечную колику</b> ;</p>
<p style="margin:0 0 10px">• <b>почечная колика</b> (И.): камень обтурирует мочевые пути, растёт внутрилоханочное давление; при</p>
<p style="margin:0 0 10px">продвижении по мочеточнику боль перемещается в паховую область, бедро, половые органы; общие признаки --- лихорадка, рвота, метеоризм, запор, интоксикация, лейкоцитоз, ↑ СОЭ; обычно заканчивается самопроизвольным отхождением мелкого камня;</p>
<p style="margin:0 0 10px">• <b>у детей раннего возраста</b> колика проявляется беспокойством, диспепсией, рвотой --- картина «острого</p>
<p style="margin:0 0 10px">живота»; из-за этого бывают неоправданные лапаротомии (при правосторонней --- аппендэктомия по поводу «катарального аппендицита»);</p>
<p style="margin:0 0 10px">• <b>гематурия</b> --- частый, постоянный симптом (80--90 %, Р.): от эритроцитурии до макрогематурии, обычно</p>
<p style="margin:0 0 10px">после нагрузки; <b>терминальная гематурия</b> --- при камне мочевого пузыря и вторичном цистите (И.);</p>
<p style="margin:0 0 10px">• <b>дизурия</b> --- при камнях нижних отделов: частые болезненные позывы, боль в головке полового члена</p>
<p style="margin:0 0 10px">(камень пузыря);</p>
<p style="margin:0 0 10px">• <b>лейкоцитурия, бактериурия</b> --- вторичный пиелонефрит или цистит;</p>
<p style="margin:0 0 10px">• <b>отхождение камней</b> --- достоверный признак (но не гарантия, что камней больше нет); без колики у детей</p>
<p style="margin:0 0 10px">камни отходят крайне редко (Р.).</p>

<p style="margin:0 0 10px">## <b>Классификация</b></p>
<p style="margin:0 0 10px"><b>Признак</b>                                         <b>Виды (по тексту книг)</b></p>
<p style="margin:0 0 10px"><b>По локализации (Р.)</b>                             камни чашечек, лоханки, мочеточников, мочевого пузыря, уретры; камни мочеточников обычно вторичны</p>
<p style="margin:0 0 10px"><b>По химическому составу (Р.; минералогическая)</b>   оксалаты, фосфаты, карбонаты, магниевые (струвит), мочекислые, белковые (цистин, ксантин); чистые и смешанные</p>
