<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Предоперационная подготовка</b></h4></p>
<p style="margin:0 0 10px">• зонд в желудок и <b>декомпрессия</b> , учёт потерь; возмещение жидкости и электролитов, контроль сахара;</p>
<p style="margin:0 0 10px">• оптимальный температурный режим (в том числе при транспортировке и анестезии), контроль сатурации;</p>
<p style="margin:0 0 10px">• перед операцией --- <b>витамин К</b> и антибиотики широкого спектра;</p>
<p style="margin:0 0 10px">• при атрезии <b>тощей</b> кишки подготовка может занять 1--2 дня; при атрезии <b>подвздошной</b> зонд не предотвращает растяжения --- операцию делают как можно раньше, <b>в первые сутки</b> , чтобы избежать ишемии и перфорации; при выраженном метеоризме с дыхательными нарушениями иногда нужна ИВЛ до операции.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Операция</b></h4></p>
<p style="margin:0 0 10px">• доступ --- <b>супраумбиликальный поперечный разрез</b> (на 1 см выше пупка, пересекается круглая связка печени); Исаков: верхняя поперечная лапаротомия, ревизия всего кишечника для исключения множественной атрезии;</p>
<p style="margin:0 0 10px">• из-за разницы диаметров (до 5 : 1) резецируют <b>10--15 см приводящей кишки</b> (Исаков --- 10--12 см), с которой плохая функция.</p>
<p style="margin:0 0 10px"><b>Вариант анастомоза</b>                                                         <b>Суть</b></p>
<p style="margin:0 0 10px"><b>«Конец в конец»</b> («рыбий рот», Louw, 1967)                                  резекция 10--15 см проксимального сегмента и 1--2 см отводящего под косым углом к противобрыжеечному краю; однорядный непрерывный шов PDS 6/0--7/0; лучший транзит</p>
<p style="margin:0 0 10px">«Конец в бок» с косым пересечением                                             увеличивает диаметр отводящей кишки</p>
<p style="margin:0 0 10px"><b>Пликационный анастомоз de Lorimier--Harrison</b> ; тапирование (Tomas, 1969)   уменьшают диаметр приводящей петли</p>
<p style="margin:0 0 10px"><b>Bishop--Koop</b> («конец в бок»)                                               при подозрении на муковисцидоз или аганглиоз толстой кишки; отводящий отрезок выводят на брюшную стенку (стома), позже закрывают</p>
<p style="margin:0 0 10px"><b>Множественные атрезии</b> (IV тип)                                             двухэтапно: пликация приводящей петли, остальные анастомозы «конец в конец» на стенте; через 8--10 суток окончательный анастомоз</p>
<p style="margin:0 0 10px">Исаков                                                                         анастомозы «конец в конец» или «конец в 3/4», Т-образный анастомоз однорядными швами</p>
<p style="margin:0 0 10px">Возможны видеоассистированная лапароскопия и «крыловидный» анастомоз по T. Kato, но они требуют большого опыта (Р.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                                             <b>Комментарий</b></p>
<p style="margin:0 0 10px"><b>Несостоятельность анастомоза</b>                           чаще из-за недостатка опыта хирурга; нужны оптика, тонкий шов и качественное анестезиологическое обеспечение</p>
<p style="margin:0 0 10px"><b>Синдром короткой кишки (СКК)</b>                           при типах IIIb и IV избегают обширных резекций</p>
<p style="margin:0 0 10px">Нарушение транзита после операции                          пассаж восстанавливается долго, особенно при IIIb и IV типах; нужно <b>длительное парентеральное питание</b></p>
<p style="margin:0 0 10px">Раннее: инфекции, водно-электролитные нарушения (Исаков)   коррекция, профилактика инфекций, формирование биоценоза и барьерной функции кишки</p>
<p style="margin:0 0 10px">Исходы: при своевременной антенатальной диагностике и вовремя выполненной операции --- благоприятный; при сопутствующих пороках, муковисцидозе и аганглиозе прогноз ухудшается. Диспансерное наблюдение --- до <b>3 лет</b> (Исаков).</p>`},
  {n:41, t:"Болезнь Гиршпрунга. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">*Разумовский, гл. 24 (с. 370--373); Исаков, с. 382--387.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: аганглиоз нейробласты супрастенотическое расширение RET</b></p>
<p style="margin:0 0 10px"><b>запор и метеоризм</b></p>
<p style="margin:0 0 10px"><b>Болезнь Гиршпрунга (БГ)</b> , врождённый мегаколон --- порок развития толстой кишки: <b>отсутствие ганглиозных клеток</b> в нервных сплетениях стенки кишки, аномальные нервные волокна и нарушение проводимости в нервно-рефлекторных дугах → расстройство моторики. Код МКБ-10: <b>Q43.1</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология и генетика</b></h4></p>
<p style="margin:0 0 10px">• 1--3 на 5000 новорождённых (Р.); мальчики болеют в <b>4--5 раз</b> чаще (И.: 80--85 %); при протяжённых формах разницы по полу нет;</p>
<p style="margin:0 0 10px">• семейные случаи --- около 8 %; мутации гена <b>RET</b> (7--35 %), <b>EDNRB</b> (7 %), EDN3 (\\< 5 %); наследование доминантное с неполной пенетрантностью;</p>
<p style="margin:0 0 10px">• ассоциации: трисомия 21 (5--7 %), синдромы Ваарденбурга и Смита--Лемли--Опитца, ВПС (≈ 4 %), нейрофиброматоз, полиэндокринная неоплазия 2B, аноректальные пороки;</p>
<p style="margin:0 0 10px">• смертность в современных условиях не выше 1 %.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• БГ считают <b>мультифакториальным</b> заболеванием: генетическая предрасположенность + вторичный фактор (гипоксия, химические и лучевые агенты, вирусы), нарушающий миграцию нейробластов;</p>
<p style="margin:0 0 10px">• специфический ген БГ не найден, заболевание полиэтиологично (Р.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<p style="margin:0 0 10px"><b>Неделя эмбриогенеза</b>   <b>Что происходит при остановке миграции нейробластов</b></p>
<p style="margin:0 0 10px"><b>6-я</b>                   нейробласты в кардиальном отделе желудка</p>
<p style="margin:0 0 10px"><b>7-я</b>                   аганглиоз <b>всей толстой</b> и части подвздошной кишки (колонизация тонкой кишки)</p>
<p style="margin:0 0 10px"><b>8-я</b>                   аганглиоз толстой кишки при сохранной подвздошной (восходящая и поперечная ободочная)</p>
<p style="margin:0 0 10px"><b>9-я</b>                   аганглиоз нисходящей, сигмовидной и прямой кишки</p>
<p style="margin:0 0 10px"><b>10--12-я</b>              аганглиоз <b>сигмовидной и ректосигмоидного отдела</b> (самые частые формы)</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Нет ганглиев ауэрбахова сплетения</span><span>Зона не перистальтирует и спазмирована | Над ней: гипертрофия и расширение кишки | Копростаз, интоксикация, дисбактериоз, энтероколит</span></div>
<p style="margin:0 0 10px">• нейроны ауэрбахова сплетения --- мотонейроны мышц кишки; денервация ведёт к первичной гибели мышечных клеток в суженной зоне, перистальтические расстройства становятся стойкими;</p>
<p style="margin:0 0 10px">• гипертрофия расширенной части --- <b>компенсаторная</b> : перистальтика проксимального отдела активирована, чтобы протолкнуть содержимое через аганглионарный сегмент; позже мышцы гибнут и замещаются соединительной тканью;</p>
<p style="margin:0 0 10px">• меняются регионарный кровоток, проницаемость, всасывание; развивается <b>дисбактериоз</b> ; при любой длине зоны <b>прямая кишка поражена обязательно</b> , так как миграция идёт от оральных отделов к каудальным (И.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• <b>триада</b> (Р.): рвота с жёлчью, задержка опорожнения кишечника, увеличение живота; <b>задержка отхождения мекония более 48 ч</b> --- достоверный критерий;</p>
<p style="margin:0 0 10px">• постоянные признаки: <b>хронический запор</b> и <b>метеоризм</b> с первых недель; запор нарастает при введении прикорма и искусственном вскармливании;</p>
<p style="margin:0 0 10px">• «лягушачий живот», видимая перистальтика, тестоватая «опухоль» из каловых масс, <b>симптом глины</b> (ямки остаются при надавливании), бочкообразная грудная клетка, высокое стояние диафрагмы (бронхиты, пневмонии);</p>
<p style="margin:0 0 10px">• ректально: <b>пустая ампула</b> прямой кишки, каловые массы выше, тонус сфинктера повышен;</p>
<p style="margin:0 0 10px">• хроническая каловая интоксикация: гипотрофия, анемия, отставание в развитии; каловые камни; <b>энтероколит</b> и парадоксальная диарея (Cl. difficile у ≈ 1/3).</p>
<p style="margin:0 0 10px"><b>Форма (И.)</b>                               <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Компенсированная</b> (лёгкая, хроническая)   короткая аганглионарная зона; запор снимается клизмой; общее состояние почти не страдает; ухудшение с прикормом</p>
<p style="margin:0 0 10px"><b>Субкомпенсированная</b> (среднетяжёлая)      зона длиннее (прямая, сигмовидная, нисходящая); запор стойкий, нужны сифонные клизмы; интоксикация, анемия, отставание в росте</p>
<p style="margin:0 0 10px"><b>Декомпенсированная</b> (тяжёлая, острая)     с первых дней низкая механическая непроходимость: нет мекония и газов, нарастает вздутие, рвота, интоксикация; возможна картина «высокой» непроходимости (раздутая поперечная кишка пережимает ДПК)</p>`},
  {n:42, t:"Болезнь Гиршпрунга. Классификация, диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*Разумовский, гл. 24 (с. 372--377, рис. 24.1--24.3); Исаков, с. 383--391 (рис. 5-39).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: классификация Лёнюшкина ирригография биопсия прямой кишки</b></p>
<p style="margin:0 0 10px"><b>манометрия мегаколон</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px"><b>Деление</b>                      <b>Виды</b></p>
<p style="margin:0 0 10px">Анатомическая ( <b>Лёнюшкин</b> )   <b>I. Ректальная</b> : суперкороткий (промежностный отдел) и короткий (ампулярный и надампулярный) сегмент. <b>II. Ректосигмоидная</b> : дистальная треть или большая часть сигмовидной. <b>III. Сегментарная</b> (И.): один или два сегмента. <b>IV. Субтотальная</b> : нисходящая и часть поперечной, далее правая половина. <b>V. Тотальная</b> : вся толстая кишка (± подвздошная)</p>
<p style="margin:0 0 10px">По Puri (Р.)                     ректосигмоидный аганглиоз; аганглиоз с длинным сегментом; тотальный аганглиоз</p>
<p style="margin:0 0 10px">Клиническое течение (Р.)         хронические запоры; острая кишечная непроходимость новорождённых; энтероколит</p>
<p style="margin:0 0 10px">По тяжести (Исаков)              компенсированная, субкомпенсированная, декомпенсированная; (Баиров) острая, подострая и хроническая формы</p>
<p style="margin:0 0 10px">Частота: ректосигмоидный отдел --- 60--77 %, прямая кишка (экстраперитонеально) --- 14--25 %, выше сигмы --- 3--15 %, вся толстая кишка --- 0,5--5 % (Р.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                      <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Обзорная рентгенограмма</b>                    раздутые петли толстой кишки, уровни жидкости, высокое стояние диафрагмы</p>
<p style="margin:0 0 10px"><b>Ирригография</b> (решающая)                    суженный участок в дистальном отделе с <b>воронкообразным переходом</b> в супрастенотическое расширение; грубая складчатость слизистой, нет гаустр. Критерии: проксимальные отделы <b>в 1,5 раза шире</b> дистальных; <b>задержка бария ≥ 1 сут</b> . Исследуют в нескольких проекциях (4 снимка: при тугом заполнении и после опорожнения) + отсроченный. Новорождённым --- водорастворимый контраст</p>
<p style="margin:0 0 10px">Трудности рентгенодиагностики                  у новорождённых, при ультракоротких и тотальных формах, при колостоме</p>
<p style="margin:0 0 10px">УЗИ (И.)                                       размеры и конфигурация дистальных отделов, толщина стенки, аноректальный угол</p>
<p style="margin:0 0 10px"><b>Биопсия прямой кишки</b> (объективный метод)   <b>нет ганглиев</b> в подслизистом (50--75 полей) и межмышечном слоях; норма --- 6--12 ганглиев на 1 см; усиление активности <b>ацетилхолинэстеразы</b> ; биопсия --- выше внутреннего сфинктера, из суженной зоны</p>
<p style="margin:0 0 10px">Функциональные (манометрия, ЭМГ)               нет <b>ректоанального тормозного рефлекса</b> (при растяжении прямой кишки сфинктер сокращается); тонус сфинктера на 50 % выше; амплитуда ЭМГ ниже на 50 %</p>
<p style="margin:0 0 10px">Урологическое обследование (И.)                сопутствуют пороки мочевыделительной системы</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                                                                                               <b>Отличие</b></p>
<p style="margin:0 0 10px">Новорождённые: атрезия и стеноз подвздошной/толстой кишки, <b>мекониальный илеус</b> , <b>синдром мекониевой пробки</b> , <b>аноректальные пороки</b> (Р., И.)   аганглиоз исключают практически при любой низкой непроходимости новорождённых</p>
<p style="margin:0 0 10px">Язвенно-некротический энтероколит, сепсис, электролитные нарушения, гипотиреоз (Р.)                                                                     функциональная непроходимость; системные причины</p>
<p style="margin:0 0 10px"><b>Долихосигма, мегадолихосигма, мегаректум (идиопатический мегаколон)</b> (И.)                                                                            начало с 2--3 лет, меньше симптомов; при смене диеты бывает самостоятельный стул (при БГ после 1 года --- никогда); широкая ампула прямой кишки с калом; на УЗИ расширение и удлинение, <b>нет суженного участка</b></p>
<p style="margin:0 0 10px">Вторичный мегаколон, привычный запор (трещины, геморрой)                                                                                                видны на осмотре, ректальном исследовании, ректороманоскопии</p>
<p style="margin:0 0 10px"><b>Нейрональная интестинальная дисплазия</b>                                                                                                               гиперплазия сплетений, гигантские ганглии; в периоде новорождённости --- функциональная непроходимость</p>
<p style="margin:0 0 10px">Функциональный мегаколон, псевдообструкция (Р.)                                                                                                         у детей старше периода новорождённости</p>`},
  {n:43, t:"Болезнь Гиршпрунга. Лечение и осложнения", a:`<p style="margin:0 0 10px">*Разумовский, гл. 24 (с. 377--379); Исаков, с. 391--394.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: операция Свенсона Дюамель--Баиров Соаве колостома</b></p>
<p style="margin:0 0 10px"><b>энтероколит</b></p>
<p style="margin:0 0 10px"><b>Лечение БГ --- только хирургическое</b> (радикальная операция). Тактические вопросы --- сроки и этапность --- остаются дискутабельными (Разумовский).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Варианты тактики (Р.)</b></h4></p>
<p style="margin:0 0 10px"><b>Тактика</b>                                                                  <b>Когда</b></p>
<p style="margin:0 0 10px">Раннее <b>радикальное</b> вмешательство (резекция аганглионарной зоны)          основной вариант; Исаков: оптимальный срок 2--3 года, сейчас тенденция оперировать грудных</p>
<p style="margin:0 0 10px"><b>Временная разгрузочная колостома</b> , радикальная операция позже            дети первых месяцев, тотальная и субтотальная формы, острое течение, риск энтероколита; при неэффективности консервативной терапии у новорождённых (И.)</p>
<p style="margin:0 0 10px"><b>Консервативное</b> лечение запоров, пока не будет уверенности в показаниях   короткие формы, трудности морфологии</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Консервативное лечение (подготовка к операции, Исаков)</b></h4></p>
<p style="margin:0 0 10px">• цель --- регулярное опорожнение кишечника; послабляющая диета (овсяная и гречневая каши, чернослив, свёкла, морковь, яблоки), кисломолочные продукты; массаж живота, ЛФК (10--15 мин перед едой);</p>
<p style="margin:0 0 10px">• <b>сифонные клизмы 1 % раствором NaCl комнатной температуры</b> (подогретая вода недопустима: всасывание → интоксикация, отёк мозга); объём 0,5--3 л у грудных и 3--10 л у старших; после клизмы --- газоотводная трубка на 1--2 ч;</p>
<p style="margin:0 0 10px">• слабительные не применяют; внутрь растительное или вазелиновое масло;</p>
<p style="margin:0 0 10px">• дисбактериоз: селективная деконтаминация (гентамицин 10 мг/кг 3--4 дня), затем бифидобактерии.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Радикальные операции</b></h4></p>
<p style="margin:0 0 10px"><b>Операция</b>                             <b>Суть, плюсы и минусы</b></p>
<p style="margin:0 0 10px"><b>Свенсон</b> (Свенсона--Хиата--Исакова)   мобилизация кишки до уровня внутреннего сфинктера, <b>эвагинация</b> на промежность, резекция, косой анастомоз. Технически проще; повреждение урогенитальных нервов (недержание мочи), риск при осложнениях</p>
<p style="margin:0 0 10px"><b>Дюамель--Баиров</b>                      прямую кишку пересекают, культю ушивают, низведённую кишку проводят позади прямой, боковой анастомоз задней стенки, «шпора» раздавливается зажимом. Меньше риск повреждения мочевого пузыря; минус --- резервуар с аганглионарной передней стенкой (недержание, запоры, «парус»)</p>
<p style="margin:0 0 10px"><b>Соаве--Лёнюшкин</b>                      отделение серозно-мышечного слоя прямой кишки, кишку проводят через мышечный цилиндр; избыток отсекают вторым этапом через 15--20 дней. Наименее травматична для тазового дна; трудности из-за склероза подслизистого слоя</p>
<p style="margin:0 0 10px"><b>Ребайн</b>                               внутрибрюшная резекция аганглионарной зоны с прямым анастомозом + ректальная миотомия</p>
<p style="margin:0 0 10px">Суперкороткая зона                       <b>ректальная миотомия</b> (подслизистое рассечение сфинктера и мышц на 4--5 см по задней полуокружности) или пальцевое растяжение ануса (2--5 раз с интервалом 1 нед)</p>
<p style="margin:0 0 10px">Все методы возможны в два этапа (отсроченный анастомоз) или в один этап лапароскопически / видеоассистированно (Р.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                                     <b>Комментарий</b></p>
<p style="margin:0 0 10px"><b>Несостоятельность колоректального анастомоза</b>   самое частое и грозное; чаще при одномоментных операциях. Тазовый перитонит, параректальный инфильтрат/абсцесс, <b>стеноз анастомоза</b> . Признаки: лихорадка, рвота, боли внизу живота, кровотечение, нарушения мочеиспускания; УЗИ, КТ, пальцевое исследование под наркозом в первые 10 сут. Лечение --- ранняя <b>разгрузочная илеостома</b></p>
<p style="margin:0 0 10px"><b>Гиршпрунг-ассоциированный энтероколит</b>          до и после операции, Cl. difficile ≈ 30 %; антибиотики ( <b>ванкомицин, метронидазол</b> ), декомпрессия и промывание кишки, детоксикация, при тяжёлом течении --- илеостома</p>
<p style="margin:0 0 10px">Недержание мочи и кала, свищи                      при хроническом воспалении у анастомоза: параректальные, ректовагинальные, ректовезикальные; полное излечение затруднено</p>
<p style="margin:0 0 10px">Стеноз, недержание, рецидив запоров                при Дюамеле --- «парус», слепой мешок</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Послеоперационное ведение и прогноз</b></h4></p>
<p style="margin:0 0 10px">• наблюдение хирурга 1--2 года (Р.), по Исакову --- 1--1,5 года; <b>профилактическое бужирование</b> анастомоза 1--2 мес;</p>
<p style="margin:0 0 10px">• реабилитация (И.): электростимуляция прямой кишки (15--20 мин, 10--15 дней, повтор через 3 мес), клизмы в одно и то же время, неостигмина метилсульфат, тренировка сфинктера баллончиком, ЛФК;</p>
<p style="margin:0 0 10px">• прогноз при неосложнённом и своевременном лечении благоприятный; поздняя диагностика осложнений ведёт к инвалидизации.</p>`},
  {n:44, t:"Долихосигма. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">*В книгах долихосигма упомянута лишь в связи с БГ (Исаков, с. 351, 391; Разумовский, с. 374). Основное --- интернет и общие учебники.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: удлинение сигмы идиопатический мегаколон запор копростаз</b></p>
<p style="margin:0 0 10px"><b>энкопрез</b></p>
<p style="margin:0 0 10px"><b>Долихосигма</b> --- удлинение сигмовидной кишки (чаще с 2--3 дополнительными петлями), нарушающее нормальный пассаж содержимого. Относится к <b>идиопатическому мегаколону</b> наряду с мегадолихосигмой и мегаректумом (Исаков, с. 391). Может быть врождённой и приобретённой (интернет).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология (интернет)</b></h4></p>
<p style="margin:0 0 10px">• обнаруживается примерно у <b>40 % детей, страдающих запорами</b> ;</p>
<p style="margin:0 0 10px">• выявляют чаще в раннем детстве, чаще врождённая.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез</b></h4></p>
<p style="margin:0 0 10px">• причина --- <b>врождённая особенность</b> развития сигмовидной кишки (удлинение, избыточные петли, длинная брыжейка), реже приобретённые факторы: длительные запоры, нарушение питания, снижение тонуса кишки;</p>
<p style="margin:0 0 10px">• у детей с врождённым удлинением, расширением или атонией толстой кишки заболевание начинается позже, <b>с 2--3 лет</b> (Исаков);</p>
<p style="margin:0 0 10px">• избыточная длина создаёт перегибы и петли → <b>замедление пассажа</b> , застой кала, всасывание воды, уплотнение каловых масс → копростаз и расширение кишки ( <b>мегадолихосигма</b> );</p>
<p style="margin:0 0 10px">• со временем --- гипотрофия, атрофия слоёв стенки, нарушения биоценоза, интоксикация (Исаков: на УЗИ удлинение, расширение, гипотрофия или атрофия слоёв стенки).</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Консервативное лечение</b></h4></p>
<p style="margin:0 0 10px">• <b>диета с клетчаткой</b> (овощи, фрукты, каши, чернослив, кефир), достаточное питьё; регулярный режим опорожнения кишечника (в одно и то же время);</p>
<p style="margin:0 0 10px">• <b>очистительные клизмы</b> , при копростазе --- повторные <b>сифонные</b> клизмы с 1 % раствором натрия хлорида комнатной температуры до размывания каловых масс (Исаков, с. 351); тёплую изотоническую воду не применяют --- риск интоксикации и отёка мозга;</p>
<p style="margin:0 0 10px">• растительное или вазелиновое масло внутрь, лёгкие слабительные;</p>
<p style="margin:0 0 10px">• массаж живота, ЛФК, укрепление мышц пресса; <b>электростимуляция кишечника</b> (аппарат «Амплипульс», 15--20 сеансов, Исаков);</p>
<p style="margin:0 0 10px">• коррекция дисбактериоза, ферменты, витамины;</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургическое лечение (по интернет-источникам и учебникам)</b></h4></p>

<p style="margin:0 0 10px">• до операции исключают болезнь Гиршпрунга (биопсия).</p>

<p style="margin:0 0 10px"><b>Болезнь (синдром) Пайра</b> --- врождённая аномалия толстой кишки с хроническим обстипационно-болевым синдромом из-за нарушения проходимости ободочной кишки при <b>высокой фиксации селезёночного изгиба</b> . Симптомокомплекс возникает при <b>опущении поперечной ободочной</b> кишки и <b>перегибе</b> толстой кишки в области селезёночной кривизны (синдром селезёночного угла).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• заболевание относят к <b>врождённым аномалиям связочного аппарата ободочной кишки</b> (диафрагмально-ободочная и ободочно-селезёночная связки, брыжейка);</p>
<p style="margin:0 0 10px">• точная причина не установлена.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Высокий фиксированный селезёночный изгиб, острый угол</span><span>Провисание удлинённой поперечной кишки («гирлянда») | Перегибы, замедление пассажа, колостаз | Расширение кишки, нарушения брыжеечного кровотока</span></div>
<p style="margin:0 0 10px">• поперечная ободочная кишка удлинена и провисает «в виде гирлянды» при фиксации в <b>печёночном углу</b> и высоко расположенном <b>селезёночном изгибе</b> с образованием острого угла;</p>
<p style="margin:0 0 10px">• нарушается физиологический пассаж; сроки появления симптомов зависят от компенсаторных возможностей поперечной ободочной кишки и скорости развития процесса;</p>
<p style="margin:0 0 10px">• в брыжеечных сосудах: извитость и перегибы вен, расширение просвета, снижение линейной скорости кровотока (по данным допплерографии).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• хронические <b>запоры</b> и периодические <b>боли в животе</b> (обстипационно-болевой синдром);</p>
<p style="margin:0 0 10px">• вздутие живота, чувство тяжести, тошнота, снижение аппетита;</p>
<p style="margin:0 0 10px">• у детей --- отставание в развитии, бледность, интоксикация при длительном колостазе;</p>
<p style="margin:0 0 10px">• по течению: компенсированная, субкомпенсированная и декомпенсированная стадии (по учебникам).</p>`},
  {n:48, t:"Болезнь Пайра у детей. Диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*В твоих книгах болезни Пайра нет. Источники: статьи о синдроме Пайра у детей, общие учебники.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: ирригография колостаз допплерография перегиб</b></p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                                                            <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Рентгеноконтрастная ирригография</b> (основной метод; по ней подтверждают диагноз)   нарушено соотношение сегментов по длине, площади, поперечнику; <b>доля поперечной ободочной кишки увеличена</b> , она опущена (до уровня малого таза); <b>селезёночный изгиб фиксирован высоко</b> , подвижность поперечного отдела значительно повышена; выраженные перегибы в области селезёночного и печёночного углов; <b>правосторонний колостаз</b> ; гаустрация дистальных отделов расширена и нарушена</p>
<p style="margin:0 0 10px">Рентгенография пассажа бария                                                         замедленный транзит по толстой кишке</p>
<p style="margin:0 0 10px">Допплерография брыжеечных сосудов                                                    извитость и перегибы вен верхней брыжеечной вены, расширение просвета, снижение линейной скорости кровотока</p>
<p style="margin:0 0 10px">Колоноскопия, УЗИ брюшной полости                                                    вспомогательно, для исключения других причин</p>
<p style="margin:0 0 10px">Анамнез и осмотр                                                                     хронические запоры, боли в животе; метеоризм</p>
<p style="margin:0 0 10px">*По описанию клиник: у детей до 15 лет диагноз подтверждают ирригографией (ссылка на цифровой анализ изображения толстой кишки).*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика (по общим учебникам)</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                            <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Болезнь Гиршпрунга</b>                               при БГ с рождения, суженная аганглионарная зона в дистальном отделе, нет ганглиев в биоптате; при Пайре нет суженной зоны, перегиб на уровне селезёночного изгиба</p>
<p style="margin:0 0 10px"><b>Долихосигма, мегаколон</b>                           удлинение и расширение сигмы; при Пайре изменения прежде всего в поперечной ободочной кишке и левом изгибе</p>
<p style="margin:0 0 10px">Функциональные запоры                                нет анатомических изменений на ирригографии</p>
<p style="margin:0 0 10px">Хронический колит, язвенный колит, болезнь Крона     воспалительные изменения при колоноскопии, диарея, кровь в стуле</p>
<p style="margin:0 0 10px">Хронический гастродуоденит, холецистит, панкреатит   боли, но нет перегиба на ирригографии; УЗИ и эндоскопия</p>
<p style="margin:0 0 10px">Спаечная болезнь, непроходимость                     анамнез операций, картина непроходимости</p>
<p style="margin:0 0 10px">*Перечень дифференциальной диагностики составлен по общим учебникам, а не по твоим книгам.*</p>`},

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Консервативное лечение (первая линия)</b></h4></p>
<p style="margin:0 0 10px">• <b>послабляющая диета</b> (клетчатка, овощи, кефир), питьё;</p>
<p style="margin:0 0 10px">• <b>спазмолитики</b> , прокинетики и слабительные по показаниям, клизмы;</p>
<p style="margin:0 0 10px">• ЛФК, массаж живота, физиотерапия;</p>
<p style="margin:0 0 10px">• наблюдение за стулом и ростом; схема со временем пересматривается.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургическое лечение</b></h4></p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: аноректальные пороки клоака ректоуретральный свищ VATER</b></p>
<p style="margin:0 0 10px"><b>Q42</b></p>
<p style="margin:0 0 10px"><b>Аноректальные пороки развития (АРПР)</b> --- широкий спектр пороков прямой кишки и заднепроходного канала, нередко вместе с мочеполовой системой. Мальчики болеют чаще (Р. --- 2 : 1). Коды МКБ-10: <b>Q42.2</b> --- атрезия ануса, прямой кишки со свищом; <b>Q42.3</b> --- без свища; Q43.7 --- персистирующая клоака.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• 1 на 5000 живорождённых (Р.); по Исакову 0,25--0,66 на 1000 (соотношение м : ж 1 : 2);</p>
<p style="margin:0 0 10px">• сочетанные пороки (сердце, почки, ЖКТ, опорно-двигательная система, ЦНС) --- от 30 % (И.) до более 60 % (Р.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• этиология <b>не выяснена</b> ; у матерей чаще сахарный диабет, приём талидомида, фенитоина, тридиона (Р.);</p>
<p style="margin:0 0 10px">• есть наследственные формы (аутосомно-доминантные, рецессивные, Х-сцепленные); риск для сибсов ≈ 1,3 %, для потомков 13--14 %;</p>
<p style="margin:0 0 10px">• входят в состав <b>VATER/VACTERL</b> , трисомий 7, 13, 18, 21, 22, синдрома кошачьего глаза и др.; у 10 % --- синдром Дауна.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эмбриопатогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">4-я неделя: клоака делится на мочевой пузырь и прямую кишку</span><span>Нарушение разделения или миграции | Нет соединения с анальной ямкой | Атрезия ± свищ в мочевой тракт или промежность</span></div>
<p style="margin:0 0 10px">• в первые недели задняя кишка и канал первичной почки открываются в <b>клоаку</b> ; на 4-й неделе она делится перегородкой на две трубки (мочевой пузырь и прямая кишка); с 5-й недели формируется анальная ямка; перфорация анальной мембраны --- к 8-й неделе (И.);</p>
<p style="margin:0 0 10px">• <b>гипотеза несостоявшейся миграции</b> (Brown, Bill, Johnson): прямая кишка не доходит до анальной ямки; <b>гипотеза нарушения каудальной дифференциации</b> (Duhamel); по Стефенсу --- стадия разделения клоаки и формирования промежности;</p>
<p style="margin:0 0 10px">• нарушение разделения клоаки → <b>клоака, ректовезикальный, ректоуретральный, ректовагинальный, ректовестибулярный свищи, атрезия без свища</b> ; остановка позже → неперфорированная анальная мембрана или стеноз; недоразвитие промежности → эктопия ануса с промежностным свищом;</p>
<p style="margin:0 0 10px">• при высоких атрезиях у мальчиков <b>прямокишечно-мочевой свищ</b> почти в 100 % случаев; у девочек свищи --- во влагалище и преддверие.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Сочетанные пороки (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>              <b>Что бывает</b></p>
<p style="margin:0 0 10px">Крестец и позвоночник   отсутствие одного или нескольких крестцовых позвонков; отсутствие более двух --- плохой прогноз функции сфинктеров</p>
<p style="margin:0 0 10px">Мочеполовая система     20--54 %; чем выше порок, тем чаще: при персистирующей клоаке --- в 90 %, при промежностном свище --- в 10 %; гидронефроз, уросепсис, метаболический ацидоз --- главные причины летальности</p>
<p style="margin:0 0 10px">Другие                  врождённый аганглиоз толстой кишки, ТПС, атрезия ДПК, мегауретер, аномалии спинного мозга, ВПС</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина (Разумовский)</b></h4></p>
<p style="margin:0 0 10px">• диагноз ставят <b>сразу после рождения</b> при осмотре (кроме анального стеноза): наличие или отсутствие заднего прохода, свищи (влагалищный, уретральный), расположение свища, размер анального углубления, срединный шов, ягодичные мышцы;</p>
<p style="margin:0 0 10px">• при атрезии --- <b>отсутствие отхождения мекония</b> через анус, вздутие живота, рвота (низкая непроходимость); меконий выделяется через свищ (с мочой при мочевом свище, из влагалища, через промежность);</p>
<p style="margin:0 0 10px">• важно отличить <b>высокую</b> форму от <b>низкой</b> : низкая --- расстояние от кожи до слепого конца кишки не более 1 см (на этой глубине лежат леваторы); больше 1 см --- высокая;</p>
<p style="margin:0 0 10px">• у детей с АРПР обязательно исключают опасные пороки спинного мозга, пищевода, сердца и почек.</p>`},
  {n:51, t:"Атрезия ануса. Классификация, диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*Разумовский, гл. 25 (с. 414--425, рис. 25.1--25.2); Исаков, с. 397--404 (табл. 5-2). Крикенбекская классификация --- клинические рекомендации (интернет).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: Мельбурнская классификация Крикенбекская классификация</b></p>
<p style="margin:0 0 10px"><b>инвертография линия Стивенса крестцовый индекс</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация 1: Мельбурнская (1970), Исаков</b></h4></p>
<p style="margin:0 0 10px">В основу положено отношение прямой кишки к мышцам тазового дна, в частности к <b>лобково-прямокишечной мышце</b> . Три группы: высокие (слепой конец выше мышц тазового дна), средние и низкие.</p>
<p style="margin:0 0 10px"><b>Группа</b>                       <b>Мальчики</b>                                                                                                     <b>Девочки</b></p>
<p style="margin:0 0 10px"><b>Высокие</b> (супра леваторные)   1\\) аноректальная агенезия: без свища; со свищом --- ректовезикальным, ректоуретральным. 2) ректальная атрезия   1\\) аноректальная агенезия: без свища; со свищом --- ректовезикальным, ректоклоакальным, ректовагинальным. 2) ректальная атрезия</p>
<p style="margin:0 0 10px"><b>Средние</b> (интер медиальные)   1\\) анальная агенезия: без свища; со свищом ректобульбарным. 2) аноректальный стеноз                             1\\) анальная агенезия: без свища; со свищом ректовестибулярным. 2) аноректальный стеноз</p>
<p style="margin:0 0 10px"><b>Низкие</b> (трансл еваторные)    прикрытый анус; анальный стеноз; передний промежностный анус; ректопромежностный свищ                            прикрытый анус; анальный стеноз; передний промежностный анус; ректовестибулярный свищ; ановульварная фистула; бульварный анус</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация 2: Крикенбекская (2005) --- общепризнанная сегодня</b></h4></p>
<p style="margin:0 0 10px">Из федеральных клинических рекомендаций «Аноректальные мальформации у детей» (Российская ассоциация детских хирургов) и клиники Морозовской ДГКБ: в классификации <b>нет понятий «высокие, низкие, промежуточные»</b> ; пороки делят по типу свища.</p>
<p style="margin:0 0 10px"><b>Группа</b>                        <b>Мальчики</b>                                                                                                                                                                          <b>Девочки</b></p>
<p style="margin:0 0 10px"><b>Основная клиническая группа</b>   <b>промежностный (кожный) свищ</b> ; <b>ректоуретральный свищ</b> (бульбарный или простатический); <b>ректовезикальный свищ</b> ; аноректальная мальформация <b>без свища</b> ; анальный стеноз   <b>промежностный (кожный) свищ</b> ; <b>вестибулярный свищ</b> ; <b>клоака</b> ; аноректальная мальформация <b>без свища</b> ; анальный стеноз</p>
<p style="margin:0 0 10px"><b>Редкие формы</b>                  ректальная атрезия / стеноз, «ректальный мешок», ректовагинальный свищ, H-образный свищ, другие                                                                                       то же</p>
<p style="margin:0 0 10px">*Сочетанные пороки и клиника --- в вопросе 50. Разумовский: мальчики 2 : 1, 1 на 5000; низкая форма --- до слепого конца не более 1 см.*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                                       <b>Суть</b></p>
<p style="margin:0 0 10px">Осмотр промежности (общеклинический)                            сразу после рождения: есть ли анус, свищ, где он открывается, срединный шов, ягодичные мышцы; цвет и состав выделений через свищ; у девочек --- единственное отверстие = клоака</p>
<p style="margin:0 0 10px"><b>Инвертография</b> (рентген вниз головой)                        на промежности --- свинцовая метка; снимок <b>не раньше чем через 24 ч</b> после рождения (газ доходит до конца кишки); расстояние между меткой и газовым пузырём; <b>линия Стивенса</b> (лоно --- дистальный копчиковый позвонок): ниже линии --- низкая, на уровне --- промежуточная, выше --- высокая форма. Ограничение: нужна только в 10--15 % случаев, много ошибок (мало газа, меконий, спазм мышц)</p>
<p style="margin:0 0 10px"><b>Крестцовый индекс</b>                                           прямая и боковая рентгенограммы таза: структура и длина крестца; показывает развитие спинного мозга и мышц таза; прогноз удержания</p>
<p style="margin:0 0 10px">Фистулография, колостография, ирригография, цистоуретрография   определяют ход свища, длину и уровень, пузырно-мочеточниковый рефлюкс</p>
<p style="margin:0 0 10px"><b>УЗИ</b> брюшной полости, таза, позвоночника                     расстояние от слепого конца кишки до кожи (дистальное УЗИ промежности), почки, спинной мозг</p>
<p style="margin:0 0 10px">КТ, МРТ, ЭМГ                                                    оценка мышц тазового дна и сфинктера, сочетанные пороки</p>
<p style="margin:0 0 10px">Обследование на сочетанные пороки                               сердце (ЭхоКГ), почки, позвоночник, пищевод, спинной мозг (VACTERL)</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: колостома заднесагиттальная аноректопластика (Пенья) анопластика</b></p>

<p style="margin:0 0 10px"><b>Лечение хирургическое.</b> Выбор операции зависит от формы порока, пола и состояния ребёнка: при низких формах --- одномоментная пластика, при промежуточных и высоких --- этапное лечение с <b>колостомой</b> (Разумовский).</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Тактика по формам (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                                                                             <b>Операция</b></p>
<p style="margin:0 0 10px"><b>Кожный (промежностный) свищ</b> , мальчики и девочки                                  <b>анопластика</b> (операция Саломона в модификации Ленюшкина --- иссечение свища и пластика ануса); при хорошей перегородке между влагалищем и кишкой и отсутствии других пороков --- <b>без защитной колостомы</b> в периоде новорождённости</p>
<p style="margin:0 0 10px"><b>Мембранозная</b> форма                                                                иссечение кожистой плёнки, гемостаз, слизистую подшивают к коже</p>
<p style="margin:0 0 10px"><b>Низкая атрезия без свища</b>                                                          промежностная аноректопластика по Диффенбаху в модификации Ленюшкина (избыток кишки отсекают через 14--15 суток) или заднесагиттальная проктопластика по Пенья; при тяжёлом состоянии --- колостома на сигмовидную кишку</p>
<p style="margin:0 0 10px"><b>Ректовестибулярный свищ</b> (девочки)                                                 операция Стоуна--Бенсона (промежностная) или <b>заднесагиттальная по Пенья</b> ; в 4--8 недель можно без колостомы; в периоде новорождённости колостома не показана</p>
<p style="margin:0 0 10px"><b>Ректоуретральный, ректовезикальный свищ, без свища на высоком уровне</b> (мальчики)   1-й этап --- <b>колостома</b> (сигмостома, «разделённая»); 2-й --- заднесагиттальная аноректопластика (Пенья) или видеоассистированное низведение; 3-й --- закрытие стомы</p>
<p style="margin:0 0 10px"><b>Клоака</b> , высокие формы у девочек                                                  колостома, затем <b>заднесагиттальная ректовагиноуретропластика</b> ; предпочитают мобилизацию влагалищно-уретрального комплекса (лучше функция)</p>
<p style="margin:0 0 10px">Алгоритмы (рис. 25.12 у мальчиков, 25.13 у девочек): осмотр промежности → кожный свищ --- анопластика; нет свища --- УЗИ и инвертограмма; диастаз больше 1 см --- колостома; меньше 1 см --- анопластика или ПСАРП; единственное отверстие --- клоака.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Основные принципы</b></h4></p>
<p style="margin:0 0 10px">• <b>колостома</b> --- на сигмовидной кишке (двуствольная или разделённая), чтобы не загрязнять свищ и зону операции калом;</p>
<p style="margin:0 0 10px">• всегда сохранять запирательный аппарат (сфинктер, пуборектальную мышцу) и формировать анус в центре сфинктера;</p>
<p style="margin:0 0 10px">• Исаков: при высоких формах --- этапные операции; решающее значение имеют ранняя диагностика уровня и сохранность мышц тазового дна.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Послеоперационное ведение и реабилитация (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Мероприятие</b>         <b>Как делают</b></p>
<p style="margin:0 0 10px"><b>Бужирование</b> ануса   с 12--14-х суток после операции ежедневно, расширителями Гегара; размер увеличивают до возрастного: 1--4 мес --- № 12, 4--8 мес --- 13, 8--12 мес --- 14, 1--3 года --- 15, 3--12 лет --- 16, старше 12 лет --- 17; до закрытия колостомы 2--3 раза в сутки по 3--5 мин, затем не реже 1 раза в сутки; далее по состоянию, около года</p>
<p style="margin:0 0 10px">Закрытие колостомы      после формирования ануса нужного размера</p>
<p style="margin:0 0 10px">Тренировка дефекации    гипертоническая клизма 5 % NaCl комнатной температуры 2 раза в сутки 3--4 недели (утром тренировочная, вечером очистительная), высаживание на горшок; курсы 4--6 раз в год</p>
<p style="margin:0 0 10px">Диета и ЛФК             мясо, рыба, сметана, яйца, белый хлеб, картофель, каши; ректальная гимнастика, электростимуляция наружного сфинктера, физиотерапия</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>          <b>Осложнения (по Разумовскому и общим учебникам)</b></p>
<p style="margin:0 0 10px">Ранние              нагноение раны, расхождение швов, ретракция (втяжение) низведённой кишки, повреждение уретры или влагалища, осложнения стомы</p>
<p style="margin:0 0 10px"><b>Поздние</b>         <b>рубцовое сужение ануса</b> (стеноз) --- профилактика бужированием; <b>недостаточность держания</b> (недержание кала); запоры и каломазание; выпадение слизистой; рецидив свища (ректоуретрального, ректовагинального)</p>
<p style="margin:0 0 10px">Влияющие на исход   сочетанные пороки (крестец, почки, спинной мозг), недоразвитие мышц тазового дна --- главный фактор плохого функционального результата</p>
<p style="margin:0 0 10px">*Функциональный результат оценивают (Крикенбекская схема): волевые движения кишки, загрязнение белья, запор. Реабилитация должна идти без перерыва до достижения нормальной функции прямой кишки (Р.).*</p>`},
  {n:53, t:"Пороки развития почек. Этиология и патогенез", a:`<p style="margin:0 0 10px">*Разумовский, гл. 42--43 (с. 544--546); Исаков, с. 437--439. Общие факторы риска --- по учебникам.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: пронефрос, мезонефрос, метанефрос метанефрогенная бластема</b></p>
<p style="margin:0 0 10px"><b>вольфов проток восхождение почек дизэмбриогенез</b></p>
<p style="margin:0 0 10px"><b>Пороки развития почек</b> --- группа врождённых аномалий количества, положения, взаимоотношения, величины и структуры почек. Пороки органов мочевой системы <b>прочно занимают первое место</b> среди всех эмбрио- и фетопатий --- более <b>40 %</b> (Разумовский). Многие из них угрожают жизни из-за нарушения оттока мочи, пиелонефрита и почечной недостаточности (обструктивные уропатии).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эмбриогенез почек: три системы</b></h4></p>
<p style="margin:0 0 10px"><b>Система</b>                                       <b>Когда и что</b></p>
<p style="margin:0 0 10px"><b>Пронефрос</b> (предпочка)                         6--10 пар канальцев (протонефридий), у переднего конца тела; редуцируется</p>
<p style="margin:0 0 10px"><b>Мезонефрос</b> (первичная почка, вольфово тело)   с 3-й недели; вольфов проток; второй проток --- мюллеров; редуцируется к 12--14-й неделе; у мужских --- выводные протоки яичка</p>
<p style="margin:0 0 10px"><b>Метанефрос</b> (окончательная почка)              из двух зачатков: <b>метанефрогенной бластемы</b> (даёт секреторный аппарат --- нефроны) и выпячивания <b>вольфова протока</b> (мочеточник, лоханка, чашечки, собирательные канальцы). С 7--8-й недели почки восходят из таза в поясничную область, при этом поворачиваются</p>
<p style="margin:0 0 10px">Мочеточниковый зачаток возникает на 5--6-й неделе от каудального отдела вольфова протока; нефрон --- структурная единица почки --- образуется при слиянии извитых канальцев с собирательными (Разумовский, с. 544--545). <b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• пороки возникают при нарушении <b>эмбриогенеза</b> (дизэмбриогенез) --- взаимодействия мочеточникового зачатка, метанефрогенной бластемы и сосудов на фоне дискоординации ряда факторов (Р.);</p>
<p style="margin:0 0 10px">• по учебникам и литературе: наследственные и генные мутации, хромосомные аномалии, тератогены (лекарства, алкоголь, курение), инфекции и сахарный диабет у матери, гипоксия;</p>
<p style="margin:0 0 10px">• частые сочетания: пороки половых органов, сердца, ЖКТ, позвоночника (VACTERL), лёгочная гипоплазия.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез: что нарушается --- какой порок</b></h4></p>
<p style="margin:0 0 10px"><b>Нарушение</b>                                                                      <b>Порок</b></p>
<p style="margin:0 0 10px">Нет закладки или полное нарушение дифференциации нефрогенной ткани                 <b>агенезия</b> , аплазия почки</p>
<p style="margin:0 0 10px">Недостаточное кровоснабжение и развитие метанефрогенной бластемы                   <b>гипоплазия</b></p>
<p style="margin:0 0 10px">Два метанефритических дивертикула с одной стороны, расщепление зачатка             <b>удвоение</b> почки и мочеточника</p>
<p style="margin:0 0 10px">Отпочкование части метанефрогенной бластемы                                        <b>добавочная</b> (третья) почка</p>
<p style="margin:0 0 10px">Остановка восхождения; множественные артерии вместо одной                          <b>дистопия</b> почки (поясничная, подвздошная, тазовая)</p>
<p style="margin:0 0 10px">Сближение и слияние метанефрогенных зачатков                                       <b>подковообразная</b> , галетообразная, S-, L-, I-образная почка</p>
<p style="margin:0 0 10px">Нарушение взаимоотношения мочеточникового зачатка и вольфова протока               <b>эктопия устья</b> мочеточника</p>
<p style="margin:0 0 10px">Несрастание первичных канальцев с собирательными трубочками (нефрон без выхода)    <b>кистозные</b> пороки: солитарная киста, поликистоз, мультикистоз</p>
<p style="margin:0 0 10px">Нерассосавшиеся аберрантные сосуды (у 1/3 людей), высокое отхождение мочеточника   сдавление мочеточника → <b>гидронефроз</b></p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Порок / состояние</b>                                                              <b>С чем дифференцируют и как</b></p>
<p style="margin:0 0 10px"><b>Агенезия</b> / аплазия / гипоплазия / нефункционирующая почка                      аплазия: комочек фибролипоматозной ткани, артерии не выявляются на аортографии, мочеточник отсутствует или слепой; агенезия: нет закладки, нет ипсилатерального мочеполового аппарата; гипоплазия: функционирующая паренхима, проходимый мочеточник, видна сосудистая ножка; утрата функции после пиелонефрита, камней, туберкулёза --- ретроградная пиелография и аортография. Помогает цистоскопия</p>
<p style="margin:0 0 10px"><b>Дистопия</b> и фиксированный <b>нефроптоз</b>                                         при нефроптозе медиальная лоханка и длинный извитой мочеточник; при дистопии на ангиографии <b>короткая</b> сосудистая ножка (длинная --- при нефроптозе)</p>
<p style="margin:0 0 10px"><b>Добавочная почка</b> и верхний сегмент удвоенной почки                             при удвоении сегменты образуют общий контур паренхимы, нижняя --- две большие чашечки, верхняя --- одна; у добавочной паренхима отдельна, три чашечки как в миниатюре</p>
<p style="margin:0 0 10px"><b>Гипоплазия</b> и вторично сморщенная почка                                         при гипоплазии артерии и вены равномерно истончены; при сморщивании ангиограмма «обгорелого дерева»; чашечки не деформированы</p>
<p style="margin:0 0 10px"><b>Кистозные формы</b> : поликистоз, мультикистоз, солитарная киста, губчатая почка   УЗИ: множественные эхонегативные тени, не связанные с коллекторной системой; губчатая --- «букет цветов» на урографии; семейный анамнез, УЗИ печени и поджелудочной железы при поликистозе</p>
<p style="margin:0 0 10px">Опухоль почки (нефробластома), гидронефроз (по учебникам)                          при кисте плотные контуры; при гидронефрозе расширены чашечки и лоханка</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: нефрэктомия уретеронефрэктомия пиелопластика</b></p>
<p style="margin:0 0 10px"><b>трансплантация почки динамическое наблюдение</b></p>
<p style="margin:0 0 10px"><b>Принцип:</b> бессимптомные пороки не требуют лечения, наблюдают; операция --- при осложнениях (гидронефроз, камни, пиелонефрит, гипертензия, боль, недержание мочи). Любая операция начинается с ликвидации воспаления и компенсации почечной функции.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Лечение по порокам</b></h4></p>
<p style="margin:0 0 10px"><b>Порок</b>                                <b>Лечение</b></p>
<p style="margin:0 0 10px">Агенезия односторонняя                   лечения не требует; берегут единственную почку (профилактика пиелонефрита, травм)</p>
<p style="margin:0 0 10px"><b>Добавочная почка</b>                     <b>нефрэктомия</b> (малая функциональная ценность) при недержании (эктопия устья) или воспалении</p>
<p style="margin:0 0 10px"><b>Дистопия</b>                             максимально консервативно; операция --- при гидронефрозе (пиелоуретеральная пластика) или камнях; при гибели почки --- нефрэктомия; перемещение почки крайне сложно (рассыпной тип сосудов)</p>
<p style="margin:0 0 10px"><b>Подковообразная</b> , сращение           операция только при осложнениях (гидронефроз, камни, опухоль); перед операцией <b>почечная ангиография</b> для оценки кровоснабжения</p>
<p style="margin:0 0 10px"><b>Аплазия</b>                              <b>уретеронефрэктомия</b> при выраженной боли, нефрогенной гипертензии или рефлюксе в гипоплазированный мочеточник</p>
<p style="margin:0 0 10px"><b>Гипоплазия</b>                           односторонняя с пиелонефритом и гипертензией --- <b>нефрэктомия</b> ; двусторонняя с тяжёлой почечной недостаточностью --- двусторонняя нефрэктомия и <b>трансплантация почки</b></p>
<p style="margin:0 0 10px"><b>Удвоение</b> (по учебникам)              без осложнений --- наблюдение; при гидронефрозе, дисплазии или эктопии устья верхнего сегмента --- <b>геминефруретерэктомия</b> или реимплантация мочеточника</p>
<p style="margin:0 0 10px"><b>Эктопия устья мочеточника</b> (Исаков)   оперативно: при отсутствии инфекции --- межлоханочный или межмочеточниковый анастомоз; при падении функции и пиелонефрите --- удаление эктопированного мочеточника вместе с сегментом почки</p>
<p style="margin:0 0 10px"><b>Кистозные</b> (по учебникам)             солитарная киста --- наблюдение, пункция или резекция при росте; <b>поликистоз</b> --- консервативно (контроль АД, лечение инфекции мочевых путей, диета), при ХПН --- диализ и трансплантация; губчатая почка --- при камнях и кровотечении</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Когда</b>                                                               <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Универсальные интраоперационные</b> (нефрэктомия, уретеронефрэктомия)   повреждение органов рядом с почкой (печень, селезёнка, поджелудочная железа), аорты, нижней полой вены; повреждение плевры --- пневмоторакс</p>
<p style="margin:0 0 10px"><b>Послеоперационные</b>                                                   вторичное кровотечение из почечной ножки, ателектаз, скопление жидкости в ложе удалённой почки; при открытой операции --- динамическая кишечная непроходимость, вентральные грыжи, раневая инфекция, паранефрит; при эндоскопической --- троакарная травма органов и сосудов, термическое повреждение</p>
<p style="margin:0 0 10px"><b>Пиелоуретеральная пластика</b> при дистопированной почке                ранние --- протечка анастомоза, длительное выделение мочи (при \\> 2 нед --- ретроградное стентирование), обструкция анастомоза (80 % рассасываются в течение 3 мес); поздние --- стеноз анастомоза, нужна повторная пластика; парез кишечника</p>
<p style="margin:0 0 10px">Самой болезни                                                           пиелонефрит, нефрогенная гипертензия, камни, гидронефроз, ХПН; при двусторонних формах --- уремия, гибель в первые годы</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: обструкция ЛМС вазоуретеральный конфликт пиелоренальные рефлюксы</b></p>

<p style="margin:0 0 10px"><b>Гидронефроз</b> (гидронефротическая трансформация) --- патологическое состояние, обусловленное нарушением оттока мочи на уровне <b>пиелоуретерального (лоханочно-мочеточникового) сегмента</b> (функционального или анатомического генеза), что ведёт к расширению собирательной системы, необратимым изменениям паренхимы и прогрессирующему снижению функции почки. Коды МКБ-10: <b>N13.0</b> (с обструкцией ЛМС), <b>Q62.0</b> (врождённый).</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология (Р., И.)</b></h4></p>
<p style="margin:0 0 10px"><b>Группа причин</b>                      <b>Что именно</b></p>
<p style="margin:0 0 10px"><b>Внутренние</b> (стеноз самой стенки)   <b>стеноз ЛМС</b> --- самая частая причина (структурные изменения, дисплазия мышц и нервных элементов, нарушение перистальтики); клапаны мочеточника (ложные --- складка слизистой; истинные --- все слои)</p>
<p style="margin:0 0 10px"><b>Внешние</b>                            <b>добавочный (аберрантный) нижнеполюсный сосуд</b> --- вазоуретеральный конфликт; ретрокавальный мочеточник; фиксированные перегибы и эмбриональные спайки, сдавливающие извне</p>
<p style="margin:0 0 10px">Высокое отхождение мочеточника         от лоханки выше обычного --- расширение нижней части лоханки</p>
<p style="margin:0 0 10px">Функциональные                         незрелость координации перистальтики на уровне ПУС, дисплазия</p>
<p style="margin:0 0 10px"><b>Вторичный</b> (приобретённый)          конкремент, послеоперационные или воспалительные стриктуры, опухоли и полипы</p>
<p style="margin:0 0 10px">Эмбриология (Р.): мочеточниковый зачаток на 5-й неделе из вольфова протока, к 6-й неделе погружается в метанефрогенную бластему; лоханка --- 10-я неделя, чашечки --- 11-я; гладкие мышцы --- с 10--12-й недели; нарушение этих событий (генные мутации, дискоординация сигналов) ведёт к стенозу ПУС.</p>

<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Обструкция ЛМС</span><span>Повышение давления в лоханке, расширение | Рефлюксы, воспаление, ишемия (активация РАС) | Фиброз, атрофия паренхимы, ХБП</span></div>
<p style="margin:0 0 10px">• обструкция → нарушение оттока → ↑ давления в лоханке → расширение (пиелоэктазия → дилатация чашечек и лоханки) → <b>пиелотубулярные рефлюксы</b> → воспаление, фиброз → активация ренин-ангиотензиновой системы → вазоконстрикция, гипоперфузия → <b>атрофия канальцев, интерстициальный фиброз, гломерулосклероз</b> (Р.);</p>
<p style="margin:0 0 10px">• лоханка сначала справляется за счёт рабочей гипертрофии, затем <b>атония</b> ; чашечки становятся монетообразными (И.);</p>
<p style="margin:0 0 10px">• почка долго остаётся работоспособной: спасают <b>пиелоренальные рефлюксы</b> (тубулярный, пиеловенозный, пиелолимфатический), но они воспаляют паренхиму и ведут к рубцу;</p>
<p style="margin:0 0 10px">• при <b>внутрипочечной лоханке</b> атрофия наступает быстрее; бактериальная инфекция ускоряет процесс; <b>обструктивный пиелонефрит у 87 % больных</b> (И.).</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: классификация SFU стадии по Лопаткину пальпируемая опухоль боль</b></p>
<p style="margin:0 0 10px"><b>пиелонефрит</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px"><b>Критерий</b>                                                <b>Виды</b></p>
<p style="margin:0 0 10px">По происхождению                                            <b>первичный (врождённый)</b> --- эмбриональные нарушения ПУС (стеноз, клапаны, сосуд, спайки, высокое отхождение); <b>вторичный (приобретённый)</b> --- камни, стриктуры, опухоли</p>
<p style="margin:0 0 10px">По времени проявления                                       антенатальный (по УЗИ плода) и постнатальный; одно- и двусторонний</p>
<p style="margin:0 0 10px">По типу лоханки                                             внутрипочечная и <b>внепочечная</b> ; атрофия при внутрипочечной развивается быстрее (И.)</p>
<p style="margin:0 0 10px"><b>Антенатально</b> (по переднезаднему размеру лоханки, ПЗР)   норма: ≤ 4 мм (II триместр), ≤ 7 мм (III); риск гидронефроза и значимой обструкции: \\> 10 мм во II триместре, \\> 15 мм в III (Р.)</p>
<p style="margin:0 0 10px"><b>Постнатально по ПЗР</b> (Р.)                                <b>лёгкая</b> --- ПЗР \\< 20 мм; <b>умеренная</b> --- 20--30 мм; <b>тяжёлая</b> --- \\> 30 мм</p>
<p style="margin:0 0 10px">По стадиям (Лопаткин, интернет)                             три стадии: I --- расширение лоханки (пиелоэктазия); II --- расширение лоханки и чашечек (гидрокаликоз) с истончением паренхимы; III --- терминальная, необратимая атрофия паренхимы (по учебникам)</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация SFU (Society for Fetal Urology; модификация A. Onen, 2009)</b></h4></p>
<p style="margin:0 0 10px">Наиболее удобна для клиники (Р.): учитывает расширение лоханки и чашечек и потерю паренхимы.</p>
<p style="margin:0 0 10px"><b>Степень</b>   <b>Признаки</b></p>
<p style="margin:0 0 10px"><b>0</b>         гидронефроза нет</p>
<p style="margin:0 0 10px"><b>I</b>         изолированное расширение лоханки (пиелоэктазия)</p>
<p style="margin:0 0 10px"><b>II</b>        расширение лоханки и больших чашечек</p>
<p style="margin:0 0 10px"><b>III</b>       расширение лоханки, больших и малых чашечек; лёгкая и умеренная потеря паренхимы (менее 50 %)</p>
<p style="margin:0 0 10px"><b>Степень</b>   <b>Признаки</b></p>
<p style="margin:0 0 10px"><b>IV</b>        расширение лоханки и чашечек; тяжёлая атрофия паренхимы (более 50 %)</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• самый частый симптом у новорождённых и малышей --- <b>синдром пальпируемой опухоли</b> (чёткие контуры, эластическая консистенция, смещается); вторые по частоте --- инфекция мочевых путей и гематурия (Р.);</p>
<p style="margin:0 0 10px">• <b>боль</b> --- у 80 % (И.): от ноющей до приступов почечной колики; у детей локализуется в области пупка, старшие жалуются на поясницу; связана с пиелонефритом и растяжением капсулы;</p>
<p style="margin:0 0 10px">• <b>изменения в моче</b> : лейкоцитурия и бактериурия (пиелонефрит), гематурия (пиелоренальный рефлюкс, форникальное кровотечение);</p>
<p style="margin:0 0 10px">• у части детей --- бессимптомно, находка при УЗИ (профилактическом или по поводу болей в животе);</p>
<p style="margin:0 0 10px">• при прогрессировании ХБП --- никтурия, жажда, тошнота, отёки, артериальная гипертензия, абдоминальные боли.</p>`},
  {n:59, t:"Гидронефроз у детей. Диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*Разумовский, гл. 45 (с. 578--580); Исаков, с. 468--470 (рис. 6-40, 6-41).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: УЗИ диуретическая проба экскреторная урография</b></p>
<p style="margin:0 0 10px"><b>сцинтиграфия ДМСА мегакаликоз</b></p>
<p style="margin:0 0 10px"><b>Важно!</b> Главная задача диагностики --- не просто поставить диагноз, но <b>отличить необструктивную дилатацию лоханки от истинной обструкции ПУС</b> , которая определяет необходимость операции (Разумовский).</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Методы диагностики</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                                                                            <b>Что находят</b></p>
<p style="margin:0 0 10px">Осмотр, пальпация, АД                                                                                малоинформативны; пальпируемая опухоль у грудных; болезненность при пиелонефрите</p>
<p style="margin:0 0 10px">Лаборатория                                                                                          анализ мочи и крови могут быть нормальными; лейкоцитурия, бактериурия --- инфекция; ↑ креатинина и мочевины, гипоизостенурия при ХБП</p>
<p style="margin:0 0 10px"><b>УЗИ</b> с допплерографией --- первая линия                                                           размер почки, ПЗР лоханки, чашечки, толщина паренхимы, мочеточник не виден; индексы резистентности. Новорождённым --- <b>два УЗИ</b> : не ранее 2--3 дней и через 4--6 недель</p>
<p style="margin:0 0 10px"><b>Диуретическая пиелоэхография</b> (фуросемид 1 мг/кг до года, 0,5 мг/кг 1--16 лет, не больше 20 мг)   в норме расширение максимально на 10--15-й минуте, возврат за 20--30 мин; <b>обструкция</b> --- отсутствие нормализации более 30 мин и значительное расширение</p>
<p style="margin:0 0 10px"><b>Экскреторная урография</b>                                                                           расширение и <b>монетообразная деформация чашечек</b> , расширение лоханки (больше при внепочечной); обязательны <b>отсроченные снимки</b> (1--6 ч); мочеточник виден редко, узкий; у новорождённых --- инфузионная урография; информативна не раньше 2 недель</p>
<p style="margin:0 0 10px"><b>Статическая нефросцинтиграфия</b> (99mTc-ДМСА)                                                       раздельная функция, индекс интегрального захвата; помогает выбрать метод лечения</p>
<p style="margin:0 0 10px">Динамическая (диуретическая) нефросцинтиграфия                                                       обструктивный или необструктивный характер оттока</p>
<p style="margin:0 0 10px">КТ и МРТ с контрастом                                                                                уточняют причину обструкции; ограничение --- седация</p>
<p style="margin:0 0 10px">Антеградная/ретроградная пиелография, <b>тест Whitaker</b>                                              инвазивные, редко</p>
<p style="margin:0 0 10px"><b>Микционная цистоуретрография</b>                                                                     при расширении нижней трети мочеточника и рецидивирующей ИМП --- исключить пузырно-мочеточниковый рефлюкс</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                   <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Парапельвикальная киста</b>                                 чашечки и лоханка не расширены; иногда полукруглая деформация лоханки от сдавления кистой</p>
<p style="margin:0 0 10px"><b>Мегакаликоз</b> (локальная чашечно-медуллярная дисплазия)   стойкое расширение чашечек при <b>нормальной лоханке</b> и проходимом ЛМС; на ангиографии --- обеднение сосудистого рисунка</p>
<p style="margin:0 0 10px"><b>Пиелоэктазия</b> («гидронефроз II ст.», N13.1)              нужно динамическое наблюдение: может быть из-за нижнеполярного сосуда или внепочечной лоханки</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: пиелопластика Хайнса--Андерсона динамическое наблюдение JJ-стент</b></p>
<p style="margin:0 0 10px"><b>нефрэктомия эндоуретеротомия</b></p>
<p style="margin:0 0 10px"><b>Цель лечения</b> --- устранить обструкцию и восстановить нормальный отток мочи, чтобы сохранить или улучшить функцию паренхимы. До лечения нужно ликвидировать инфекцию в стадии обострения и скомпенсировать почечную функцию (Разумовский).</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Динамическое наблюдение при I--II ст.</span><span>Операция при III--IV ст., ПЗР \\> 20 мм | Пиелопластика (Хайнс--Андерсон) | Стент, контрольные УЗИ, сцинтиграфия</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Динамическое наблюдение (Разумовский)</b></h4></p>
<p style="margin:0 0 10px">• показано новорождённым и грудным при <b>SFU I--II</b> , ПЗР 10--15 мм, <b>дифференциальной функции почки \\> 40 %</b> , положительной диуретической пробе (Т½ \\< 10 мин);</p>
<p style="margin:0 0 10px">• обструкция функциональная; в <b>65 %</b> за первые 2--3 года ЧЛС уменьшается;</p>
<p style="margin:0 0 10px">• УЗИ у младенцев каждые 3 месяца, у старших --- раз в год; при росте степени, инфекции или боли --- полное урологическое обследование.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эндоурологические операции</b></h4></p>
<p style="margin:0 0 10px">• <b>бужирование</b> ПУС, <b>баллонная дилатация</b> высокого давления, <b>эндоуретеротомия</b> с установкой внутреннего стента (при стенозе не более 1 см);</p>
<p style="margin:0 0 10px">• противопоказаны при внепросветных препятствиях и вторичном гидронефрозе; эффективность 65--80 % --- ниже, чем открытых. <b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургическое лечение</b></h4></p>
<p style="margin:0 0 10px"><b>Операция</b>                                          <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Показания</b> (Р.)                                    SFU <b>III--IV</b> , ПЗР лоханки \\> 20 мм, снижение функции на 35--40 %, отрицательная диуретическая проба (Т½ \\> 20 мин); обычно с 6--12 месяцев</p>
<p style="margin:0 0 10px"><b>Резекционная пиелопластика по Хайнсу--Андерсону</b>   резекция суженного сегмента и избытка лоханки с анастомозом; успех <b>90--95 %</b> ; сегодня <b>лапароскопическая</b> резекционная пиелопластика --- «золотой стандарт» в мире; доступы: люмботомия, лапароскопия, ретроперитонеоскопия, робот</p>
<p style="margin:0 0 10px">Нерезекционные (Foley и др.)                          без резекции лоханки</p>
<p style="margin:0 0 10px">Нижнеполюсный сосуд                                   антевазальная пиелоуретропластика или <b>вазопексия (операция Hillstrom)</b> --- у подростков при отсутствии дисплазии ПУС</p>
<p style="margin:0 0 10px">Дренирование                                          <b>JJ-стент</b> внутренний или наружная пиелостома 1--4--6 недель</p>
<p style="margin:0 0 10px"><b>Нефрэктомия</b>                                       ДФП \\< 10 % или нефункционирующая почка; сначала убедиться в функции контралатеральной почки; при сомнении --- нефростомия или стент и оценка через 14--28 дней</p>
<p style="margin:0 0 10px">Факторы плохого прогноза: функция почки ≤ 60 %, ПЗР \\> 50 мм с расширением чашечек, рецидивирующая инфекция, боль. Противопоказания к лапароскопической пиелопластике: внутрипочечная лоханка, перенесённые операции на брюшной полости, дорсальная гиперротация почки, вентрикулоперитонеальный шунт.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения (Разумовский)</b></h4></p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: мегауретер уретеровезикальный сегмент нейромышечная дисплазия</b></p>

<p style="margin:0 0 10px"><b>Мегауретер</b> (гидроуретер, мегалоуретер, мегадолихоуретер, ахалазия мочеточника, уретерогидронефроз) --- стойкое расширение мочеточника и собирательной системы почки вследствие препятствия, локализованного в <b>дистальном отделе мочеточника</b> (Р.). Причины: механическая обструкция пузырно-мочеточникового сегмента, пузырно-мочеточниковый рефлюкс или недоразвитие стенки мочеточника (И.). Коды МКБ-10: <b>N13.4</b> (гидроуретер), <b>Q62.2</b> (врождённый мегалоуретер).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология (Разумовский)</b></h4></p>
<p style="margin:0 0 10px">• один из самых распространённых видов обструктивных уропатий у детей --- <b>25--30 %</b> ;</p>
<p style="margin:0 0 10px">• двусторонний процесс --- у 20--25 %; слева в 2,5 раза чаще; мальчики в 3 раза чаще девочек;</p>
<p style="margin:0 0 10px">• число случаев растёт из-за антенатальной диагностики (с 26-й недели; патология почек плода видна с 13--16-й недели) и действия тератогенных факторов.</p>

<p style="margin:0 0 10px">Нерефлюксирующий --- <b>функциональная</b> обструкция   мышечные волокна в терминальном отделе теряют продольную ориентацию, незрелость дистального отдела; нарушена волна сокращения</p>

<p style="margin:0 0 10px">• морфология: гипертрофия мышц по всей длине с циркулярным ходом пучков, <b>гипотрофия или атрофия эластического каркаса</b> , избыток коллагена, неравномерное утолщение и фрагментация нервных волокон (Р.);</p>

<p style="margin:0 0 10px"><b>консервативное лечение эналаприл</b></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Определить форму: функциональная, органическая, пузырная</span><span>Консервативно при функциональной | Операция: резекция и неоимплантация | Контроль уродинамики</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Консервативное лечение (функциональная форма, Р.)</b></h4></p>
<p style="margin:0 0 10px">• цель --- улучшить трофику и функцию почек, дозревание мочеточников;</p>
<p style="margin:0 0 10px">• вазоактивные препараты: <b>аминофиллин, дипиридамол, эналаприл</b> (0,1 мг/кг в сутки однократно при нормальном АД, 3 месяца --- улучшает почечную гемодинамику);</p>
<p style="margin:0 0 10px">• фитотерапия по 2--3 недели каждого месяца; физиотерапия (синусоидальные модулированные токи, ультразвук, интерференционные токи); <b>гипербарическая оксигенация</b> ;</p>
<p style="margin:0 0 10px">• <b>санация мочевых путей</b> по чувствительности флоры, уросептики;</p>
<p style="margin:0 0 10px">• при дисфункции пузыря --- м-холинолитики. <b><h4 style="margin:14px 0 8px;color:#0d7377">Пузырно-зависимая форма</b></h4></p>
<p style="margin:0 0 10px">• сначала --- нормализация уродинамики нижних путей: режим «наполнение --- опорожнение», <b>периодическая катетеризация</b> ;</p>
<p style="margin:0 0 10px">• физиотерапия, <b>БОС-терапия</b> , фармакотерапия; при выраженной дезадаптации --- <b>инъекции ботулотоксина типа А</b> в детрузор (Р.);</p>
<p style="margin:0 0 10px">• устранение инфравезикальной обструкции (И.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургическое лечение (Р., И.)</b></h4></p>
<p style="margin:0 0 10px"><b>Показания</b> (Р.): прогрессирование дилатации, рецидивирующее течение хронического пиелонефрита и --- главное --- <b>первые признаки снижения функции почки</b> . Нерефлюксирующий мегауретер с органическим стенозом подлежит хирургической коррекции (И.).</p>
<p style="margin:0 0 10px"><b>Вариант</b>                                <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Три требования</b> к любой операции (Р.)   1\\) максимальная мобилизация мочеточника; 2) резекция патологического участка; 3) <b>уретероцистонеоимплантация с антирефлюксной защитой</b></p>
<p style="margin:0 0 10px"><b>Неоимплантация по Коэну</b> (Cohen)        после резекции формируют подслизистый туннель длиной в <b>4--5 диаметров</b> мочеточника; неоустье --- на контралатеральной стороне задней стенки пузыря по Ричарду; сужение (тапирование) обычно не нужно</p>
<p style="margin:0 0 10px">Операция по Исакову                        выделение дистального отдела, устранение коленообразных изгибов, резекция изменённого участка, туннель в подслизистом слое; методика одинакова при любой форме</p>
<p style="margin:0 0 10px"><b>Эндохирургические</b> (Р.)                 <b>везикоскопическая</b> (интрапузырная; с 2--3 лет, объём пузыря \\> 100 мл) и <b>лапароскопическая</b> (внепузырная); в последние десятилетия вытесняют открытые операции</p>
<p style="margin:0 0 10px"><b>Стентирование</b> (низкий J-стент; Р.)     при нерефлюксирующем мегауретере у новорождённых и грудных: стент с нитью до границы средней и нижней трети; дренирование <b>6--8 ± 2 недели</b> ; удаляют без анестезии за нить; эффективность \\> 80 % в возрасте 1,5--6 мес</p>
<p style="margin:0 0 10px">Рефлюксирующий мегауретер (И.)             длительная подготовка: разгрузка периодической катетеризацией, комплексная терапия для улучшения кровоснабжения и трофики; затем операция</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Когда</b>                      <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>После операции</b>             по Разумовскому число послеоперационных осложнений <b>8--40 %</b> (высокое, поскольку тяжёлая дисплазия мочеточника): обструкция неоустья, рецидив ПМР, ИМП, пиелонефрит; по общим учебникам --- несостоятельность швов, мочевой затёк</p>
<p style="margin:0 0 10px"><b>Болезни</b>                    хронический пиелонефрит, рефлюкс-нефропатия, склероз паренхимы, артериальная гипертензия, ХПН (при двустороннем поражении), камни</p>
<p style="margin:0 0 10px">Стентирование (по учебникам)   миграция и инкрустация стента, ИМП, дизурия</p>
<p style="margin:0 0 10px">*Тактику изменило наблюдение: у части детей порок саморазрешается (до 34 %), поэтому хирургия --- не единственный способ лечения нерефлюксирующего мегауретера (Р.). Дети нуждаются в диспансерном наблюдении.*</p>`},
