<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials — Shahrom Rajabov</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #f0f7f7;
  --bg-card: #ffffff;
  --text: #0f2c32;
  --text-muted: #5a7178;
  --primary: #0d7377;
  --primary-hover: #0a5c5f;
  --accent: #14b8a6;
  --border: #d0e5e5;
  --header-bg: rgba(255,255,255,0.9);
  --shadow: 0 4px 24px rgba(13,115,119,0.08);
  --radius: 14px;
  --danger: #e11d48;
}

[data-theme="dark"] {
  --bg: #0b1a1d;
  --bg-card: #122529;
  --text: #e6f2f2;
  --text-muted: #8aa3a8;
  --primary: #2dd4bf;
  --primary-hover: #5eead4;
  --accent: #14b8a6;
  --border: #1e3a3f;
  --header-bg: rgba(11,26,29,0.92);
  --shadow: 0 4px 24px rgba(0,0,0,0.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.25s, color 0.25s;
}
a { text-decoration: none; color: inherit; transition: 0.2s; }
.container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 20px; }

/* Header */
.header {
  background: var(--header-bg);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  gap: 12px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--text);
}
.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(145deg, var(--primary), var(--accent));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 1.3rem;
  box-shadow: 0 4px 14px rgba(13,115,119,0.3);
}
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a {
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-muted);
}
.nav a:hover, .nav a.active {
  background: color-mix(in srgb, var(--primary) 15%, transparent);
  color: var(--primary);
}
.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  transition: 0.2s;
}
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
.lang-btn {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-muted);
  font-weight: 700;
  font-size: 0.8rem;
  cursor: pointer;
}
.lang-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.burger { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--primary); }

/* Hero */
.hero {
  background: linear-gradient(145deg, #0a2e36 0%, #0d7377 50%, #14b8a6 100%);
  color: white;
  padding: 64px 0 56px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.03em; }
.hero .subtitle { font-size: 1.15rem; opacity: 0.95; font-weight: 500; }
.hero .tagline { font-size: 0.98rem; opacity: 0.8; max-width: 460px; margin: 12px auto 0; }

/* Sections */
.section { padding: 48px 0; }
.section-title {
  font-size: 1.7rem; font-weight: 800; color: var(--text);
  margin-bottom: 24px; letter-spacing: -0.02em;
  position: relative; padding-bottom: 10px;
}
.section-title::after {
  content: ''; position: absolute; left: 0; bottom: 0;
  width: 44px; height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 4px;
}

/* Cards */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  height: 100%;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(13,115,119,0.12); }
.card h3 { color: var(--primary); margin-bottom: 8px; font-size: 1.15rem; font-weight: 700; }
.card p { color: var(--text-muted); font-size: 0.93rem; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }

/* About */
.about-content { display: grid; grid-template-columns: 1fr 1.5fr; gap: 36px; align-items: start; }
.about-photo {
  background: linear-gradient(145deg, color-mix(in srgb, var(--primary) 20%, var(--bg)), color-mix(in srgb, var(--accent) 25%, var(--bg)));
  border-radius: var(--radius); aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 5rem; border: 2px solid var(--border);
}
.about-text p { margin-bottom: 12px; color: var(--text-muted); }
.about-text strong { color: var(--text); }
.info-list { list-style: none; margin-top: 18px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
.info-list li { padding: 11px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
.info-list li:last-child { border-bottom: none; }
.info-list .label { font-weight: 700; color: var(--primary); min-width: 90px; font-size: 0.88rem; }

/* Material hero + book viewer */
.material-hero {
  background: linear-gradient(145deg, #0a2e36, #0d7377 60%, #14b8a6);
  color: white; padding: 28px; border-radius: var(--radius); margin-bottom: 24px;
}
.material-hero h3 { color: white; font-size: 1.35rem; font-weight: 800; margin-bottom: 8px; }
.material-hero p { opacity: 0.92; margin-bottom: 18px; max-width: 520px; }
.btn-read, .btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: white; color: #0a2e36;
  padding: 12px 22px; border-radius: 999px;
  font-weight: 700; font-size: 0.95rem; border: none; cursor: pointer;
  transition: 0.2s; font-family: inherit;
}
.btn-read:hover, .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
}

/* Embedded book section */
.book-viewer {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 28px;
  box-shadow: var(--shadow);
}
.book-viewer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--bg);
  border-bottom: 1px solid var(--border); font-weight: 700;
}
.book-frame {
  width: 100%; height: 70vh; min-height: 420px; border: none;
  background: #e8eef0;
}

/* Search & questions */
.search-box { margin-bottom: 16px; }
.search-box input {
  width: 100%; max-width: 480px; padding: 12px 16px;
  border: 1.5px solid var(--border); border-radius: 999px;
  font-size: 1rem; background: var(--bg-card); color: var(--text);
  font-family: inherit; transition: 0.2s;
}
.search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
.stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; font-size: 0.88rem; color: var(--text-muted); }
.stats strong { color: var(--primary); }

.q-list { list-style: none; }
.q-item {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 8px; overflow: hidden; transition: 0.15s;
}
.q-item:hover { box-shadow: var(--shadow); }
.q-header {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 15px; cursor: pointer; user-select: none;
}
.q-num {
  background: color-mix(in srgb, var(--primary) 15%, transparent);
  color: var(--primary); font-weight: 800; font-size: 0.78rem;
  min-width: 32px; height: 26px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.q-title { flex: 1; font-weight: 600; font-size: 0.94rem; line-height: 1.4; }
.q-toggle { color: var(--text-muted); font-size: 0.85rem; transition: 0.2s; }
.q-item.open .q-toggle { transform: rotate(180deg); }
.q-body {
  display: none; padding: 12px 16px 16px;
  border-top: 1px solid var(--border);
  max-height: 65vh; overflow-y: auto;
  font-size: 0.92rem; line-height: 1.55; background: color-mix(in srgb, var(--primary) 4%, var(--bg));
}
.q-item.open .q-body { display: block; }
.q-body p { margin-bottom: 8px; }
.q-body h4 { margin: 12px 0 6px; color: var(--primary); }

.note {
  background: color-mix(in srgb, var(--primary) 12%, transparent);
  border-left: 4px solid var(--primary);
  padding: 12px 16px; border-radius: 0 10px 10px 0;
  margin-bottom: 18px; font-size: 0.9rem; color: var(--text-muted);
}

.item-card { display: flex; gap: 14px; align-items: flex-start; }
.item-icon {
  width: 48px; height: 48px;
  background: color-mix(in srgb, var(--primary) 15%, transparent);
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; flex-shrink: 0;
}
.badge {
  display: inline-block;
  background: color-mix(in srgb, var(--primary) 15%, transparent);
  color: var(--primary); font-size: 0.72rem; font-weight: 700;
  padding: 3px 10px; border-radius: 20px; margin-top: 6px;
}

/* Contact */
.contact-form {
  background: var(--bg-card); padding: 28px; border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow); max-width: 520px;
}
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 0.9rem; }
.form-group input, .form-group textarea {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 1rem; font-family: inherit;
  background: var(--bg); color: var(--text); transition: 0.2s;
}
.form-group input:focus, .form-group textarea:focus {
  outline: none; border-color: var(--primary);
}
.form-group textarea { min-height: 120px; resize: vertical; }

/* Footer */
.footer {
  background: #0a2e36; color: rgba(255,255,255,0.8);
  padding: 24px 0; margin-top: auto; text-align: center; font-size: 0.88rem;
}

/* AI Widget */
.ai-chat-btn {
  position: fixed; bottom: 22px; right: 22px;
  width: 60px; height: 60px; border-radius: 50%;
  background: linear-gradient(145deg, var(--primary), var(--accent));
  color: white; border: none;
  box-shadow: 0 8px 28px rgba(13,115,119,0.4);
  cursor: pointer; z-index: 1500;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.7rem; transition: 0.2s;
}
.ai-chat-btn:hover { transform: scale(1.08); }
.ai-chat-btn.open { background: #64748b; }
.ai-chat-panel {
  position: fixed; bottom: 94px; right: 22px;
  width: 380px; max-width: calc(100vw - 24px);
  height: 520px; max-height: calc(100vh - 120px);
  background: var(--bg-card); border-radius: 16px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.2);
  z-index: 1499; display: none; flex-direction: column;
  overflow: hidden; border: 1px solid var(--border);
}
.ai-chat-panel.open { display: flex; }
.ai-chat-header {
  background: linear-gradient(145deg, #0a2e36, var(--primary));
  color: white; padding: 13px 15px;
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 700;
}
.ai-chat-header button {
  background: rgba(255,255,255,0.18); border: none; color: white;
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 1.1rem;
}
.ai-chat-body { flex: 1; overflow-y: auto; padding: 14px; background: var(--bg); }
.ai-chat-disclaimer {
  padding: 8px 12px; font-size: 0.7rem; color: var(--text-muted);
  background: var(--bg-card); border-top: 1px solid var(--border); text-align: center;
}

/* PDF Modal */
.pdf-modal {
  display: none; position: fixed; inset: 0;
  background: rgba(10,46,54,0.8); z-index: 2000;
  align-items: center; justify-content: center; padding: 12px;
  backdrop-filter: blur(6px);
}
.pdf-modal.open { display: flex; }
.pdf-modal-inner {
  background: var(--bg-card); width: 100%; max-width: 980px;
  height: 92vh; border-radius: 14px; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 60px rgba(0,0,0,0.35);
}
.pdf-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px; background: #0a2e36; color: white; font-weight: 700;
}
.pdf-modal-header button {
  background: rgba(255,255,255,0.15); border: none; color: white;
  width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1.15rem;
}
.pdf-modal-body { flex: 1; background: #e8eef0; }
.pdf-modal-body iframe { width: 100%; height: 100%; border: none; }

@media (max-width: 768px) {
  .burger { display: block; }
  .nav {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    background: var(--bg-card); flex-direction: column; padding: 12px;
    box-shadow: var(--shadow); border-top: 1px solid var(--border);
  }
  .nav.open { display: flex; }
  .nav a { padding: 12px 14px; border-radius: 10px; }
  .hero h1 { font-size: 1.85rem; }
  .about-content { grid-template-columns: 1fr; }
  .about-photo { max-width: 180px; margin: 0 auto; }
  .ai-chat-panel { right: 10px; left: 10px; width: auto; bottom: 88px; }
  .ai-chat-btn { right: 14px; bottom: 14px; }
  .book-frame { height: 55vh; }
}
</style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">⚕</div>
        <span>Shahrom Rajabov</span>
      </a>
      <button class="burger" id="burger">☰</button>
      <nav class="nav" id="nav">
      <a href="index.html" class="" data-i18n="about">О себе</a>
      <a href="materials.html" class="active" data-i18n="materials">Материалы</a>
      <a href="books.html" class="" data-i18n="books">Книги</a>
      <a href="contact.html" class="" data-i18n="contact">Обратная связь</a>
    </nav>
      <div class="header-actions">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="icon-btn" id="themeBtn" title="Theme">🌙</button>
      </div>
    </div>
  </header>
  
<section class="section">
  <div class="container">
    <h2 class="section-title" data-i18n="matTitle">Материалы для экзамена</h2>
    <div class="material-hero">
      <h3 data-i18n="matHero">Детская хирургия — вопросы 1–182</h3>
      <p data-i18n="matDesc">Основной учебный материал. Читайте учебник прямо на сайте и ищите ответы по вопросам.</p>
      <button class="btn-read" data-open-pdf="materials.pdf" data-i18n="openBook">Открыть учебник</button>
    </div>

    <div class="book-viewer" id="bookSection">
      <div class="book-viewer-header">
        <span>📖 Учебник / Textbook (PDF)</span>
        <button class="icon-btn" onclick="document.getElementById('bookFrame').src='materials.pdf'" title="Reload">↻</button>
      </div>
      <iframe class="book-frame" id="bookFrame" src="materials.pdf#toolbar=1" title="Textbook"></iframe>
    </div>

    <div class="stats">
      <span><span data-i18n="totalQ">Всего вопросов</span>: <strong id="qCount">182</strong></span>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" data-i18n-placeholder="searchPh" placeholder="Поиск по вопросам...">
    </div>
    <ul class="q-list" id="qList"></ul>
  </div>
</section>

  <footer class="footer">
    <div class="container"><p>© 2025–2026 Shahrom Rajabov · Medical student</p></div>
  </footer>
  <script>// Theme + Language + AI + PDF
const i18n = {
  ru: {
    about: "О себе", materials: "Материалы", books: "Книги", contact: "Обратная связь",
    heroTitle: "Раджабов Шахром", heroSub: "Студент • Будущий врач",
    heroTag: "Путь в медицину начинается с знаний, дисциплины и желания помогать людям",
    aboutTitle: "О себе",
    aboutP1: "Здравствуйте! Меня зовут Раджабов Шахром. Я студент медицинского университета, который стремится стать квалифицированным и внимательным врачом.",
    aboutP2: "Медицина для меня — это не просто профессия, а призвание. Я верю, что хороший врач должен сочетать глубокие знания, эмпатию и постоянное стремление к развитию.",
    status: "Статус", statusVal: "Студент медицинского вуза",
    goal: "Цель", goalVal: "Стать практикующим врачом",
    interests: "Интересы", interestsVal: "Клиническая медицина, анатомия, терапия",
    matTitle: "Материалы для экзамена",
    matHero: "Детская хирургия — вопросы 1–182",
    matDesc: "Основной учебный материал. Читайте учебник прямо на сайте и ищите ответы по вопросам.",
    openBook: "Открыть учебник",
    searchPh: "Поиск по вопросам (атрезия, травма, пилоростеноз...)",
    totalQ: "Всего вопросов",
    booksTitle: "Рекомендуемые книги",
    contactTitle: "Обратная связь",
    send: "Отправить",
    aiTitle: "ИИ-помощник",
    aiLocal: "Поиск по материалам сайта",
    aiWeb: "Спросить общий медицинский ИИ",
    aiHint: "Введите тему или вопрос — найду в материалах. Для других медицинских вопросов откройте ChatGPT / Perplexity."
  },
  en: {
    about: "About", materials: "Materials", books: "Books", contact: "Contact",
    heroTitle: "Shahrom Rajabov", heroSub: "Student • Future Doctor",
    heroTag: "The path to medicine begins with knowledge, discipline and the desire to help people",
    aboutTitle: "About me",
    aboutP1: "Hello! My name is Shahrom Rajabov. I am a medical university student who strives to become a qualified and attentive doctor.",
    aboutP2: "Medicine for me is not just a profession, but a calling. I believe a good doctor must combine deep knowledge, empathy and continuous development.",
    status: "Status", statusVal: "Medical university student",
    goal: "Goal", goalVal: "Become a practicing physician",
    interests: "Interests", interestsVal: "Clinical medicine, anatomy, therapy",
    matTitle: "Exam materials",
    matHero: "Pediatric Surgery — questions 1–182",
    matDesc: "Main study material. Read the textbook on the site and search answers by question.",
    openBook: "Open textbook",
    searchPh: "Search questions (atresia, trauma, pyloric stenosis...)",
    totalQ: "Total questions",
    booksTitle: "Recommended books",
    contactTitle: "Feedback",
    send: "Send",
    aiTitle: "AI Assistant",
    aiLocal: "Search site materials",
    aiWeb: "Ask general medical AI",
    aiHint: "Enter a topic — I will search the materials. For other medical questions open ChatGPT / Perplexity."
  }
};

let currentLang = localStorage.getItem('lang') || 'ru';
let currentTheme = localStorage.getItem('theme') || 'light';

document.addEventListener('DOMContentLoaded', () => {
  document.documentElement.setAttribute('data-theme', currentTheme);
  applyLang(currentLang);
  initBurger();
  initThemeBtn();
  initLangBtn();
  initAIChat();
  initPdfButtons();
});

function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang][key]) el.textContent = i18n[lang][key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (i18n[lang][key]) el.placeholder = i18n[lang][key];
  });
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

function initThemeBtn() {
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  btn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
  btn.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', currentTheme);
    document.documentElement.setAttribute('data-theme', currentTheme);
    btn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
  });
}

function initLangBtn() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });
}

function initBurger() {

  burger.addEventListener('click', () => {

    burger.textContent = nav.classList.contains('open') ? '✕' : '☰';

function initPdfButtons() {

function openPdfViewer(url) {
  let modal = document.getElementById('pdfModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'pdfModal';
    modal.className = 'pdf-modal';
    modal.innerHTML = `
      <div class="pdf-modal-inner">
        <div class="pdf-modal-header">
          <span>Pediatric Surgery / Детская хирургия</span>
          <button id="pdfModalClose">✕</button>
        </div>
        <div class="pdf-modal-body"><iframe id="pdfFrame" src="" title="PDF"></iframe></div>
      </div>`;
    document.body.appendChild(modal);
    document.getElementById('pdfModalClose').onclick = () => {
      modal.classList.remove('open');
      document.getElementById('pdfFrame').src = '';
    };
    modal.onclick = e => { if (e.target === modal) { modal.classList.remove('open'); document.getElementById('pdfFrame').src = ''; } };
  }
  document.getElementById('pdfFrame').src = url + '#toolbar=1';
  modal.classList.add('open');
}

<script>
const fullQuestions = [
  {n:1, t:"Основоположник детской хирургии в Таджикистане. Особенности детского возраста. История развития", a:`<p style="margin:0 0 10px">*Особенности и история --- по Исакову (с. 25--36) и Разумовскому (с. 33); Таджикистан --- по сайту ТГМУ, Википедии и некрологу (интернет).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: основоположник А.Т. Пулатов особенности ребёнка история</b></p>
<p style="margin:0 0 10px"><b>эндохирургия</b></p>
<p style="margin:0 0 10px"><b>Детская хирургия</b> --- раздел хирургии, изучающий хирургические болезни, пороки развития и травмы у детей. Ребёнок --- <b>не уменьшенная копия взрослого</b> : у него другие размеры тела, обмен, реакции на лекарства и наркоз (Исаков, с. 33).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Основоположник детской хирургии в Таджикистане</b></h4></p>
<p style="margin:0 0 10px"><b>Показатель</b>            <b>Сведения</b></p>
<p style="margin:0 0 10px"><b>Кто</b>                   <b>Азам Таирович Пулатов</b> (15.06.1928 -- 26.07.2007), хирург, д.м.н. (1963), профессор (1966), член-корр. АН Таджикской ССР (1985), заслуженный деятель науки</p>
<p style="margin:0 0 10px"><b>Должности</b>             с 1950 г. в ТГМИ им. Абуали ибни Сино; с <b>1964 г. зав. кафедрой детской хирургии</b> (и детской анестезиологии); <b>главный хирург МЗ Таджикистана</b> (1967--1993)</p>
<p style="margin:0 0 10px"><b>Что сделал</b>            создал (при его непосредственном участии) кафедру и клинику детской хирургии, Республиканский центр детской хирургии; в 1974 г. клиника и кафедра получили статус <b>Республиканского научного общества детских хирургов</b> , началась подготовка детских хирургов и детских анестезиологов</p>
<p style="margin:0 0 10px"><b>Научные направления</b>   эхинококкоз и уролитиаз у детей, восстановительная хирургия лица, детская анестезиология и реаниматология; более 600 работ, 10 монографий (в т.ч. «Хирургия эхинококкоза у детей», 1983)</p>
<p style="margin:0 0 10px"><b>Важно!</b> В твоих трёх книгах Таджикистан отдельно не описан (у Разумовского только упомянут среди стран --- членов ассоциации). Сведения выше --- из интернета. Сайт ТГМУ подчёркивает, что развитие службы --- труд большого коллектива; Пулатова называют организатором кафедры и клиники. Если на вашей кафедре на лекции называли другое имя, ориентируйся на лекцию.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Особенности хирургии детского возраста (Исаков, с. 33--36)</b></h4></p>
<p style="margin:0 0 10px"><b>Особенность</b>          <b>Что это значит для хирурга</b></p>
<p style="margin:0 0 10px"><b>Размеры тела</b>         у новорождённого масса ≈ 1/21, площадь поверхности 1/9, длина 10/33 от взрослого: большие потери тепла и жидкости, высокий обмен, дозы препаратов считают по массе</p>
<p style="margin:0 0 10px"><b>Строение</b>             большая голова, короткая шея, слабые мышцы: трудно сохранять проходимость дыхательных путей (операция, наркоз, даже сон)</p>
<p style="margin:0 0 10px"><b>Нервная система</b>      не завершена: мозг ≈ 1/10 массы тела (у взрослого 1/50), нервных клеток лишь 25 % от взрослого</p>
<p style="margin:0 0 10px"><b>Вода и электролиты</b>   вода 80--85 % массы тела (у взрослого 55--60 %): быстрое обезвоживание; склонность к метаболическому ацидозу, малые буферные резервы</p>
<p style="margin:0 0 10px"><b>Теплорегуляция</b>       в первые месяцы не сформирована: риск переохлаждения (кувез, обогрев)</p>
<p style="margin:0 0 10px"><b>Желудок</b>              опорожнение дольше (у половины до 8 ч), слабый кардиальный сфинктер: риск аспирации при наркозе</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">История развития детской хирургии (Исаков, с. 25--31)</b></h4></p>
<p style="margin:0 0 10px"><b>Год</b>          <b>Событие</b></p>
<p style="margin:0 0 10px"><b>1869</b>         первое детское хирургическое отделение в России --- Санкт-Петербург (К.А. Раухфус)</p>
<p style="margin:0 0 10px"><b>1876</b>         Москва, Владимирская больница (В.И. Иршик); Д.Е. Горохов --- автор первой в России монографии «Детская хирургия»</p>
<p style="margin:0 0 10px"><b>до 1917</b>      всего 15 детских хирургических отделений на 10--20 коек</p>
<p style="margin:0 0 10px"><b>1922</b>         кафедра детской хирургии в Петрограде (Ф.К. Вебер, затем Н.В. Шварц)</p>
<p style="margin:0 0 10px"><b>1931</b>         <b>первая в стране кафедра</b> детской хирургии --- 2-й МГМИ (К.Д. Есипов)</p>
<p style="margin:0 0 10px"><b>1943--1960</b>   С.Д. Терновский --- основатель отечественной школы детских хирургов</p>
<p style="margin:0 0 10px"><b>с 1966</b>       кафедру возглавил академик Ю.Ф. Исаков --- новый этап развития</p>
<p style="margin:0 0 10px"><b>1993</b>         создана Российская ассоциация детских хирургов (в её составе и детские хирурги Таджикистана) --- Разумовский, с. 33</p>
<p style="margin:0 0 10px"><b>сегодня</b>      малоинвазивная <b>эндохирургия</b> (лапароскопия, торакоскопия, артроскопия)</p>`},
  {n:2, t:"Атрезия пищевода. Этиология и патогенез", a:`<p style="margin:0 0 10px">*Разумовский, гл. 28 (с. 459--460); Исаков, с. 217--218.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: атрезия пищевода ТПС передняя кишка трахеомаляция</b></p>
<p style="margin:0 0 10px"><b>многоводие</b></p>
<p style="margin:0 0 10px"><b>Атрезия пищевода</b> --- порок развития, при котором проксимальный и дистальный концы пищевода разобщены и не сообщаются между собой. Верхний конец расширен и слепо заканчивается на уровне I--IV грудного позвонка; нижний --- узкий, расположен над диафрагмой и часто сообщается с трахеей (Разумовский).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология и коды</b></h4></p>
<p style="margin:0 0 10px">• частота: 1 на 2400--6000 живорождённых (Р.), по Исакову --- 0,3 : 1000; мальчики : девочки = 1 : 1;</p>
<p style="margin:0 0 10px">• около 30 % больных --- недоношенные дети (Р.); в 5 % случаев --- при хромосомных болезнях (И.);</p>
<p style="margin:0 0 10px">• часто сочетается с пороками сердца, ЖКТ, мочеполовой системы;</p>
<p style="margin:0 0 10px">• МКБ-10: <b>Q39.0</b> --- без свища; <b>Q39.1</b> --- с трахеопищеводным свищом (ТПС); <b>Q39.2</b> --- ТПС без атрезии.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• причина --- нарушение эмбриогенеза головного отдела передней (первичной) кишки;</p>
<p style="margin:0 0 10px">• трахея и пищевод развиваются из одного зачатка; разделение идёт после 20-го дня (4--5-я неделя) от карины в направлении головы;</p>
<p style="margin:0 0 10px">• порок возникает при несоответствии направления и скорости роста трахеи и пищевода и нарушении вакуолизации (20--40-й день); формирование заканчивается к 40-му дню;</p>
<p style="margin:0 0 10px">• в анамнезе беременности типичны <b>многоводие</b> и угроза выкидыша в I триместре (И.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез (Разумовский)</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Верхний сегмент растягивается амниотической жидкостью</span><span>Давит на трахею: трахеомаляция | Нет проходимости: нарушена перистальтика и глотательный рефлекс | Свищ: воздух в желудок, желудочное содержимое в лёгкие</span></div>
<p style="margin:0 0 10px">• <b>перерастяжение желудка воздухом</b> через ТПС при крике → ограничение подвижности диафрагмы → ателектазы базальных отделов и пневмония;</p>
<p style="margin:0 0 10px">• <b>заброс желудочного содержимого</b> через дистальный ТПС в бронхи → «химическая» пневмония, затем бактериальная;</p>
<p style="margin:0 0 10px">• внутриутробно нарушено развитие трахеи и бронхов (низкое давление в бронхах → нарушено ветвление бронхов и альвеол);</p>
<p style="margin:0 0 10px">• дисплазия интрамурального нервного сплетения и уменьшение числа ганглиев → патологическая перистальтика и <b>дисфункция пищевода после операции</b> .</p>`},
  {n:3, t:"Атрезия пищевода. Клиника и классификация", a:`<p style="margin:0 0 10px">*Разумовский, гл. 28 (с. 460--461, рис. 28.1); Исаков, с. 217--220 (рис. 4-35).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: классификация дистальный ТПС пенистые выделения VACTERL</b></p>
<p style="margin:0 0 10px"><b>цианоз</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                               <b>Частота</b>   <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Атрезия с дистальным (нижним) ТПС</b>   ≈ 85 %        верхний сегмент слепой, нижний сообщается с трахеей --- самая частая форма</p>
<p style="margin:0 0 10px"><b>Изолированная (без свища)</b>           ≈ 6 %         оба сегмента слепые, связи с трахеей нет; второе место по частоте</p>
<p style="margin:0 0 10px"><b>Изолированный ТПС без атрезии</b>       ≈ 5 %         пищевод проходим, но есть соустье с трахеей на любом уровне</p>
<p style="margin:0 0 10px"><b>С верхним и нижним ТПС</b>              ≈ 3 %         свищи и у проксимального, и у дистального сегмента</p>
<p style="margin:0 0 10px"><b>Все остальные</b>                       ≈ 1 %         в том числе с верхним ТПС</p>
<p style="margin:0 0 10px">![](media/image1.jpg){width="2.940264654418198in" height="1.6668164916885388in"}                                                  ![](media/image2.jpg){width="2.581796806649169in" height="1.667826990376203in"}</p>
<p style="margin:0 0 10px">*Рис. 28.1 (Р., с. 460). Формы атрезии: А --- без свища; Б --- с верхним ТПС; В --- с нижним ТПС; Г --- с верхним и нижним ТПС*   *Рис. 4-35 (И., с. 218). Варианты атрезии пищевода; в центре --- наиболее частая форма*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Период / форма</b>                       <b>Признаки</b></p>
<p style="margin:0 0 10px"><b>Антенатально</b>                         на УЗИ плода желудок не виден или микрогастрия, особенно с многоводием</p>
<p style="margin:0 0 10px"><b>Сразу после рождения</b>                 верхний сегмент и носоглотка переполнены слизью: <b>обильные пенистые выделения изо рта</b> ; после отсасывания появляются вновь</p>
<p style="margin:0 0 10px"><b>Аспирация</b>                            приступы цианоза, хрипы в лёгких, нарастает одышка; при попытке кормления --- дисфагия, кашель, цианоз</p>
<p style="margin:0 0 10px"><b>Дистальный ТПС</b>                       вздутие живота, особенно эпигастрия; тяжесть аспирации зависит от диаметра свища</p>
<p style="margin:0 0 10px"><b>Изолированная форма</b>                  живот запавший, мягкий, безболезненный (в кишечнике нет газа)</p>
<p style="margin:0 0 10px"><b>Свищ + дуоденальная непроходимость</b>   сильно вздута эпигастральная область; при очень широком ТПС вздут весь живот</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Ассоциации VATER / VACTERL</b></h4></p>
<p style="margin:0 0 10px"><b>Буква</b>   <b>Порок</b></p>
<p style="margin:0 0 10px"><b>V</b>       Vertebral --- аномалии позвонков и других костей</p>
<p style="margin:0 0 10px"><b>A</b>       Anal atresia --- атрезия заднего прохода</p>
<p style="margin:0 0 10px"><b>C</b>       Cardiac --- пороки сердца</p>
<p style="margin:0 0 10px"><b>T</b>       Tracheo-esophageal fistula --- трахеопищеводный свищ</p>
<p style="margin:0 0 10px"><b>E</b>       Esophageal atresia --- атрезия пищевода</p>
<p style="margin:0 0 10px"><b>R</b>       Radial dysplasia и Renal --- дисплазия лучевой кости и аномалии почек</p>
<p style="margin:0 0 10px"><b>L</b>       Limb --- пороки развития конечностей</p>
<p style="margin:0 0 10px">Ассоциация описана в 1973 г. Полная VATER --- у 1,5 % детей с атрезией, три компонента --- у 17,5 % (Исаков). При VACTERL чаще высокая атрезия, тяжёлое течение и высокая летальность. Нашёл один порок --- ищи остальные.</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: зондирование симптом элефанта рентгенография</b></p>
<p style="margin:0 0 10px"><b>водорастворимый контраст УЗИ, ЭхоКГ</b></p>
<p style="margin:0 0 10px"><b>Важно!</b> Зондирование пищевода целесообразно проводить <b>всем младенцам с дыхательными расстройствами сразу после рождения</b> --- до развития аспирационной пневмонии (Исаков).</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Подозрение: многоводие, пена изо рта</span><span>Зондирование желудка | Рентген с зондом: грудь + живот | УЗИ, ЭхоКГ, осмотр ануса</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Зондирование</b></h4></p>
<p style="margin:0 0 10px">• при малейшем подозрении вводят зонд (катетер); при пороке на глубине <b>8--13 см</b> зонд упирается в слепой конец (Р.); по Исакову --- 6--8 см, либо катетер заворачивается и выходит изо рта;</p>
<p style="margin:0 0 10px">• <b>симптом элефанта (слона)</b> : воздух, введённый в слепой конец, с шумом выходит из носоглотки;</p>
<p style="margin:0 0 10px">• окончательный диагноз ставят только после рентгенографии.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Рентгенография</b></h4></p>
<p style="margin:0 0 10px">• снимок в вертикальном положении, прямая проекция, захват груди и живота;</p>
<p style="margin:0 0 10px">• вводят до 1 мл <b>водорастворимого</b> контраста в верхний сегмент через зонд, затем удаляют аспиратором; <b>бариевую взвесь не используют</b> (риск аспирации);</p>
<p style="margin:0 0 10px"><b>Находка на снимке</b>                                  <b>Значение</b></p>
<p style="margin:0 0 10px">газ в желудке и петлях кишечника                       есть дистальный ТПС</p>
<p style="margin:0 0 10px">нет газа, запавший живот, затемнение брюшной полости   изолированная форма (без свища)</p>
<p style="margin:0 0 10px">уровни жидкости в животе                               сочетанная патология ЖКТ (например, дуоденальная непроходимость)</p>
<p style="margin:0 0 10px">контраст попал в трахею                                проксимальный (верхний) ТПС</p>
<p style="margin:0 0 10px">лёгкие, тень сердца, позвоночник                       пневмония, ателектазы; ВПС; аномалии позвонков</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дополнительное обследование</b></h4></p>
<p style="margin:0 0 10px">• пренатально: УЗИ плода (нет желудка, многоводие);</p>
<p style="margin:0 0 10px">• обязательны: <b>УЗИ</b> брюшной полости и забрюшинного пространства, <b>ЭхоКГ</b> , осмотр промежности (атрезия ануса).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                               <b>Чем отличается</b></p>
<p style="margin:0 0 10px"><b>Изолированный ТПС (без атрезии)</b>                                                     пищевод проходим, зонд проходит в желудок; кашель и цианоз при кормлении; диагноз --- контраст и трахеоскопия (Исаков, с. 223)</p>
<p style="margin:0 0 10px"><b>Ахалазия, сужение пищевода, ГЭР</b>                                                     пищевод проходим, нет слепого мешка на рентгене (перечень Исакова)</p>
<p style="margin:0 0 10px"><b>Дисфагия при родовой травме голосовых связок или центрального генеза</b>                зонд проходит в желудок (перечень Исакова)</p>
<p style="margin:0 0 10px"><b>Респираторный дистресс-синдром, аспирационная пневмония (дополнение по учебникам)</b>   дыхательные расстройства есть, но зонд свободно проходит, нет пенистых выделений как при слепом мешке</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: предоперационная подготовка прямой анастомоз гастростома по Кадеру</b></p>
<p style="margin:0 0 10px"><b>бужирование пластика пищевода</b></p>
<p style="margin:0 0 10px"><b>Лечение только оперативное.</b> Только раннее вмешательство может спасти жизнь ребёнку (Исаков). Подготовку начинают уже в родильном доме.</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Подготовка в роддоме, транспортировка</span><span>Выбор операции по форме и риску | Послеоперационное ведение | Контроль анастомоза, бужирование</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Предоперационная подготовка</b></h4></p>
<p style="margin:0 0 10px">• аспирация содержимого рото- и носоглотки <b>каждые 15--20 мин</b> , оксигенотерапия, <b>полное исключение кормления через рот</b> ;</p>
<p style="margin:0 0 10px">• транспортировка в сопровождении специализированной бригады, в кратчайший срок;</p>
<p style="margin:0 0 10px">• при аспирации, пневмонии, ателектазе --- прямая ларингоскопия, катетеризация трахеи и аспирация; при неэффективности под наркозом бронхоскопия или интубация;</p>
<p style="margin:0 0 10px">• кувез: непрерывная подача кислорода, аспирация, согревание; инфузионная, антибактериальная, симптоматическая терапия.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Выбор операции (Исаков)</b></h4></p>
<p style="margin:0 0 10px"><b>Ситуация</b>                                                                                                           <b>Операция</b></p>
<p style="margin:0 0 10px">Дистальный ТПС, малый операционный риск (доношенный, без тяжёлых сочетанных пороков и внутричерепной родовой травмы)   торакотомия, <b>разделение ТПС</b> ; если диастаз ≤ 1,5--2 см --- <b>прямой анастомоз</b> «конец в конец»</p>
<p style="margin:0 0 10px">Большой диастаз                                                                                                        шейная эзофагостома + гастростома по Кадеру</p>
<p style="margin:0 0 10px">Несвищевые формы (значительный диастаз)                                                                                гастростомия и эзофагостомия</p>
<p style="margin:0 0 10px">Высокий операционный риск                                                                                              <b>двойная гастростома</b> (1-я --- кормление зондом в ДПК, 2-я --- декомпрессия желудка и меньше аспирации); 2-й этап через 2--4 дня после улучшения состояния</p>
<p style="margin:0 0 10px">После эзофаго- и гастростомии в возрасте от 2--3 мес до 3 лет выполняют второй этап --- <b>пластику пищевода толстокишечным трансплантатом</b> (Исаков, с. 222).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Послеоперационный период</b></h4></p>
<p style="margin:0 0 10px">• интенсивная терапия продолжается; кормление через зонд, поставленный через анастомоз (или в гастростому);</p>
<p style="margin:0 0 10px">• на <b>6--7-е сутки</b> проверяют состоятельность анастомоза: под рентген-экраном через рот 1--2 мл водорастворимого контраста; без осложнений --- кормят через рот;</p>
<p style="margin:0 0 10px">• через 2--3 нед --- контрольная ФЭГДС (проходимость анастомоза, кардия, эзофагит);</p>
<p style="margin:0 0 10px">• на первом году жизни --- диспансерное наблюдение; кормление гомогенизированной пищей.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                               <b>Комментарий</b></p>
<p style="margin:0 0 10px">Несостоятельность анастомоза                 исключают контрастным исследованием на 6--7-е сутки (затёки контраста)</p>
<p style="margin:0 0 10px"><b>Стеноз анастомоза</b>                        у 30--40 % больных; лечение --- бужирование (бужи № 22--24) под контролем эзофагоскопии</p>
<p style="margin:0 0 10px">Дисфагия, непроходимость в зоне анастомоза   требует срочной эзофагоскопии</p>
<p style="margin:0 0 10px">ГЭР и недостаточность кардии                 ночные регургитации, повторные пневмонии, срыгивания; ГЭР развивается у 18--35 % детей с атрезией; может вести к стриктуре анастомоза</p>
<p style="margin:0 0 10px">Осиплость голоса                             в первые 6--12 мес из-за травмы возвратного гортанного нерва</p>
<p style="margin:0 0 10px">Дисфункция пищевода, пневмонии               дисплазия нервного сплетения пищевода, аспирация (Разумовский)</p>`},
  {n:6, t:"Ахалазия пищевода. Этиология и патогенез", a:`<p style="margin:0 0 10px">*Разумовский, гл. 9 (с. 143); Исаков, с. 223--224.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: ахалазия кардия ауэрбахово сплетение нейрогенная природа</b></p>
<p style="margin:0 0 10px"><b>дилатация</b></p>
<p style="margin:0 0 10px"><b>Ахалазия пищевода</b> --- патологическое состояние, характеризующееся функциональным нарушением проходимости кардиального отдела пищевода. С прогрессированием пищевод теряет двигательную активность и расширяется (дилатация). Код МКБ-10: <b>K22.0</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• заболеваемость 4--6 на 1 000 000 населения; у детей встречается значительно реже, чем у взрослых (Р.);</p>
<p style="margin:0 0 10px">• первые проявления у детей чаще в 7--10 лет (Р.), в среднем в 8--9 лет (И.); возможна и у грудных детей.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• заболевание имеет <b>нейрогенную природу</b> ;</p>
<p style="margin:0 0 10px">• причины: <b>дефицит нейронов в ганглиях ауэрбахова (межмышечного) сплетения</b> кардиального отдела пищевода и/или дегенеративные изменения в двигательных ядрах блуждающих нервов.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Неполноценная иннервация</span><span>Кардия не раскрывается координированно | Нарушена моторика вышележащих отделов | Дилатация и атония пищевода</span></div>
<p style="margin:0 0 10px">• нарушено координированное раскрытие кардии при глотании → пища задерживается над кардией;</p>
<p style="margin:0 0 10px">• пищевод расширяется, теряет перистальтику (атония); возможен эзофагит;</p>
<p style="margin:0 0 10px">• регургитация и ночные аспирации ведут к пневмониям; нарушенное питание --- к дефициту массы тела.</p>
<p style="margin:0 0 10px"><b>Важно!</b> Лечение ахалазии не патогенетическое, а направлено на устранение симптомов (Исаков, с. 226), поэтому после операции нужно диспансерное наблюдение.</p>`},
  {n:7, t:"Ахалазия пищевода. Клиника, диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*Разумовский, гл. 9 (с. 143--145, рис. 9.1); Исаков, с. 224--226 (рис. 4-37).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: дисфагия регургитация рентген с барием симптом проваливания</b></p>
<p style="margin:0 0 10px"><b>эзофагоскопия</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• основные симптомы --- <b>дисфагия</b> и <b>регургитация</b> (рвота непереваренной пищей); чаще при грубой пище, чем при жидкой;</p>
<p style="margin:0 0 10px">• у малышей дисфагия видна по косвенным признакам: едят медленно, тщательно пережёвывают, не доедают, давятся;</p>
<p style="margin:0 0 10px">• старшие дети делают усиленные (пустые) глотательные движения, запивают еду водой;</p>
<p style="margin:0 0 10px">• дискомфорт, тяжесть и боли за грудиной или в эпигастрии дети описывают с трудом --- диагностические сложности;</p>
<p style="margin:0 0 10px">• потеря массы тела и отставание в развитии (дефицит массы почти у 2/3 детей), умеренная анемия у половины;</p>
<p style="margin:0 0 10px">• ночные аспирации → рецидивирующие пневмонии, бронхит, бронхоэктазы;</p>
<p style="margin:0 0 10px">• течение перемежающееся: периоды ухудшения сменяются благополучием; симптомы часто принимают за психологические проблемы, поэтому диагноз ставят поздно (И.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                              <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Обзорная рентгеноскопия</b> (стоя)     нет газового пузыря желудка, уровень жидкости в расширенном пищеводе</p>
<p style="margin:0 0 10px"><b>Рентген с барием</b> (густая взвесь)   задержка бария над кардией или тонкая струйка в желудок; <b>симптом проваливания</b> --- кардия вдруг раскрывается и поступает большая порция (достоверный признак функционального нарушения кардии; вызывают запиванием водой)</p>
<p style="margin:0 0 10px"><b>Эзофагоскопия</b> (обязательна)        признаки и степень эзофагита; <b>свободно проходит в желудок</b> --- значит, стеноза нет</p>
<p style="margin:0 0 10px">Манометрия                             у детей применяется ограниченно; в будущем может отличить ахалазию от кардиоспазма</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px">• стеноз пищевода --- врождённый, пептический (после рубцевания язвы), послеожоговый;</p>
<p style="margin:0 0 10px">• дивертикул пищевода;</p>
<p style="margin:0 0 10px">• гастроэзофагеальный рефлюкс (Р.);</p>

<p style="margin:0 0 10px">• кардиоспазм (Исаков, с. 225).</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: операция Геллера кардиомиотомия фундопликация лапароскопия</b></p>
<p style="margin:0 0 10px"><b>диспансеризация</b></p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Консервативные методы</b></h4></p>
<p style="margin:0 0 10px">• медикаментозная терапия, форсированное бужирование, кардиодилатация (у детей --- баллонная, пневмо- и гидродилататорами);</p>
<p style="margin:0 0 10px">• у детей они <b>не получили распространения</b> : эффект нестойкий (Исаков: непосредственное улучшение есть, но временное).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургическое лечение --- основной метод</b></h4></p>
<p style="margin:0 0 10px">• самый распространённый и радикальный вариант: <b>внеслизистая кардиомиотомия (операция Геллера)</b> в сочетании с <b>эзофагокардиофундопликацией</b> ; сейчас выполняют лапароскопически;</p>
<p style="margin:0 0 10px">• суть: рассекают продольный и циркулярный мышечные слои <b>до слизистой</b> на протяжении <b>5--7 см</b> ;</p>
<p style="margin:0 0 10px">• затем дно желудка подшивают к краям мышечного разреза: закрывается раневая поверхность и создаётся антирефлюксный механизм.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Возможные осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                                            <b>Комментарий</b></p>
<p style="margin:0 0 10px">Аспирационная пневмония                                   из-за регургитации и аспирации</p>
<p style="margin:0 0 10px">Несостоятельность швов, перфорация пищевода или желудка   ведут к медиастиниту и перитониту</p>
<p style="margin:0 0 10px">Медиастинит, перитонит, сепсис                            летальность при медиастините и сепсисе у детей достигает <b>75 %</b></p>
<p style="margin:0 0 10px">Кровотечение                                              исключить развитие осложнений полностью невозможно</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Прогноз и наблюдение</b></h4></p>
<p style="margin:0 0 10px">• после операции прогноз благоприятный; лечение не патогенетическое, поэтому <b>диспансерный учёт нужен и без рецидива</b> ;</p>
<p style="margin:0 0 10px">• после радикального лечения --- осмотр каждые <b>6--12 мес</b> ; нелеченых больных --- 3--4 раза в год (Исаков);</p>
<p style="margin:0 0 10px">• соблюдать режим труда и отдыха, периодически обследоваться.</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: ГЭР антирефлюксный барьер нижний пищеводный сфинктер</b></p>
<p style="margin:0 0 10px"><b>угол Гиса рефлюкс-эзофагит</b></p>
<p style="margin:0 0 10px"><b>ГЭР</b> --- полиэтиологическое заболевание, обусловленное ретроградным забросом желудочной кислоты и других повреждающих веществ из желудка и ДПК в пищевод. В структуре заболеваний пищевода у детей занимает <b>первое место</b> . Код МКБ-10: <b>K21</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Антирефлюксный барьер --- что не пускает содержимое назад</b></h4></p>
<p style="margin:0 0 10px"><b>Компонент</b>                                                  <b>Роль</b></p>
<p style="margin:0 0 10px"><b>Острый угол Гиса</b>                                           угол между дном желудка и пищеводом; в норме острый --- удваивает эффективность барьера; тупой при грыже пищеводного отверстия или после операции по поводу атрезии</p>
<p style="margin:0 0 10px"><b>Клапан Губарева (слизистая розетка)</b>                        складки слизистой при росте давления в желудке прижимаются друг к другу</p>
<p style="margin:0 0 10px"><b>Ножки диафрагмы</b>                                            сокращение правой ножки и мембрана Лаймера повышают давление в области НПС</p>
<p style="margin:0 0 10px"><b>Брюшной отдел пищевода</b>                                     в норме длиннее 2 см; чем длиннее, тем лучше замыкание</p>
<p style="margin:0 0 10px"><b>Нижний пищеводный сфинктер (НПС), зона высокого давления</b>   у новорождённых 1 см, у взрослых 2--4 см</p>
<p style="margin:0 0 10px"><b>Внутрибрюшное давление</b>                                     нужно 6--8 см вод. ст.; снижается при омфалоцеле, гастрошизисе, мышечной гипотонии</p>
<p style="margin:0 0 10px"><b>Клиренс пищевода и слюна</b>                                   самоочищение перистальтикой, ощелачивание слюной; тканевая резистентность слизистой</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Причины ГЭР</b></h4></p>
<p style="margin:0 0 10px">• <b>несостоятельность антирефлюксного барьера</b> : недостаточность НПС, частые эпизоды его транзиторного расслабления;</p>
<p style="margin:0 0 10px">• слабый клиренс пищевода и нейтрализация кислоты; патология желудка;</p>
<p style="margin:0 0 10px">• <b>замедленное опорожнение желудка</b> --- у детей один из основных факторов (до 60 %): растягивается кардия, чаще и дольше расслабляется НПС;</p>
<p style="margin:0 0 10px">• <b>функциональная</b> несостоятельность --- нарушение регуляции со стороны центральной и вегетативной нервной системы;</p>
<p style="margin:0 0 10px">• <b>органическая</b> --- грыжа пищеводного отверстия диафрагмы, врождённый короткий пищевод, химические ожоги, операции на пищеводе и желудке (после операции по поводу атрезии ГЭР у 18--35 % детей).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Слабый барьер, заброс содержимого</span><span>Долгий контакт с слизистой, слабый клиренс | Рефлюкс-эзофагит | Стеноз, метаплазия (Барретт)</span></div>
<p style="margin:0 0 10px"><b>Тип рефлюкса</b>                    <b>Повреждающий фактор</b></p>
<p style="margin:0 0 10px"><b>Кислый</b>                          соляная кислота + пепсин (активность максимальна при pH 1--2): денатурация белка, некроз слизистой, стенозирование</p>
<p style="margin:0 0 10px"><b>Щелочной</b>                        заброс из ДПК: желчь и ферменты поджелудочной железы; трипсин усиливает действие желчных кислот</p>
<p style="margin:0 0 10px"><b>Смешанный (кислотно-щелочной)</b>   самое тяжёлое повреждение; ведущая роль в формировании пептического стеноза и метаплазии</p>
<p style="margin:0 0 10px">• при длительном контакте: глубокие сливные язвы, повреждение мышц и нервов пищевода, накопление коллагена I типа, рубцы → <b>пептический стеноз</b> ;</p>
<p style="margin:0 0 10px">• <b>синдром Барретта</b> --- замещение плоского эпителия пищевода цилиндрическим желудочным; редко у детей, но возможно перерождение в аденокарциному, поэтому нужна ранняя диагностика.</p>`},
  {n:10, t:"Гастроэзофагеальный рефлюкс. Клиника и классификация", a:`<p style="margin:0 0 10px">*Клиника и физиологический / патологический рефлюкс --- Разумовский (с. 148, рис. 9.4--9.5), Исаков (с. 229, 233--234). Рабочие классификации эзофагита --- интернет (клинические рекомендации, МКБ).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: изжога срыгивание респираторные проявления эзофагит</b></p>
<p style="margin:0 0 10px"><b>классификация</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клинические проявления: три группы</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>                                <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Нарушения питания (пищеварительные)</b>   срыгивания и рвота (самый частый симптом у малышей; регургитация --- пассивное истечение, рвота --- активное), потеря массы тела, отставание в развитии</p>
<p style="margin:0 0 10px"><b>Поражение пищевода</b>                    изжога, отрыжка, боли в эпигастрии или за грудиной, дисфагия (у старших детей); при эрозивно-язвенном эзофагите --- рвота с кровью и анемия</p>
<p style="margin:0 0 10px"><b>Респираторные</b>                         аспирационная пневмония, бронхит, ларингит, синусит, отит, кашель, стридор, апноэ, удушье; у больных астмой --- бронхоспазм даже без аспирации</p>
<p style="margin:0 0 10px">• у <b>младенцев и дошкольников</b> преобладают срыгивание, рвота, потеря массы и внепищеводные проявления; <b>изжога и загрудинные боли</b> характерны для старших;</p>
<p style="margin:0 0 10px">• респираторные нарушения --- из-за микроаспирации и рефлекторного бронхо- или ларингоспазма (раздражение рецепторов блуждающих нервов);</p>
<p style="margin:0 0 10px">• аспирационная пневмония чаще у детей с неврологической патологией и дискоординацией глотания;</p>
<p style="margin:0 0 10px">• стеноз от рубцов: дисфагия, «пищеводная» рвота, быстрая потеря массы тела.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Физиологический и патологический рефлюкс (Исаков, с. 233--234)</b></h4></p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px">• по характеру: рефлюкс <b>кислый, щелочной, смешанный</b> (Исаков);</p>
<p style="margin:0 0 10px">• по течению: физиологический и патологический (таблица выше);</p>
<p style="margin:0 0 10px">• по причине барьера: функциональная и органическая несостоятельность (Разумовский);</p>
<p style="margin:0 0 10px">• <b>интернет:</b> российская рабочая классификация ГЭРБ у детей (Приворотский, Луппова, 2006): ГЭР без эзофагита; ГЭР с эзофагитом I--IV степени; внепищеводные проявления; осложнения;</p>
<p style="margin:0 0 10px">• <b>интернет:</b> эндоскопическая классификация эзофагита --- Лос-Анджелесская, степени A--D (от единичных эрозий до эрозий более 75 % окружности пищевода). Деление по Монреальскому консенсусу: эндоскопически негативная форма и эрозивный эзофагит.</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: рН-мониторинг рентген эндоскопия + биопсия манометрия</b></p>
<p style="margin:0 0 10px"><b>сцинтиграфия</b></p>

<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Клиника: срыгивание, изжога, кашель</span><span>Рентген и ФЭГДС с биопсией | Суточная рН-метрия --- «золотой стандарт» | Манометрия, сцинтиграфия по показаниям</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Методы диагностики</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                <b>Что даёт</b></p>
<p style="margin:0 0 10px"><b>Суточная рН-метрия</b>   «золотой» стандарт (И.: чувствительность 87--93 %, специфичность 93--97 %; Р.: достоверность 97--100 %). Рефлюкс --- падение рН в пищеводе <b>ниже 4,0</b> . Оценивают число рефлюксов, самый длинный эпизод, число эпизодов дольше 5 мин, <b>индекс рефлюкса</b> (норма ≤ 10 %). Показана при респираторных нарушениях: связь кашля, бронхоспазма, апноэ с рефлюксом</p>
<p style="margin:0 0 10px">Рентген с контрастом     в положении лёжа: заброс бария из желудка в пищевод, увеличение угла Гиса, колбовидное расширение желудка над диафрагмой, продольные складки слизистой желудка в нижнем отделе пищевода. Провокации: положение Тренделенбурга, питьё воды, давление на желудок. Информативность 60--86 %; хорошо видны <b>грыжа пищеводного отверстия</b> и <b>пептический стеноз</b> (уровень и протяжённость)</p>
<p style="margin:0 0 10px"><b>Эндоскопия</b> (ФЭГДС)   основной метод диагностики рефлюкс-эзофагита; видны эзофагит, зияние кардии, смещение кардии выше диафрагмы. Но у 40 % больных признаков нет, поэтому нужна <b>биопсия</b> (эзофагит, метаплазия)</p>
<p style="margin:0 0 10px">Манометрия               сократимость пищевода и НПС; давление в НПС 0--10 мм рт. ст. способствует ГЭР</p>
<p style="margin:0 0 10px">Сцинтиграфия             находит рефлюкс и лёгочную аспирацию (отсроченные снимки), оценивает опорожнение желудка (у здоровых через 1,5 ч в желудке остаётся менее 60 % РФП); лучевая нагрузка ниже, чем при рентгене</p>
<p style="margin:0 0 10px">УЗИ желудка              оценка эвакуации; перед фундопликацией, чтобы решить, нужна ли пилоропластика</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Состояние</b>                                                           <b>Чем отличается</b></p>
<p style="margin:0 0 10px"><b>Физиологический рефлюкс новорождённого</b>                              срыгивания есть, но масса растёт, эзофагита нет, давление НПС \\> 10 мм рт. ст., индекс ≤ 10 % (Исаков, с. 233)</p>
<p style="margin:0 0 10px"><b>Пилоростеноз, ахалазия, врождённый стеноз пищевода (по учебникам)</b>   другая картина рвоты (фонтаном; дисфагия с регургитацией), рентген с контрастом и ФЭГДС</p>
<p style="margin:0 0 10px"><b>Пищевая аллергия, инфекции ЖКТ (по учебникам)</b>                       нет связи с положением и рефлюксом по рН-метрии</p>
<p style="margin:0 0 10px"><b>Бронхиальная астма, рецидивирующие пневмонии другого генеза</b>         рН-метрия: приступ после эпизода рефлюкса говорит в пользу ГЭР</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: постуральная терапия ИПП, прокинетики фундопликация по Ниссену</b></p>
<p style="margin:0 0 10px"><b>бужирование метаплазия</b></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Консервативное лечение (Исаков)</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>                      <b>Что делают</b></p>
<p style="margin:0 0 10px">Постуральная терапия            у малышей головной конец кроватки поднят до <b>45°</b> ; после кормления держать вертикально 20--30 мин; старшим --- прогулки после еды, без наклонов</p>
<p style="margin:0 0 10px">Диета                           антирефлюксные смеси («Фрисовом», «Нутрилон-Антирефлюкс», «Лемолак»); старшим --- больше белка, меньше жира; исключить шоколад, цитрусовые соки, кофе, перец, томаты; в тяжёлых случаях --- парентеральное питание, кормление через дуоденальный зонд</p>
<p style="margin:0 0 10px">Антациды                        слабый раствор гидрокарбоната натрия, щелочные минеральные воды, алгелдрат + магния гидроксид, алюминия фосфат (уменьшают симптомы, но не число рефлюксов)</p>
<p style="margin:0 0 10px">Блокаторы Н2-рецепторов и ИПП   снижают секрецию кислоты и пепсина (ранитидин, фамотидин и др.); ингибиторы протонного насоса упомянуты у Разумовского</p>
<p style="margin:0 0 10px">Прокинетики                     метоклопрамид 0,5--1 мг/кг/сут в 2--3 приёма до еды, домперидон (меньше побочных, не действует на ЦНС); ускоряют клиренс и опорожнение желудка, повышают давление НПС</p>
<p style="margin:0 0 10px">Прокинетики и ИПП дают результат у 80 % больных, но после отмены терапии рецидив наступает у 100 % через 12 мес (Разумовский) --- отсюда нужда в операции. До 3 месяцев жизни консервативное лечение обычно эффективно, так как причина --- халазия кардии, «созревающая» со временем (Исаков).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Показания к операции</b></h4></p>
<p style="margin:0 0 10px">• неэффективность консервативной терапии;</p>
<p style="margin:0 0 10px">• отставание в физическом развитии;</p>
<p style="margin:0 0 10px">• эрозивно-язвенный рефлюкс-эзофагит;</p>
<p style="margin:0 0 10px">• пептический стеноз и метаплазия пищевода (синдром Барретта);</p>
<p style="margin:0 0 10px">• респираторные осложнения;</p>
<p style="margin:0 0 10px">• грыжа пищеводного отверстия диафрагмы.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургическое лечение</b></h4></p>
<p style="margin:0 0 10px">• самая распространённая и надёжная операция --- <b>фундопликация по Ниссену</b> : вокруг брюшного отдела пищевода из дна желудка формируют манжету 360° высотой до 2 см; делают лапароскопически; хорошие результаты более чем у 90 % детей;</p>
<p style="margin:0 0 10px">• <b>пептический стеноз</b> : бужирование на фоне лекарств, затем лапароскопическая фундопликация;</p>
<p style="margin:0 0 10px">• <b>метаплазия</b> : фундопликация и эндоскопическая электрокоагуляция очага (положительный результат в 100 %);</p>
<p style="margin:0 0 10px">• <b>протяжённый или рецидивирующий стеноз</b> : экстирпация пищевода и колоэзофагопластика (профилактика аденокарциномы);</p>
<p style="margin:0 0 10px">• при замедленной эвакуации из желудка --- решают вопрос о пилоропластике (Исаков).</p>

<p style="margin:0 0 10px"><b>Самой болезни</b>         рефлюкс-эзофагит, кровотечение и анемия, <b>пептический стеноз</b> , синдром Барретта (риск аденокарциномы), аспирационная пневмония, отставание в развитии</p>
<p style="margin:0 0 10px"><b>После операции (Р.)</b>   аспирационная пневмония, несостоятельность швов, перфорация пищевода, медиастинит, перфорация желудка, перитонит, сепсис, кровотечение; летальность при медиастините и сепсисе у детей до <b>75 %</b></p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: долевая эмфизема клапанный механизм аплазия хряща бронха</b></p>
<p style="margin:0 0 10px"><b>смещение средостения Q33.8</b></p>
<p style="margin:0 0 10px"><b>Врождённая лобарная (долевая) эмфизема</b> --- порок развития, при котором растягивается (вздувается) часть лёгкого, чаще одна доля. Другие названия: локализованная, обструктивная, гипертрофическая эмфизема (Исаков). Код МКБ-10: <b>Q33.8</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• примерно 1 на 100 000 родившихся (Р.);</p>
<p style="margin:0 0 10px">• чаще поражается <b>верхняя или средняя доля</b> ; нижняя доля --- крайне редко.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• истинные причины <b>не выяснены</b> ;</p>
<p style="margin:0 0 10px">• часть авторов связывает порок с <b>аплазией хрящевых элементов бронхов</b> , гипоплазией эластических волокон, гипоплазией гладких мышц терминальных и респираторных бронхиол и другими нарушениями структурных единиц лёгкого;</p>
<p style="margin:0 0 10px">• в основе всех пороков лёгких --- нарушение эмбриогенеза: рост бронхолёгочных почек на 4--6-й неделе (Исаков, с. 187).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Слабость стенки бронха (нет хряща, мало эластики)</span><span>Клапанный механизм: вдох есть, выдоха нет | Доля вздувается | Сдавление здорового лёгкого, смещение средостения</span></div>
<p style="margin:0 0 10px">• <b>дыхательная недостаточность</b> : 1) из дыхания выключен большой объём лёгочной ткани (порочная доля не работает, здоровые отделы коллабируют от сдавления), 2) шунтирование крови в коллабированной части лёгкого;</p>
<p style="margin:0 0 10px">• <b>сердечно-сосудистые нарушения</b> : повышение внутригрудного давления и смещение средостения;</p>
<p style="margin:0 0 10px">• в тяжёлых случаях дыхательная недостаточность начинается в первые часы жизни, а при малой выраженности порока симптомов нет годами.</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: декомпенсированная субкомпенсированная компенсированная</b></p>
<p style="margin:0 0 10px"><b>дыхательная асимметрия коробочный звук</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация по степени компенсации</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                  <b>Проявления</b>                                                                                                                                        <b>Тактика</b></p>
<p style="margin:0 0 10px"><b>Декомпенсирован ная</b>    порок проявляется <b>с рождения</b> : общий цианоз, одышка, дыхательная асимметрия, беспокойство, частый сухой кашель, приступы асфиксии при кормлении   неотложная операция</p>
<p style="margin:0 0 10px"><b>Субкомпенсирова нная</b>   промежуточная форма: умеренные дыхательные нарушения                                                                                                  плановая операция</p>
<p style="margin:0 0 10px"><b>Компенсированна я</b>      симптомы слабые, непостоянные, заметны лишь опытному врачу; поводом к обследованию часто становится воспаление в порочной доле                        плановая операция</p>
<p style="margin:0 0 10px">*Анатомически поражается одна доля --- чаще верхняя или средняя, редко нижняя (Р.).*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• ведущий симптом --- <b>дыхательная недостаточность</b> ; тяжесть и срок появления зависят от степени вздутия доли;</p>
<p style="margin:0 0 10px">• <b>дыхательная асимметрия</b> : вздутая половина грудной клетки отстаёт в акте дыхания;</p>
<p style="margin:0 0 10px">• при перкуссии <b>коробочный оттенок</b> звука, при аускультации дыхание на стороне поражения ослаблено;</p>
<p style="margin:0 0 10px">• выраженное <b>смещение средостения</b> (границы сердца смещены);</p>
<p style="margin:0 0 10px">• беспокойство, отказ от еды, приступы асфиксии при кормлении, частый сухой кашель;</p>
<p style="margin:0 0 10px">• сердечно-сосудистые нарушения от повышения внутригрудного давления;</p>
<p style="margin:0 0 10px">• при компенсированной форме --- рецидивирующие воспалительные заболевания лёгких в порочной доле.</p>
<p style="margin:0 0 10px"><b>Важно!</b> Пневмоторакс у новорождённого очень похож на декомпенсированную лобарную эмфизему. Различить помогает рентген (см. вопрос 15): при эмфиземе здоровые отделы лёгкого поджаты в виде треугольной тени ателектаза (Исаков); при пневмотораксе лёгкое поджато к корню (Разумовский).</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: рентген КТ радиоизотопное исследование бронхоскопия</b></p>
<p style="margin:0 0 10px"><b>пневмоторакс</b></p>

<p style="margin:0 0 10px"><b>Рентгенография</b> (решающий метод)   повышенная прозрачность вплоть до исчезновения лёгочного рисунка, смещение средостения (иногда «медиастинальная грыжа»), поджатие здоровых отделов --- <b>треугольная тень ателектаза</b></p>
<p style="margin:0 0 10px">КТ и радиоизотопное исследование      самые убедительные признаки локализации; на сцинтиграфии --- снижение перфузии в зоне порока</p>
<p style="margin:0 0 10px">Бронхоскопия                          выявляет внутрипросветную обструкцию, иногда решающая для диагноза</p>
<p style="margin:0 0 10px">Антенатальное УЗИ                     позволяет предсказать тяжёлое течение и спланировать ведение новорождённого</p>
<p style="margin:0 0 10px">МРТ, спиральная КТ                    в трудных случаях подтверждают сосудистую аномалию, сдавливающую бронх</p>

<p style="margin:0 0 10px"><b>Компенсированная</b>      плановая</p>
<p style="margin:0 0 10px">• сейчас, благодаря оптике высокого разрешения и эндосшивающим аппаратам, возможна <b>торакоскопическая лобэктомия</b> (Р.);</p>
<p style="margin:0 0 10px">• доступ --- торакотомия или торакоскопия; удаляют всю поражённую долю.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Вид</b>                             <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Болезни</b>                         тяжёлая дыхательная недостаточность в первые часы жизни, смещение средостения и сердечно-сосудистая недостаточность, воспаление в порочной доле</p>
<p style="margin:0 0 10px"><b>Операции (по общим учебникам)</b>   ателектаз, пневмония, пневмоторакс, кровотечение, бронхоплевральный свищ, эмпиема плевры</p>
<p style="margin:0 0 10px">*Строка про осложнения операции взята из общих учебников, в твоих книгах для этого порока она не расписана.*</p>`},
  {n:17, t:"Врождённые кисты лёгкого. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">*Исаков, с. 194--197 (рис. 4-25, 4-26); Разумовский, гл. 8 (с. 124--125). В книгах: солитарная, бронхогенная киста.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: бронхогенная киста солитарная киста напряжённая киста Q33.0</b></p>
<p style="margin:0 0 10px"><b>уровень жидкости</b></p>
<p style="margin:0 0 10px"><b>Врождённая киста лёгкого</b> --- порок развития с кистозным образованием, расположенным центрально (в прикорневой зоне) или ближе к периферии лёгкого. Другие названия: <b>бронхогенная</b> , бронхиальная киста. Код МКБ-10: <b>Q33.0</b> «Врождённая киста лёгкого».</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез</b></h4></p>
<p style="margin:0 0 10px">• в стенке кисты находят элементы бронха: хрящевые пластинки, цилиндрический эпителий, эластические и мышечные волокна --- отсюда название;</p>
<p style="margin:0 0 10px">• эмбриогенез связывают с образованием <b>добавочной гипоплазированной доли</b> (сегмента, субсегмента), которая полностью отделилась от бронхиального дерева или сохраняет с ним сообщение;</p>
<p style="margin:0 0 10px">• периферические кисты образуются на <b>6--16-й неделе</b> беременности и, в отличие от центральных, могут быть множественными и большими;</p>
<p style="margin:0 0 10px">• при сообщении с бронхом возможен <b>клапанный механизм</b> : воздух входит, выходит плохо --- киста напрягается.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Вариант</b>                                     <b>Проявления</b></p>
<p style="margin:0 0 10px">Малая киста без сообщения с бронхом             симптомов может не быть; часто <b>случайная рентгенологическая находка</b></p>
<p style="margin:0 0 10px">Киста сообщается с бронхом                      влажный кашель, сухие и влажные хрипы; на рентгене <b>уровень жидкости</b> в кисте</p>
<p style="margin:0 0 10px">Инфицированная киста                            лихорадка, беспокойство, снижение аппетита, интоксикация</p>
<p style="margin:0 0 10px">Большая центральная или <b>напряжённая</b> киста   дыхательные расстройства из-за сдавления лёгкого; ослабление дыхания, коробочный звук, смещение средостения в здоровую сторону; дыхательная и сердечно-сосудистая недостаточность --- как при напряжённом пневмотораксе; без смещения --- беспокойство, отказ от еды, рвота</p>
<p style="margin:0 0 10px">Киста с жидким содержимым                       редко даёт синдром напряжения; ослабление дыхания и притупление звука на стороне поражения</p>
<p style="margin:0 0 10px">Разумовский: большинство ВКАМ выявляют антенатально (УЗИ и МРТ плода); большая киста сдавливает здоровое лёгкое, смещает средостение, может вести к сердечной недостаточности и неиммунной водянке плода. Общий симптом --- дыхательная недостаточность: шумное дыхание, кашель, втяжение межрёберий, редко цианоз.</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: тип по Стокеру ВКАМ КТ с контрастом эхинококк</b></p>
<p style="margin:0 0 10px"><b>антенатальное УЗИ</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px"><b>Признак</b>                                                        <b>Виды</b></p>
<p style="margin:0 0 10px">По расположению (И.)                                               <b>центральная</b> (прикорневая) и <b>периферическая</b> киста; одиночная (солитарная) и множественная</p>
<p style="margin:0 0 10px">По сообщению с бронхом                                             не сообщается; сообщается с бронхом (уровень жидкости)</p>
<p style="margin:0 0 10px">По течению (И.)                                                    неосложнённая, <b>инфицированная</b> , <b>напряжённая</b> (клапанная)</p>
<p style="margin:0 0 10px"><b>Кистозно-аденоматозная мальформация (ВКАМ)</b> , по Стокеру (Р.)   <b>Тип I</b> --- одиночные или множественные кисты \\> 2 см, мерцательный эпителий; нередко бессимптомный. <b>Тип II</b> --- множество кист \\< 1 см, часты другие пороки. <b>Тип III</b> --- мелкие кисты между респираторными бронхиолами и альвеолами, слизистых клеток и хряща нет. Типы II--III дают дыхательный дистресс у новорождённых</p>
<p style="margin:0 0 10px">Кистозная гипоплазия (поликистоз) (И.)                             множественные тонкостенные воздушные полости в зоне порока, расширения субсегментарных бронхов или бронхиол</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px">• <b>антенатально</b> : УЗИ и МРТ плода, сроки 15--28 недель;</p>
<p style="margin:0 0 10px">• <b>обзорная рентгенограмма</b> : воздушное образование с чёткими контурами; уровень жидкости = частичное дренирование через бронх; гомогенное затенение с чёткими контурами --- повод для дифдиагностики;</p>
<p style="margin:0 0 10px">• рентген в двух проекциях, полипозиционная рентгеноскопия, <b>КТ</b> --- уточняют локализацию; <b>КТ с контрастированием</b> --- чувствительность 100 % и исключает питающий сосуд (секвестрацию);</p>
<p style="margin:0 0 10px">• при подозрении на эхинококк --- УЗИ печени, серологические реакции, эпидемиологический анамнез.</p>
