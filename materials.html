<p style="margin:0 0 10px">*Рис. 8.4 (Р., с. 126). КТ: ВКАМ правого лёгкого, 1 --- микрокистозные изменения нижней доли*   *Рис. 8.5. КТ, аксиальный срез: макрокистозные изменения нижних долей обоих лёгких*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                      <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Паразитарная (эхинококковая) киста</b>         гомогенное затенение с чёткими контурами; эндемичный район, серология, УЗИ печени</p>
<p style="margin:0 0 10px"><b>Опухоль лёгкого</b>                            сложно отличить от кисты --- одна из причин планового удаления</p>
<p style="margin:0 0 10px"><b>Напряжённая киста</b> и пневмоторакс           у кисты видны оболочки округлой формы; при пневмотораксе нет лёгочного рисунка</p>
<p style="margin:0 0 10px">Секвестрация лёгкого                           есть аномальный сосуд от аорты (КТ с контрастом)</p>
<p style="margin:0 0 10px">Абсцесс, бронхоэктазия, кистозная гипоплазия   при длительном воспалении трудно отличить; помогают бронхография и КТ</p>
<p style="margin:0 0 10px">Диафрагмальная грыжа                           в грудной полости петли кишки, контрастное исследование ЖКТ</p>`},
  {n:19, t:"Врождённые кисты лёгкого. Лечение и осложнения", a:`<p style="margin:0 0 10px">*Исаков, с. 197; Разумовский, гл. 8 (с. 125--126). Осложнения операции --- по общим учебникам.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: лобэктомия сегментэктомия торакоскопия плановая операция</b></p>
<p style="margin:0 0 10px"><b>напряжённая киста</b></p>
<p style="margin:0 0 10px"><b>Лечение хирургическое.</b> «Золотой стандарт» --- <b>лобэктомия</b> (Разумовский). Основной радикальный способ --- торакоскопическая лобэктомия.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Почему оперируют</b></h4></p>
<p style="margin:0 0 10px">• трудно отличить кисту от опухоли;</p>
<p style="margin:0 0 10px">• нельзя предсказать течение: рост кисты, нагноение, разрыв (Исаков) --- поэтому операция плановая даже при бессимптомной кисте.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Объём и сроки операции</b></h4></p>
<p style="margin:0 0 10px"><b>Ситуация</b>                                      <b>Тактика</b></p>
<p style="margin:0 0 10px">Обычная киста (И.)                                в плановом порядке: удаление кисты или участка лёгкого с кистой ( <b>сегмент- или лобэктомия</b> )</p>
<p style="margin:0 0 10px">ВКАМ (Р.)                                         лобэктомия, чаще торакоскопическая; атипичные резекции возможны, но есть минусы: <b>нерадикальность</b> , длительный пневмоторакс, трудно определить ориентиры у малышей</p>
<p style="margin:0 0 10px">Есть дыхательная недостаточность после рождения   <b>экстренная</b> операция</p>
<p style="margin:0 0 10px">Нет ДН или она компенсирована                     операция в возрасте <b>3--6 месяцев</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Вид</b>                         <b>Осложнения</b></p>
<p style="margin:0 0 10px">Самой кисты                     инфицирование и нагноение, разрыв, формирование <b>клапана и напряжённой кисты</b> (дыхательная и сердечно-сосудистая недостаточность), сдавление лёгкого; антенатально --- неиммунная водянка плода</p>
<p style="margin:0 0 10px">Операции (по общим учебникам)   нерадикальное удаление, длительный пневмоторакс (Р.), ателектаз, пневмония, кровотечение, эмпиема плевры</p>
<p style="margin:0 0 10px">*В книгах из осложнений операции прямо названы нерадикальность и длительный пневмоторакс при атипичных резекциях; остальное --- из общих учебников.*</p>`},
  {n:20, t:"Секвестрация лёгких. Классификация, диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*Разумовский, гл. 8 (с. 126--127, рис. 8.6); Исаков, с. 197--199 (рис. 4-27).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: секвестрация аномальный сосуд из аорты интралобарная</b></p>
<p style="margin:0 0 10px"><b>экстралобарная Q33.2</b></p>
<p style="margin:0 0 10px"><b>Секвестрация лёгкого</b> --- порок развития, при котором участок лёгочной ткани отделился от основного лёгкого, развивается самостоятельно и получает <b>кровь по аномальной артерии из аорты</b> или её ветвей. Код МКБ-10: <b>Q33.2</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px"><b>Критерий</b>             <b>Виды</b></p>
<p style="margin:0 0 10px">По расположению (Р.)     <b>интралобарная</b> (внутри доли, общая плевра; встречается чаще) и <b>экстралобарная</b> (своя плевра)</p>
<p style="margin:0 0 10px">То же (И.)               <b>внутрилёгочная</b> и <b>внелёгочная</b> секвестрация</p>
<p style="margin:0 0 10px">По сообщению с бронхом   сообщается с бронхиальным деревом или нет</p>
<p style="margin:0 0 10px">По строению (И.)         простая или кистозная гипоплазия (единичная киста или поликистоз)</p>
<p style="margin:0 0 10px">Кровоснабжение           обычно один питающий сосуд из грудной или брюшной аорты; венозный отток чаще в лёгочные вены (при интралобарной --- в 98 %)</p>
<p style="margin:0 0 10px">Локализация: чаще нижние отделы лёгких, в основном левого (нижнемедиальные отделы); описана и секвестрация в брюшной полости. Артериовенозное шунтирование --- особый вариант (Р.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиника</b></h4></p>
<p style="margin:0 0 10px">• зависит от типа и размеров участка и выраженности аномального кровотока;</p>
<p style="margin:0 0 10px">• у новорождённых и грудных --- нарастание дыхательной и сердечной недостаточности (сброс артериальной крови в секвестр), синдром обкрадывания;</p>
<p style="margin:0 0 10px">• при воспалении: лихорадка, симптомы лобарной пневмонии или бронхоэктатической болезни; без сообщения с бронхом может быть <b>случайной находкой</b> ;</p>
<p style="margin:0 0 10px">• возможно выявление во взрослом возрасте: сердечная недостаточность, кровохарканье.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px">• антенатальное УЗИ неспецифично; <b>допплер</b> показывает аномальный кровоток;</p>
<p style="margin:0 0 10px">• обзорный рентген малоинформативен: тень в нижних отделах левого гемиторакса (экстралобарная) или очаговая тень невентилируемого участка (интралобарная);</p>
<p style="margin:0 0 10px">• <b>КТ или МРТ с внутривенным контрастом</b> --- специфичны, показывают аномальный сосуд и позволяют не делать ангиографию; <b>аортография</b> --- прежде всего аномальный сосуд;</p>
<p style="margin:0 0 10px">• важно знать сосуд до операции: крупная артерия от аорты опасна при операции (Исаков).</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                     <b>Отличие</b></p>
<p style="margin:0 0 10px">Другие пороки (поликистоз, бронхоэктазия, солитарная киста)   очень похожи; решает выявление питающего сосуда</p>

<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Выявить аномальный сосуд (КТ/МРТ с контрастом, аортография)</span><span>Подготовка, лечение воспаления | Операция: секвестрэктомия или лобэктомия | Наблюдение</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Выбор операции (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                                                                                                                                                                                                                                                                   <b>Операция</b></p>
<p style="margin:0 0 10px"><b>Экстралобарная</b> секвестрация                                                                                                                                                                                                                                             <b>секвестрэктомия</b> --- удаление секвестра; выполняется торакоскопически</p>
<p style="margin:0 0 10px"><b>Интралобарная</b> секвестрация                                                                                                                                                                                                                                              торакоскопическая <b>лобэктомия</b> --- резекция поражённой доли лёгкого</p>
<p style="margin:0 0 10px">Крупный аномальный сосуд, шунт (артериовенозный шунт, венолобарный синдром)                                                                                                                                                                                                 тоже хирургическое лечение; особое внимание на сосуд</p>
<p style="margin:0 0 10px"><b>Важно!</b> Предоперационная диагностика важна: крупная артериальная ветвь, отходящая прямо от аорты в нетипичном месте, <b>опасна во время операции</b> (Исаков, с. 199). Поэтому питающий сосуд надо найти до операции (КТ или МРТ с внутривенным контрастом, аортография).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Когда</b>                             <b>Осложнения</b></p>
<p style="margin:0 0 10px">До операции (болезнь)                 нарастающая дыхательная и сердечная недостаточность из-за сброса артериальной крови в секвестр; синдром обкрадывания, сердечная и почечная недостаточность; инфицирование и воспаление (лобарная пневмония, бронхоэктазы); кровохарканье</p>
<p style="margin:0 0 10px">Во время операции                     кровотечение из крупного аномального сосуда, поэтому его важно найти заранее (Исаков)</p>
<p style="margin:0 0 10px">После операции (по общим учебникам)   ателектаз, пневмония, пневмоторакс, эмпиема плевры, бронхиальный свищ</p>
<p style="margin:0 0 10px">*Последняя строка --- из общих учебников: для секвестрации в книгах осложнения операции отдельно не перечислены.*</p>`},
  {n:22, t:"Агенезия, аплазия и гипоплазия лёгких. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">*Разумовский, гл. 8 (с. 120--122); Исаков, с. 187--191.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: агенезия аплазия гипоплазия тератогенные факторы</b></p>
<p style="margin:0 0 10px"><b>бронхолёгочные почки</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Определения</b></h4></p>
<p style="margin:0 0 10px"><b>Порок</b>        <b>Что это</b>                                                                                     <b>МКБ-10</b></p>
<p style="margin:0 0 10px"><b>Агенезия</b>     отсутствие лёгкого <b>вместе с главным бронхом</b>                                                 Q33.3</p>
<p style="margin:0 0 10px"><b>Аплазия</b>      отсутствие лёгкого или его части при наличии сформированного или <b>рудиментарного бронха</b>      ---</p>
<p style="margin:0 0 10px"><b>Гипоплазия</b>   недоразвитие <b>всех структурных элементов</b> : обоих лёгких, одного лёгкого, доли или сегмента   Q33.6</p>
<p style="margin:0 0 10px">При <b>двусторонней</b> агенезии или аплазии дети нежизнеспособны, при <b>односторонней</b> могут жить и нормально развиваться (Исаков, Разумовский).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• порок --- результат <b>нарушения эмбриогенеза</b> под влиянием тератогенных факторов;</p>
<p style="margin:0 0 10px">• есть две критические стадии: <b>3--6-я неделя</b> гестации (закладка трахеи, правого и левого лёгкого) и <b>6--16-я неделя</b> (быстрое деление бронхов);</p>
<p style="margin:0 0 10px">• чем раньше действует вредный фактор, тем тяжелее порок;</p>
<p style="margin:0 0 10px">• часто сочетаются с аномалиями из группы VATER (позвонки, атрезия ануса, ТПС, дисплазия лучевой кости и почек).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез: чем раньше остановка, тем тяжелее</b></h4></p>
<p style="margin:0 0 10px"><b>Срок остановки роста бронхолёгочных почек</b>   <b>Порок</b></p>
<p style="margin:0 0 10px">4-я неделя                                      <b>агенезия</b> одного или обоих лёгких</p>
<p style="margin:0 0 10px">5-я неделя                                      <b>аплазия</b> или глубокая гипоплазия лёгких</p>
<p style="margin:0 0 10px">5--6-я неделя                                   агенезия, аплазия или гипоплазия <b>долей</b></p>
<p style="margin:0 0 10px">• при <b>гипоплазии</b> форма зависит от стадии, на которой остановилась дифференцировка элементов лёгкого;</p>
<p style="margin:0 0 10px">• различают простую и кистозную гипоплазию (подробно --- вопрос 23);</p>
<p style="margin:0 0 10px">• недоразвитый участок плохо вентилируется и дренируется, в нём присоединяется гнойно-воспалительный процесс.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Порок</b>              <b>Проявления</b></p>
<p style="margin:0 0 10px">Агенезия и аплазия     очень сходны: <b>дыхательная асимметрия</b> , притупление перкуторного звука, отсутствие или значительное ослабление дыхания на стороне поражения, смещение средостения в больную сторону; со временем возможен симптом медиастинальной грыжи (часть лёгкого уходит на другую сторону)</p>
<p style="margin:0 0 10px">Простая гипоплазия     зависит от объёма поражения и воспаления: признаки дыхательной недостаточности, асимметрия грудной клетки, смещение средостения в сторону <b>уменьшенного</b> лёгкого, ослабление дыхания, хрипы. Главный фактор клиники --- гнойно-воспалительный процесс в недоразвитой части; повторные воспаления лёгкого одной локализации --- повод заподозрить порок</p>
<p style="margin:0 0 10px">Кистозная гипоплазия   интоксикация, влажный кашель с гнойной мокротой, дыхательная недостаточность</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: простая и кистозная бронхография ангиопульмонография</b></p>
<p style="margin:0 0 10px"><b>ателектаз новорождённых КТ</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px"><b>Деление</b>                                     <b>Виды</b></p>
<p style="margin:0 0 10px">По тяжести недоразвития                         <b>агенезия</b> → <b>аплазия</b> → <b>гипоплазия</b></p>
<p style="margin:0 0 10px">По объёму                                       двусторонняя или односторонняя; всё лёгкое, доля, сегмент</p>
<p style="margin:0 0 10px">Гипоплазия: простая                             равномерное уменьшение объёма лёгкого или доли, <b>сужение бронхов и сосудов</b></p>
<p style="margin:0 0 10px">Гипоплазия: кистозная (врождённый поликистоз)   на уровне субсегментарных бронхов или бронхиол --- расширения кистообразной формы разных размеров; на рентгене множественные тонкостенные воздушные полости, при воспалении --- уровни жидкости</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                           <b>Что находят</b></p>
<p style="margin:0 0 10px">Обзорная рентгенограмма             агенезия и аплазия: <b>тотальное затенение половины грудной полости</b> , смещение средостения в больную сторону. Гипоплазия: чаще повышение прозрачности или ателектаз доли (диагностика затруднена)</p>
<p style="margin:0 0 10px">Бронхоскопия                        выраженность и локализация воспаления, варианты отхождения бронхов, степень сужения устьев</p>
<p style="margin:0 0 10px">Бронхография (трахеобронхография)   деформация бронхиального дерева; при агенезии бронх на стороне порока <b>не определяется</b></p>
<p style="margin:0 0 10px">Ангиопульмонография                 значительное <b>обеднение кровотока</b> в участке гипоплазии</p>
<p style="margin:0 0 10px">Радиоизотопное сканирование         степень нарушения вентиляции и кровотока</p>
<p style="margin:0 0 10px">КТ лёгких                           изменение воздушности и структуры паренхимы</p>
<p style="margin:0 0 10px">Гистология                          окончательный диагноз «гипоплазия» ставят по гистологическому заключению (Р.)</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: сохранить лёгочную ткань лобэктомия при гипоплазии</b></p>
<p style="margin:0 0 10px"><b>диспансерное наблюдение</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Агенезия и аплазия</b></h4></p>
<p style="margin:0 0 10px">• хирургическое лечение, как правило, <b>не показано</b> ;</p>
<p style="margin:0 0 10px">• главная задача --- сохранить как можно больше дыхательных «единиц»;</p>
<p style="margin:0 0 10px">• цель хирурга --- <b>коррекция сочетанных пороков</b> (Разумовский).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Гипоплазия</b></h4></p>
<p style="margin:0 0 10px"><b>Ситуация</b>                                           <b>Лечение</b></p>
<p style="margin:0 0 10px">Хронический воспалительный процесс в пораженной доле   <b>оперативное</b> : удаление пораженной части лёгкого</p>
<p style="margin:0 0 10px">Перед операцией                                        максимально купировать острое воспаление --- меньше послеоперационных осложнений и лучше результаты (Исаков)</p>
<p style="margin:0 0 10px">Без воспаления, бессимптомная                          наблюдение</p>
<p style="margin:0 0 10px">• после операции: <b>постоянное диспансерное наблюдение</b> --- в оставшихся отделах лёгких могут быть менее выраженные нарушения, которые способны привести к воспалению;</p>
<p style="margin:0 0 10px">• окончательный диагноз гипоплазии подтверждают по гистологии удалённого препарата.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Вид</b>         <b>Осложнения</b></p>
<p style="margin:0 0 10px">Самого порока   повторные гнойно-воспалительные процессы в недоразвитом участке (пневмония, бронхоэктазы, нагноение полостей), дыхательная недостаточность, смещение средостения, сочетанные пороки (VATER-подобные)</p>
<p style="margin:0 0 10px">Операции        гнойно-воспалительные осложнения чаще, если воспаление не купировано до операции (Исаков); остальное --- как после любой резекции лёгкого (по общим учебникам: ателектаз, пневмоторакс, кровотечение)</p>`},
  {n:25, t:"Диафрагмальная грыжа. Этиология и патогенез", a:`<p style="margin:0 0 10px">*Разумовский, гл. 10 (с. 163--165, 166); Исаков, с. 249--253.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: перегородка диафрагмы грыжа Бохдалека внутригрудное напряжение</b></p>
<p style="margin:0 0 10px"><b>гипоплазия лёгкого лёгочная гипертензия</b></p>
<p style="margin:0 0 10px"><b>Диафрагмальная грыжа</b> --- перемещение органов брюшной полости в грудную клетку через дефект в диафрагме. В отличие от других грыж, <b>не всегда имеет грыжевой мешок</b> . Код МКБ-10: <b>Q79.0</b> (врождённая); K44 (приобретённая).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• у детей в основном <b>врождённые</b> грыжи --- пороки развития диафрагмы;</p>
<p style="margin:0 0 10px">• частота от 1 : 2000 до 1 : 4000 новорождённых (не учитывая мертворождённых с пороками диафрагмы);</p>
<p style="margin:0 0 10px">• часто сочетаются с другими пороками (до 50 %): ВПС, пороки ЦНС и ЖКТ, атрезия пищевода.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и эмбриогенез</b></h4></p>
<p style="margin:0 0 10px">• порок начинает формироваться на <b>4-й неделе</b> гестации, когда образуется зачаток перегородки между перикардиальной полостью и туловищем;</p>
<p style="margin:0 0 10px">• <b>истинные грыжи</b> (есть мешок из брюшины и плевры) --- следствие недоразвития мышц в отдельных участках грудобрюшной преграды;</p>
<p style="margin:0 0 10px">• <b>ложные грыжи</b> (сквозное отверстие, мешка нет) --- следствие недоразвития плевроперитонеальной перепонки или её разрыва от перерастяжения;</p>
<p style="margin:0 0 10px">• чаще <b>левосторонние</b> : на левой стороне плевроперитонеальное отверстие закрывается позже; ложные справа очень редки;</p>
<p style="margin:0 0 10px">• при ложной грыже дефект обычно щелевидный в рёберно-позвоночном отделе --- <b>грыжа Бохдалека</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Дефект диафрагмы</span><span>Органы живота уходят в грудь | Сдавление лёгкого, смещение сердца и средостения | Гипоплазия лёгкого, гипертензия, шунт справа налево</span></div>
<p style="margin:0 0 10px">• без мешка органы перемещаются без ограничения → <b>синдром внутригрудного напряжения</b> ;</p>
<p style="margin:0 0 10px">• слева в грудь уходят поперечная ободочная кишка, желудок, селезёнка, почка; справа --- печень;</p>
<p style="margin:0 0 10px">• недоразвитие лёгкого и нарушение малого круга → <b>лёгочная гипертензия</b> и шунт «справа налево» на уровне артериального протока или внутрисердечно; возможно шунтирование крови через фетальные коммуникации;</p>
<p style="margin:0 0 10px">• тяжесть зависит от объёма перемещённых органов, степени недоразвития лёгкого и сочетанных пороков; такие дети нередко рождаются мёртвыми или погибают вскоре после рождения.</p>`},
  {n:26, t:"Диафрагмальная грыжа. Клиника и классификация", a:`<p style="margin:0 0 10px">*Разумовский, гл. 10 (с. 164--167, рис. 10.1--10.6); Исаков, с. 250--254 (рис. 4-46).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: диафрагмально-плевральная парастернальная френоперикардиальная</b></p>
<p style="margin:0 0 10px"><b>грыжа пищеводного отверстия ладьевидный живот</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (по происхождению и локализации)</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>              <b>Виды</b></p>
<p style="margin:0 0 10px"><b>I. Врождённые</b>       1\\) <b>диафрагмально-плевральные</b> (ложные и истинные); 2) <b>парастернальные</b> ; 3) <b>френоперикардиальные</b> ; 4) <b>грыжи пищеводного отверстия</b> (эзофагеальные и параэзофагеальные)</p>
<p style="margin:0 0 10px"><b>II. Приобретённые</b>   <b>травматические</b> ; делятся на острые, хронические и ущемлённые</p>
<p style="margin:0 0 10px">Чаще всего у детей --- диафрагмально-плевральные и грыжи пищеводного отверстия; парастернальные редки (2--6 %), френоперикардиальные --- казуистика. Паралич и парез диафрагмы --- отдельная болезнь, в эту классификацию не входит.</p>

<p style="margin:0 0 10px">*Схемы из Разумовского, с. 164--165.*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Особенности отдельных видов</b></h4></p>
<p style="margin:0 0 10px"><b>Вид</b>                      <b>Особенности</b></p>
<p style="margin:0 0 10px">Диафрагмально-плевра льные   ложные --- щель в рёберно-позвоночном отделе (Бохдалека), мешка нет; истинные --- мешок; полное высокое стояние купола без мышечного слоя --- <b>релаксация диафрагмы</b></p>
<p style="margin:0 0 10px">Парастернальные              есть мешок; проходят через щель <b>Ларрея</b> в переднем отделе; справа от грудины --- грыжа <b>Морганьи</b> ; загрудинные и загрудинно-рёберные</p>
<p style="margin:0 0 10px">Френоперикардиальные         ложная, дефект в сухожильной части диафрагмы и перикарде; кишки уходят в перикард</p>
<p style="margin:0 0 10px">Пищеводного отверстия        <b>эзофагеальные</b> --- переход пищевода в желудок выше диафрагмы; <b>параэзофагеальные</b> --- желудок смещён вверх рядом с пищеводом; врождённые и приобретённые (после операций)</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Вид</b>                                                         <b>Клиника</b></p>
<p style="margin:0 0 10px"><b>Диафрагмально-плевра льные</b> (большие, ложные или истинные)   сразу после рождения или через часы --- <b>одышка и цианоз</b> («чугунного» цвета кожа), быстро растёт дыхательная недостаточность; асимметрия грудной клетки (выбухает больная сторона, не участвует в дыхании); <b>запавший ладьевидный живот</b> ; над грудью тимпанит, резко ослабленное или «мозаичное» дыхание; тоны сердца справа громче (смещено вправо); иногда слышна перистальтика и плеск</p>
<p style="margin:0 0 10px">Малые грыжи                                                     одышка и цианоз только при беспокойстве, крике, кормлении; возможны ущемление или заворот желудка у детей постарше (боль в животе, тошнота, рвота). Малая правосторонняя грыжа с печенью может не давать симптомов</p>
<p style="margin:0 0 10px">Парастернальные                                                 симптомы слабые, непостоянные: неприятные ощущения в эпигастрии, тошнота, рвота; примерно у половины жалоб нет; дыхательных и сердечно-сосудистых нарушений нет</p>
<p style="margin:0 0 10px">Пищеводного отверстия                                           эзофагеальные --- проявления <b>ГЭР</b> : дисфагия, изжога, рвота, бронхиты, аспирационные пневмонии, кровотечения при эзофагите; параэзофагеальные --- нарушение эвакуации, перегиб, заворот, иногда сдавление сердца</p>
<p style="margin:0 0 10px">Травматические                                                  шок и дыхательная недостаточность; возможно скрытое течение с болями в животе и одышкой после еды, явлениями непроходимости</p>`},
  {n:27, t:"Диафрагмальная грыжа. Диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*Разумовский, гл. 10 (с. 168--171, рис. 10.7--10.10); Исаков, с. 254--258 (рис. 4-47). Часть дифдиагностики --- по учебникам.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: рентген контраст ЖКТ УЗИ ЭхоКГ ФЭГДС</b></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Рентген груди и живота</span><span>Контраст ЖКТ, УЗИ, КТ | ЭхоКГ и генетик | ФЭГДС при ГПОД</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Методы диагностики</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                        <b>Что даёт</b></p>
<p style="margin:0 0 10px"><b>Рентгенография груди</b> (главный метод)         при диафрагмально-плевральных грыжах --- <b>кольцевидные просветления</b> над всей левой половиной груди, пятнистые, прозрачнее на периферии; <b>изменчивость</b> положения и формы просветлений на снимках в разное время; смещение сердца и средостения; у новорождённых тень коллабированного лёгкого иногда не видно</p>
<p style="margin:0 0 10px">Контрастное исследование ЖКТ (барий)             какой отдел кишки в груди (чаще поперечная ободочная --- ирригография); при трудной дифдиагностике; иногда достаточно зонда в желудок (он ещё и декомпрессирует желудок)</p>
<p style="margin:0 0 10px"><b>УЗИ</b>                                          информативность 80--90 %; <b>пренатальная</b> диагностика</p>
<p style="margin:0 0 10px">КТ                                               при затруднениях диагностики</p>
<p style="margin:0 0 10px">ЭхоКГ, консультация генетика                     пороки сердца (сопутствующие до 50 %), синдромальные формы</p>
<p style="margin:0 0 10px">ФЭГДС                                            при подозрении на грыжу пищеводного отверстия</p>
<p style="margin:0 0 10px">Рентгеноскопия пищевода и желудка с контрастом   самая показательная при ГПОД: параэзофагеальная --- желудок «песочные часы»; эзофагеальная --- тупой угол Гиса, переход выше диафрагмы</p>
<p style="margin:0 0 10px">![](media/image39.jpg){width="1.9079254155730534in" height="1.6877799650043745in"}   ![](media/image40.jpg){width="2.116519028871391in" height="1.6892093175853018in"}   ![](media/image41.jpg){width="1.731169072615923in" height="1.6910651793525808in"}   ![](media/image42.jpg){width="0.7898775153105861in" height="1.6935509623797025in"}</p>
<p style="margin:0 0 10px">*Рис. 10.7 (Р., с. 168). Ложная диафрагмально-плевральная грыжа*                     *Рис. 10.8 (Р., с. 169). Истинная диафрагмально-плевральная грыжа*                  *Рис. 10.9 (Р., с. 169). Эзофагеальная грыжа пищеводного отверстия*                 *Рис. 4-47 (И.). Рентген груди при диафрагм альной грыже*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Отличие ложной грыжи от истинной</b></h4></p>
<p style="margin:0 0 10px">• сложно, особенно когда плевральная полость заполнена кишкой; при <b>истинной</b> обычно прослеживается верхний контур грыжевого мешка;</p>
<p style="margin:0 0 10px">• справа при истинной грыже содержимое --- печень: плотная округлая тень, сливающаяся с тенью печени, похожая на опухоль лёгкого.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                             <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Поликистоз лёгкого</b> , <b>ограниченный пневмоторакс</b> (Р., с. 168)   для уточнения --- контрастирование ЖКТ: видно, какой отдел кишки в груди</p>
<p style="margin:0 0 10px"><b>Лобарная эмфизема</b> , напряжённая киста (Р., с. 124)                при диафрагмальной грыже в плевральной полости петли кишки; при кисте --- оболочки; при эмфиземе --- доля лёгкого</p>
<p style="margin:0 0 10px"><b>Паралич (релаксация) диафрагмы</b>                                    при параличе нет грыжевых ворот и мешка, мышечно-связочный компонент сохранён, купол высоко стоит, ровный полусферический контур</p>
<p style="margin:0 0 10px">Опухоль лёгкого (при правосторонней грыже)                            плотная округлая тень рядом с диафрагмой, связана с печенью</p>
<p style="margin:0 0 10px">Пневмония, абсцесс (по учебникам)                                     нет петель кишки в груди, воспалительные изменения</p>`},
  {n:28, t:"Диафрагмальная грыжа. Лечение и осложнения", a:`<p style="margin:0 0 10px">*Разумовский, гл. 10 (с. 170--172); Исаков, с. 258--261. Общие послеоперационные осложнения --- по учебникам.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: предоперационная подготовка ИВЛ с ПДКВ пластика диафрагмы</b></p>
<p style="margin:0 0 10px"><b>Ниссен пневмония</b></p>
<p style="margin:0 0 10px"><b>Лечение врождённых диафрагмальных грыж оперативное.</b> Исключение --- малые бессимптомные грыжи справа, где в грыже участок печени. Срочность зависит от выраженности дыхательной и сердечно-сосудистой недостаточности; сейчас предпочитают <b>стабилизировать состояние</b> ребёнка, а не оперировать экстренно (Разумовский).</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Подготовка (в роддоме)</span><span>ИВЛ, декомпрессия, лечение шунта | Операция: низведение органов, закрытие дефекта | Длительная ИВЛ, наблюдение</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Предоперационная подготовка (большие грыжи)</b></h4></p>
<p style="margin:0 0 10px">• <b>декомпрессия желудка</b> катетером;</p>
<p style="margin:0 0 10px">• назотрахеальная интубация, <b>ИВЛ с положительным давлением на выдохе --- не более 20 см вод. ст.</b> (иначе пневмоторакс);</p>
<p style="margin:0 0 10px">• устранение метаболических нарушений, инфузионная терапия, улучшение реологии крови;</p>
<p style="margin:0 0 10px">• препараты, снижающие давление в малом круге ( <b>допамин</b> );</p>
<p style="margin:0 0 10px">• такие дети плохо переносят транспортировку: терапию начинают <b>в родильном доме</b> и продолжают в специальной машине; оперируют после улучшения гомеостаза и устранения гипоксии.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Операция</b></h4></p>
<p style="margin:0 0 10px"><b>Грыжа</b>                                                <b>Что делают</b></p>
<p style="margin:0 0 10px">Ложная диафрагмально-пле вральная                        <b>низведение органов</b> в брюшную полость, <b>ушивание дефекта</b></p>
<p style="margin:0 0 10px">Истинная                                                 <b>пластика диафрагмы</b> ; при аплазии мышц и наличии только плевры --- пластический материал</p>
<p style="margin:0 0 10px">Грыжа пищеводного отверстия (показание --- сама грыжа)   лапароскопически: низведение желудка, <b>полное иссечение мешка</b> , ушивание ножек диафрагмы, подшивание пищевода к диафрагме, фундопликация (чаще <b>манжета Ниссена</b> ); при параэзофагеальной без симптомов --- в ясельном возрасте; при ГЭР без эффекта консервативной терапии 1 мес --- операция</p>
<p style="margin:0 0 10px">Травматическая                                           низведение выпавших органов и ушивание дефекта; при давней грыже трудно разделить спайки; рубцы краёв дефекта мешают закрытию</p>
<p style="margin:0 0 10px">Доступ --- через брюшную или грудную полость; важно, чтобы после операции не было высокого внутрибрюшного давления, поэтому во время операции проводят декомпрессию ЖКТ.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Послеоперационный период и осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                                                    <b>Комментарий (Разумовский)</b></p>
<p style="margin:0 0 10px">Тяжёлая дыхательная недостаточность, пневмонии                    из-за недоразвития лёгкого; поэтому нужна <b>длительная ИВЛ</b> до улучшения гемодинамики</p>
<p style="margin:0 0 10px"><b>Парез кишечника</b>                                               длительный, из-за роста внутрибрюшного давления</p>
<p style="margin:0 0 10px">Пневмоторакс                                                      при слишком высоком давлении на выдохе при ИВЛ</p>
<p style="margin:0 0 10px">Лёгочная гипертензия, сердечная недостаточность                   из-за гипоплазии лёгкого и шунта справа налево</p>
<p style="margin:0 0 10px">Рецидив грыжи (по учебникам); при ГПОД --- рецидивы со спайками   рецидивные грыжи ГПОД --- самые трудные</p>
<p style="margin:0 0 10px">Исход зависит от тяжести состояния при поступлении, степени гипоплазии лёгкого и качества транспортировки и подготовки. При тяжёлых нарушениях в первые сутки жизни прогноз более чем в 50 % неблагоприятный.</p>`},
  {n:29, t:"Пилоростеноз у детей. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">*Разумовский, гл. 31 (с. 473--474); Исаков, с. 325 (разд. 5.10).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: гипертрофия привратника рвота фонтаном метаболический алкалоз</b></p>
<p style="margin:0 0 10px"><b>Q40.0 мальчики 4 : 1</b></p>
<p style="margin:0 0 10px"><b>Врождённый гипертрофический пилоростеноз</b> --- врождённое сужение пилорического канала желудка (нарушение иннервации и гипертрофия циркулярного мышечного слоя привратника). Код МКБ-10: <b>Q40.0</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• самая частая причина непроходимости у детей первых месяцев; пик --- около <b>4-й недели</b> жизни, ранние формы --- с 2 недель; после 3 мес редок;</p>
<p style="margin:0 0 10px">• частота 0,5--3 на 1000 (И.); мальчиков в <b>4 раза</b> больше;</p>
<p style="margin:0 0 10px">• у братьев и сестёр больного --- в 30 раз чаще; входит в состав синдромов (Смита--Лемли--Опитца, Корнелии де Ланге).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• причина <b>неизвестна</b> , заболевание считают многофакторным (врождённая аномалия развития);</p>
<p style="margin:0 0 10px">• в пилорическом отделе отсутствует нейральная форма синтетазы оксида азота (Исаков);</p>
<p style="margin:0 0 10px">• есть генетические и нейрогуморальные факторы.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Утолщение стенки привратника за несколько дней</span><span>Сужение канала, рвота | Потеря хлора, калия, воды | Алкалоз, гипокалиемия, истощение</span></div>
<p style="margin:0 0 10px">• главное звено --- быстрое, за несколько дней, утолщение стенки привратника и постепенная обструкция его канала;</p>
<p style="margin:0 0 10px">• многократная рвота ведёт к <b>метаболическому алкалозу</b> (повышается бикарбонат), потеря натрия и жидкости усиливает его; <b>гипокалиемия</b> , гипохлоремия;</p>
<p style="margin:0 0 10px">• при выраженной гипокалиемии почки реабсорбируют бикарбонаты, и моча становится кислой --- <b>парадоксальная ацидурия</b> ;</p>
<p style="margin:0 0 10px">• невозможность кормления → дефицит массы тела, истощение, обезвоживание.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• первые симптомы --- с конца 2-й, начала 3-й недели жизни;</p>
<p style="margin:0 0 10px">• <b>рвота «фонтаном»</b> между кормлениями; рвотные массы застойные, объём больше разового кормления, створоженное молоко с кислым запахом; в начале возможна примесь жёлчи, затем рвота бесцветная; иногда примесь крови (эрозивный эзофагит, гастрит);</p>
<p style="margin:0 0 10px">• <b>классическая триада</b> : рвота фонтаном + видимая перистальтика желудка («песочные часы») + <b>пальпируемая «олива»</b> в правом подреберье;</p>
<p style="margin:0 0 10px">• ребёнок худеет, обезвоживается, реже мочится, стул скудный;</p>
<p style="margin:0 0 10px">• <b>острая форма</b> --- быстро, в течение недели, дегидратация II--III ст. и декомпенсированный алкалоз; <b>подострая</b> --- постепенно, срыгивания, затем рвота, гипотрофия, без грубых водно-электролитных нарушений (Исаков).</p>

<p style="margin:0 0 10px"><b>Лечение пилоростеноза оперативное.</b> Операция <b>не экстренная</b> : её делают после нормализации гидратации и уровня электролитов в крови (Разумовский). «Золотой стандарт» --- <b>внеслизистая пилоромиотомия по Фреде--Рамштедту</b> (Рамштедт, 1911).</p>

<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Предоперационная подготовка</span><span>Пилоромиотомия (открытая или лапароскопическая) | Кормление через 3--6 ч | Наблюдение 1 мес</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Предоперационная подготовка</b></h4></p>
<p style="margin:0 0 10px">• регидратация внутривенно: изотонические растворы глюкозы и хлорида натрия;</p>
<p style="margin:0 0 10px">• коррекция <b>гиповолемии, алкалоза, гипокалиемии</b> с контролем ионов крови (Исаков, Разумовский);</p>
<p style="margin:0 0 10px">• оперируют только после нормализации водно-электролитного баланса.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Операция</b></h4></p>
<p style="margin:0 0 10px">• <b>пилоромиотомия</b> : продольное рассечение гипертрофированной мышцы привратника до слизистой, слизистая выбухает в рану; устраняется анатомическое препятствие и восстанавливается проходимость привратника;</p>
<p style="margin:0 0 10px">• два подхода: <b>открытый</b> и <b>лапароскопический</b> ; послеоперационное лечение одинаково;</p>
<p style="margin:0 0 10px">• <b>консервативное лечение</b> (атропин внутривенно) --- только если операция невозможна из-за высокого риска анестезии; в обычной ситуации не рекомендуется.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Послеоперационное кормление</b></h4></p>
<p style="margin:0 0 10px"><b>Источник</b>      <b>Схема</b></p>
<p style="margin:0 0 10px"><b>Исаков</b>        через 3--6 ч --- 5 % раствор глюкозы, затем молоко по 5--10 мл каждые 2 ч; в следующие сутки +100 мл в день (по 10 мл на кормление); к 6-м суткам 60--70 мл каждые 3 ч, потом обычное кормление; до этого дефицит жидкости и электролитов восполняют инфузией</p>
<p style="margin:0 0 10px"><b>Разумовский</b>   внутривенные жидкости --- пока ребёнок не может получать нужный объём энтерально; начало кормления через 6 ч; раньше --- 20, 40, 60, 80 мл, сейчас чаще режим «ad libitum» (сколько хочет ребёнок)</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения (Разумовский, с. 476)</b></h4></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                      <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Перфорация слизистой оболочки</b>   во время операции, примерно в 5 % случаев; распознают осмотром выбухающей слизистой или <b>аэропробой</b> (50 мл воздуха через зонд); нераспознанная --- вплоть до смерти. Лечат ушиванием раны с ротацией привратника и повторной миотомией с противоположной стороны (или способом Hight: ушивание слизистой без реконструкции мышцы и миотомия на другой стороне)</p>
<p style="margin:0 0 10px"><b>Неполная миотомия</b>               мышца рассечена недостаточно (в основном антральная часть); подозревают, если рвота продолжается более 48 ч после операции</p>
<p style="margin:0 0 10px">Нарушение толерантности к пище      главная проблема послеоперационного периода</p>
<p style="margin:0 0 10px">Прогноз благоприятный. Наблюдение у детского хирурга в течение 1 месяца (Р.); дети нуждаются в диспансерном наблюдении для лечения гипотрофии, анемии и гиповитаминоза (И.).</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: незавершённый поворот тяжи Ледда заворот средней кишки</b></p>
<p style="margin:0 0 10px"><b>сдавление ДПК высокая непроходимость</b></p>
<p style="margin:0 0 10px"><b>Синдром Ледда</b> --- сочетание двух врождённых патологических состояний: <b>сдавления двенадцатиперстной кишки эмбриональными тяжами брюшины</b> и <b>врождённого заворота тонкой и правой половины толстой кишки</b> вследствие <b>незавершённого поворота кишечника</b> (Исаков, с. 317).</p>
<p style="margin:0 0 10px">*Описан хирургом W. Ladd в 1936 г. (по статьям из интернета). В русскоязычной литературе синдром Ледда часто используют как синоним мальротации с дуоденальной компрессией.*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и эмбриогенез</b></h4></p>
<p style="margin:0 0 10px">• порок --- нарушение <b>нормального поворота кишечника</b> в эмбриональном периоде (по учебникам: средняя кишка поворачивается вокруг верхней брыжеечной артерии против часовой стрелки);</p>
<p style="margin:0 0 10px">• при нормальном повороте <b>дуоденальный изгиб и слепая кишка встают на своё место</b> и брыжейка прикрепляется к задней стенке живота широко (Исаков, с. 315);</p>
<p style="margin:0 0 10px">• при пороке эти события не завершаются: слепая кишка остаётся высоко справа, от неё к правой стенке живота идут <b>эмбриональные тяжи брюшины (тяжи Ледда)</b> , проходящие через ДПК;</p>
<p style="margin:0 0 10px">• сочетается с другими пороками (в том числе дуоденальной мембраной) и с синдромальной патологией.</p>
<p style="margin:0 0 10px">*Частота: незавершённый поворот у 1 : 500 населения, но клинические проявления возникают значительно реже (интернет).* <b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Незавершённый поворот, высокая слепая кишка</span><span>Тяжи Ледда сдавливают ДПК | Брыжейка узкая, на «ножке» верхней брыжеечной артерии | Заворот, нарушение кровотока, некроз кишки</span></div>
<p style="margin:0 0 10px">• брыжейка средней кишки фиксирована <b>только в одной точке</b> и висит на верхней брыжеечной артерии; начало средней кишки (дуоденальный изгиб) и конец (илеоцекальный угол) лежат рядом в правой эпигастральной области (Исаков, с. 315);</p>
<p style="margin:0 0 10px">• поэтому опасность <b>заворота всей средней кишки</b> , как правило, по движению часовой стрелки;</p>
<p style="margin:0 0 10px">• при завороте нарушается кровообращение: <b>ишемия → некроз кишки → перитонит</b> ; сдавление ДПК тяжами даёт высокую частичную непроходимость;</p>
<p style="margin:0 0 10px">• у старших детей хроническая дуоденальная непроходимость связана ещё и с острым углом между аортой и верхней брыжеечной артерией (меньше 45--60°) (Разумовский, с. 207).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина (Исаков)</b></h4></p>
<p style="margin:0 0 10px"><b>Вариант</b>                                           <b>Проявления</b></p>
<p style="margin:0 0 10px">Острый заворот средней кишки                          симптомы <b>высокой странгуляционной непроходимости</b> ; чаще начинается остро на <b>3--4-е сутки</b> жизни: приступы беспокойства, частая <b>рвота с примесью жёлчи</b> ; живот несколько вздут в эпигастрии, болезнен; перистальтика усилена; стула нет, из прямой кишки --- кровь со слизью</p>
<p style="margin:0 0 10px">Синдром Ледда (заворот + сдавление ДПК)               клиника такая же, как при завороте средней кишки; тяжесть зависит от степени заворота и нарушения брыжеечного кровообращения</p>
<p style="margin:0 0 10px">Хроническая (интермиттирующая) форма (по учебникам)   рецидивирующая рвота с жёлчью, боли в животе, отставание в весе; у старших детей --- аорто-мезентериальная компрессия (Р., с. 207)</p>`},
  {n:33, t:"Синдром Ледда. Классификация, диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*Исаков, с. 313--317 (рис. 5-12, 5-13). Классификация и часть диагностики --- общие учебники (в Исакове нет).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: мальротация контраст через 30--40 мин УЗИ-допплер</b></p>
<p style="margin:0 0 10px"><b>симптом водоворота спастическая непроходимость</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (по учебникам)</b></h4></p>
<p style="margin:0 0 10px"><b>Деление</b>                 <b>Виды</b></p>
<p style="margin:0 0 10px">По варианту порока          незавершённый поворот ( <b>мальротация</b> ) с тяжами Ледда и высокой слепой кишкой; нарушение фиксации брыжейки (заворот средней кишки); обратный поворот</p>
<p style="margin:0 0 10px">По течению                  <b>острая</b> --- заворот с некрозом кишки (срочная операция); <b>хроническая</b> (интермиттирующая) --- повторная дуоденальная непроходимость</p>
<p style="margin:0 0 10px">По степени непроходимости   полная и частичная (по Исакову клиника зависит от степени заворота)</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                                                                                                       <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Обзорная рентгенограмма</b> стоя (Исаков, с. 315)                                                                               затемнение брюшной полости с <b>единственным уровнем жидкости</b> и газовым пузырём в желудке; в петлях кишки --- единичные пузырьки газа</p>
<p style="margin:0 0 10px"><b>Рентгеноконтрастное исследование</b> : два снимка стоя (прямой и боковой) через 30--40 мин после введения контраста в желудок   увеличенный желудок с уровнем; заполнены <b>желудок и начальный отдел ДПК</b> , скудно --- порочно расположенные <b>справа</b> петли начального отдела тощей кишки</p>
<p style="margin:0 0 10px">УЗИ с допплером (интернет и учебники)                                                                                           изменённое взаимоположение верхних брыжеечных сосудов, «симптом водоворота» при завороте брыжейки</p>

<p style="margin:0 0 10px">Паретическая непроходимость, НЭК, гастроэнтерит (по учебникам)   другая клиническая картина и рентген; нет рентгенологических признаков заворота средней кишки</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: операция Ледда деторсия рассечение тяжей лапароскопия</b></p>
<p style="margin:0 0 10px"><b>некроз кишки</b></p>
<p style="margin:0 0 10px"><b>Важно!</b> Из-за нарушения кровообращения при завороте велик риск <b>некроза кишки и перитонита</b> . Диагностика должна быть максимально быстрой, предоперационная подготовка занимает <b>2--3 ч</b> (Исаков, с. 317).</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Операция Ледда</b></h4></p>
<p style="margin:0 0 10px"><b>Этап</b>                     <b>Что делают</b></p>
<p style="margin:0 0 10px">1\\. Расправление заворота    вращением кишечника (Исаков): <b>деторсия</b> --- раскручивают кишку против часовой стрелки</p>
<p style="margin:0 0 10px">2\\. Рассечение тяжей Ледда   <b>рассекают эмбриональные тяжи брюшины</b> , сдавливающие ДПК (Исаков); ДПК освобождают</p>
<p style="margin:0 0 10px">3\\. По учебникам             расширяют основание брыжейки, укладывают тонкую кишку справа, толстую --- слева; выполняют аппендэктомию (чтобы потом не было атипичного аппендицита); оценивают жизнеспособность кишки; при некрозе --- резекция</p>
<p style="margin:0 0 10px">Доступ                       лапаротомия; в последние годы возможна <b>лапароскопическая</b> операция Ледда, в том числе у детей первых 6 месяцев без заворота (интернет, «Российский вестник детской хирургии»)</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Прогноз (Исаков, с. 318)</b></h4></p>
<p style="margin:0 0 10px">• <b>прогноз благоприятный</b> ; если операция выполнена технически правильно, <b>рецидива заворота не бывает</b> ;</p>
<p style="margin:0 0 10px">• но <b>незавершённый поворот кишечника остаётся</b> --- поэтому нужно помнить о возможной атипичной картине острого аппендицита.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения (по учебникам)</b></h4></p>
<p style="margin:0 0 10px"><b>Когда</b>        <b>Осложнения</b></p>
<p style="margin:0 0 10px">Болезни          заворот средней кишки → ишемия, некроз кишки, перитонит; дегидратация; высокая дуоденальная непроходимость</p>
<p style="margin:0 0 10px">После операции   синдром короткой кишки (при обширной резекции), перитонит, спаечная кишечная непроходимость, рецидив непроходимости; в систематическом обзоре (Трофимов, Мокрушина, 2021) описаны повторные операции из-за рецидива у 18 новорождённых</p>
<p style="margin:0 0 10px">*Из книги (Исаков) здесь взяты определение операции Ледда, сроки подготовки и прогноз. Детальные этапы операции и осложнения --- из общих учебников и интернета.*</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: муковисцидоз ген CFTR вязкий меконий</b></p>
<p style="margin:0 0 10px"><b>тонкокишечная непроходимость E84.1</b></p>
<p style="margin:0 0 10px"><b>Мекониальный илеус (МИ)</b> --- синдром тонкокишечной непроходимости, возникающий внутриутробно на сроке <b>20--24 недели</b> у плодов с кистозным фиброзом поджелудочной железы из-за нарушения формирования мекония: он становится очень вязким и закупоривает кишку, обычно на уровне средних отделов тонкой кишки. МИ --- <b>самое раннее проявление муковисцидоза</b> . Коды МКБ-10: <b>E84.1</b> (МИ), E84 (муковисцидоз), P78.0 (мекониевый перитонит).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• муковисцидоз у новорождённых: 0,24--0,50 %; МИ имеют <b>10--20 %</b> больных муковисцидозом;</p>
<p style="margin:0 0 10px">• мальчики и девочки болеют одинаково часто (И.);</p>
<p style="margin:0 0 10px">• МИ осложняется внутриутробной перфорацией и перитонитом почти в 50 % случаев (Исаков).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• муковисцидоз --- <b>наследственное</b> заболевание, передаётся <b>аутосомно-рецессивно</b> ;</p>
<p style="margin:0 0 10px">• описано около 1900 мутаций гена <b>CFTR</b> ; самая частая в Европе --- <b>F508del</b> ;</p>
<p style="margin:0 0 10px">• поражение поджелудочной железы начинается с середины II триместра беременности.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Мутация CFTR: вязкий секрет желёз</span><span>Протоки поджелудочной закупорены, мало ферментов | Меконий плотный, мало воды, много белка | Обтурация тонкой кишки, перфорация</span></div>
<p style="margin:0 0 10px">• обтурация протоков вязким секретом → <b>ацинарная атрофия</b> , снижение секреции, фиброз, жировое перерождение железы;</p>
<p style="margin:0 0 10px">• при снижении протеолитических ферментов <b>меконий уплотняется</b> : в нём мало воды, высокий уровень белков (преимущественно альбуминов), мало углеводов;</p>
<p style="margin:0 0 10px">• после рождения повышается уровень <b>натрия и хлора в поте</b> --- основа диагностики;</p>
<p style="margin:0 0 10px">• морфология (Исаков): растянутые гипертрофированные петли тощей и начала подвздошной кишки заполнены густым вязким меконием; дистальный отдел подвздошной кишки --- узкий тонкостенный сегмент, просвет закрыт плотными серыми слизистыми пробками; толстая кишка гипоплазирована.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• с рождения --- симптомы <b>низкой полной обтурационной непроходимости</b> ;</p>
<p style="margin:0 0 10px">• живот увеличен, через брюшную стенку контурируются растянутые кишечные петли тестоватой консистенции, перистальтика несколько усилена;</p>
<p style="margin:0 0 10px">• рвота чаще густым желудочным содержимым, слабо окрашенным жёлчью; застойное содержимое в желудке;</p>
<p style="margin:0 0 10px">• <b>меконий не отходит</b> ; при осмотре через прямую кишку ампула гипоплазирована, выделяются серые слизистые пробки;</p>
<p style="margin:0 0 10px">• при осложнённой форме (перфорация, мекониевый перитонит) --- тяжёлое состояние с первых минут жизни.</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: симптом мыльной пены микроколон потовый тест</b></p>
<p style="margin:0 0 10px"><b>неосложнённая и осложнённая болезнь Гиршпрунга</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                   <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Неосложнённая</b>           чаще в 1--2-е сутки жизни --- картина полной кишечной непроходимости (вздутый живот, застой в желудке, меконий не отходит); реже обструкция лёгкая --- справляются клизмами, похоже на <b>синдром мекониевой пробки</b></p>
<p style="margin:0 0 10px"><b>Осложнённая</b>             <b>перфорация</b> обтурированного отдела тонкой кишки (антенатально или рано после рождения) с <b>мекониевым перитонитом</b> : фиброадгезивный, кистозный, генерализованный (по Lorimer и Ellis, 1966)</p>
<p style="margin:0 0 10px">МИ без муковисцидоза (Р.)   у недоношенных (МИН), коды P76.1, P76.2</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                     <b>Что находят</b></p>
<p style="margin:0 0 10px">Антенатальное УЗИ (с 20--24-й недели)         расширенные петли кишки, гиперэхогенное содержимое, многоводие; жёлчный пузырь не виден; при осложнении --- кальцификаты, гиперэхогенный выпот, киста с густым содержимым</p>
<p style="margin:0 0 10px"><b>Обзорная рентгенограмма</b> стоя              расширенные петли с несколькими уровнями, неравномерная пневматизация, мало газа внизу; <b>симптом мыльной пены</b> (матового стекла) в правой нижней части --- газ внутри плотных масс; кальцификаты (Исаков)</p>
<p style="margin:0 0 10px"><b>Ирригография</b> (водорастворимый контраст)   <b>микроколон</b> (гипоплазированная толстая кишка); округлые плотные тени --- « <b>четки</b> » слизистых шариков в правой подвздошной области (патогномонично)</p>
<p style="margin:0 0 10px">УЗИ брюшной полости                           самое информативное при осложнениях: гиперэхогенный выпот, кальцификаты</p>
<p style="margin:0 0 10px"><b>Тесты на муковисцидоз</b>                     ДНК-анализ пятен крови на мажорные мутации; <b>потовый тест</b> (Гибсона и Кука): хлориды в поте в норме ≤ 40 ммоль/л, \\> 60 --- вероятен, \\> 100 --- муковисцидоз достоверен; копрограмма (нейтральный жир); неонатальный скрининг</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Консервативное лечение (метод Noblett, 1969)</b></h4></p>
<p style="margin:0 0 10px">• показано при <b>лёгкой</b> обструкции, когда препятствие близко к илеоцекальному углу и нет признаков осложнений;</p>
<p style="margin:0 0 10px">• <b>высокое промывание толстой кишки</b> водорастворимым контрастом (гастрографин, осмолярность 1900 мосмоль/л): он «вытягивает» воду в просвет и разжижает меконий; разведение 1 : 1 с изотоническим NaCl, под контролем рентгена или УЗИ, до баугиниевой заслонки и рефлюкса в подвздошную кишку;</p>
<p style="margin:0 0 10px">• затем клизма с изотоническим NaCl до 50 мл; через 2 ч можно повторить с ацетилцистеином; при сохранении непроходимости процедуру повторяют через сутки;</p>
<p style="margin:0 0 10px">• параллельно --- инфузия кристаллоидов (профилактика гиповолемии);</p>
<p style="margin:0 0 10px">• если контраст не достигает мекониевой пробки --- переходят к <b>операции</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургическое лечение</b></h4></p>
<p style="margin:0 0 10px">Показания: неосложнённый МИ, когда муковисцидоз выявлен во время операции, неэффективность консервативной терапии, осложнённые формы. <b>Цель --- вывести содержимое из просвета кишки.</b></p>
<p style="margin:0 0 10px"><b>Метод</b>                                               <b>Суть</b></p>
<p style="margin:0 0 10px">Двойная энтеростома на зоне перехода                    кишку пересекают в переходной зоне, в оба конца вводят трубки и промывают; выводят двойную стому. Недостаток --- второй этап (закрытие стомы) и большие потери жидкости</p>
<p style="margin:0 0 10px">Двойная илеостома по Микуличу                           когда разница в диаметрах приводящей и отводящей кишки небольшая</p>
<p style="margin:0 0 10px">Энтеротомия в переходной зоне, лаваж, ушивание          много недостатков: десерозирование, перфорация, рецидив МИ</p>
<p style="margin:0 0 10px"><b>Двухкатетерная илеостома по Rehbein</b> (1976)          при большой разнице в диаметрах; микроэнтеротомия на 5--7 см выше перехода, две трубки (Ch6 в суженный, Ch8--10 в расширенный отдел), промывание изотоническим NaCl (с 2-х суток --- с ацетилцистеином 4 г на 100 мл)</p>
<p style="margin:0 0 10px"><b>Т-образный анастомоз по Bishop--Koop</b> или Santulli   разгрузочный анастомоз «конец в бок»; через стому промывают, транзит восстанавливается быстро, потерь почти нет</p>
<p style="margin:0 0 10px">Дренирование приводящей кишки через аппендикостому      вариант разгрузки</p>
<p style="margin:0 0 10px">Исаков: энтеротомия растянутой петли, промывание кишки ферментными препаратами, разжижающими меконий, наложение энтероэнтероанастомоза; заместительная ферментная терапия после операции.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнённые формы (мекониевый перитонит)</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                                                                                          <b>Лечение</b></p>
<p style="margin:0 0 10px"><b>Фиброадгезивный</b> --- самая частая и лёгкая, кальцификаты, вторичная атрезия подвздошной кишки   срочная операция; при большой разнице диаметров --- Bishop--Koop или Rehbein; при близких диаметрах --- «конец в конец»</p>
<p style="margin:0 0 10px"><b>Кистозный</b> (псевдокиста с жидким меконием)                                                      разгрузочный лапароцентез, предоперационная подготовка; резекция изменённой кишки, двойная энтеро- или энтероколостома (закрывают через 4--6 нед)</p>
<p style="margin:0 0 10px"><b>Генерализованный</b> (меконий во всей брюшной полости)                                             то же + реанимационная помощь; тяжёлый иммунодефицит: антибиотики, иммунные и противогрибковые препараты, ферменты</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения и исходы</b></h4></p>
<p style="margin:0 0 10px">• при консервативной терапии: перфорация кишки, гиповолемия, электролитные нарушения, токсическое поражение печени;</p>
<p style="margin:0 0 10px">• после операции у детей с кистозной и генерализованной формами: <b>полиорганная недостаточность</b> , висцеральный кандидоз, грибковый менингоэнцефалит с исходом в окклюзионную гидроцефалию;</p>
<p style="margin:0 0 10px">• <b>эквивалент мекониевого илеуса</b> у детей старше 3 мес с муковисцидозом: вздутие, боли, запоры, непроходимость (в том числе инвагинация или заворот) --- чаще консервативное лечение: ферменты, высокие клизмы;</p>
<p style="margin:0 0 10px">• летальность в последние годы: при неосложнённой форме близка к 0, при осложнённой не более 5 %; <b>долгосрочный прогноз неблагоприятный</b> --- из-за муковисцидоза, нужно <b>пожизненное наблюдение</b> . Исаков: прогноз серьёзный.</p>`},
  {n:38, t:"Атрезия тонкого кишечника у новорождённых. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">*Разумовский, гл. 33 (с. 483--487); Исаков, с. 318.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: атрезия сосудистая теория тощая и подвздошная кишка</b></p>
<p style="margin:0 0 10px"><b>низкая непроходимость Q41</b></p>
<p style="margin:0 0 10px"><b>Атрезия тонкой кишки</b> --- врождённое отсутствие просвета кишечной трубки в результате нарушения эмбрионального развития; обструкция на одном или нескольких уровнях. <b>Стеноз</b> --- врождённое сужение (частичная окклюзия). Коды МКБ-10: <b>Q41.1</b> (тощая кишка), <b>Q41.2</b> (подвздошная), Q41.8, Q41.9.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• в среднем 1 случай на <b>5000 родов</b> ; атрезии и стенозы тощей кишки --- основные причины кишечной непроходимости у новорождённых;</p>
<p style="margin:0 0 10px">• по Исакову: атрезия <b>тощей</b> кишки --- 50 %, <b>подвздошной</b> --- 43 %, и той и другой --- 7 %;</p>
<p style="margin:0 0 10px">• часто сочетаются с гастрошизисом, омфалоцеле, пороками сердца и почек; около <b>11 %</b> детей с атрезией тонкой кишки страдают <b>муковисцидозом</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез (Разумовский)</b></h4></p>
<p style="margin:0 0 10px">• ЖКТ происходит из энтодермы; на 4-й неделе начинается формирование первичной кишки; теория нарушения реканализации существует;</p>
<p style="margin:0 0 10px">• <b>основная теория --- сосудистая</b> : большинство атрезий результат <b>локального пренатального нарушения кровообращения</b> кишечной трубки с ишемическим некрозом и образованием зоны сужения или обструкции;</p>
<p style="margin:0 0 10px">• доказательство: в меконии плода есть жёлчные пигменты, первичный волосяной покров и клетки кожного эпителия, проглоченные до возникновения препятствия;</p>
<p style="margin:0 0 10px">• сегментарное нарушение кровотока --- изолированная атрезия или стеноз; повторное действие сосудистого фактора --- <b>множественные атрезии</b> ; допускаются теории внутриутробного заворота и инвагинации.</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Нарушение кровотока в брыжейке</span><span>Ишемия и некроз сегмента | Сужение или отсутствие просвета | Растяжение приводящей кишки, дисфункция</span></div>
<p style="margin:0 0 10px">• <b>приводящий</b> сегмент гипертрофирован, с фиброзной дисплазией мышечного слоя (долго восстанавливается пассаж --- показание к резекции); <b>отводящий</b> --- функционально не развит, гипоплазия всех слоёв;</p>
<p style="margin:0 0 10px">• разница диаметров сегментов 1 : 4--1 : 5 и более;</p>
<p style="margin:0 0 10px">• у ≈ 10 % детей --- внутриутробный <b>мекониевый перитонит</b> : перфорация на верхушке слепого сегмента, мекониевая псевдокиста с кальцификатами;</p>
<p style="margin:0 0 10px">• в атрезии подвздошной кишки примерно у 50 % --- внутриутробный заворот и адгезивный перитонит (Исаков).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Признак</b>                          <b>Проявления</b></p>
<p style="margin:0 0 10px">Рвота                                самый ранний и постоянный симптом; при тощей и подвздошной кишке --- к <b>концу 1-х суток</b> ; обильная, с жёлчью (мембрана ниже фатерова сосочка), облегчения не приносит; чем выше блок, тем раньше рвота, чем ниже --- тем обильнее</p>
<p style="margin:0 0 10px">Меконий                              при полной обструкции <b>не отходит</b> ; при стенозе иногда малыми порциями; из прямой кишки --- только слизистые пробки (Исаков)</p>
<p style="margin:0 0 10px">Живот                                при атрезии тощей кишки вздутие незначительное; чем ниже уровень, тем больше растянута брюшная стенка; при низкой непроходимости --- значительно вздут, видны контуры петель и перистальтика; с рождения большой живот (заглатывание околоплодных вод); при неосложнённом течении мягкий и безболезненный</p>
<p style="margin:0 0 10px">Общее состояние                      дегидратация с <b>2-х суток</b> (сухость кожи, западение родничка, олигурия), интоксикация быстрее при низком уровне; беспокойство и «схватки» при странгуляции</p>
<p style="margin:0 0 10px">Осложнения при поздней диагностике   перфорация и перитонит</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: типы I--IV яблочная кожура микроколон множественные уровни</b></p>
<p style="margin:0 0 10px"><b>нитка жемчуга</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (Martin--Zerella, Grosfeld)</b></h4></p>
<p style="margin:0 0 10px"><b>Тип</b>    <b>Суть</b></p>
<p style="margin:0 0 10px"><b>I</b>      <b>внутрипросветная мембрана</b> , непрерывность кишечной трубки и целостность брыжейки сохранены; мембрана --- два слоя слизистой и подслизистый слой между ними</p>
<p style="margin:0 0 10px"><b>II</b>     два слепых сегмента, соединённых <b>фиброзным тяжом</b> ; проксимальный гипертрофирован на 10--20 см, отводящий гипоплазирован; длина кишки обычно сохранена</p>
<p style="margin:0 0 10px"><b>IIIa</b>   полное разобщение сегментов с <b>V-образным дефектом брыжейки</b> ; расширенный приводящий сегмент нередко некротизирован из-за заворота</p>
<p style="margin:0 0 10px"><b>IIIb</b>   полное разобщение с большим дефектом брыжейки --- « <b>яблочная кожура</b> », «рождественская ёлка»: короткий отводящий сегмент спиралью огибает единственный питающий сосуд; резкое укорочение кишки</p>
<p style="margin:0 0 10px"><b>IV</b>     <b>множественные атрезии</b> (комбинация вариантов)</p>

<p style="margin:0 0 10px"><b>С чем</b>                                                         <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Паретическая (динамическая) непроходимость</b> (Исаков, с. 319)   бывает у новорождённых при инфекционном токсикозе; перистальтика ослаблена; на рентгене множественные уровни, но газа больше, чем жидкости; <b>контраст проходит</b> --- механическая непроходимость исключается</p>
