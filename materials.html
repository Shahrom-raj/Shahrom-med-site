<p style="margin:0 0 10px">• при открытой операции --- широкий доступ Волковича--Дьяконова (по предположению об остром</p>
<p style="margin:0 0 10px">аппендиците)</p>
<p style="margin:0 0 10px">• случайно обнаруженный дивертикул при операции по поводу аппендицита, как правило, удаляют</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Послеоперационное ведение</b></h4></p>
<p style="margin:0 0 10px">• антибактериальная терапия при воспалении и перитоните; инфузионная терапия, ранняя активизация,</p>
<p style="margin:0 0 10px">возобновление питания по восстановлению пассажа</p>
<p style="margin:0 0 10px">• прогноз при своевременной операции благоприятный</p>`},
  {n:113, t:"Дивертикул Меккеля. Осложнения", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: кровотечение дивертикулит инвагинация странгуляция грыжа Литтре</b></p>
<p style="margin:0 0 10px">Осложнения возникают у части носителей; наибольшее значение имеют <b>кровотечение, воспаление (дивертикулит), инвагинация и другие виды кишечной непроходимости</b> .   |   ![](media/image131.jpg){width="2.8472222222222223in" height="3.7740693350831145in"}</p>
<p style="margin:0 0 10px">|   *Осложнения дивертикула подвздошной кишки: а --- кровотечение; б --- инвагинация; в --- странгуляционная непроходимость; г --- дивертикулит; д --- заворот дивертикула на длинной ножке; е --- заворот кишечника*</p>
<p style="margin:0 0 10px"><b>Осложнение</b>              <b>Механизм</b></p>
<p style="margin:0 0 10px"><b>Кровотечение</b>            эрозивно-язвенный процесс из-за секреции дистопированных клеток желудка/ПЖ</p>
<p style="margin:0 0 10px"><b>Дивертикулит</b>            катаральный, флегмонозный, гангренозный; перфорация и перитонит</p>
<p style="margin:0 0 10px"><b>Инвагинация</b>             внедрение дивертикула в просвет кишки → тонкокишечная инвагинация</p>
<p style="margin:0 0 10px"><b>Странгуляция</b>            перекрут петель вокруг дивертикула, припаянного к передней брюшной стенке; ущемление при фиксации к брыжейке</p>
<p style="margin:0 0 10px"><b>Заворот</b>                 дивертикула на длинной ножке; заворот кишечника</p>
<p style="margin:0 0 10px"><b>Обтурация</b>               частичная, затем полная кишечная непроходимость</p>
<p style="margin:0 0 10px"><b>Грыжа Литтре</b>            ущемление дивертикула в паховой грыже</p>
<p style="margin:0 0 10px"><b>Опухоли</b>                 исключительно редко</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Послеоперационные осложнения</b></h4></p>
<p style="margin:0 0 10px">• нагноение раны, несостоятельность швов кишки (при резекции с анастомозом), перитонит</p>
<p style="margin:0 0 10px">• спаечная кишечная непроходимость, инфильтраты и абсцессы брюшной полости</p>
<p style="margin:0 0 10px">• стеноз зоны резекции при неправильном формировании шва (поперечный шов при клиновидном</p>
<p style="margin:0 0 10px">иссечении)</p>`},
  {n:114, t:"Особенности течения перитонита у новорождённых и детей раннего возраста", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: низкие пластические свойства брюшины недоразвитие сальника быстрая интоксикация</b></p>
<p style="margin:0 0 10px"><b>преобладание общих симптомов</b></p>
<p style="margin:0 0 10px">Чем меньше ребёнок, тем <b>быстрее гнойный процесс распространяется на всю брюшину</b> : местные и отграниченные формы встречаются реже разлитых, течение быстрое и злокачественное. У детей до 3 лет защитные механизмы быстро становятся патологическими, а общие симптомы преобладают над местными.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Особенности и их следствия</b></h4></p>
<p style="margin:0 0 10px"><b>Особенность</b>                                                            <b>Следствие</b></p>
<p style="margin:0 0 10px"><b>Низкие пластические свойства брюшины, недоразвитие большого сальника</b>   нет отграничения очага → быстрое распространение гноя на все отделы брюшины</p>
<p style="margin:0 0 10px"><b>Относительно большая поверхность брюшины</b>                               интенсивная резорбция токсинов → быстрая интоксикация, дегидратация, расстройства циркуляции</p>
<p style="margin:0 0 10px"><b>Быстрый переход защитных реакций в патологические</b>                      гиповолемия, централизация кровообращения, ацидоз, парез кишечника развиваются в первые часы</p>
<p style="margin:0 0 10px"><b>Гипертермия 39--40 °С</b>                                                  быстрое истощение энергетических запасов, нарушение дыхания и кровообращения, надпочечниковая недостаточность</p>
<p style="margin:0 0 10px"><b>Преобладание общих симптомов над местными</b>                              живот может быть мало напряжён; ведущими бывают дыхательная недостаточность, вялость, отказ от еды, рвота</p>
<p style="margin:0 0 10px"><b>Быстрая перфорация при аппендиците</b>                                     аппендикулярный перитонит у детей первых 3 лет --- в 4--5 раз чаще, чем у старших</p>
<p style="margin:0 0 10px"><b>Применение антибиотиков до диагноза</b>                                    сглаживают боль и температуру, а воспаление брюшины прогрессирует --- их назначать нельзя</p>
<p style="margin:0 0 10px"><b>Тонкая брюшная стенка (новорождённые)</b>                                  отёк и гиперемия кожи живота, расширение подкожных вен; у мальчиков содержимое стекает через влагалищный отросток в мошонку</p>
<p style="margin:0 0 10px"><b>Причина (новорождённые)</b>                                                чаще всего перфорация полого органа --- ЯНЭК, пороки развития (до 84 %)</p>
<p style="margin:0 0 10px"><b>Стул</b>                                                                   в раннем возрасте чаще жидкий, иногда зелёный со слизью --- маскирует «кишечную инфекцию»</p>`},
  {n:115, t:"Перитонит у новорождённых. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: перфорация ЯНЭК перитонеальный шок симптом исчезновения печёночной тупости</b></p>
<p style="margin:0 0 10px"><b>Перитонит новорождённых</b> --- грозное осложнение различных патологических состояний: некротического энтероколита, пороков развития ЖКТ, острого аппендицита, ятрогенных перфораций полых органов и сепсиса. Причина чаще всего --- <b>перфорация стенки ЖКТ (84 %)</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и пути инфицирования</b></h4></p>
<p style="margin:0 0 10px"><b>Вариант</b>                                   <b>Причина и характер</b></p>
<p style="margin:0 0 10px"><b>Внутриутробные перфорации при пороках</b>     асептический адгезивный перитонит (мекониевый)</p>
<p style="margin:0 0 10px"><b>Постнатальные перфорации</b>                  разлитой фибринозно-гнойный, <b>каловый</b> перитонит</p>
<p style="margin:0 0 10px"><b>ЯНЭК (до 60 % постнатальных перфораций)</b>   на фоне интенсивной терапии возможен <b>отграниченный</b> перитонит</p>
<p style="margin:0 0 10px"><b>Неперфоративный (редко)</b>                   гематогенное, лимфогенное, трансплацентарное инфицирование; контактное --- при гнойном периартериите и перифлебите пупочных сосудов, абсцессах печени, флегмоне передней брюшной стенки</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b> Перфорация, выход содержимого и газа в брюшную полость</span><span><b>ШАГ 2</b> Резорбция токсинов, экссудация | <b>ШАГ 3</b> Гиповолемия, централизация кровообращения | <b>ШАГ 4</b> Парез кишки, высокое стояние диафрагмы, шок</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина (постнатальный перфоративный перитонит)</b></h4></p>
<p style="margin:0 0 10px">• острое начало с признаками <b>перитонеального шока</b> на 2--3-и сутки жизни</p>
<p style="margin:0 0 10px">• ребёнок вялый, стонет; кожа бледно-серая, акроцианоз; дыхание частое, поверхностное (высокое стояние</p>
<p style="margin:0 0 10px">диафрагмы); тоны сердца глухие</p>
<p style="margin:0 0 10px">• <b>живот резко вздут, напряжён и болезнен</b> , расширение подкожной венозной сети; гиперемия кожи</p>
<p style="margin:0 0 10px">нижних отделов живота и половых органов</p>
<p style="margin:0 0 10px">• перистальтика не выслушивается; над печенью <b>коробочный звук</b> --- симптом исчезновения печёночной</p>
<p style="margin:0 0 10px">тупости</p>
<p style="margin:0 0 10px">• постоянная рвота кишечным содержимым; стул и газы не отходят</p>
<p style="margin:0 0 10px">• у мальчиков --- отёк и гиперемия мошонки (содержимое через влагалищный отросток брюшины)</p>`},
  {n:116, t:"Перитонит у новорождённых. Классификация", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: перфоративный неперфоративный пренатальный фиброзно-гнойный мекониевый</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация перитонита у новорождённых</b></h4></p>
<p style="margin:0 0 10px"><b>Принцип деления</b>                  | <b>Формы</b></p>
<p style="margin:0 0 10px"><b>По этиологии --- перфоративный</b>   | -   некротический энтероколит (постгипоксический, септический)</p>
<p style="margin:0 0 10px">| -   пороки развития ЖКТ (сегментарный дефект мышечного слоя, атрезия,</p>
<p style="margin:0 0 10px">| заворот кишечника, мекониевый илеус, болезнь Гиршпрунга)</p>
<p style="margin:0 0 10px">| -   острый аппендицит</p>
<p style="margin:0 0 10px">| -   деструктивный холецистит и холангит</p>
<p style="margin:0 0 10px">| -   ятрогенные перфорации полых органов</p>
<p style="margin:0 0 10px"><b>По этиологии --- неперфоративный</b> | -   гематогенное и лимфогенное инфицирование брюшины</p>
<p style="margin:0 0 10px">| -   контактное инфицирование</p>
<p style="margin:0 0 10px"><b>По времени возникновения</b>         | пренатальный; постнатальный</p>
<p style="margin:0 0 10px"><b>По распространённости</b>            | разлитой; отграниченный</p>
<p style="margin:0 0 10px"><b>По характеру выпота</b>              | фиброадгезивный; фибринозно-гнойный; фибринозно-гнойный, каловый</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Мекониевый перитонит (внутриутробная перфорация кишки)</b></h4></p>
<p style="margin:0 0 10px">Классификация по распространённости (Lorimer, Ellis, 1966):</p>
<p style="margin:0 0 10px">• <b>фиброадгезивный</b> --- самая частая и лёгкая форма, кальцификаты в брюшной полости;</p>
<p style="margin:0 0 10px">• <b>кистозный</b> --- зона перфорации ограничена кистой;</p>
<p style="margin:0 0 10px">• <b>генерализованный</b> --- тяжёлая форма с распространением по брюшной полости.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Фазы течения (общая схема для перитонита)</b></h4></p>
<p style="margin:0 0 10px"><b>Фаза</b>                     <b>Характеристика</b></p>
<p style="margin:0 0 10px"><b>Реактивная</b>               преобладают местные проявления; организм справляется собственными резервами</p>
<p style="margin:0 0 10px"><b>Токсическая</b>              нарастают интоксикация, парез, циркуляторные расстройства, наложения фибрина на петлях кишки</p>
<p style="margin:0 0 10px"><b>Полиорганных нарушений</b>   паралич кишки, глубокие нарушения гемодинамики, обмена и функции органов; несостоятельность защитных сил</p>`},
  {n:117, t:"Перитонит у новорождённых. Диагностика и диф. диагностика", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: обзорная рентгенограмма пневмоперитонеум УЗИ лапароскопия</b></p>
<p style="margin:0 0 10px">![](media/image132.jpg){width="1.8749989063867016in" height="2.9826498250218725in"}</p>
<p style="margin:0 0 10px">*Обзорная рентгенограмма живота новорождённого: пневмоперитонеум --- значительное количество газа под куполами диафрагмы*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px">• <b>обзорная рентгенограмма брюшной полости</b> в вертикальном</p>
<p style="margin:0 0 10px">положении --- <b>серп воздуха под куполом диафрагмы</b> , значительный пневмоперитонеум --- достоверный признак перфоративного перитонита</p>
<p style="margin:0 0 10px">• <b>УЗИ</b> : свободная жидкость и газ, утолщение стенок и парез петель,</p>
<p style="margin:0 0 10px">утолщённая брюшина</p>
<p style="margin:0 0 10px">• <b>пункция брюшной полости</b> --- лечебно-диагностическая (газ,</p>
<p style="margin:0 0 10px">кишечное содержимое, гной)</p>
<p style="margin:0 0 10px">• лаборатория: лейкоцитоз или лейкопения со сдвигом, СРБ, ацидоз,</p>
<p style="margin:0 0 10px">электролиты (K, Na, Cl), гипоальбуминемия</p>
<p style="margin:0 0 10px">• в сложных случаях --- <b>диагностическая лапароскопия</b></p>
<p style="margin:0 0 10px">• пренатально: УЗИ плода (пороки брюшной полости, мекониевый</p>
<p style="margin:0 0 10px">перитонит)</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                             <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Механическая кишечная непроходимость (атрезия, заворот, МИ, болезнь Гиршпрунга)</b>   усиление видимой и слышимой перистальтики; при обтурации живот мягкий, при странгуляции болезненный и напряжённый; уровни жидкости без свободного газа</p>
<p style="margin:0 0 10px"><b>ЯНЭК без перфорации</b>                                                               вздутие, пневматоз стенки кишки, газ в воротной вене; нет пневмоперитонеума; местная болезненность в правой подвздошной области</p>
<p style="margin:0 0 10px"><b>Динамическая непроходимость (сепсис, пневмония, гипоксия)</b>                         перистальтика ослаблена; основное заболевание; нет свободного газа</p>
<p style="margin:0 0 10px"><b>Внутрибрюшное кровотечение</b>                                                        бледность, анемия, снижение Hb; жидкость при УЗИ/пункции --- кровь</p>
<p style="margin:0 0 10px"><b>Острый аппендицит</b>                                                                 редкий у новорождённых; локальная боль и напряжение в правой подвздошной области</p>
<p style="margin:0 0 10px"><b>Пневмония, пневмоторакс</b>                                                           вздутие живота «вторично»; рентгенография грудной клетки</p>`},
  {n:118, t:"Перитонит у новорождённых. Лечение и осложнения", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: пункция брюшной полости верхне-поперечная лапаротомия энтеростома</b></p>
<p style="margin:0 0 10px"><b>санация и дренирование</b></p>
<p style="margin:0 0 10px">Лечение перитонита новорождённых --- <b>только хирургическое</b> .</p>
<p style="margin:0 0 10px"><b>ШАГ 1</b> Пункция брюшной полости --- снижение давления           <b>ШАГ 4</b> Санация, дренаж, послеоперационная терапия</p>
<p style="margin:0 0 10px"><b>ШАГ 2 ШАГ 3</b> Предоперационная Лапаротомия, ревизия, подготовка 2--3 ч выведение петли</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этапы лечения</b></h4></p>
<p style="margin:0 0 10px"><b>Этап</b>                                   <b>Содержание</b></p>
<p style="margin:0 0 10px"><b>Пункция брюшной полости</b>                удаление газа и выпота, уменьшение внутрибрюшного давления (улучшает дыхание и гемодинамику)</p>
<p style="margin:0 0 10px"><b>Предоперационная подготовка (2--3 ч)</b>   ликвидация <b>централизации кровообращения</b> : инфузионная терапия, согревание, коррекция ацидоза и электролитов, антибиотики широкого спектра, при необходимости ИВЛ, декомпрессия желудка зондом</p>
<p style="margin:0 0 10px"><b>Операция</b>                               <b>верхне-поперечная лапаротомия</b> --- полноценная ревизия органов брюшной полости; <b>петлю кишки с перфорацией подшивают к брюшной стенке в виде кишечного свища (энтеростомы)</b></p>
<p style="margin:0 0 10px"><b>Санация</b>                                промывание брюшной полости растворами антисептиков, ушивание раны с оставлением дренажа</p>
<p style="margin:0 0 10px"><b>Послеоперационный период</b>               ИВЛ по показаниям, парентеральное питание, антибиотикотерапия, инфузионная и дезинтоксикационная терапия, уход за стомой, контроль анализов</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Когда</b>                      <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Заболевания</b>                перитонеальный шок, сепсис, полиорганная недостаточность; высокая летальность</p>
<p style="margin:0 0 10px"><b>Ранние послеоперационные</b>   нагноение раны, эвентрация, абсцессы брюшной полости, несостоятельность швов, осложнения энтеростомы (выпадение, ретракция, раздражение кожи), дыхательная недостаточность</p>
<p style="margin:0 0 10px"><b>Поздние</b>                    спаечная кишечная непроходимость, стеноз кишки, синдром короткой кишки</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Профилактика</b></h4></p>
<p style="margin:0 0 10px">Ранняя диагностика пороков развития и заболеваний, приводящих к перитониту (пренатальное УЗИ, наблюдение недоношенных и детей группы риска по ЯНЭК), значительно снижает частоту перитонита и улучшает результаты лечения.</p>`},
  {n:119, t:"Перитонит у детей. Этиология и патогенез", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: воспаление брюшины E. coli резорбция токсинов гиповолемия</b></p>
<p style="margin:0 0 10px"><b>метаболический ацидоз</b></p>
<p style="margin:0 0 10px"><b>Перитонит</b> --- воспаление брюшины с местными и общими проявлениями. Тяжесть течения у детей определяется не только местным процессом, но в большей степени <b>бурными и глубокими нарушениями гомеостаза</b> . Код МКБ-10: K65.0 (острый перитонит).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• чаще всего --- инфицирование со стороны органов брюшной полости; у детей старше 1 года</p>
<p style="margin:0 0 10px">перфоративные перитониты развиваются чаще всего на фоне <b>острого аппендицита</b> ; возможна перфорация воспалённого дивертикула Меккеля</p>
<p style="margin:0 0 10px">• другие причины: перфорация при ЯНЭК и пороках, непроходимость, травма, первичный пельвиоперитонит</p>
<p style="margin:0 0 10px">у девочек, гематогенный и криптогенный перитонит</p>
<p style="margin:0 0 10px">• возбудители --- <b>полимикробная</b> флора: E. coli (ведущая), энтерококки, клебсиелла, анаэробы (более чем у</p>
<p style="margin:0 0 10px">1/3 больных, при абсцессах --- почти в 100 %)</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px">По этиологии --- асептический и инфекционный; по пути заноса --- перфоративный, септический (контактный, гематогенный), криптогенный; по распространённости --- местный (отграниченный и неотграниченный) и общий (диффузный, разлитой).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b> Очаг инфекции, перфорация</span><span><b>ШАГ 2</b> Резорбция токсинов брюшиной, экссудация | <b>ШАГ 3</b> Гиповолемия, централизация, нарушение функции органов | <b>ШАГ 4</b> Ацидоз, электролитные сдвиги, парез кишки, шок</span></div>
<p style="margin:0 0 10px"><b>Звено</b>          <b>Что происходит</b></p>
<p style="margin:0 0 10px"><b>Резорбция</b>      поверхность брюшины у детей относительно больше; токсины и продукты распада в большом количестве попадают в кровь и лимфу</p>
<p style="margin:0 0 10px"><b>Гемодинамика</b>   вазодилатация → проницаемость сосудов, потеря воды и белка в брюшную полость, рвота, парез → ↓ОЦК, гемоконцентрация, спазм периферических сосудов и сосудов почек, тахикардия, ишемия почек</p>
<p style="margin:0 0 10px"><b>Температура</b>    39--40 °С и выше; в раннем возрасте --- быстрое истощение энергозапасов</p>
<p style="margin:0 0 10px"><b>Обмен</b>          расход гликогена, затем белков и жиров → недоокисленные продукты, <b>метаболический ацидоз</b> ; потери белка с экссудатом --- диспротеинемия</p>
<p style="margin:0 0 10px"><b>Электролиты</b>    потеря K, Na, Cl; внутриклеточный ацидоз при внеклеточном алкалозе (механизм Дэрроу) → слабость миокарда, парез ЖКТ</p>
<p style="margin:0 0 10px"><b>Иммунитет</b>      фазовые изменения: напряжение реактивности → дисбаланс → катастрофическое снижение иммунных реакций</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Фазы перитонита</b></h4></p>
<p style="margin:0 0 10px"><b>Реактивная</b> → <b>токсическая</b> → <b>фаза полиорганных (полиморфных) нарушений</b> . Фазность подтверждают изменения центральной гемодинамики, микроциркуляции и иммунологической реактивности.</p>`},
  {n:120, t:"Перитонит у детей. Клиника", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: боль, рвота, лихорадка симптом Щёткина--Блюмберга ректальное исследование</b></p>
<p style="margin:0 0 10px"><b>дыхательная недостаточность</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Анамнез и динамика</b></h4></p>
<p style="margin:0 0 10px">• боль в животе, рвота, повышение температуры; затем боль может несколько стихать, но <b>гипертермия</b></p>
<p style="margin:0 0 10px"><b>сохраняется</b></p>
<p style="margin:0 0 10px">• ухудшение связано с вовлечением брюшины при перфорации червеобразного отростка (или нарушении</p>
<p style="margin:0 0 10px">целостности инфильтрата)</p>
<p style="margin:0 0 10px">• антибиотики сглаживают боль и температуру, воспаление при этом прогрессирует</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Объективные данные</b></h4></p>
<p style="margin:0 0 10px"><b>Признак</b>                   <b>Находки</b></p>
<p style="margin:0 0 10px"><b>Общее состояние</b>           тяжёлое; кожа бледная, иногда мраморная; глаза блестящие; язык сухой с белым налётом</p>
<p style="margin:0 0 10px"><b>Дыхание, пульс</b>            одышка (тем сильнее, чем младше ребёнок); <b>расхождение пульса и температуры</b></p>
<p style="margin:0 0 10px"><b>Живот</b>                     вздут, резко болезнен во всех отделах; <b>защитное напряжение мышц</b> и <b>симптом Щёткина--Блюмберга</b> , наиболее выражены в правой подвздошной области</p>
<p style="margin:0 0 10px"><b>Прочее</b>                    тенезмы, частый жидкий стул малыми порциями, болезненное и частое мочеиспускание</p>
<p style="margin:0 0 10px"><b>Ректальное исследование</b>   резкая болезненность и <b>нависание стенки прямой кишки</b> (скопление гноя в малом тазу)</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Течение по фазам</b></h4></p>
<p style="margin:0 0 10px"><b>Фаза</b>                     <b>Клиническая картина</b></p>
<p style="margin:0 0 10px"><b>Реактивная</b>               местные симптомы выражены; лихорадка, тахикардия, рвота, симптомы раздражения брюшины; при операции --- обильный гной, петли вздуты и гиперемированы</p>
<p style="margin:0 0 10px"><b>Токсическая</b>              нарастает интоксикация и дегидратация; выраженный парез кишечника, вздутие, многократная рвота; фибрин на петлях</p>
<p style="margin:0 0 10px"><b>Полиорганных нарушений</b>   паралич кишки, шок, нарушения дыхания, кровообращения и функции почек; возможны отграниченные абсцессы</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Особенности у детей раннего возраста</b></h4></p>
<p style="margin:0 0 10px">• общее состояние первое время может нарушаться незначительно (компенсаторные возможности</p>
<p style="margin:0 0 10px">сердечно-сосудистой системы), на первый план выходит <b>дыхательная недостаточность</b> ; затем быстро наступает декомпенсация</p>
<p style="margin:0 0 10px">• чаще жидкий стул, иногда зелёный со слизью; общие симптомы преобладают над местными</p>
<p style="margin:0 0 10px"><b>ЭКЗАМЕНАЦИОННЫЕ ВОПРОСЫ · 5 КУРС</b></p>
<p style="margin:0 0 10px"><b>ДЕТСКАЯ ХИРУРГИЯ</b></p>
<p style="margin:0 0 10px">вопросы 121--131</p>
<p style="margin:0 0 10px">Перитонит · Инвагинация · Кишечная непроходимость</p>`},
  {n:121, t:"Перитонит у детей. Классификация", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: общий местный перфоративный криптогенный фазы</b></p>
<p style="margin:0 0 10px"><b>Перитонит</b> --- воспаление брюшины, сопровождающееся местными и общими проявлениями. У детей он составляет значительную долю острой хирургической патологии, а тяжесть определяется <b>нарушениями гомеостаза</b> , а не только местным процессом.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Общепринятая классификация</b></h4></p>
<p style="margin:0 0 10px"><b>Принцип</b>                            <b>Формы</b></p>
<p style="margin:0 0 10px"><b>По этиологии</b>                       асептический; инфекционный</p>
<p style="margin:0 0 10px"><b>По пути заноса</b>                     <b>перфоративный</b> ; септический (контактный, гематогенный); <b>криптогенный</b> (причину установить трудно)</p>
<p style="margin:0 0 10px"><b>По распространённости</b>              <b>местный</b> --- неограниченный и отграниченный; <b>общий</b> --- диффузный и разлитой</p>
<p style="margin:0 0 10px"><b>По стадийности (аппендикулярный)</b>   реактивная фаза → токсическая фаза → фаза полиорганных (полиморфных) нарушений</p>
<p style="margin:0 0 10px"><b>По характеру экссудата</b>             серозный, фибринозный, гнойный, каловый, желчный, геморрагический</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация аппендикулярного перитонита</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>                    <b>Формы</b></p>
<p style="margin:0 0 10px"><b>Местный отграниченный</b>     периаппендикулярный инфильтрат (рыхлый --- первые 2--3 сут; плотный); периаппендикулярный абсцесс</p>
<p style="margin:0 0 10px"><b>Местный неотграниченный</b>   воспаление в области очага с затёком экссудата в правый боковой канал и малый таз</p>
<p style="margin:0 0 10px"><b>Распространённый</b>          диффузный; разлитой; общий</p>
<p style="margin:0 0 10px">Практически наиболее целесообразно деление на <b>местный и разлитой</b> . Выход воспаления за пределы правого бокового канала считают разлитым перитонитом.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">По источнику (клинические формы у детей)</b></h4></p>
<p style="margin:0 0 10px">• <b>аппендикулярный</b> --- самая частая форма у детей старше 1 года (8--10 % всех случаев аппендицита)</p>
<p style="margin:0 0 10px">• перфорация дивертикула Меккеля, при непроходимости и травме; пельвиоперитонит у девочек</p>
<p style="margin:0 0 10px">(первичный)</p>
<p style="margin:0 0 10px">• <b>перитонит новорождённых</b> (ЯНЭК, пороки ЖКТ) и мекониевый; послеоперационный</p>`},
  {n:122, t:"Перитонит у детей. Диагностика и диф. диагностика", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: УЗИ КЩС гематокрит лапароскопия дифдиагностика</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                   <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Осмотр</b>                                  тяжёлое состояние, бледность, «мраморная» кожа, одышка, сухой язык, расхождение пульса и температуры; живот вздут, резко болезнен, защитное напряжение, симптом Щёткина--Блюмберга</p>
<p style="margin:0 0 10px"><b>Ректальное исследование</b>                 резкая болезненность и <b>нависание стенки прямой кишки</b></p>
<p style="margin:0 0 10px"><b>УЗИ (ценность близка к 100 %)</b>           свободная или отграниченная жидкость неоднородная, гиперэхогенная, с взвесью и нитями фибрина; расширенные петли со сниженной перистальтикой; утолщённые отёчные стенки; утолщённая брюшина; изменения червеобразного отростка, инфильтрат, абсцесс</p>
<p style="margin:0 0 10px"><b>КТ брюшной полости</b>                      в сложных случаях --- гнойные затёки и межкишечные абсцессы</p>
<p style="margin:0 0 10px"><b>Общий анализ крови</b>                      лейкоцитоз, нейтрофильный сдвиг, повышение СОЭ</p>
<p style="margin:0 0 10px"><b>КЩС и электролиты</b>                       ацидоз, гипокалиемия, гипонатриемия, повышение гематокрита</p>
<p style="margin:0 0 10px"><b>Биохимия</b>                                гипоальбуминемия, повышение СРБ (полиорганная недостаточность); определить группу крови и резус-фактор</p>
<p style="margin:0 0 10px"><b>Гематокрит</b>                              расчёт дефицита жидкости: V = (Ht больного − Ht нормы) / Ht нормы × k × масса тела; k = 1/3 (до 3 лет), 1/5 (старше 3 лет)</p>
<p style="margin:0 0 10px"><b>Лапароскопия, обзорная рентгенография</b>   в диагностически трудных случаях; газ под диафрагмой --- при перфорации полого органа</p>
<p style="margin:0 0 10px">У детей раннего возраста общее состояние вначале нарушено мало, на первый план выходит дыхательная недостаточность; антибиотики до установления причины боли <b>противопоказаны</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                  <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Острые кишечные инфекции</b>               жидкий стул (при перитоните у малышей тоже), но нет напряжения мышц и симптомов раздражения брюшины; ошибки чаще летом и осенью</p>
<p style="margin:0 0 10px"><b>Пневмония, острый отит</b>                 абдоминальный синдром при мягком животе без защитного напряжения; рентгенография грудной клетки, осмотр ЛОР-органов (боль при надавливании на козелок)</p>
<p style="margin:0 0 10px"><b>Первичный пельвиоперитонит у девочек</b>   девочки 3--7 лет; инфекция проникает через влагалище (эндосальпингит); часто локализованная форма с боль в правой подвздошной области, неотличимая от аппендицита; <b>лапароскопия</b> подтверждает диагноз («красный венчик» фимбрий), аппендэктомию не выполняют</p>
<p style="margin:0 0 10px"><b>Кишечная непроходимость, инвагинация</b>   схваткообразная боль, «светлые» промежутки, малиновое желе; УЗИ</p>
<p style="margin:0 0 10px"><b>Острый панкреатит, мезаденит</b>           амилаза, УЗИ; нет разлитого гнойного выпота</p>`},
  {n:123, t:"Перитонит у детей. Лечение и осложнения", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: предоперационная подготовка санация и дренирование антибиотики абсцессы</b></p>
<p style="margin:0 0 10px">Лечение складывается из трёх этапов: <b>предоперационная подготовка → операция → послеоперационный период</b> . Немедленная операция при выраженных нарушениях внутренней среды --- серьёзная ошибка.</p>
<p style="margin:0 0 10px"><b>ШАГ 1</b> Подготовка 2--3 ч: инфузия, антибиотики, зонд                                                                                                                                              <b>ШАГ 4</b> Контроль, УЗИ, профилактика осложнений</p>
<p style="margin:0 0 10px"><b>ШАГ 2 ШАГ 3</b> Операция: очаг, санация, Борьба с интоксикацией, дренаж парезом, инфекцией</p>
<p style="margin:0 0 10px"><b>Этап</b>                          <b>Содержание</b></p>
<p style="margin:0 0 10px"><b>Предоперационная подготовка</b>   борьба с гиповолемией и дегидратацией: декстраны, альбумин, раствор Рингера, плазма; антибиотики (цефалоспорин III поколения или ингибиторозащищённый пенициллин); зондирование и промывание желудка; борьба с гипертермией, судорогами, отёком лёгких</p>
<p style="margin:0 0 10px"><b>Сроки операции</b>                когда компенсированы гемодинамика, КЩС, водно-электролитный обмен, температура не выше субфебрильной</p>
<p style="margin:0 0 10px"><b>Реактивная фаза</b>               аппендэктомия, тщательная санация, рана ушивается, дренаж малого таза (силиконовый)</p>
<p style="margin:0 0 10px"><b>Токсическая фаза</b>              более тщательное промывание большим объёмом раствора; декомпрессия кишки (интубация, цекостома); обкалывание корня брыжейки 0,25 % прокаином; эпидуральная анестезия</p>
<p style="margin:0 0 10px"><b>Фаза полиорганных нарушений</b>   лапаростомия (рана не ушивается), дренаж малого таза, повторная операция через 2--3 сут</p>
<p style="margin:0 0 10px"><b>Лапароскопия</b>                  всё чаще метод выбора: меньше травматичность и системный воспалительный ответ</p>
<p style="margin:0 0 10px"><b>Послеоперационный период</b>      возвышенное положение 30°; комбинированные антибиотики (цефалоспорин + аминогликозид + метронидазол); коррекция КЩС и электролитов; стимуляция кишки (гипертонические клизмы со 2--3 сут, неостигмин, 10 % NaCl); УЗИ ежедневно со 2--3 сут</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px">• продолжающийся перитонит; <b>инфильтраты и абсцессы брюшной полости</b> (на 4--7-е сутки; около 15 %</p>
<p style="margin:0 0 10px">нагнаиваются); забрюшинные абсцессы</p>
<p style="margin:0 0 10px">• спаечная кишечная непроходимость; кишечные свищи (особенно тонкокишечные)</p>
<p style="margin:0 0 10px">• сепсис, полиорганная недостаточность, нагноение раны, эвентрация (общие осложнения тяжёлого</p>
<p style="margin:0 0 10px">перитонита)</p>`},
  {n:124, t:"Инвагинация кишечника. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: илеоцекальный угол малиновое желе пальпируемое образование грудной возраст</b></p>
<p style="margin:0 0 10px"><b>Инвагинация кишечника</b> (K56.1) --- внедрение одного отдела кишечника в просвет другого. Смешанная механическая непроходимость: сочетает <b>странгуляцию</b> (ущемление брыжейки) и <b>обтурацию</b> (закрытие просвета инвагинатом).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• 85--90 % случаев --- грудной возраст, чаще всего 4--9 месяцев; мальчики болеют в 2 раза чаще; чаще у</p>
<p style="margin:0 0 10px">упитанных детей</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• <b>идиопатическая</b> (у грудных): нарушение координации продольных и круговых мышц с преобладанием</p>
<p style="margin:0 0 10px">круговых --- при смене питания, раннем прикорме, воспалительных заболеваниях кишечника, энтеровирусной инфекции</p>
<p style="margin:0 0 10px">• анатомические особенности илеоцекального отдела у детей раннего возраста: недостаточность</p>
<p style="margin:0 0 10px">баугиниевой заслонки, подвижность толстой кишки</p>
<p style="margin:0 0 10px">• у старших детей --- чаще <b>органическая</b> : дивертикул Меккеля, эмбриональные тяжи, гиперплазия</p>
<p style="margin:0 0 10px">лимфоидной ткани, дупликатурные кисты, опухоли</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b> Некоординированная перистальтика</span><span><b>ШАГ 2</b> Внедрение: головка, шейка инвагината | <b>ШАГ 3</b> Ущемление брыжейки, венозный застой, отёк | <b>ШАГ 4</b> Кровь со слизью, некроз, перитонит</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Симптом</b>            <b>Особенности</b></p>
<p style="margin:0 0 10px"><b>Боль</b>               внезапно, на фоне здоровья; <b>приступообразная</b> ; ребёнок кричит, беспокоен, лицо страдальческое; затишье 5--10 мин («светлый промежуток») и снова приступ</p>
<p style="margin:0 0 10px"><b>Рвота</b>              вскоре после начала, рефлекторная; позже --- из-за полной непроходимости; в начале при слепоободочной форме --- лишь у 20--25 %</p>
<p style="margin:0 0 10px"><b>Стул</b>               вначале нормальный; через 5--6 ч и более --- <b>кровь со слизью («малиновое желе»)</b> , без каловых масс</p>
<p style="margin:0 0 10px"><b>Живот</b>              вне приступа мягкий, <b>не вздут</b> (первые 8--12 ч); справа от пупка, в правом подреберье --- мягкоэластичное малоболезненное опухолевидное образование</p>
<p style="margin:0 0 10px"><b>Температура</b>        нормальная; повышается лишь в запущенных случаях</p>
<p style="margin:0 0 10px"><b>Поздние признаки</b>   вздутие, напряжение и резкая болезненность живота при некрозе и перитоните; выпадение инвагината из ануса</p>
<p style="margin:0 0 10px">При слепоободочной и толстокишечной формах клиника менее выражена: нет резкого беспокойства, боли реже; крови может не быть (преобладает обтурация).</p>`},
  {n:125, t:"Инвагинация кишечника. Классификация, диагностика и диф. диагностика", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: илеоцекальная симптом мишени пневмоирригоскопия УЗИ гемоколит</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (по локализации)</b></h4></p>
<p style="margin:0 0 10px"><b>Вид</b>                      <b>Характеристика</b></p>
<p style="margin:0 0 10px"><b>Илеоцекальная (≈ 95 %)</b>   собирательное понятие для инвагинации в илеоцекальном углу; чаще всего <b>подвздошно-ободочная</b> (тонкая кишка через баугиниеву заслонку в восходящую); слепо-ободочная --- простая и сложная</p>
<p style="margin:0 0 10px"><b>Тонкокишечная</b>            тонко-тонкокишечная --- не более 5 %</p>
<p style="margin:0 0 10px"><b>Толстокишечная</b>           толсто-толстокишечная --- казуистическая редкость</p>
<p style="margin:0 0 10px">По происхождению: идиопатическая и органическая (на фоне дивертикула, опухоли, кисты); по течению --- острая и хроническая.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px">![](media/image133.jpg){width="1.4444444444444444in" height="1.3645669291338582in"}   |   ![](media/image134.jpg){width="1.444443350831146in" height="2.0797309711286087in"}</p>
<p style="margin:0 0 10px">*УЗИ при инвагинации кишечника: симптом мишени*                                       |   *Пневмоирригоскопия: инвагинат в области печёночного угла толстой кишки (стрелка)*</p>
<p style="margin:0 0 10px">• осмотр <b>между приступами</b> : живот мягкий, не вздут;</p>
<p style="margin:0 0 10px">опухолевидное образование справа</p>
<p style="margin:0 0 10px">• ректоабдоминальное исследование: инвагинат</p>
<p style="margin:0 0 10px">бимануально; на пальце --- кровь со слизью</p>
<p style="margin:0 0 10px">• <b>УЗИ</b> (ценность более 97 %): многослойная трубчатая</p>
<p style="margin:0 0 10px">структура, на поперечном срезе --- <b>мишень</b> ; оценка кровотока, лимфоузлов, аппендикса, дивертикула Меккеля</p>
<p style="margin:0 0 10px">• <b>пневмоирригоскопия</b> : круглая тень инвагината с</p>
<p style="margin:0 0 10px">чёткими контурами, чаще в области печёночного угла</p>
<p style="margin:0 0 10px">• обзорная рентгенография в первые сутки</p>
<p style="margin:0 0 10px">неинформативна (уровни --- только при длительности более суток)</p>
<p style="margin:0 0 10px">• КТ или МРТ --- при хронической инвагинации и</p>
<p style="margin:0 0 10px">подозрении на опухоль</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                         <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Острые кишечные инфекции, дизентерия (гемоколит)</b>              в кале много слизи и зелени, прожилки алой крови; при инвагинации --- кровь со слизью <b>без каловых масс</b></p>
<p style="margin:0 0 10px"><b>Отит</b>                                                          выраженное беспокойство у грудного ребёнка; боль при надавливании на козелок; УЗИ живота исключает инвагинацию</p>
<p style="margin:0 0 10px"><b>Другие острые заболевания грудного возраста с беспокойством</b>   аппендицит, колики, копростаз, кровотечение из дивертикула Меккеля (без боли)</p>`},
  {n:126, t:"Инвагинация кишечника. Лечение и осложнения", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: пневмоскопическая дезинвагинация лапароскопическая дезинвагинация резекция кишки</b></p>
<p style="margin:0 0 10px"><b>рецидив</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Консервативное лечение</b></h4></p>
<p style="margin:0 0 10px">• показано при раннем поступлении (первые 12--18 ч; от появления «малинового желе» --- не более 8--10 ч);</p>
<p style="margin:0 0 10px">определяют состояние ребёнка и сроки</p>
<p style="margin:0 0 10px">• <b>пневмоскопическая дезинвагинация</b> под адекватным обезболиванием (анальгетики, спазмолитики,</p>
<p style="margin:0 0 10px">наркоз); воздух под контролем давления, <b>не выше 120 мм вод. ст.</b> (риск перфорации)</p>
<p style="margin:0 0 10px">• критерий расправления --- поступление воздуха в дистальный отдел подвздошной кишки; при тенденции к</p>
<p style="margin:0 0 10px">смещению --- 2--3 повтора с перерывами 3--5 мин; газоотводная трубка</p>
<p style="margin:0 0 10px">• контроль --- пассаж бария (через 3--4 ч в начальных отделах толстой кишки); эффективность 65--70 %</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b> УЗИ, пневмоирригоскопия</span><span><b>ШАГ 2</b> Пневмоскопическая дезинвагинация | <b>ШАГ 3</b> Неэффективна --- лапароскопия | <b>ШАГ 4</b> Лапаротомия, резекция при некрозе</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургическое лечение</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                              <b>Показания и техника</b></p>
<p style="margin:0 0 10px"><b>Лапароскопическая дезинвагинация</b>   неэффективность консервативного лечения; попытка расправления при позднем поступлении; выяснение причины у детей старше 1 года; рецидив. <b>Противопоказание</b> --- подозрение на некроз и перитонит. Расправление двумя атравматичными зажимами с нагнетанием воздуха; радикально --- почти в 90 % случаев</p>
<p style="margin:0 0 10px"><b>Лапаротомия</b>                        поступление позже 12--24 ч, осложнённые формы: <b>ручная дезинвагинация</b> осторожным выдавливанием; при некрозе --- резекция в пределах здоровых тканей с анастомозом; при массивном некрозе, перфорации, перитоните или опухоли --- илеостома</p>
<p style="margin:0 0 10px"><b>Рецидивирующая инвагинация</b>         лапароскопия: баугинопластика, аппендэктомия, рассечение спаек, удаление дивертикула Меккеля</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения и прогноз</b></h4></p>
<p style="margin:0 0 10px">• нарушение кровоснабжения кишки (в том числе в зоне анастомоза) при неверной оценке</p>
<p style="margin:0 0 10px">микроциркуляции: контроль УЗ-допплерографией, при сомнении --- лапароскопия</p>
<p style="margin:0 0 10px">• некроз кишки, перфорация, перитонит; рецидив инвагинации; перфорация толстой кишки при избыточном</p>
<p style="margin:0 0 10px">давлении воздуха</p>
<p style="margin:0 0 10px">• при массивном некрозе --- синдром короткой кишки; при опухоли --- наблюдение у онколога</p>
<p style="margin:0 0 10px">• прогноз при идиопатической инвагинации благоприятный</p>`},
  {n:127, t:"Странгуляционная кишечная непроходимость у детей. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: странгуляция заворот узел ущемление нарушение кровообращения</b></p>
<p style="margin:0 0 10px"><b>Странгуляционная кишечная непроходимость</b> --- непроходимость, при которой сдавливаются кишка <b>вместе с брыжейкой, сосудами и нервами</b> : к механическому препятствию присоединяется острое нарушение кровообращения в стенке кишки. Протекает тяжелее обтурационной.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>          <b>Причины</b></p>
<p style="margin:0 0 10px"><b>Врождённые</b>      пороки развития: нарушение обратного развития желточного протока (тяжи, дивертикул Меккеля), мальротация, незавершённый поворот кишки, дефекты брыжейки, внутренние грыжи, удвоения</p>
<p style="margin:0 0 10px"><b>Приобретённые</b>   спайки и тяжи после операций и воспалений; ущемление кишки в грыжевых воротах; узлообразование; перекрут на фоне перистальтических нарушений</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Формы странгуляции</b></h4></p>
<p style="margin:0 0 10px">• <b>заворот</b> --- вращение кишки вокруг оси брыжейки (при мальротации --- заворот средней кишки)</p>
<p style="margin:0 0 10px">• <b>узлообразование</b> --- петли обвиваются одна вокруг другой; <b>ущемление</b> --- в спайках, тяже, грыже,</p>
<p style="margin:0 0 10px">отверстии брыжейки</p>
<p style="margin:0 0 10px">• особенно тяжело протекает заворот вокруг спаечного тяжа</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b> Сдавление брыжейки с сосудами</span><span><b>ШАГ 2</b> Венозный застой, отёк, транссудат | <b>ШАГ 3</b> Артериальная ишемия, некроз стенки | <b>ШАГ 4</b> Перфорация, перитонит, шок</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• внезапная <b>резкая схваткообразная, затем постоянная боль</b> ; ребёнок беспокоен, кричит, принимает</p>
<p style="margin:0 0 10px">вынужденное положение</p>
<p style="margin:0 0 10px">• <b>неукротимая рвота</b> (желчью, затем кишечным содержимым); задержка стула и газов</p>
<p style="margin:0 0 10px">• быстро нарастают токсикоз, эксикоз, нарушения гемодинамики --- вплоть до шока</p>
<p style="margin:0 0 10px">• живот асимметричный, вздут, <b>болезнен и напряжён</b> (при обтурации живот мягкий безболезненный);</p>
<p style="margin:0 0 10px">перистальтика вначале усилена, затем исчезает</p>
<p style="margin:0 0 10px">• при некрозе --- кровь в стуле, симптомы перитонита</p>`},
  {n:128, t:"Странгуляционная кишечная непроходимость у детей. Диагностика и диф. диагностика", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: обзорная рентгенограмма УЗИ уровни жидкости дифдиагностика</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                     <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Анамнез, осмотр</b>                           ранее перенесённые операции, воспаление, пороки; внезапная боль, рвота, задержка стула; рубцы на брюшной стенке; живот болезнен, напряжён, вздутие асимметрично</p>
<p style="margin:0 0 10px"><b>Обзорная рентгенография брюшной полости</b>   <b>множественные горизонтальные уровни жидкости</b> и газовые пузырьки разного калибра в петлях кишечника</p>
<p style="margin:0 0 10px"><b>Рентгеноконтрастное исследование</b>          динамический пассаж бария в сомнительных случаях; но занимает 8--9 ч, оптимальный момент операции может быть упущен, лучевая нагрузка</p>
<p style="margin:0 0 10px"><b>УЗИ</b>                                       расширенные и спавшиеся петли, <b>маятникообразная перистальтика</b> , инфильтраты; оценка кровотока в стенке тонкой кишки, возможность заворота</p>
<p style="margin:0 0 10px"><b>Диагностическая лапароскопия</b>              подтверждает странгуляцию, «симптом фиксации» петель; осторожно из-за риска перфорации раздутых петель</p>
<p style="margin:0 0 10px"><b>Лабораторно</b>                               гемоконцентрация, лейкоцитоз, нарушения КЩС и электролитов</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                          <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Обтурационная непроходимость</b>                   живот <b>мягкий, безболезненный</b> ; при странгуляции --- болезненный и напряжённый; нет раннего шока</p>
<p style="margin:0 0 10px"><b>Динамическая (паралитическая) непроходимость</b>   перистальтика ослаблена или отсутствует (при перитоните, внутрибрюшном кровотечении); основное заболевание; тотальное вздутие</p>
<p style="margin:0 0 10px"><b>Инвагинация</b>                                    приступы с «светлым промежутком», малиновое желе, опухоль справа, живот не вздут, УЗИ --- мишень</p>
<p style="margin:0 0 10px"><b>Острый аппендицит и перитонит</b>                  локальная боль и напряжение в правой подвздошной области; УЗИ отростка</p>
<p style="margin:0 0 10px"><b>Острый панкреатит, кишечные инфекции</b>           амилаза, УЗИ; диарея, лихорадка</p>`},
  {n:129, t:"Странгуляционная кишечная непроходимость у детей. Лечение и осложнения", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: экстренная операция деторсия резекция кишки лапароскопия</b></p>
<p style="margin:0 0 10px">Лечение <b>хирургическое и экстренное</b> : после краткой предоперационной подготовки (зонд, инфузия, антибиотики). Промедление ведёт к некрозу кишки: диагностическое ожидание недопустимо.</p>
<p style="margin:0 0 10px"><b>ШАГ 1</b> Краткая подготовка                                                                                                                                                                <b>ШАГ 4</b> Резекция, энтеростома по показаниям</p>
<p style="margin:0 0 10px"><b>ШАГ 2 ШАГ 3</b> Лапароскопия или Устранение причины, лапаротомия оценка кишки</p>
<p style="margin:0 0 10px"><b>Этап</b>                 <b>Содержание</b></p>
<p style="margin:0 0 10px"><b>Подготовка</b>           опорожнение желудка постоянным зондом, инфузионная терапия, коррекция гомеостаза, антибиотики</p>
<p style="margin:0 0 10px"><b>Доступ</b>               <b>лапароскопическое разделение спаек</b> --- метод выбора, если нет противопоказаний (резкое вздутие, плотный инфильтрат, «холодный» конгломерат, необратимые нарушения кровообращения, кишечные свищи в анамнезе); при открытой операции доступ с учётом прежних разрезов</p>
<p style="margin:0 0 10px"><b>Устранение причины</b>   деторсия заворота, <b>рассечение только спаек, вызывающих полную непроходимость</b> (максимальный консерватизм), освобождение ущемлённой петли</p>
<p style="margin:0 0 10px"><b>Оценка кишки</b>         цвет, перистальтика, пульсация сосудов брыжейки после согревания; сомнительные участки --- повторная оценка</p>
<p style="margin:0 0 10px"><b>Резекция</b>             при некрозе --- в пределах здоровых тканей, анастомоз «конец в конец»; при перитоните --- энтеростома</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px">• перфорация тонкой кишки, <b>кишечные свищи</b> (более 65 % закрываются самопроизвольно при</p>
<p style="margin:0 0 10px">консервативной тактике, если свищ ограничен)</p>
<p style="margin:0 0 10px">• некроз кишки, перитонит, шок, сепсис; несостоятельность анастомоза; нагноение раны</p>
<p style="margin:0 0 10px">• рецидив спаечной непроходимости (при тотальном спаечном процессе); синдром короткой кишки после</p>
<p style="margin:0 0 10px">обширной резекции</p>
<p style="margin:0 0 10px">• прогноз для жизни и здоровья в большинстве случаев благоприятный при своевременной операции</p>`},
  {n:130, t:"Обтурационная кишечная непроходимость у детей. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: копростаз каловые камни аскариды опухоль симптом ямки</b></p>
<p style="margin:0 0 10px"><b>Обтурационная кишечная непроходимость</b> --- закрытие просвета кишки изнутри (каловыми массами, опухолью, клубком аскарид) или снаружи <b>без нарушения кровоснабжения</b> брыжейки.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px"><b>Причина</b>                  <b>Комментарий</b></p>
<p style="margin:0 0 10px"><b>Копростаз (чаще всего)</b>   обтурация плотными каловыми массами в любом возрасте; вялая функция кишечника у ослабленных детей, порок развития мышц брюшной стенки с атонией; <b>мегадолихоколон, болезнь Гиршпрунга</b> , врождённое или рубцовое сужение прямой кишки; свищевая форма атрезии прямой кишки</p>
<p style="margin:0 0 10px"><b>Опухоль</b>                  реже; дифференцируют с каловыми камнями</p>
<p style="margin:0 0 10px"><b>Аскариды</b>                 клубок аскарид у илеоцекального клапана (сейчас практически не встречается)</p>
<p style="margin:0 0 10px"><b>Прочее</b>                   инородные тела, безоары, внутрипросветные образования, стриктуры, сдавление извне</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b> Препятствие в просвете кишки</span><span><b>ШАГ 2</b> Накопление содержимого и газов выше препятствия | <b>ШАГ 3</b> Растяжение кишки, застой, интоксикация | <b>ШАГ 4</b> Полная непроходимость, вздутие, рвота</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• в анамнезе всегда <b>ранние запоры</b> ; стул получают только после очистительной клизмы; неправильный</p>
<p style="margin:0 0 10px">режим питания и уход приводят к каловым завалам и камням</p>
<p style="margin:0 0 10px">• каловые камни нередко принимают за опухоль; при полной обтурации --- ухудшение состояния, нарастает</p>
<p style="margin:0 0 10px">вздутие живота, рвота, интоксикация</p>
<p style="margin:0 0 10px">• живот при обтурации <b>мягкий и безболезненный</b> (при странгуляции --- болезненный и напряжённый)</p>
<p style="margin:0 0 10px">• копростаз: опухолевидное образование <b>тестоватой консистенции</b> , симптом «ямки» при надавливании; на</p>
<p style="margin:0 0 10px">рентгенограмме контраст обтекает каловый камень со всех сторон</p>
<p style="margin:0 0 10px">• аскаридоз: схваткообразные боли, клубок в брюшной полости, рвота; при полной непроходимости ---</p>
<p style="margin:0 0 10px">вздутие</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Принципы лечения</b></h4></p>
<p style="margin:0 0 10px">• <b>повторные клизмы</b> с 1 % раствором NaCl комнатной температуры; при неэффективности --- сифонные до</p>
<p style="margin:0 0 10px">полного размывания каловых масс. Тёплый изотонический раствор недопустим: всасывание → интоксикация, отёк мозга</p>
<p style="margin:0 0 10px">• диета с клетчаткой, растительное или вазелиновое масло, послабляющие, электростимуляция кишечника</p>
<p style="margin:0 0 10px">(15--20 сеансов); после устранения копростаза --- рентгеноконтрастное исследование ЖКТ</p>
<p style="margin:0 0 10px">• при неэффективности консервативных мер (аскариды) --- операция, затем противоглистное лечение</p>`},
  {n:131, t:"Спаечная кишечная непроходимость у детей. Диагностика, диф. диагностика, лечение и осложнения", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: спайки ранняя и поздняя неостигмин лапароскопический адгезиолизис</b></p>
<p style="margin:0 0 10px"><b>Острая спаечная кишечная непроходимость (ОСКН)</b> (K56.5) --- 30--40 % всех видов непроходимости; до 60 % релапаротомий у детей. В 7--10 % спаечный процесс приобретает прогрессирующий, злокачественный характер (рецидивирующая СКН).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                                 <b>Клиника и данные обследования</b></p>
<p style="margin:0 0 10px"><b>Ранняя (до 4--5 нед после операции)</b>   острая и подострая; <b>спаечно-паретическая</b> в первые 5--7 сут; вялое течение, паретический компонент, приступообразная боль, многократная рвота, усиленные кишечные шумы, нет стула</p>
<p style="margin:0 0 10px"><b>Поздняя</b>                               острая, подострая и <b>сверхострая</b> ; внезапная резкая боль с «светлыми» промежутками, быстрый эксикоз и токсикоз, неукротимая рвота; особенно тяжело при завороте вокруг спаечного тяжа</p>
<p style="margin:0 0 10px"><b>Обзорная рентгенограмма</b>               уровни жидкости с газовыми пузырьками разного калибра; при сомнении --- динамическое контрастное исследование (в среднем 8--9 ч)</p>
<p style="margin:0 0 10px"><b>УЗИ</b>                                   спавшиеся и расширенные петли, маятникообразная перистальтика, инфильтраты; при паретической форме --- расширение всех петель, перистальтики нет</p>
<p style="margin:0 0 10px"><b>Лапароскопия</b>                          «симптом фиксации» петель; конгломерат, подпаянный к рубцу</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Послеоперационный парез кишечника</b> и динамическая непроходимость (перистальтики нет; нет «светлых» промежутков), <b>послеоперационный перитонит</b> , инфильтраты и абсцессы, инвагинация, острый аппендицит, обтурационная непроходимость (копростаз).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Лечение</b></h4></p>
<p style="margin:0 0 10px"><b>Вид</b>                                         <b>Содержание</b></p>
<p style="margin:0 0 10px"><b>Консервативное (подострая и острая формы)</b>   зонд, промывание желудка каждые 2--3 ч; в/в <b>10 % NaCl 2 мл на год жизни</b> , <b>неостигмин 0,05 % 0,1 мл на год жизни</b> ; сифонная клизма через 30--40 мин; контроль пассажа бария; коррекция гомеостаза. Купирует более чем у 50 %</p>
<p style="margin:0 0 10px"><b>Хирургическое</b>                               сверхострая форма и неэффективность консервативного лечения; <b>лапароскопическое разделение спаек</b> --- метод выбора; при открытой операции пересекают только спайки, вызывающие полную непроходимость</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px">• перфорация тонкой кишки, кишечные свищи (более 65 % закрываются самопроизвольно), перитонит,</p>
<p style="margin:0 0 10px">гангрена кишки</p>
<p style="margin:0 0 10px">• рецидив СКН; при тотальном спаечном процессе лечение осложнённых форм крайне трудное</p>
<p style="margin:0 0 10px">• профилактика: щадящие операции, лапароскопия, профилактика воспалительных осложнений, раннее</p>
<p style="margin:0 0 10px">восстановление функций кишечника</p>`},
  {n:132, t:"Особенности течения эпифизарного остеомиелита у новорождённых", a:`<p style="margin:0 0 10px">Разумовский, гл. 41 (с. 534--537, рис. 41.1--41.3); Исаков, 7.9.4 (с. 576--578, рис. 7-13).</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   метаэпифизарная зона · гнойный артрит · псевдопарез · ростковая зона · сцинтиграфия · УЗИ</p>
<p style="margin:0 0 10px"><b>Острый гематогенный остеомиелит новорождённых</b> --- острое воспалительное заболевание, поражающее костную ткань и синовиальные оболочки сустава (Р.). Эпифизарный (метаэпифизарный) остеомиелит чаще встречают у грудных детей, но <b>новорождённые страдают чаще</b> (И.); доля новорождённых и грудных с эпифизарным остеомиелитом растёт (Р., гл. 59).</p>
<p style="margin:0 0 10px">## <b>Почему течение особое: кровоснабжение (Р.)</b></p>
<p style="margin:0 0 10px">• очаг поражения --- <b>метаэпифизарная зона</b> длинных трубчатых костей и её ростковый хрящ;</p>
<p style="margin:0 0 10px">• у новорождённых внутрикостная диафизарная артерия вблизи эпифизов превращается в <b>густую</b></p>
<p style="margin:0 0 10px"><b>сосудистую сеть</b> , около ростковой пластинки образуются большие <b>венозные лакуны</b> --- ток крови там резко замедляется, и создаются условия для размножения микробов;</p>
<p style="margin:0 0 10px">• <b>эпифизы расположены внутри суставной сумки</b> ; вокруг каждого сустава --- сосудистое кольцо; эпифиз</p>
<p style="margin:0 0 10px">получает кровь из метафизарных сосудов и ветвей кольца, перфорирующих кость и заканчивающихся под суставным хрящом;</p>
<p style="margin:0 0 10px">• лишь <b>к концу 1-го года</b> связь метафиза с эпифизом нарушается, и ростковая пластинка становится</p>
<p style="margin:0 0 10px">барьером для инфекции --- поэтому до этого воспаление легко переходит на эпифиз и сустав (И.: «основные клинические симптомы обусловлены артритом»).</p>
<p style="margin:0 0 10px"><b>Вариант</b>                    <b>Особенности (Р., И.)</b></p>
<p style="margin:0 0 10px"><b>Первичный</b>                  на фоне видимого благополучия; возбудитель в <b>90 %</b> золотистый стафилококк (в тексте И. цифра нечитаема)</p>
<p style="margin:0 0 10px"><b>Вторичный</b>                  на фоне текущего инфекционного процесса (пупочного, лёгочного, кишечного сепсиса), несмотря на антибиотики или вскоре после их отмены; возбудитель --- кокки или <b>грамотрицательная флора</b> (клебсиелла, кишечная и синегнойная палочки, И.); часто один из септикопиемических очагов --- возможны множественные поражения</p>
<p style="margin:0 0 10px"><b>Пути и «предшественники»</b>   распространение всегда гематогенное; предшественники бактериемии --- пустулёзная инфекция, омфалит, катетеры в пупочные сосуды, интубация трахеи; в синовиальную сосудистую сеть → артрит</p>
<p style="margin:0 0 10px"><b>Условия возникновения</b>      одних бактерий мало: нужны <b>сосудистый стаз в венозных лакунах</b> , сгустки или некроз в синусоидах костного мозга, истощение пассивного иммунитета от матери, недостаточный синтез собственных антител и низкий титр иммуноглобулинов</p>

<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• <b>формы</b> (Р.): <b>местная</b> , <b>токсическая</b> , <b>септикопиемическая</b> ;</p>
<p style="margin:0 0 10px">• <b>начало</b> (И.) острое: повышение температуры, вялость, отказ от еды, <b>щажение конечности</b> (вынужденное</p>
<p style="margin:0 0 10px">положение);</p>
<p style="margin:0 0 10px">• <b>местная форма</b> (Р.): <b>псевдопарез</b> конечности (кисть или стопа свисают, движения резко ограничены),</p>
<p style="margin:0 0 10px">боль при активных и пассивных движениях, сглаженность контуров сустава; затем отёк мягких тканей, гиперемия (позже), местная гипертермия, болезненность над метафизом; пальпация и пассивные движения резко болезненны;</p>
<p style="margin:0 0 10px">• <b>токсическая форма</b> : резкое ухудшение общего состояния, инфекционный токсикоз;</p>
<p style="margin:0 0 10px">• <b>септикопиемическая</b> : флюктуация, флегмона мягких тканей, при патологическом переломе ---</p>
<p style="margin:0 0 10px">крепитация, гнойный артрит (сустав увеличен, кожа гиперемирована, флюктуация); тяжёлые формы --- клиника <b>септического шока</b> ;</p>
<p style="margin:0 0 10px">• <b>чаще поражаются</b> дистальный и проксимальный концы бедренной кости, проксимальные концы плечевой</p>
<p style="margin:0 0 10px">и большеберцовой костей (И.).</p>
<p style="margin:0 0 10px"><b>Метод</b>                              <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Рентгенография</b>                     признаки появляются поздно: Р. --- на <b>7--10-е сутки</b> (И. --- 8--10-й день): утолщение мягких тканей и надкостницы, расширение суставной щели, лёгкая периостальная реакция; очаги деструкции в метафизе --- лишь на <b>3-й неделе</b> ; при тяжёлых --- патологический вывих, зона деструкции больше половины ширины метафиза, линия патологического перелома; степень разрушения эпифиза и ростковой зоны оценивают только после появления ядра окостенения</p>
<p style="margin:0 0 10px"><b>УЗИ (наиболее информативно, Р.)</b>    жидкость в полости сустава (гнойный артрит), образования в мягких тканях (межмышечная флегмона); сравнивают здоровую и больную конечности</p>
<p style="margin:0 0 10px"><b>Радиоизотопная сцинтиграфия (Р.)</b>   по разнице накопления в симметричных суставах: до 30 % --- начальная фаза экссудации, до 55 % --- собственно экссудация, более 55 % --- гнойные осложнения</p>
<p style="margin:0 0 10px"><b>Пункция сустава (И.)</b>               гнойный выпот при артрите --- больше, чем при остеомиелите, где выпот сначала может быть реактивным</p>
<p style="margin:0 0 10px">## <b>Особенности диагностики</b></p>
<p style="margin:0 0 10px"><b>Гнойный артрит без остеомиелита</b> (И.): сустав увеличен значительнее, околосуставные ткани плотнее и отёчнее; на снимке --- расширение суставной щели за счёт выпота, контрактура раньше и резче; при правильном лечении проходит без функциональных последствий; при поздней диагностике переходит на суставные поверхности (остеоартрит, поверхности выглядят «изъеденными»).</p>

<p style="margin:0 0 10px">## <b>Главные особенности течения</b></p>
<p style="margin:0 0 10px">• процесс быстро переходит на ростковую зону, эпифиз и сустав: <b>артрит --- ведущий синдром</b> , нередко</p>
<p style="margin:0 0 10px">патологический вывих;</p>
<p style="margin:0 0 10px">• морфологически преобладают <b>некротические процессы</b> (гибель и рассасывание кости метафиза,</p>
<p style="margin:0 0 10px">повреждение ростковой зоны и суставных поверхностей); но <b>репаративные процессы выражены хорошо</b> --- в хронический остеомиелит эта форма <b>не переходит</b> (И.);</p>
<p style="margin:0 0 10px">• однако <b>отдалённые функциональные нарушения могут быть значительными</b> : нарушение роста</p>
<p style="margin:0 0 10px">конечности, деформации суставов (И.).</p>`},
  {n:133, t:"Эпифизарный остеомиелит у новорождённых. Лечение и осложнение", a:`<p style="margin:0 0 10px">Разумовский, гл. 41 (с. 536--537, рис. 41.3); Исаков, 7.9.4 (с. 577--578, рис. 7-13).</p>

<p style="margin:0 0 10px">## <b>Лечение</b></p>
<p style="margin:0 0 10px">• лечение --- <b>в отделении хирургии новорождённых</b> ; общая терапия --- по принципам лечения острой</p>
<p style="margin:0 0 10px">гнойной хирургической инфекции с учётом возраста: <b>антибиотики</b> (Р.: широкого спектра; И.: направленного спектра, тропные к костной ткани), антикоагулянты, дезинтоксикационная терапия, иммунокоррекция (иммунотерапия);</p>
<p style="margin:0 0 10px">• <b>иммобилизация</b> (важная роль): на нижней конечности --- <b>лейкопластырное вытяжение</b> (И.: вытяжение</p>
<p style="margin:0 0 10px">по Шеде), на верхней --- <b>повязка Дезо</b> или сетчатый бинт; <b>гипсовые лонгеты не применяют</b> ;</p>
<p style="margin:0 0 10px">• <b>хирургические манипуляции в области ростковой зоны не проводят</b> (Р., И.);</p>
<p style="margin:0 0 10px">• <b>контроль осложнений --- УЗИ</b> (сравнивая со здоровой стороной): жидкость в суставе → гнойный артрит;</p>
<p style="margin:0 0 10px">распространение в мягкие ткани → межмышечная флегмона; в обоих случаях показано хирургическое вмешательство;</p>
<p style="margin:0 0 10px">• <b>флегмона мягких тканей</b> --- вскрытие;</p>
<p style="margin:0 0 10px">• <b>гнойный артрит</b> --- лечение <b>пункциями</b> с удалением выпота и введением антибиотиков в сустав; для</p>
<p style="margin:0 0 10px">санации крупных суставов в настоящее время --- <b>артроскопия</b> ;</p>
<p style="margin:0 0 10px">• при процессе в проксимальном эпифизе бедра после стихания острого воспаления --- <b>шины-распорки</b></p>
<p style="margin:0 0 10px">(повязки-распорки): профилактика патологического вывиха бедра и формирования coxa vara.</p>
<p style="margin:0 0 10px"><b>Группа</b>                                             <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Общие</b>                                              генерализация воспаления (сепсис, метастатические очаги) вследствие неадекватной антибактериальной терапии</p>
<p style="margin:0 0 10px"><b>Местные --- ранние</b>                                 <b>патологический перелом</b> в зоне деструкции (чаще --- при позднем обращении и неадекватной антибиотикотерапии); гнойный артрит; межмышечная флегмона; патологический вывих</p>
<p style="margin:0 0 10px"><b>Поздние (обширная деструкция, поражение сустава)</b>   значительная деструкция эпифиза → <b>закрытие зоны роста</b> , деформация и <b>укорочение конечности</b> ; <b>анкилоз</b> сустава; coxa vara, патологический вывих бедра (И.); остеоартрит (И.)</p>
<p style="margin:0 0 10px"><b>Переход в хронический</b>                              <b>не происходит</b> (хорошая репарация, И.); функциональные нарушения могут быть выраженными</p>
<p style="margin:0 0 10px">## <b>Осложнения и исходы (Р.)</b></p>
<p style="margin:0 0 10px">## <b>Диспансерное наблюдение</b></p>
<p style="margin:0 0 10px">Все дети, перенёсшие остеомиелит, <b>независимо от формы и локализации состоят на диспансерном учёте у ортопеда</b> по месту жительства (Р.); И. --- наблюдение ортопеда или хирурга.</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   бактериемия · стафилококк · метафиз · внутрикостная гипертензия · субпериостальный абсцесс · флегмона</p>
<p style="margin:0 0 10px"><b>Остеомиелит</b> --- гнойно-некротическое поражение костного мозга с последующим вовлечением других анатомических структур кости (Р., И.). Тяжёлая и распространённая патология детского возраста. При гематогенном остеомиелите местному воспалению предшествует <b>бактериемия</b> ; при нарушении иммунитета очаг может стать источником сепсиса и септикопиемии.</p>
<p style="margin:0 0 10px">## <b>Эпидемиология</b></p>
<p style="margin:0 0 10px">• Р.: в последние годы число больных во многих регионах РФ имеет тенденцию к уменьшению; идёт</p>
<p style="margin:0 0 10px"><b>патоморфоз</b> болезни; по возрасту лидируют школьники, растёт доля новорождённых и грудных с эпифизарным остеомиелитом; изменились сезонность и формы; почти в 70 % преобладает <b>местно-очаговая</b> форма; реже атипичные и первично-хронические;</p>
<p style="margin:0 0 10px">• <b>мальчики страдают в 2--3 раза чаще</b> ; поражаются в основном активно растущие <b>длинные трубчатые</b></p>
<p style="margin:0 0 10px"><b>кости</b> (более 70 %);</p>
<p style="margin:0 0 10px">• И.: острым гематогенным остеомиелитом заболевают преимущественно дети старше 5 лет.</p>
<p style="margin:0 0 10px">## <b>Этиология</b></p>
<p style="margin:0 0 10px">• возбудитель --- гноеродная микрофлора: <b>стафилококк (до 90 %)</b> или его ассоциации с энтеробактериями;</p>
<p style="margin:0 0 10px">• <b>входные ворота</b> : повреждённая кожа, слизистые, лимфоидное глоточное кольцо; значение имеют</p>
<p style="margin:0 0 10px">гнойничковые заболевания кожи, воспаление носоглотки, латентная инфекция; <b>у грудных детей --- пупочная ранка</b> ;</p>
<p style="margin:0 0 10px">• <b>контактный путь</b> (переход с мягких тканей или органов): одонтогенный остеомиелит (кариес),</p>
<p style="margin:0 0 10px">остеомиелит ребра при эмпиеме плевры, остеомиелит фаланг при панариции.</p>
<p style="margin:0 0 10px">## <b>Возрастные анатомические особенности кости (Р., И.)</b></p>
<p style="margin:0 0 10px">• <b>значительно развитая сеть сосудов</b> ; <b>автономное кровоснабжение</b> эпифиза, метафиза и диафиза;</p>
<p style="margin:0 0 10px">множество мелких ветвей, идущих радиарно через эпифизарный хрящ к ядру окостенения;</p>
<p style="margin:0 0 10px">• <b>у детей первых 2 лет</b> преобладает <b>эпифизарная</b> система кровоснабжения, метафизарная развивается</p>
<p style="margin:0 0 10px">после 2 лет; системы обособлены, анастомозы есть; общая сосудистая сеть образуется только после окостенения зоны роста;</p>
<p style="margin:0 0 10px">• <b>младше 2--3 лет</b> --- поражение <b>метаэпифизарных зон</b> ; с возрастом (когда развивается метафизарная</p>
<p style="margin:0 0 10px">система) чаще страдает <b>диафиз</b> .</p>
<p style="margin:0 0 10px">## <b>Патогенез (Р.)</b></p>
<p style="margin:0 0 10px">• <b>почему метафиз</b> : капиллярные ветви a. nutricia образуют острые петли у метафизарных зон роста и</p>
<p style="margin:0 0 10px">впадают в большие синусоидальные вены с <b>медленным кровотоком</b> ; восходящая петля (артериола) не имеет фагоцитарных клеток, нисходящая (венула) содержит функционально неактивные фагоциты; диаметр нисходящей петли больше --- кровоток замедлен и турбулентный; петли не анастомозируют, поэтому любая закупорка (рост бактерий, <b>микротромбы</b> ) ведёт к <b>аваскулярному некрозу</b> ;</p>
<p style="margin:0 0 10px">• <b>основную роль играют сосудистые расстройства</b> : в капиллярах костного мозга активируются тучные</p>
<p style="margin:0 0 10px">клетки, повышается проницаемость; <b>отёк костного мозга</b> --- основной механизм подъёма внутрикостного давления; воспаление серозное → фибринозное → гнойное;</p>
<p style="margin:0 0 10px">• воспаление <b>замкнуто ригидными стенками костной трубки</b> → сдавление вен, затем артерий;</p>
<p style="margin:0 0 10px"><b>внутрикостное давление 300--500 мм вод. ст.</b> (в норме 60--100) --- отсюда сильная боль;</p>
<p style="margin:0 0 10px">• если не диагностирован в пределах костномозгового канала --- <b>с 4--5-х суток</b> гной идёт по гаверсовым и</p>
<p style="margin:0 0 10px">фолькмановским каналам <b>под надкостницу</b> (субпериостальный абсцесс), с <b>8--10-х суток</b> --- в мягкие ткани (межмышечные и подкожные флегмоны) --- запущенный остеомиелит; боль стихает при самопроизвольном вскрытии, так как снижается давление;</p>
<p style="margin:0 0 10px">• большое значение имеет <b>сенсибилизация</b> : иногда бурная общая реакция, сходная с анафилактическим</p>
<p style="margin:0 0 10px">шоком (Р., И.).</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   локальная форма · генерализованная · токсическая (адинамическая) · септикопиемическая · контрактура</p>
<p style="margin:0 0 10px">Клиника и тяжесть острого гематогенного остеомиелита у детей <b>очень разнообразны</b> и зависят от реактивности организма, вирулентности микрофлоры, возраста, локализации, сроков заболевания, предшествующего лечения и <b>сенсибилизации</b> . Нередко на первый план выходит бурная общая реакция, сходная с анафилактическим шоком.</p>
<p style="margin:0 0 10px"><b>Форма</b>                                          <b>Клиника</b></p>
<p style="margin:0 0 10px"><b>Местная (локальная)</b>                            преобладают местные симптомы над общими; <b>на фоне кажущегося благополучия резкая боль</b> в конечности; старшие точно указывают место; ребёнок держит конечность в определённом положении (движение усиливает боль); очаг около сустава → поражение связок и околосуставных тканей → <b>стойкая выраженная контрактура</b> ; температура 38--39 °С с начала, быстро ухудшается общее состояние, снижается аппетит, усиливается жажда (интоксикация). Сюда же относят атипичные формы</p>
<p style="margin:0 0 10px"><b>Септико-пиемическая (генерализованная по Р.)</b>   начало острое: температура <b>39--40 °С</b> , нарастающая интоксикация, нарушение функций жизненно важных органов; спутанное сознание, бред, эйфория; боль в конечности с первых дней, очень интенсивная из-за внутрикостной гипертензии; костные поражения выявляют раньше; <b>септические метастазы</b> (лёгкие, сердце, почки, другие кости); возможно молниеносное развитие сепсиса и шока, часто резистентных к интенсивной терапии --- высокая летальность</p>
<p style="margin:0 0 10px"><b>Токсическая (адинамическая) (И.)</b>               протекает чрезвычайно бурно, с <b>эндотоксическим шоком</b> : коллапс, потеря сознания, бред, температура до 40--41 °С, судороги, рвота; одышка без пневмонии; нарушение центрального и периферического кровообращения, ↓ АД, сердечная недостаточность, миокардит; мелкоточечные кровоизлияния на коже; язык сухой с коричневым налётом; живот вздут; печень увеличена; <b>местные симптомы трудно выявить</b> , очаг находят позже; нередко летальный исход несмотря на интенсивную терапию</p>
<p style="margin:0 0 10px">## <b>Формы</b></p>
<p style="margin:0 0 10px">Р. выделяет <b>две основные формы</b> : локальную и генерализованную; И. --- <b>три</b> : токсическую, септико-пиемическую и местную (см. вопрос 136).</p>
<p style="margin:0 0 10px">## <b>Местные признаки при осмотре (Р., И.)</b></p>
<p style="margin:0 0 10px">• <b>припухлость</b> над очагом, сплошная инфильтрация тканей, усиление венозного рисунка кожи;</p>
<p style="margin:0 0 10px">• <b>главный постоянный местный признак</b> --- резко выраженная <b>локальная болезненность при</b></p>
<p style="margin:0 0 10px"><b>пальпации и особенно при перкуссии</b> над очагом; отёк и болезненность распространяются на соседние участки;</p>
<p style="margin:0 0 10px">• <b>гиперемия кожи и флюктуация --- поздние признаки</b> , свидетельствуют о запущенности процесса;</p>
<p style="margin:0 0 10px">• <b>контрактура</b> прилежащего сустава, повышение местной температуры.</p>
<p style="margin:0 0 10px">## <b>Особенности по локализации</b></p>
<p style="margin:0 0 10px">• <b>кости тазобедренного сустава</b> : в первые дни местные симптомы нечёткие из-за мощных мышц; нижняя</p>
<p style="margin:0 0 10px">конечность слегка согнута в тазобедренном суставе, <b>отведена и ротирована кнаружи</b> ; движения болезненны; сустав и кожа над ним умеренно отёчны;</p>
<p style="margin:0 0 10px">• <b>подвздошная кость и позвонки</b> : очень тяжело, с самого начала выражены интоксикация и высокая</p>
<p style="margin:0 0 10px">температура; отёчность и наибольшая болезненность при пальпации и перкуссии в очаге.</p>
