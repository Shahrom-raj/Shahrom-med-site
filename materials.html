<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: уретероцеле удвоение мочеточника закон Вейгерта--Мейера</b></p>
<p style="margin:0 0 10px"><b>стеноз устья гидроуретеронефроз</b></p>
<p style="margin:0 0 10px"><b>Важно!</b> В Исакове и Разумовском уретероцеле описано <b>только в составе удвоения почки</b> , отдельной главы нет. Основное ниже из интернета и общих учебников --- проверь по лекции.</p>
<p style="margin:0 0 10px"><b>Уретероцеле</b> --- кистовидное расширение <b>внутрипузырного (интрамурального) отдела мочеточника</b> , выпячивание слизистого и подслизистого слоёв в просвет мочевого пузыря; сопровождается расширением мочеточника (мегауретер). Название «уретероцеле» используют, когда суженное устье образует кистозную полость (Р., И.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология (интернет)</b></h4></p>
<p style="margin:0 0 10px">• у <b>80 %</b> детей уретероцеле выявляют при <b>удвоенном</b> мочеточнике, у <b>60 %</b> оно эктопическое;</p>
<p style="margin:0 0 10px">• девочки болеют чаще (в одной серии 62 %);</p>
<p style="margin:0 0 10px">• чаще односторонний процесс.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез</b></h4></p>
<p style="margin:0 0 10px"><b>Звено</b>                         <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Эмбриогенез</b>                   порок связан с удвоением мочеточникового зачатка (расщепление в начале пути или перед врастанием в бластему); аномалия дифференциации интрамурального отдела: стеноз устья и слабая мышечная стенка</p>
<p style="margin:0 0 10px"><b>Закон Вейгерта--Мейера</b> (Р.)   при полном удвоении основной ствол от нижнего сегмента открывается в углу мочепузырного треугольника, второй (от верхнего сегмента) --- рядом или <b>дистальнее</b> (эктопия); именно его устье чаще суживается</p>
<p style="margin:0 0 10px">Стеноз устья                      моча скапливается в интрамуральном отделе → кистозная полость в пузыре + расширение мочеточника (мегауретер) + гидронефроз верхнего сегмента</p>
<p style="margin:0 0 10px">Последствия                       обструкция верхнего сегмента → дисплазия и гибель его паренхимы; большое уретероцеле сдавливает устье нижнего сегмента → ПМР и гидронефроз нижнего сегмента; перекрывает шейку пузыря и уретру (у девочек выпадение через уретру)</p>
<p style="margin:0 0 10px">Пиелонефрит (Р.)                  чаще поражает верхний пиелон, быстро разрушая его → сморщивание паренхимы, мочеточник удлинён, расширен и извит</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• чаще всего --- <b>инфекция мочевых путей</b> (пиелонефрит, цистит) и лейкоцитурия (И.);</p>
<p style="margin:0 0 10px">• человек с удвоенной почкой может прожить без жалоб, аномалию находят случайно при УЗИ (И., Р.);</p>
<p style="margin:0 0 10px">• у новорождённых --- киста в мочевом пузыре на антенатальном УЗИ, гидронефроз;</p>
<p style="margin:0 0 10px">• при эктопическом устье в уретру или преддверие --- <b>постоянное недержание мочи</b> на фоне нормальных микций (И.);</p>
<p style="margin:0 0 10px">• большое уретероцеле: затруднённое мочеиспускание, острая задержка мочи, у девочек --- выпадение кисты через уретру (интернет);</p>
<p style="margin:0 0 10px">• боль в животе или пояснице, гематурия, камни (поздно).</p>`},
  {n:65, t:"Уретероцеле у детей. Классификация, диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*Классификация --- интернет (клинические описания, статьи по детской урологии); диагностика --- Разумовский (с. 561), Исаков (с. 443--444). Дифференциальная диагностика --- общие учебники.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: простое и эктопическое ортотопическое / гетеротопическое</b></p>
<p style="margin:0 0 10px"><b>симптом «головки кобры» цистоскопия УЗИ мочевого пузыря</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (интернет)</b></h4></p>
<p style="margin:0 0 10px"><b>Критерий</b>                     <b>Виды</b></p>
<p style="margin:0 0 10px"><b>По расположению</b> (основная)   <b>простое</b> (внутрипузырное, в нормально расположенном устье, ортотопическое; чаще у взрослых) и <b>эктопическое</b> (в мочеточнике с атипичным устьем --- уретра, шейка, преддверие влагалища и др.; <b>гетеротопическое</b> --- при удвоении почки; чаще у детей)</p>
<p style="margin:0 0 10px">По отношению к удвоению          <b>ортотопическое</b> --- в одиночном мочеточнике; <b>гетеротопическое</b> --- при удвоенной почке (верхний сегмент)</p>
<p style="margin:0 0 10px">По форме                         пролабирующее (выпадающее через уретру), слепо заканчивающееся</p>
<p style="margin:0 0 10px">По размеру кисты                 малое, среднее, большое, гигантское</p>
<p style="margin:0 0 10px">По тяжести                       лёгкая (расширение внутрипузырного отдела мочеточника без нарушения оттока), средняя (нарушение оттока, начальный гидронефроз), тяжёлая (нарушение функции почки и пузыря)</p>
<p style="margin:0 0 10px">*Классификация взята из клинических описаний в интернете (в твоих книгах её нет); деление на простое и эктопическое --- основное и принято всеми.*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                                     <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>УЗИ</b> почек и мочевого пузыря (+ антенатальное)             в пузыре --- тонкостенная округлая киста («пузырь в пузыре») в области устья, расширенный мочеточник, удвоение почки, гидронефроз верхнего сегмента (первый метод)</p>
<p style="margin:0 0 10px"><b>Экскреторная урография</b> с отсроченными снимками (Р., И.)   функция обоих сегментов сохранена --- коллекторные системы видны; поражённый (чаще верхний) сегмент может не контрастироваться: о нём судят по смещению нижнего сегмента вниз и латерально и уменьшению числа чашечек; на цистограмме --- дефект наполнения, при контрастировании кисты --- «головка кобры»</p>
<p style="margin:0 0 10px"><b>МЦУГ</b> , цистография                                        пузырно-мочеточниковый рефлюкс (чаще в нижний сегмент), форма кисты, шейка пузыря</p>
<p style="margin:0 0 10px"><b>Цистоскопия</b> (Р., И.)                                      кистозное образование у устья, отличает полное и неполное удвоение; большое уретероцеле затрудняет осмотр и устья можно не найти</p>
<p style="margin:0 0 10px">Радиоизотопные методы                                         функция верхнего и нижнего сегментов</p>
<p style="margin:0 0 10px">Проба с красителем (И.)                                       метилтиониния хлорид в пузырь по катетеру с баллоном; подтекание неокрашенной мочи --- эктопия устья в уретру</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика (по учебникам)</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                       <b>Отличие</b></p>
<p style="margin:0 0 10px">Дивертикул мочевого пузыря                      при дивертикуле полость заполняется при цистографии и опорожняется при мочеиспускании; нет связи с мочеточником</p>
<p style="margin:0 0 10px">Опухоль, полип, камень, сгусток                 твёрдое образование без полости; УЗИ, цистоскопия</p>
<p style="margin:0 0 10px"><b>Эктопия устья мочеточника</b> без уретероцеле   постоянное недержание, нет кисты в пузыре; урография, цистоскопия</p>
<p style="margin:0 0 10px">Другие причины мегауретера                      клапаны задней уретры, инфравезикальная обструкция, стеноз устья (вопрос 62)</p>
<p style="margin:0 0 10px">Простое и эктопическое уретероцеле              эктопическое всегда с удвоением, часто с гидронефрозом верхнего сегмента</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: эндоскопическое рассечение геминефруретерэктомия неоимплантация</b></p>
<p style="margin:0 0 10px"><b>рефлюкс после операции</b></p>
<p style="margin:0 0 10px"><b>Лечение хирургическое</b> : цель --- устранить обструкцию, сохранить функцию почки и предотвратить рефлюкс. Выбор операции зависит от размера, расположения, состояния сегмента почки и наличия ПМР.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Операции</b></h4></p>
<p style="margin:0 0 10px"><b>Ситуация</b>                                                               <b>Операция</b></p>
<p style="margin:0 0 10px"><b>Небольшое</b> уретероцеле, умеренные функциональные нарушения (интернет)   <b>эндоскопическое рассечение</b> (электрорассечение) стенки кисты через уретру: малотравматично; широкое рассечение для оттока мочи; по клиническим данным у детей чаще применяют первым этапом</p>
<p style="margin:0 0 10px"><b>Уретероцеле</b> (Р., с. 561)                                               <b>иссечение</b> с <b>неоимплантацией мочеточников</b> в мочевой пузырь (антирефлюксная защита)</p>
<p style="margin:0 0 10px">Погибший (нефункционирующий) сегмент почки (Р.)                            уретероцеле можно не иссекать: <b>геминефруретерэктомия</b> --- удаляют нефункционирующий сегмент и мочеточник <b>максимально близко к пузырю</b> (чтобы не было эмпиемы культи); при гибели обоих сегментов --- нефрэктомия (частичная или тотальная)</p>
<p style="margin:0 0 10px">Рефлюкс в один из мочеточников (Р.)                                        уретероуретероанастомоз или пиелопиелоанастомоз; антирефлюксная операция --- подслизистая туннелизация мочеточников <b>одним блоком</b></p>
<p style="margin:0 0 10px">Эктопия устья (И.)                                                         без инфекции --- межлоханочный или межмочеточниковый анастомоз; при падении функции и пиелонефрите --- удаление эктопированного мочеточника вместе с сегментом почки</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Когда</b>                          <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Ранние</b>                         инфекция мочевыводящих путей, гематурия, редко --- послеоперационное кровотечение</p>
<p style="margin:0 0 10px"><b>Поздние</b>                        <b>рецидив рефлюкса</b> , реже обструкция мочеточника</p>
<p style="margin:0 0 10px">Уретероуретеростомия               небольшой риск ИМП из-за культи мочеточника верхнего сегмента (выше, если он расширен или есть рефлюкс); может потребоваться удаление дистальной культи</p>
<p style="margin:0 0 10px">Геминефрэктомия                    риск деваскуляризации нижнего сегмента с потерей части или всей его функции --- нечасто</p>
<p style="margin:0 0 10px"><b>После рассечения уретероцеле</b>   <b>рефлюкс почти у половины пациентов</b> (в ипсилатеральные сегменты или контралатеральную почку); более 50 % случаев рефлюкса разрешаются самостоятельно --- возможно консервативное лечение</p>
<p style="margin:0 0 10px">Эндорассечение (интернет)          рефлюкс, рецидив обструкции, необходимость повторной операции; публикации указывают, что часть детей всё же требует реконструкции</p>`},
  {n:67, t:"Экстрофия мочевого пузыря у детей. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">*Разумовский, гл. 46 (с. 603--604, рис. 46.2); Исаков, с. 479--480 (рис. 6-47, 6-48). Патогенез --- общие учебники.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: экстрофия клоакальная мембрана OEIS диастаз лонного сочленения</b></p>
<p style="margin:0 0 10px"><b>утиная походка</b></p>
<p style="margin:0 0 10px"><b>Экстрофия (эктопия) мочевого пузыря</b> --- тяжёлый порок: <b>отсутствие передней стенки мочевого пузыря</b> и соответствующего участка передней брюшной стенки. Всегда сопровождается <b>тотальной эписпадией</b> и <b>расхождением костей лобкового симфиза</b> . Синонимы: выворот, расщелина, эктопия мочевого пузыря. Код МКБ-10: <b>Q64.1</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• 1 на 40 000--50 000 новорождённых; мальчики чаще: в 2,5 раза (Р.), в 3 раза (И.);</p>
<p style="margin:0 0 10px">• сочетается с паховой грыжей, крипторхизмом, выпадением прямой кишки, пороками верхних мочевых путей.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез</b></h4></p>
<p style="margin:0 0 10px">• порок формируется в первые <b>4--7 недель</b> внутриутробной жизни (Р., И.);</p>
<p style="margin:0 0 10px">• генетика (Исаков): комплекс <b>OEIS</b> (омфалоцеле --- экстрофия --- анальная атрезия --- дефекты позвоночника; OMIM 258040); экстрофия мочевого пузыря изолированно (OMIM 600057): дефекты нижнего отдела мочевого тракта, патология наружных половых органов, дефект нижней части брюшной стенки, «открытый» лобковый симфиз;</p>
<p style="margin:0 0 10px">• по общим учебникам и клиническим рекомендациям: в основе --- нарушение миграции мезенхимы в зоне клоакальной мембраны: при <b>частичной</b> миграции формируется только эписпадия, при <b>полной остановке</b> --- экстрофия (экстрофийно-эписпадийный комплекс);</p>
<p style="margin:0 0 10px">• следствия: нет передней стенки пузыря → моча течёт наружу, слизистая пузыря контактирует со средой, мочеточники открываются прямо в пластинку, таз не замкнут (диастаз лобков), мышцы тазового дна не сомкнуты.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина (Р., И.)</b></h4></p>
<p style="margin:0 0 10px"><b>Признак</b>                  <b>Проявления</b></p>
<p style="margin:0 0 10px">Местный статус               через округлый дефект брюшной стенки <b>выбухает ярко-красная слизистая задней стенки пузыря</b> ; пупочное кольцо расщеплено и прилегает к верхнему краю дефекта; слизистая легко ранима, кровоточит, нередко покрыта папилломатозными разрастаниями; диаметр мочепузырной пластинки <b>3--7 см</b> ; устья мочеточников в нижнем отделе пластинки на конусовидных возвышениях или между складками; со временем рубцуется → обструкция устьев</p>
<p style="margin:0 0 10px">Мальчики                     половой член <b>укорочен</b> , подтянут к животу, расщеплённая уретра соприкасается со слизистой пузыря; мошонка недоразвита, нередко крипторхизм</p>
<p style="margin:0 0 10px">Девочки                      расщепление уретры и клитора, спайки больших и малых половых губ, задний проход эктопирован кпереди; в старшем возрасте --- выпадение влагалища, опущение и пролапс матки</p>
<p style="margin:0 0 10px">Постоянное недержание мочи   мацерация кожи живота, бёдер и промежности</p>
<p style="margin:0 0 10px">Таз                          нестабильность тазового кольца --- <b>«утиная» походка</b></p>
<p style="margin:0 0 10px">Инфекция                     контакт мочеточников со средой + нарушение оттока → <b>восходящий пиелонефрит</b></p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: экстрофийно-эписпадийный комплекс классическая экстрофия</b></p>
<p style="margin:0 0 10px"><b>клоакальная экстрофия размер пластинки диастаз лонных костей</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px">Экстрофия мочевого пузыря входит в <b>экстрофийно-эписпадийный комплекс (ЭЭК)</b> --- спектр урогенитальных пороков разной тяжести (клинические рекомендации и обзоры, интернет):</p>
<p style="margin:0 0 10px"><b>Форма (по тяжести)</b>                                                                               <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Эписпадия</b> (от частичной до тотальной)                                                            расщепление уретры без экстрофии пузыря --- самая лёгкая (вопросы 70--72)</p>
<p style="margin:0 0 10px"><b>Частичная экстрофия</b>                                                                              вариант с недоразвитием пластинки</p>
<p style="margin:0 0 10px"><b>Классическая экстрофия мочевого пузыря</b> (+ тотальная эписпадия)                                   открытый пузырь, расщеплённая уретра, диастаз лобка --- самая частая форма экстрофии</p>
<p style="margin:0 0 10px"><b>Экстрофия клоаки</b> (OEIS)                                                                          самая тяжёлая: экстрофия пузыря и кишки, омфалоцеле, анальная атрезия, дефекты позвоночника</p>
<p style="margin:0 0 10px"><b>Дополнительные критерии</b>                                                                                                                                                                        <b>Градации (клинические рекомендации)</b></p>
<p style="margin:0 0 10px"><b>Размер площадки</b> экстрофированного пузыря (Рудин и соавт., Российский вестник детской хирургии)                                                                                                 большая --- более 5 см; средняя --- 35--50 мм; малая --- менее 35 мм</p>
<p style="margin:0 0 10px"><b>Качество ткани</b> пузыря                                                                                                                                                                          эластичность, отсутствие изменений слизистой (определяет возможность пластики местными тканями)</p>
<p style="margin:0 0 10px">Разумовский                                                                                                                                                                                        пластика местными тканями возможна при диаметре пластинки <b>не менее 5 см</b> ; меньше --- кишечная деривация или инкорпорация</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                 <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Осмотр</b> (Р., И.)                       диагноз ставят сразу после рождения: выбухающая красная слизистая пузыря, расщеплённый пупок, эписпадия, диастаз лобка; пол, размер пластинки, качество слизистой</p>
<p style="margin:0 0 10px"><b>Антенатальное УЗИ</b> (по учебникам)      нет заполненного пузыря, низко расположенный пупок, широкое расхождение лобковых костей, образование на нижней части брюшной стенки; возможна МРТ плода</p>
<p style="margin:0 0 10px"><b>Рентгенография таза</b> (И., рис. 6-48)   <b>диастаз лонного сочленения</b> (до 6--8 см)</p>
<p style="margin:0 0 10px"><b>УЗИ почек и мочеточников</b>              пороки верхних мочевых путей, гидронефроз, расширение мочеточников из-за рубцов устьев</p>
<p style="margin:0 0 10px">Анализы мочи, посев                       пиелонефрит, ИМП</p>
<p style="margin:0 0 10px">Исключить сочетанные пороки               пах, яички, прямая кишка, позвоночник, сердце</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика (по учебникам)</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                           <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Экстрофия клоаки</b> (OEIS)                                                         в дефекте две половины пузыря с кишечной «площадкой» между ними, омфалоцеле, анальная атрезия, спинальные дефекты</p>
<p style="margin:0 0 10px"><b>Омфалоцеле</b> , гастрошизис                                                        дефект пупочного кольца, грыжевой мешок или эвентрация кишки; пузырь на месте</p>
<p style="margin:0 0 10px"><b>Эписпадия</b> (изолированная)                                                       пузырь закрыт, уретра расщеплена; диастаз лобка меньше</p>
<p style="margin:0 0 10px">Пролапс слизистой мочевого пузыря, открытый мочевой проток, пузырно-пупочный свищ   при свище моча из пупка, пузырь на месте</p>`},
  {n:69, t:"Экстрофия мочевого пузыря у детей. Лечение и осложнения", a:`<p style="margin:0 0 10px">*Разумовский, гл. 46 (с. 604--606, рис. 46.3); Исаков, с. 481. Современная тактика --- клинические рекомендации.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: пластика местными тканями остеотомия таза кишечная деривация</b></p>
<p style="margin:0 0 10px"><b>цистопластика недержание мочи</b></p>
<p style="margin:0 0 10px"><b>Лечение только оперативное</b> (Р., И.). Цель --- закрыть мочевой пузырь и брюшную стенку, замкнуть тазовое кольцо, создать условия для удержания мочи и сохранить функцию почек.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Группы операций (Р., И.)</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>                             <b>Суть и условия</b></p>
<p style="margin:0 0 10px"><b>Пластика пузыря местными тканями</b>   возможна при диаметре пластинки <b>не менее 5 см</b> ; оптимальный срок --- <b>первые 2 недели жизни</b> (нет воспаления, инфекции) (Р.); Исаков --- период новорождённости, не позднее <b>3 месяцев</b></p>
<p style="margin:0 0 10px"><b>Кишечная деривация</b> мочи            если пластинка меньше 5 см: инкорпорация мочевой системы в непрерывную кишечную трубку или изолированный сегмент кишки</p>
<p style="margin:0 0 10px">Изолированный кишечный пузырь (И.)     создание резервуара из сегмента кишки</p>
<p style="margin:0 0 10px">![](media/image86.jpg){width="3.101926946631671in" height="2.087963692038495in"}</p>
<p style="margin:0 0 10px">*Рис. 46.3 (Р., с. 605). Этапы пластики пузыря местными тканями: а --- разрез; б --- мобилизация краёв; в --- формирование пузыря и уретры; г --- перемещение уретры; д --- сфинктер*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Принципы операции (Разумовский)</b></h4></p>
<p style="margin:0 0 10px">• всегда <b>начинают с ликвидации диастаза лонных костей</b> : замыкание тазового кольца и урогенитальной диафрагмы укрепляет связки таза и облегчает закрытие брюшной стенки;</p>
<p style="margin:0 0 10px">• на первой неделе жизни кости сводят <b>без остеотомии</b> ; позже --- <b>двусторонняя задняя вертикальная подвздошная остеотомия</b> (диастаз часто рецидивирует);</p>
<p style="margin:0 0 10px">• техника: интубация устьев мочеточников (Ch 6), окаймляющий разрез по границе слизистой и кожи, мобилизация пластинки, ушивание краёв непрерывным швом PDS 6/0, формирование шейки и начальной уретры на катетере Ch 8, мышцы шейки ушивают; <b>уретру по всей длине не формируют</b> (позже --- расправление полового члена); затем сводят и фиксируют лобковые кости, закрывают брюшную стенку;</p>
<p style="margin:0 0 10px">• интубаторы мочеточников удаляют на 10--12-е сутки, катетер --- на 14--16-е;</p>
<p style="margin:0 0 10px">• после операции --- увеличение ёмкости пузыря: <b>периодическая катетеризация</b> , м-холинолитики (атропин, оксибутинин), коррекция гипоксии (ГБО, цитохром С, левокарнитин).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дальнейшие этапы</b></h4></p>
<p style="margin:0 0 10px">• устраняют эписпадию: расправление полового члена и пластика уретры (по Duplay, Cantwell) после года; по современным клиническим рекомендациям --- поэтапная реконструкция ЭЭК или полная первичная реконструкция в специализированном центре;</p>
<p style="margin:0 0 10px">• через <b>1,5--2 года</b> (Р.) / 8--12 мес (И.) --- <b>расширяющая цистопластика</b> сегментом тонкой или толстой кишки на ножке: объём пузыря до 150--200 мл, пластика шейки пузыря и антирефлюксная защита.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>                    <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Сохраняются всегда</b>        <b>частичное или полное недержание мочи</b> из-за малого объёма пузыря и недоразвития сфинктера (Р., И.)</p>
<p style="margin:0 0 10px"><b>Самой болезни</b>             восходящий пиелонефрит, рубцы и обструкция устьев мочеточников, гидронефроз, ХПН; у девочек --- пролапс матки; деформация наружных половых органов</p>
<p style="margin:0 0 10px"><b>Операции (по учебникам)</b>   повторное расхождение лонных костей, дегисценция швов, свищи, стриктура уретры, ПМР, камни пузыря, инфекция; при кишечной пластике --- метаболические нарушения, слизь, перфорация</p>
<p style="margin:0 0 10px">Отдалённые                    социальная и психологическая адаптация; сексуальная функция</p>`},
  {n:70, t:"Эписпадия у детей. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">*Разумовский, гл. 46 (с. 606--607); Исаков, с. 494--495. Эмбриология --- клинические рекомендации.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: эписпадия клоакальная мембрана субсимфизарная тотальная</b></p>
<p style="margin:0 0 10px"><b>недержание мочи</b></p>
<p style="margin:0 0 10px"><b>Эписпадия</b> --- сложный порок развития, характеризующийся <b>незаращением и различной степенью расщепления передней (верхней) стенки мочеиспускательного канала</b> . Синонимы: верхняя расщелина уретры. Код МКБ-10: <b>Q64.0</b> . Входит в экстрофийно-эписпадийный комплекс (вопросы 67--69).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• 1 на 50 000 новорождённых; у мальчиков в <b>5 раз</b> чаще, чем у девочек (Р.);</p>
<p style="margin:0 0 10px">• <b>тотальная</b> эписпадия развивается в 3 раза чаще, чем все другие формы вместе.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез</b></h4></p>
<p style="margin:0 0 10px">• порок связан с нарушением миграции мезенхимы при формировании нижней части брюшной стенки и клоакальной мембраны; <b>при частичной миграции развивается только эписпадия</b> (клинические рекомендации);</p>
<p style="margin:0 0 10px">• у части больных --- сочетание с экстрофией пузыря и другими пороками мочеполовой системы (Исаков: экстрофия всегда сопровождается тотальной эписпадией);</p>
<p style="margin:0 0 10px">• следствие: расщепление передней стенки уретры, расхождение ножек кавернозных тел, недоразвитие шейки пузыря и сфинктера при проксимальных формах.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Пол</b>       <b>Формы по степени расщепления уретры</b></p>
<p style="margin:0 0 10px">Мальчики      <b>эписпадия головки</b> ; <b>эписпадия полового члена</b> ; <b>неполная (субсимфизарная)</b> ; <b>полная (тотальная)</b></p>
<p style="margin:0 0 10px">Девочки       <b>клиторная</b> ; <b>неполная (субсимфизарная)</b> ; <b>полная (тотальная)</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                       <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Головки</b> (мальчики)          уплощение головки, расщепление крайней плоти сверху, отверстие у венечной борозды; мочеиспускание обычно не нарушено, <b>разбрызгивание струи</b></p>
<p style="margin:0 0 10px"><b>Полового члена</b>              половой член искривлён кверху; от головки по дорсальной поверхности идёт полоска слизистой к отверстию в области <b>члено-лобкового угла</b> ; моча разбрызгивается, растекается по мошонке и бёдрам --- больной мочится сидя</p>
<p style="margin:0 0 10px"><b>Неполная (субсимфизарная)</b>   половой член укорочен и подтянут к животу из-за расхождения ножек кавернозных тел; уретра расщеплена до лона, отверстие воронкой; недержание мочи при кашле, смехе, напряжении (слабость сфинктера); часто расхождение лонного сочленения и прямых мышц</p>
<p style="margin:0 0 10px"><b>Полная (тотальная)</b>          половой член недоразвит, <b>«крючком» кверху</b> ; кавернозные тела расщеплены; уретральная дорожка под лоном переходит в воронку шейки пузыря; <b>полное недержание мочи</b> ; диастаз симфиза до 6--8 см; у трети --- пороки почек и мочеточников, крипторхизм, гипоплазия яичек и простаты</p>
<p style="margin:0 0 10px"><b>Клиторная</b> (девочки)         расщепление клитора, отверстие уретры смещено вперёд и кверху; мочеиспускание не нарушено; значения почти не имеет</p>
<p style="margin:0 0 10px"><b>Субсимфизарная</b> (девочки)    полное расщепление клитора; уретра расщеплена до шейки; полное или частичное недержание</p>
<p style="margin:0 0 10px"><b>Тотальная</b> (девочки)         клитор разделён, недоразвит; уретра в виде желоба, верхняя стенка отсутствует; шейка пузыря расщеплена без мышц; диастаз лонных костей; моча постоянно вытекает, мацерация бёдер</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: классификация профилометрия уретры цистотонометрия</b></p>

<p style="margin:0 0 10px">*Полная (тотальная) форма развивается в 3 раза чаще остальных. Исаков называет у мальчиков три формы: головки, полового члена, полную. Экстрофийно-эписпадийный комплекс: эписпадия --- самая лёгкая форма (вопрос 68).*</p>

<p style="margin:0 0 10px">Урофлоуметрия, цистоскопия                         оценка функции сфинктера и состояния шейки пузыря</p>

<p style="margin:0 0 10px">УЗИ, экскреторная урография, цистография           сочетанные пороки почек и мочеточников --- у трети больных с тотальной; ПМР; крипторхизм, гипоплазия яичек и простаты</p>

<p style="margin:0 0 10px"><b>Экстрофия мочевого пузыря</b>                                               есть дефект передней брюшной стенки и открытая слизистая пузыря; всегда с тотальной эписпадией</p>
<p style="margin:0 0 10px">Другие причины недержания (нейрогенный пузырь, эктопия устья мочеточника)   при эписпадии известен анатомический дефект уретры; нейрогенный --- миелодисплазия; эктопия --- нормальные микции + подтекание</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: пластика по Duplay Young--Dees Державин</b></p>
<p style="margin:0 0 10px"><b>расширяющая цистопластика кишечная деривация</b></p>
<p style="margin:0 0 10px"><b>Лечение только оперативное.</b> Объём зависит от формы и степени нарушения мочеиспускания. Все операции целесообразно начинать <b>после года</b> (Разумовский).</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Расправление члена, пластика уретры</span><span>Пластика шейки и сфинктера | Цистопластика при малой ёмкости | Деривация мочи --- крайний случай</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дистальные формы (головка, половой член)</b></h4></p>
<p style="margin:0 0 10px">• коррекция: <b>расправление полового члена</b> и <b>пластика мочеиспускательного канала</b> ;</p>
<p style="margin:0 0 10px">• у девочек при дистальной форме --- пластика клитора и наружного отверстия уретры.</p>
<p style="margin:0 0 10px"><b>Операция</b>             <b>Суть (Разумовский)</b></p>
<p style="margin:0 0 10px"><b>Duplay</b> (рис. 46.4)   как при гипоспадии, в два этапа: <b>I</b> --- расправление полового члена (отделение от лонных костей, сближение кавернозных тел у основания); <b>II</b> --- формирование уретры вдоль ствола: края слизистой желоба сшивают в трубку на катетере Ch 8 (PDS 6/0), второй ряд швов на белочную оболочку, третий --- на кожу</p>
<p style="margin:0 0 10px"><b>Cantwell</b>             принципы Duplay, но уретру формируют после <b>полного отделения слизистой от кавернозных тел</b> ; тела разводят и погружают под уретру</p>
<p style="margin:0 0 10px"><b>Young</b>                модификация Cantwell: слизистую выделяют частично, сохраняя контакт с кавернозным телом --- лучше кровообращение стенки</p>
<p style="margin:0 0 10px">![](media/image87.jpg){width="3.24540791776028in" height="1.666020341207349in"}</p>
<p style="margin:0 0 10px">*Рис. 46.4 (Р., с. 608). Операция Duplay: а --- линия разреза; б --- формирование трубки; в --- погружение трубки в ткани*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Проксимальные формы (субсимфизарная, тотальная)</b></h4></p>
<p style="margin:0 0 10px">• главное --- <b>создать удерживающие мочу механизмы</b> и восстановить адекватную ёмкость пузыря;</p>
<p style="margin:0 0 10px">• ведущий симптом --- истинное недержание: при тотальной моча течёт каплями, позыва нет, ёмкость ≤ 30--50 мл;</p>
<p style="margin:0 0 10px">• при диастазе лонных костей более 5 см --- <b>остеотомия</b> .</p>
<p style="margin:0 0 10px"><b>Операция</b>                  <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Young--Dees</b> (рис. 46.6)   вскрывают пузырь до наружного отверстия уретры; иссекают слизистую шеечной части в виде треугольников, оставляя <b>дорожку ≈ 1 см</b> на задней стенке; дорожку сшивают в трубку на катетере Ch 8; боковые мышечные демукозированные лоскуты сшивают над уретрой <b>внахлёст в два ряда</b> --- «двойное мышечное кольцо»; интубация мочеточников; сведение лонных костей. Мочеточниковые интубаторы --- на 8--10-е сутки, катетер --- на 10--12-е</p>
<p style="margin:0 0 10px"><b>Gross</b> (рис. 46.7)         как Young--Dees, но предварительно выделяют концы расщеплённого мышечного кольца наружного сфинктера и в конце сшивают их «седлом» над уретрой и шейкой</p>
<p style="margin:0 0 10px"><b>Державин</b>                  на катетере Фолея шейку суживают дупликатурой боковых стенок на 4--5 см двумя рядами швов (мочеточники не прошивать); катетер удаляют на 10--12-е сутки; удержание --- за счёт сокращения мышц пузырного треугольника</p>
<p style="margin:0 0 10px">![](media/image88.jpg){width="3.721013779527559in" height="1.9471970691163605in"}   ![](media/image89.jpg){width="2.7000437445319334in" height="1.9466983814523184in"}</p>
<p style="margin:0 0 10px">*Рис. 46.6 (Р., с. 609). Пластика уретры и сфинктера по Young--Dees*                *Рис. 46.7. Пластика по Gross (а, б)*</p>
<p style="margin:0 0 10px">При успехе пластики шейки объём пузыря постепенно растёт, удлиняются «сухие» промежутки, появляется струя. <b>Если объём не превышает 60--80 мл при внутрипузырной гипертензии --- расширяющая цистопластика</b> . Сохраняющееся недержание и уменьшение ёмкости --- показание к <b>кишечной деривации</b> (Р.). <b><h4 style="margin:14px 0 8px;color:#0d7377">Кишечная деривация мочи (Разумовский)</b></h4></p>
<p style="margin:0 0 10px">• показания: сохраняется недержание, прогрессирует уменьшение ёмкости, рецидивирует инфекция, обструкция верхних путей вплоть до ХПН (экстрофия, субтотальная и тотальная эписпадия, нейрогенный пузырь);</p>
<p style="margin:0 0 10px">• варианты: уретеросигмостомия, искусственный кишечный резервуар, расширяющая цистопластика изолированным кишечным сегментом; операции делят на три группы: без разделения мочи и кала, с частичным и полным отведением кала;</p>
<p style="margin:0 0 10px">• операция <b>Coffey--Goodwin</b> (анальный сфинктер как держащий механизм): нижняя срединная лапаротомия, дистальные отделы мочеточников, сигмовидную кишку вскрывают по taenia libera на 8--10 см, формируют подслизистые туннели.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>                          <b>Осложнения</b></p>
<p style="margin:0 0 10px">Самой болезни (Р.)                  недержание мочи, мацерация кожи, малый объём пузыря, пузырная гипертензия, рецидивирующая инфекция, обструкция верхних путей, ХПН</p>
<p style="margin:0 0 10px">После операции (по учебникам)       уретральный свищ, стриктура уретры, рецидив искривления члена, стрессовое недержание после пластики шейки, дегисценция швов, инфекция; при цистопластике кишкой --- метаболический ацидоз, слизь, камни, перфорация</p>
<p style="margin:0 0 10px">Кишечная деривация (по учебникам)   восходящая инфекция, гиперхлоремический ацидоз, нарушение функции почек; риск аденокарциномы в зоне анастомоза в отдалённом периоде</p>`},
  {n:73, t:"Гермафродитизм у детей. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">*Исаков, с. 491--493; Разумовский, с. 655, 666. Современная терминология и этиология --- интернет и общие учебники (Чикагский консенсус).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: нарушение формирования пола DSD половая дифференцировка</b></p>
<p style="margin:0 0 10px"><b>адреногенитальный синдром урогенитальный синус</b></p>
<p style="margin:0 0 10px"><b>Гермафродитизм (интерсексуальность)</b> --- одни из самых тяжёлых пороков половых органов (И.): <b>сочетание признаков обоих полов</b> . В современной терминологии (Чикагский консенсус 2006) --- <b>нарушения формирования (развития) пола, DSD</b> (disorders of sex development) --- врождённые состояния, при которых хромосомный, гонадный и анатомический пол не совпадают (интернет). Термин «гермафродитизм» устарел, но в книгах использован.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Хромосомный пол (XX / XY, ген SRY)</span><span>Гонадный пол: яичко или яичник | Гормоны: тестостерон, ДГТ, АМГ | Наружные половые органы и внутренний пол</span></div>
<p style="margin:0 0 10px">• в норме пол формируется в три этапа: <b>генетический → гонадный → фенотипический</b> (по учебникам); нарушение на любом этапе даёт порок;</p>
<p style="margin:0 0 10px">• <b>истинный гермафродитизм</b> связывают с <b>хромосомными аберрациями</b> в эмбриональном периоде (Исаков); бывает у 10--12 % больных с тяжёлыми формами гипоспадии;</p>
<p style="margin:0 0 10px">• <b>ложный женский</b> гермафродитизм (46,XX) --- чаще всего из-за <b>врождённой гиперплазии или вирилизирующей опухоли коры надпочечников</b> (адреногенитальный синдром) --- избыток андрогенов маскулинизирует наружные органы при нормальных яичниках;</p>
<p style="margin:0 0 10px">• <b>ложный мужской</b> гермафродитизм (46,XY) --- яички есть, но недостаточно андрогенов или нечувствительность тканей к ним: наружные органы недоразвиты (тяжёлая гипоспадия);</p>
<p style="margin:0 0 10px">• причины по учебникам: мутации ферментов синтеза стероидов (дефицит 21-гидроксилазы), рецептора андрогенов, 5α-редуктазы, дисгенезия гонад, андрогены матери, опухоли.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина (Исаков)</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                     <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Истинный</b> гермафродитизм   ближе к ложному мужскому; физическое и психическое развитие по возрасту; наружные органы маскулинизированы; <b>расщеплённая мошонка</b> похожа на большие половые губы; малых губ нет; половой член размером с гипертрофированный клитор; отверстие уретры у корня члена-клитора; влагалище бывает развито, чаще по типу урогенитального синуса; в складках можно пальпировать яичко или яичник; ректально --- гипоплазированная матка</p>
<p style="margin:0 0 10px"><b>Ложный мужской</b>            наружные органы недоразвиты, <b>тяжёлая гипоспадия</b> с отверстием на промежности (мочеиспускание «по женскому типу»), расщеплённая мошонка, чаще крипторхизм; расщепление крайней плоти; психоориентация в основном мужская</p>
<p style="margin:0 0 10px"><b>Ложный женский</b>            маскулинизация: <b>клитор гипертрофирован</b> , большие губы нормальные или как расщеплённая мошонка; влагалище развито (иногда атрезировано), матка пальпируется; <b>ускоренное развитие</b> : раннее огрубение голоса, оволосение, вторичные признаки не дифференцированы, менструаций нет; психоориентация женская</p>
<p style="margin:0 0 10px"><b>Важно!</b> Внешние проявления разных форм очень похожи, поэтому установить истинный пол трудно и требует специальных исследований (Исаков). Сольтеряющая форма адреногенитального синдрома (по учебникам) в первые недели жизни может дать криз: рвота, обезвоживание, гиперкалиемия --- <b>срочное состояние</b> , нужно выявлять в первую очередь.</p>`},

<p style="margin:0 0 10px"><b>Группа DSD</b>                                 <b>Суть и основные формы</b></p>
<p style="margin:0 0 10px"><b>46,XX DSD</b> (самая многочисленная, ≈ 60 %)   генетически женский пол: <b>врождённая гиперплазия коры надпочечников</b> (самая частая причина; ранее «ложный женский»), андрогены матери, андроген-продуцирующие опухоли, пороки развития мюллеровых структур</p>
<p style="margin:0 0 10px"><b>46,XY DSD</b>                                  нормальный мужской кариотип: нарушения синтеза или действия андрогенов (недостаток тестостерона, дефицит 5α-редуктазы, <b>нечувствительность к андрогенам</b> --- полная и частичная), дисгенезия гонад, синдром персистирующих мюллеровых протоков; ранее «ложный мужской»</p>

<p style="margin:0 0 10px"><b>Овотестикулярный DSD</b>                       ранее «истинный гермафродитизм»: в организме и яичниковая, и яичковая ткань (овотестис или яичко с одной стороны и яичник с другой); кариотип может быть 46,XX, 46,XX/46,XY или 46,XY</p>
<p style="margin:0 0 10px">*По степени вирилизации наружных гениталий в литературе применяют шкалу <b>Prader (I--V)</b> (по учебникам).*</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: определение пола гормональная терапия феминизирующая пластика</b></p>
<p style="margin:0 0 10px"><b>орхипексия мультидисциплинарная команда</b></p>
<p style="margin:0 0 10px"><b>Главное:</b> лечение начинают с <b>точного определения пола и причины</b> ; у подавляющего большинства больных --- хирургическая коррекция (Исаков). Современный принцип --- <b>мультидисциплинарная команда</b> (детский хирург-уролог, эндокринолог, генетик, психолог) и участие родителей; не торопиться с хирургией, пока не установлен диагноз.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Лечение по формам (Исаков)</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                        <b>Лечение</b></p>
<p style="margin:0 0 10px"><b>Истинный</b> гермафродитизм      учитывают <b>половую психопринадлежность</b> (проявляется после 2 лет). Коррекция по женскому типу --- удаление гипертрофированного клитора и яичек. Коррекция по мужскому типу сложнее: удаление матки и яичников, выпрямление кавернозных тел, <b>уретропластика</b> , <b>орхипексия</b></p>
<p style="margin:0 0 10px"><b>Ложный мужской</b>               выпрямление полового члена, затем уретропластика и низведение яичек в мошонку; коррекция по женскому типу --- только при резкой микропении и несовершенной дифференцировке яичек</p>
<p style="margin:0 0 10px"><b>Ложный женский</b> адреналовый   женский генотип, дифференцированные яичники: гормональная терапия (регрессирует маскулинизация, яичники функционируют нормально); операция --- только при опухоли надпочечника</p>
<p style="margin:0 0 10px">Ложный женский неадреналовый     резекция гипертрофированного клитора и пластика влагалища</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Современные принципы (интернет, учебники)</b></h4></p>
<p style="margin:0 0 10px">• <b>ВГКН</b> : пожизненная терапия <b>глюкокортикоидами</b> (гидрокортизон), при сольтеряющей форме --- <b>минералокортикоид</b> (флудрокортизон); контроль 17-ОНП;</p>
<p style="margin:0 0 10px">• выбор пола воспитания --- по кариотипу, анатомии, потенциалу фертильности и функции, гормональной чувствительности, мнению родителей;</p>
<p style="margin:0 0 10px">• хирургическая коррекция: <b>феминизирующая</b> (клиторопластика с сохранением чувствительности, <b>вагинопластика</b> , разделение уретры и влагалища) и <b>маскулинизирующая</b> (пластика гипоспадии, орхипексия, удаление мюллеровых структур); сроки обсуждаются --- чаще после диагностики и совета команды;</p>
<p style="margin:0 0 10px">• гонады с Y-материалом при дисгенезии --- риск опухоли: профилактическое удаление или наблюдение;</p>
<p style="margin:0 0 10px">• гормональная заместительная терапия в пубертате.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения (по учебникам и интернет)</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>             <b>Осложнения</b></p>
<p style="margin:0 0 10px">Болезни                сольтеряющий криз (ВГКН) --- шок и летальность; ложное определение пола; бесплодие; психосоциальные проблемы; риск гонадобластомы при дисгенезии с Y-хромосомой</p>
<p style="margin:0 0 10px">Операции               стеноз влагалища и повторные пластики, потеря чувствительности клитора, свищи уретры, стриктуры, недержание, рецидив искривления, послеоперационное нагноение</p>
<p style="margin:0 0 10px">Гормональной терапии   передозировка глюкокортикоидов --- задержка роста, ожирение; недостаточность --- кризы, вирилизация</p>
<p style="margin:0 0 10px">*Из книги (Исаков) взяты лечение по каждой форме; современные принципы и осложнения --- из общих источников.*</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: физиологический фимоз рубцовый фимоз</b></p>
<p style="margin:0 0 10px"><b>гипертрофический / атрофический баланопостит степени фимоза</b></p>
<p style="margin:0 0 10px"><b>Фимоз</b> --- рубцовое сужение отверстия крайней плоти, препятствующее обнажению головки полового члена (Исаков).</p>
<p style="margin:0 0 10px"><b>Важно!</b> У мальчиков до 3--5 лет крайняя плоть обычно полностью прикрывает головку («хоботок»), и обнажение затруднено --- <b>физиологический фимоз</b> , лечения не требует (Исаков); по мере роста головка раздвигает препуциальный мешок.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез</b></h4></p>
<p style="margin:0 0 10px">• <b>физиологический</b> : возрастное сужение и эмбриональные спайки (синехии) между внутренним листком крайней плоти и головкой, проходят с ростом;</p>
<p style="margin:0 0 10px">• <b>патологический (рубцовый)</b> : плохой туалет → скопление смегмы → <b>баланопостит</b> (воспаление головки и крайней плоти) → после стихания в отверстии образуются <b>рубцы</b> ; насильственное выведение головки, травмы, повторные воспаления;</p>
<p style="margin:0 0 10px">• следствие: нарушение оттока мочи → восходящая инфекция ( <b>цистит, пиелонефрит</b> ), а у части --- инфравезикальная обструкция с ПМР и риском ХБП (Разумовский: рубцовый фимоз --- частая причина органической инфравезикальной обструкции у мальчиков).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px"><b>Критерий</b>                              <b>Виды</b></p>
<p style="margin:0 0 10px">По происхождению                          <b>физиологический</b> (до 3--4 лет, проходит сам) и <b>патологический</b> (приобретённый, рубцовый)</p>
<p style="margin:0 0 10px"><b>Исаков</b> (рис. 6-59)                    <b>гипертрофический</b> --- избыточно развитая крайняя плоть; <b>атрофический</b> --- крайняя плоть плотно облегает головку, точечное отверстие с каллёзными (омозолелыми) краями</p>
<p style="margin:0 0 10px">Клинические варианты                      <b>атрофический</b> (истончённая кожа, надрывы), <b>рубцовый</b> (грубая рубцовая ткань после воспалений), <b>спаечный</b> (спайки после неумелого лечения)</p>
<p style="margin:0 0 10px"><b>По степени</b> (4 степени, интернет)      <b>I</b> --- головка не выводится только при эрекции, в покое открывается свободно; <b>II</b> --- в покое дискомфорт, при эрекции боль; <b>III</b> --- головка не выводится в любом состоянии, мочеиспускание не нарушено; <b>IV</b> --- отёк, воспаление крайней плоти, затруднение мочеиспускания. В литературе также степени по Kayaba (I--V; по учебникам)</p>
<p style="margin:0 0 10px">Стадии инфравезикальной обструкции (Р.)   I --- полное опорожнение за счёт гипертрофии детрузора; II --- вялая струя, остаточная моча; III --- атония детрузора, парадоксальная ишурия</p>
<p style="margin:0 0 10px">*Классификации по степеням взяты из клинических описаний в интернете (в твоих книгах такого деления нет).*</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• основные жалобы при рубцовом фимозе (Исаков): <b>нарушение мочеиспускания</b> и невозможность вывести головку;</p>
<p style="margin:0 0 10px">• во время мочеиспускания ребёнок беспокоится, тужится; моча <b>раздувает препуциальный мешок</b> и выходит тонкой струйкой или каплями (Р., И.);</p>
<p style="margin:0 0 10px">• при баланопостите: боль, отёк, гиперемия, гнойное отделяемое из мешка; цистит, пиелонефрит --- лихорадка, лейкоцитурия;</p>
<p style="margin:0 0 10px">• у части детей --- каждый эпизод мочеиспускания сопровождается плачем (грудные).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика и дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px">• при внимательном осмотре диагностика проста (Исаков): сужение отверстия, рубцовое кольцо, спайки, смегма; оценивают струю мочи (напор, прерывистость) --- <b>урофлоуметрия</b> , остаточная моча (Р.);</p>
<p style="margin:0 0 10px">• анализ мочи, посев при подозрении на инфекцию; УЗИ почек и пузыря при рецидивирующих ИМП и расширении верхних путей;</p>
<p style="margin:0 0 10px">• <b>нельзя насильно выводить головку</b> --- травма крайней плоти (Исаков).</p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                <b>Отличие</b></p>
<p style="margin:0 0 10px">Физиологический фимоз                                                    возраст до 3--4 лет, кожа эластична, нет рубцов и воспаления, мочеиспускание свободно</p>
<p style="margin:0 0 10px"><b>Баланопостит</b>                                                         воспаление (отёк, гиперемия, гной) --- осложнение фимоза или самостоятельное</p>
<p style="margin:0 0 10px"><b>Парафимоз</b>                                                            ущемление головки суженным кольцом: резкая боль, отёк (Исаков, с. 502)</p>
<p style="margin:0 0 10px">Меатальный стеноз, дистальная гипоспадия, клапаны задней уретры          сужение отверстия уретры, а не крайней плоти; цистоуретрография, калибровка уретры</p>
<p style="margin:0 0 10px">Синехии крайней плоти без сужения, лихен склерозирующий (по учебникам)   белёсые атрофичные участки кожи при лихене; нужна консультация</p>`},
  {n:77, t:"Фимоз у детей. Лечение и осложнения", a:`<p style="margin:0 0 10px">*Исаков, с. 502--503; Разумовский, гл. 45 (с. 600). Консервативная терапия стероидными мазями --- интернет и общие учебники.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: круговое иссечение обрезание консервативное лечение парафимоз</b></p>
<p style="margin:0 0 10px"><b>меатотомия</b></p>
<p style="margin:0 0 10px"><b>Рубцовый фимоз --- показание к операции</b> : круговое иссечение листков крайней плоти (обрезание) (Исаков, Разумовский). Физиологический фимоз до 3--5 лет не лечат, насильно головку не выводят.</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Оценить: физиологический или рубцовый</span><span>Баланопостит --- консервативно | Рубцовый --- операция | Наблюдение, гигиена</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Лечение баланопостита (Исаков)</b></h4></p>
<p style="margin:0 0 10px">• промывание препуциального мешка <b>слабым раствором перманганата калия</b> или <b>1 % хлоргексидином</b> , затем введение <b>хлоргексидина + лидокаина</b> ;</p>
<p style="margin:0 0 10px">• шприцем <b>без иглы</b> 1--2 раза в день, <b>головку не обнажают</b> ; 2--5 дней;</p>
<p style="margin:0 0 10px">• после стихания воспаления --- наблюдение; рубцы у отверстия --- показание к операции;</p>
<p style="margin:0 0 10px">• <b>рецидивирующий баланопостит</b> , не поддающийся консервативному лечению, --- показание к обрезанию даже без выраженных рубцов.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Лечение фимоза</b></h4></p>
<p style="margin:0 0 10px"><b>Ситуация</b>                                               <b>Лечение</b></p>
<p style="margin:0 0 10px"><b>Физиологический</b> (до 3--4 лет)                          не нужно; гигиена, наблюдение (Исаков)</p>
<p style="margin:0 0 10px">Без рубцов, умеренное сужение (интернет, по учебникам)     консервативно: <b>местные кортикостероидные мази</b> (бетаметазон и др.) 4--6 нед, мягкое растяжение, гигиена; эффективность около 70--90 %</p>
<p style="margin:0 0 10px"><b>Рубцовый фимоз</b>                                         <b>круговое иссечение листков</b> крайней плоти (циркумцизия): плановая операция</p>
<p style="margin:0 0 10px">Нарушение мочеиспускания, раздувание мешка, рецидивы ИМП   операция в плановом порядке, не откладывая</p>
<p style="margin:0 0 10px">Спаечный (синехии)                                         бережное разделение спаек, лечение воспаления</p>
<p style="margin:0 0 10px">Меатальный стеноз при дистальной гипоспадии (Р.)           <b>меатотомия</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Парафимоз (Исаков, с. 502--503)</b></h4></p>
<p style="margin:0 0 10px"><b>Парафимоз</b> --- ущемление головки суженным кольцом крайней плоти при насильственном оттягивании (у детей нередко при мастурбации). Развивается отёк, нарушается кровоснабжение → возможен <b>некроз</b> . Клиника: резкая боль, нарастающий отёк, невозможность мочиться.</p>
<p style="margin:0 0 10px"><b>Срок</b>        <b>Лечение</b></p>
<p style="margin:0 0 10px">Ранний          <b>немедленное вправление</b> головки под наркозом</p>
<p style="margin:0 0 10px"><b>Срок</b>                <b>Лечение</b></p>
<p style="margin:0 0 10px">Поздний, сильный отёк   рассечение ущемляющего кольца, затем обрезание крайней плоти</p>
<p style="margin:0 0 10px">При своевременной диагностике и раннем лечении прогноз благоприятный.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Когда</b>                            <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Самого фимоза</b>                    рецидивирующий баланопостит, рубцевание, <b>парафимоз</b> (некроз головки), нарушение мочеиспускания, восходящая инфекция (цистит, пиелонефрит), инфравезикальная обструкция с ПМР и риском ХБП (Р.)</p>
<p style="margin:0 0 10px"><b>После обрезания</b> (по учебникам)   кровотечение, нагноение раны, отёк, избыточное или недостаточное иссечение, рубцовый меатальный стеноз, повреждение головки</p>
<p style="margin:0 0 10px">Насильственное выведение головки     разрывы крайней плоти, кровотечение, рубцы, парафимоз (Исаков)</p>`},
  {n:78, t:"Омфалоцеле у детей. Этиология и патогенез", a:`<p style="margin:0 0 10px">*Разумовский, гл. 26 (с. 442--443); Исаков, с. 293--294 (рис. 5-5).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: омфалоцеле грыжа пупочного канатика физиологическая грыжа</b></p>
<p style="margin:0 0 10px"><b>вращение кишечника туловищный стебель</b></p>
<p style="margin:0 0 10px"><b>Омфалоцеле</b> (грыжа пупочного канатика, пуповинная, эмбриональная грыжа) --- порок, при котором из-за раннего нарушения органогенеза <b>органы брюшной полости располагаются вне туловища</b> , под оболочками пуповины; дефект в центральной части брюшной стенки (Р., И.). Грыжевой мешок: снаружи <b>амнион</b> , изнутри <b>брюшина</b> , между ними <b>вартонов студень</b> (Р.). Код МКБ-10: <b>Q79.2</b> (в тексте Р. указан Q79.3 --- это гастрошизис).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• 1 на 4000 живых новорождённых (Р.); по Исакову --- 1 на 6000;</p>
<p style="margin:0 0 10px">• по полу различий нет; большинство детей --- доношенные (Р.);</p>
<p style="margin:0 0 10px">• <b>сочетанные пороки</b> : у 54 % (Р.), примерно у 65 % (И.): при больших грыжах --- пороки сердца (тетрада Фалло), при малых --- дивертикул Меккеля, необлитерированный желточный проток и урахус, пороки почек, атрезия ануса;</p>
<p style="margin:0 0 10px">• хромосомные аномалии: синдромы <b>Эдвардса</b> (трисомия 18), <b>Беквита--Видеманна</b> (OMG: омфалоцеле, макроглоссия, гигантизм); компонент <b>пентады Кантрелла</b> и клоакальной экстрофии.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез</b></h4></p>
<p style="margin:0 0 10px">Этиология и патогенез до конца <b>не известны</b> (Р.). Основные теории:</p>
<p style="margin:0 0 10px"><b>Теория</b>                                                  <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Нарушение вращения кишечника</b> (первый период поворота)   в норме у 5-недельного эмбриона из-за несоответствия роста кишки и брюшной полости образуется <b>физиологическая пупочная грыжа</b> , исчезающая к <b>11-й неделе</b> ; её сохранение = омфалоцеле. По Исакову: несовпадение «критических периодов» кишечника и брюшной полости; петли проходят стадию физиологической грыжи, затем «вращение» и возврат в живот</p>
<p style="margin:0 0 10px"><b>Недоразвитие передней брюшной стенки</b>                    недоразвитие брюшной полости или нарушение замыкания брюшной стенки: часть органов остаётся в пуповинных оболочках</p>
<p style="margin:0 0 10px"><b>Персистенция туловищного стебля</b> (Р.)                    в части, которая в норме занята соматоплеврой; нарушение латерального мезодермального замещения брюшины, амниона и мезодермы стебля --- объясняет многообразие сочетанных аномалий</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Нарушение замыкания брюшной стенки или вращения кишки</span><span>Органы остаются в оболочках пуповины | Нарушение развития брюшной полости и органов | Высыхание оболочек, инфекция, разрыв</span></div>
<p style="margin:0 0 10px">• <b>эмбриональные</b> грыжи --- остановка развития рано: печень не имеет фиброзной (глиссоновой) капсулы и срастается с оболочками пуповины; <b>фетальные</b> --- позже (И.);</p>
<p style="margin:0 0 10px">• недоразвитие брюшной полости ограничивает возможность вправления органов; при больших грыжах нарушается и развитие грудной клетки (Р.);</p>
<p style="margin:0 0 10px">• после рождения оболочки теряют воду и инфицируются: опасность гипотермии, дегидратации, перитонита.</p>`},
  {n:79, t:"Омфалоцеле у детей. Клиника и классификация", a:`<p style="margin:0 0 10px">*Разумовский, гл. 26 (с. 443--445, рис. 26.1--26.4); Исаков, с. 294 (классификация, клиническая картина).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: малые / средние / большие эмбриональные и фетальные</b></p>
<p style="margin:0 0 10px"><b>неосложнённые и осложнённые содержимое мешка полицитемия</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px"><b>Критерий</b>                                                     <b>Виды</b></p>
<p style="margin:0 0 10px"><b>Разумовский</b> (рабочая) --- по размеру дефекта и содержимому   <b>малые</b> , <b>средние</b> и <b>большие</b> : в малых и средних --- только кишечные петли; <b>большое</b> омфалоцеле <b>всегда содержит печень</b></p>
<p style="margin:0 0 10px"><b>Исаков</b> --- по размеру (диаметр грыжи)                        <b>небольшие</b> --- до 5 см; <b>средние</b> --- до 10 см; <b>большие</b> --- более 10 см</p>
<p style="margin:0 0 10px"><b>Исаков</b> --- по состоянию оболочек                             <b>неосложнённые</b> (оболочки не изменены) и <b>осложнённые</b> (разрыв оболочек, инфицирование)</p>
<p style="margin:0 0 10px">По времени остановки развития (И.)                               <b>эмбриональные</b> (печень без глиссоновой капсулы, срастается с оболочками) и <b>фетальные</b></p>
<p style="margin:0 0 10px">По форме мешка (И.)                                              удлинённая с узкими воротами или полушаровидная</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Признак</b>                        <b>Проявления (Исаков, Разумовский)</b></p>
<p style="margin:0 0 10px">Внешний вид                        часть органов брюшной полости в пуповинных оболочках; размер мешка от 2--5 см до гигантских 15--20 см; грыжевые ворота --- расширенное пупочное кольцо (от 1--2 см и больше); <b>пуповина переходит в мешок, видны три пупочных сосуда</b></p>
<p style="margin:0 0 10px">Содержимое                         кишечник, желудок, печень; при дефекте диафрагмы --- эктопия сердца</p>
<p style="margin:0 0 10px"><b>Оболочки</b> по времени            в первые часы блестящие, прозрачные, белесоватые; <b>к исходу первых суток высыхают, мутнеют, инфицируются, покрываются фибрином</b></p>
<p style="margin:0 0 10px">Осложнения                         при отсутствии профилактики --- СКН (синдром кишечной непроходимости), перитонит, сепсис; <b>разрыв оболочек в родах</b> --- эвентрация органов и перитонит</p>
<p style="margin:0 0 10px">Состояние ребёнка                  зависит от размера грыжи, недоношенности и незрелости, сочетанных пороков, гемодинамики и микроциркуляции</p>
<p style="margin:0 0 10px">Лабораторно                        <b>полицитемия</b> : повышены гематокрит и гемоглобин</p>
<p style="margin:0 0 10px">Малое омфалоцеле (Р., рис. 26.4)   в оболочках 1--2 петли или долька печени --- может <b>выглядеть как утолщённая пуповина</b> : при обработке пуповины возможны тяжёлые ошибки (перевязка кишки)</p>
<p style="margin:0 0 10px">Сочетанные пороки: сердце, почки, ортопедическая патология, необлитерированный желточный проток; хромосомные синдромы (Эдвардса, Беквита--Видеманна) (Р.).</p>`},
  {n:80, t:"Омфалоцеле у детей. Диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*Разумовский, гл. 26 (с. 444--445, рис. 26.4--26.5); Исаков, с. 295. Дифференциальная диагностика --- частично по учебникам.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: антенатальное УЗИ лигирование пуповины ЭхоКГ гастрошизис</b></p>
<p style="margin:0 0 10px"><b>сочетанные пороки</b></p>
<p style="margin:0 0 10px"><b>Важно!</b> Диагноз после рождения <b>не вызывает затруднений</b> (Р., И.), но при <b>малом омфалоцеле</b> в роддоме возможна ошибка при перевязке пуповины --- самое опасное.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                           <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Антенатальное УЗИ</b> (с 13--14-й недели)           над передней брюшной стенкой образование с ровными контурами, содержит петли кишки и/или печень; выявляют сопутствующую патологию и синдромальные формы (Р.)</p>
<p style="margin:0 0 10px">Родоразрешение (Р.)                                 омфалоцеле с петлями кишки --- возможны естественные роды; <b>при печени в мешке --- оперативное родоразрешение</b></p>
<p style="margin:0 0 10px"><b>Осмотр новорождённого</b>                           мешок с оболочками из пуповины; сосуды пуповины; размер ворот и содержимое; эвентрация при разрыве</p>
<p style="margin:0 0 10px"><b>Осмотр пуповинного остатка</b> (малое омфалоцеле)   позволяет подтвердить или исключить; при сомнении --- ревизия в операционной; при толстой пуповине или варикозной дисплазии сосудов пуповины --- <b>лигировать пуповину на расстоянии не менее 10--15 см от кожного края</b> ; ребёнка срочно перевести в хирургический стационар</p>
<p style="margin:0 0 10px"><b>ЭхоКГ</b> (обязательна, Р.)                         пороки сердца (до половины сочетанных пороков)</p>
<p style="margin:0 0 10px">Обследование на сочетанные пороки (И., Р.)          УЗИ брюшной полости, почек, нейросонография, рентген грудной клетки, консультация генетика, кариотип; при больших грыжах --- оценка лёгочной гипоплазии</p>
<p style="margin:0 0 10px">Лаборатория                                         полицитемия (Hb, Ht), глюкоза (синдром Беквита--Видеманна --- гипогликемия), электролиты, кровь на посев</p>

<p style="margin:0 0 10px"><b>Гастрошизис</b>                                                                                            дефект брюшной стенки <b>справа от пупка</b> (2--5 см), <b>нет оболочек</b> и грыжевого мешка, пуповина прикрепляется нормально; кишка отёчная, утолщённая, покрыта фибрином («peel»); чаще у недоношенных; сочетанные пороки --- редки (кроме кишечных атрезий); у омфалоцеле дефект по средней линии, мешок и пуповина на его вершине</p>
<p style="margin:0 0 10px"><b>Малое омфалоцеле</b> и <b>утолщённая пуповина</b> (сосудистая дисплазия)                                      тщательный осмотр, УЗИ, ревизия; лигировать пуповину ≥ 10--15 см от кожи (Р.)</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: радикальная пластика силопластика консервативное лечение</b></p>
<p style="margin:0 0 10px"><b>вентральная грыжа синдром Беквита--Видеманна</b></p>
<p style="margin:0 0 10px"><b>Лечение хирургическое или консервативное</b> ; выбор зависит от размеров грыжи (Р.). Сегодня <b>в подавляющем большинстве случаев, даже при больших омфалоцеле, возможна первичная радикальная пластика</b> передней брюшной стенки.</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Первая помощь в роддоме, кувез</span><span>Предоперационная подготовка | Радикальная или этапная пластика | Лечение осложнений, наблюдение</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Первая помощь и транспортировка (Разумовский)</b></h4></p>
<p style="margin:0 0 10px">• риск: высыхание органов, <b>гипотермия</b> , дегидратация, инфицирование брюшины;</p>
<p style="margin:0 0 10px">• широкопросветный (Ch 8) назогастральный или орогастральный зонд; интубация --- только по показаниям;</p>
<p style="margin:0 0 10px">• омфалоцеле погружают в <b>стерильный пластиковый пакет</b> и покрывают сухой ватно-марлевой повязкой; кувез 37 °С, влажность близка к 100 %;</p>
<p style="margin:0 0 10px">• обезболивание (в том числе наркотическими) при больших омфалоцеле; венозный доступ;</p>
<p style="margin:0 0 10px">• транспорт --- в кувезе, с открытым желудочным зондом, лёжа на боку, в сопровождении врача-реаниматолога.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Предоперационная подготовка</b></h4></p>
<p style="margin:0 0 10px">• мониторинг, коррекция волемических и метаболических нарушений, профилактика охлаждения, антибиотики, обезболивание; промывание желудка и очистительная клизма --- оценка проходимости ЖКТ;</p>
<p style="margin:0 0 10px">• при <b>больших омфалоцеле с печенью</b> сначала подготавливают брюшную полость: грыжу <b>фиксируют за пуповинный остаток в натянутом положении</b> перпендикулярно телу ребёнка --- за 2--3 суток брюшная стенка растягивается, затем возможна одномоментная пластика;</p>
<p style="margin:0 0 10px">• при сочетании с кишечной непроходимостью --- операция после короткой подготовки.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Методы лечения</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                                 <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Первичная радикальная пластика</b> (хирургически)         иссечь эмбриональные оболочки по краю дефекта, мобилизовать края апоневроза до сведения; для погружения печени --- мобилизовать серповидную связку до нижней полой вены (рис. 26.6). Показана при малых и средних грыжах, хорошо сформированной брюшной полости, без отягчающих факторов (глубокая недоношенность, родовая травма, сепсис) (И.): иссечение пуповинных оболочек, вправление, пластика</p>
<p style="margin:0 0 10px"><b>Этапная</b> (силопластика) --- большие омфалоцеле         если печень не погружается: <b>пластиковый резервуар</b> (временная брюшная полость; Schuster 1967, Allen и Wrenn 1969 --- силастик, подшивается к фасции, объём уменьшают мануальной компрессией); после восстановления моторики через <b>3--14 дней</b> --- удаление мешка и радикальная пластика или формирование небольшой вентральной грыжи; главный метод и сегодня (рис. 26.7)</p>
<p style="margin:0 0 10px">С непроходимостью (необлитерированный желточный проток)   одномоментно устранение причины и пластика брюшной стенки</p>
<p style="margin:0 0 10px">Заплаты (аллотрансплантаты)                               синтетические или биологические, при выраженной висцероабдоминальной диспропорции</p>
<p style="margin:0 0 10px"><b>Консервативное</b> (Р., И.)                               для огромных грыж, при множественных тяжёлых пороках, критических пороках сердца, недоразвитии брюшной полости, отягощённом фоне. Дубящие растворы: <b>повидон-йод, 5 % перманганат калия</b> , мербромин (Р.); 2 % йод, этанол, перманганат (И.): ежедневные обработки --- оболочки превращаются в чёрный струп, непроницаемый для инфекции; затем рубец → большая <b>вентральная грыжа</b> , полная эпителизация за 2--2,5 мес. При узких воротах --- рассечение апоневроза по белой линии</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>                                         <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>После операции</b> (Р.) --- редки                  <b>СКН</b> (спаечная кишечная непроходимость); вторичная инфекция, <b>НЭК</b> , сепсис; при больших омфалоцеле --- грыжа пищеводного отверстия диафрагмы, френоперикардиальная грыжа</p>
<p style="margin:0 0 10px">Повышение внутрибрюшного давления (по учебникам)   при слишком тугом ушивании: сдавление нижней полой вены, ишемия кишки, дыхательная недостаточность --- поэтому этапная пластика</p>
<p style="margin:0 0 10px"><b>Консервативное лечение</b> (Р.)                    инфицирование оболочек, их разрыв, длительное заживление, выраженный спаечный процесс; формируется вентральная грыжа</p>
<p style="margin:0 0 10px">Синдром Беквита--Видеманна                         склонность к тяжёлой <b>гипогликемии</b> --- контроль сахара, профилактика энцефалопатии</p>
<p style="margin:0 0 10px">Разрыв оболочек (И.)                               эвентрация, перитонит, сепсис</p>
<p style="margin:0 0 10px"><b>Прогноз:</b> дети без летальных пороков других органов выживают в <b>100 %</b> (Р.); при незрелости и сочетанных пороках прогноз серьёзный (И.); успешно оперированные в периоде новорождённости растут нормально. Диспансерное наблюдение --- несколько лет.</p>`},
  {n:82, t:"Гастрошизис у детей. Этиология и патогенез", a:`<p style="margin:0 0 10px">*Разумовский, гл. 27 (с. 448--450); Исаков, с. 296--297 (рис. 5-6).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: гастрошизис сосудистая теория пупочная вена химический перитонит</b></p>
<p style="margin:0 0 10px"><b>висцероабдоминальная диспропорция</b></p>
<p style="margin:0 0 10px"><b>Гастрошизис</b> (греч. gastros --- живот, schisis --- расщепление) --- порок, при котором в ранние сроки внутриутробного развития через <b>дефект передней брюшной стенки справа от нормально сформированной пуповины</b> полые органы брюшной полости перемещаются в околоплодные воды. Дефект обычно <b>2--3 см</b> ; <b>грыжевого мешка нет никогда</b> (И.). Код МКБ-10: <b>Q79.3</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• 1 на 5000 живых новорождённых; мальчики и девочки почти поровну (чуть чаще мальчики);</p>
<p style="margin:0 0 10px">• <b>более 70 %</b> детей рождаются у очень <b>молодых матерей от первой беременности</b> , часто <b>недоношенными</b> --- на 33--36-й неделе (Р.);</p>
<p style="margin:0 0 10px">• сочетанные пороки редко --- преимущественно со стороны кишечной трубки (атрезии, дивертикул Меккеля), другие органы --- 6 %, пороки сердца и ЦНС --- 1 % (Р.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• <b>этиология неизвестна</b> : ни один фактор не вызывает порок однозначно (Р.);</p>
<p style="margin:0 0 10px">• факторы риска по учебникам и литературе: молодой возраст матери, первая беременность, курение, приём лекарств и наркотиков во время беременности (вазоконстрикторы).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез: сосудистая теория (Разумовский)</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Повреждение пупочной вены или ветви омфало мезентериальной артерии</span><span>Ишемия параумбиликальной области справа | Дефект брюшной стенки справа от пупка | Эвентрация кишки в амниотическую жидкость</span></div>
<p style="margin:0 0 10px">• наиболее достоверна <b>теория сосудистого генеза</b> : внутриутробное повреждение (тромбоз, аплазия, ранняя инволюция) <b>одной из пупочных вен</b> либо ветви <b>омфаломезентериальной артерии</b> ;</p>
<p style="margin:0 0 10px">• преждевременная инволюция <b>правой пупочной вены</b> → ишемия → мезодермальные и эктодермальные дефекты; нарушение формирования дистального сегмента омфаломезентериальной артерии → ишемия околопупочной области справа → <b>парaумбиликальный дефект</b> (экспериментально подтверждено);</p>
<p style="margin:0 0 10px">• ишемия в зоне <b>верхней брыжеечной артерии</b> может не только дать дефект брюшной стенки, но и обеднить кровоснабжение кишки → резорбция стенки, <b>атрезия</b> --- отсюда высокая частота сочетания с пороками кишечной трубки;</p>
<p style="margin:0 0 10px">• выпадает короткий, не совершивший поворот отдел средней кишки, кровоснабжаемый верхней брыжеечной артерией; кишка <b>короче обычной</b> и в 3--4 раза шире, стенка отёчная, серозная оболочка мутная, признаки внутриутробного перитонита (И.).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Повреждающие факторы после эвентрации</b></h4></p>
<p style="margin:0 0 10px"><b>Фактор</b>                   <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Амниотическая жидкость</b>   химический агрессор для серозной оболочки → <b>«химический перитонит»</b> ; при внутриамниотической инфекции --- фибриновые «корки» (Р.)</p>
<p style="margin:0 0 10px">Сдавление в узком дефекте    нарушение венозного и лимфатического оттока → отёк стенки кишки, спайки (И.)</p>
<p style="margin:0 0 10px">Роды                         при прохождении по родовым путям --- кровоизлияния, разрывы, инфицирование эвентрированных органов (И.)</p>
<p style="margin:0 0 10px">После рождения               большая теплоотдающая поверхность → <b>гипотермия</b> , потери жидкости и белка, гемоконцентрация, метаболический ацидоз; <b>болевой (перитонеальный) шок и анурия</b> (И.)</p>
<p style="margin:0 0 10px">Брюшная полость              резко недоразвита --- висцероабдоминальная диспропорция, трудность вправления</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: простая форма осложнённая форма эвентрация</b></p>
<p style="margin:0 0 10px"><b>фибринозные наложения висцероабдоминальная диспропорция</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (Разумовский --- рабочая)</b></h4></p>
<p style="margin:0 0 10px">Позволяет выбрать путь ведения беременности и родов и вид хирургической коррекции.</p>
<p style="margin:0 0 10px"><b>Форма</b>                           <b>Суть</b>                                                                                                                                                                                          <b>Доля</b></p>
<p style="margin:0 0 10px"><b>Простая</b> (изолированный порок)   нет <b>висцероабдоминальной диспропорции</b> , нет сопутствующих пороков кишечника (рис. 27.1)                                                                                                       ≈ 70 %</p>
<p style="margin:0 0 10px"><b>Осложнённая</b> --- вариант 1       порок <b>без</b> диспропорции, но с <b>сопутствующими пороками</b> других органов, аномалиями формирования кишки или внутриутробной <b>перфорацией</b> кишечной стенки (рис. 27.2: атрезия тонкой кишки)   ≈ 30 % (суммарно)</p>
<p style="margin:0 0 10px"><b>Осложнённая</b> --- вариант 2       порок <b>с</b> висцероабдоминальной диспропорцией, с сочетанными пороками или без них</p>
<p style="margin:0 0 10px">Осложнённые формы, как правило, требуют <b>этапного</b> хирургического лечения.</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: пластиковый пакет безнаркозное вправление по Бианки силопластика</b></p>
<p style="margin:0 0 10px"><b>синдром сдавления НПВ энтеральное питание</b></p>
<p style="margin:0 0 10px"><b>Лечение хирургическое.</b> Начинают сразу после рождения: главное --- <b>предотвратить охлаждение</b> и защитить кишку. Операция --- после выведения из шока и восстановления диуреза (Исаков).</p>
