<p style="margin:0 0 10px">## <b>Диагностика</b></p>
<p style="margin:0 0 10px">• <b>анамнез</b> : семейный анамнез, отхождение песка и камней, колики, инфекции;</p>
<p style="margin:0 0 10px">• <b>моча</b> : эритроциты и кристаллы, лейкоциты, бактериологический посев, <b>рН мочи</b> ; <b>суточная</b> моча ---</p>
<p style="margin:0 0 10px">кальций и щавелевая кислота; проба с нитропруссидом на цистин (И.);</p>
<p style="margin:0 0 10px">• <b>кровь</b> (И.): концентрация гидрокарбоната (исключить почечный канальцевый ацидоз), кальций, фосфор,</p>
<p style="margin:0 0 10px">щелочная фосфатаза, мочевая кислота;</p>
<p style="margin:0 0 10px">• ведущие --- <b>рентгенологические методы</b> (И.): рентгеноконтрастный камень виден на <b>обзорном снимке</b> ;</p>
<p style="margin:0 0 10px"><b>экскреторная урография</b> показывает место камня, степень вторичных изменений; рентгенонегативный камень --- дефект наполнения; ретроградная пневмоуретеропиелография для рентгенонегативных камней;</p>
<p style="margin:0 0 10px">• <b>УЗИ</b> (интернет, КР СПР, EAU): рекомендовано как основной метод первой линии; видит камни, расширение</p>
<p style="margin:0 0 10px">чашечно-лоханочной системы, аномалии; <b>КТ</b> --- при неясной картине (по общим учебникам, с минимальной дозой облучения);</p>
<p style="margin:0 0 10px">• обязательны обследование мочевых путей на аномалии и обструкцию, оценка функции почек.</p>
<p style="margin:0 0 10px"><b>Метод</b>                            <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Анализ мочи, посев</b>               гематурия, лейкоцитурия, бактериурия, кристаллы; рН --- для выбора диеты</p>
<p style="margin:0 0 10px"><b>Биохимия крови и суточной мочи</b>   метаболические нарушения (кальций, фосфор, мочевая кислота, оксалаты, цистин)</p>
<p style="margin:0 0 10px"><b>Обзорная урография</b>               контрастные камни (оксалатные, фосфатные)</p>
<p style="margin:0 0 10px"><b>Экскреторная урография</b>           положение камня, дефект наполнения, гидронефроз, функция</p>
<p style="margin:0 0 10px"><b>Пневмоуретеропиелография (И.)</b>    рентгенонегативные камни почек (воздух в мочеточник)</p>
<p style="margin:0 0 10px"><b>УЗИ (интернет)</b>                   камни, расширение ЧЛС, состояние паренхимы, аномалии</p>
<p style="margin:0 0 10px"><b>Анализ удалённого камня</b>          состав камня --- для противорецидивного лечения (Р.)</p>
<p style="margin:0 0 10px">## <b>Дифференциальная диагностика</b></p>
<p style="margin:0 0 10px">В книгах есть одно прямое указание (И.): у детей раннего возраста колику трудно отличить от острых хирургических заболеваний живота. Остальное --- по общим принципам.</p>
<p style="margin:0 0 10px"><b>С чем</b>                                                         <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Острый аппендицит, «острый живот» (И.)</b>                        при правосторонней колике --- риск неоправданной аппендэктомии; иррадиация боли в пах/половые органы, гематурия, УЗИ, анализ мочи, отсутствие перитонита</p>
<p style="margin:0 0 10px"><b>Острый пиелонефрит (Р.)</b>                                       лихорадка, лейкоцитурия; камень может быть причиной --- нужны УЗИ и урография</p>
<p style="margin:0 0 10px"><b>Гидронефроз и аномалии, обструктивные уропатии</b>                расширение ЧЛС без камня; урография, УЗИ</p>
<p style="margin:0 0 10px"><b>Гематурия другой причины (гломерулонефрит, травма, опухоль)</b>   нет колики; белок, цилиндры; «гломерулярные» эритроциты; УЗИ почек</p>
<p style="margin:0 0 10px"><b>Кишечная колика, инвагинация, заворот (общие)</b>                 приступы боли, но нет мочевого синдрома; УЗИ живота</p>
<p style="margin:0 0 10px"><b>Туберкулёз почек, нефрокальциноз (общие)</b>                      изменения мочи, ЧЛС; рентген, посев на МБТ</p>
<p style="margin:0 0 10px"><b>Другие причины дизурии (цистит, уретрит)</b>                      нет камня на УЗИ и цистоскопии</p>

<p style="margin:0 0 10px"><b>Мочекаменная болезнь (уролитиаз)</b> --- заболевание, при котором из-за нарушения обмена веществ в моче образуются песок (до 1 мм) и камни (от 1 до 25 мм и больше). Они нарушают отток мочи и вызывают почечную колику и воспаление (Р.). МКБ-10: N20 --- камни почки и мочеточника, N21 --- нижних отделов, N22 --- при других болезнях.</p>
<p style="margin:0 0 10px">## <b>Лечение --- общий подход</b></p>
<p style="margin:0 0 10px">• лечение направлено на устранение камня, чтобы не погибла почечная паренхима; обязательно нужно и</p>
<p style="margin:0 0 10px"><b>предупреждение рецидивов</b> --- одного удаления камня мало (Р.);</p>
<p style="margin:0 0 10px">• знание химического состава камня нужно и для выбора способа удаления, и для противорецидивной</p>
<p style="margin:0 0 10px">терапии;</p>
<p style="margin:0 0 10px">• метод выбирают по размеру и положению камня, клинике, составу, возрасту, состоянию почек и мочевых</p>
<p style="margin:0 0 10px">путей (И.).</p>
<p style="margin:0 0 10px">## <b>Консервативное лечение</b></p>
<p style="margin:0 0 10px">• <b>цели</b> (Р.): снять боль, победить инфекцию, предупредить камнеобразование, создать условия для</p>
<p style="margin:0 0 10px">самостоятельного отхождения камней до 5--7 мм (зависит от возраста);</p>
<p style="margin:0 0 10px">• <b>почечная колика</b> (И.): тепло + анальгетики + спазмолитики; новокаиновая блокада семенного канатика</p>
<p style="margin:0 0 10px">по Лорину---Эпштейну; если не помогает --- катетеризация мочеточника выше камня (снять внутрилоханочную гипертензию). Р.: при неэффективности --- стент мочеточника, пункционная нефростома или цистостома;</p>
<p style="margin:0 0 10px">• <b>инфекция</b> --- антибиотики как в детской уронефрологии; лечат обязательно, при любом титре бактерий</p>
<p style="margin:0 0 10px">(микроорганизмы семейства Proteus ощелачивают мочу и ускоряют рост камня) (Р.);</p>
<p style="margin:0 0 10px">• <b>лекарства</b> (Р.): терпены (цистенал, артемизол, энатин) при мелких камнях у старших; спазмолитики</p>
<p style="margin:0 0 10px">(дротаверин, бенциклан и др.); фитопрепарат Канефрон; цитратные смеси (подщелачивание мочи); витамины группы В.</p>

<p style="margin:0 0 10px"><b>Оксалурия</b>    какао, шоколад, свёкла, шпинат, щавель, петрушка, морковь, зелёная фасоль, помидоры, лук, смородина, шиповник   хлеб, молоко и молочные продукты, крупы, мясо/рыба не более 150 г через день, цветная и белокочанная капуста, яблоки, груши, виноград   слабоминерализованные воды (Ессентуки № 20, Саирме)</p>

<p style="margin:0 0 10px">## <b>Диета и питьё по типу солей (Р.)</b></p>
<p style="margin:0 0 10px">Водная нагрузка у детей не должна быть такой же, как у взрослых (гидролабильность, быстрое всасывание).</p>
<p style="margin:0 0 10px">## <b>Хирургическое лечение</b></p>
<p style="margin:0 0 10px">• <b>показания</b> (И.): прогрессирование пиелонефрита, нарастание гидронефротической трансформации,</p>
<p style="margin:0 0 10px">ухудшение функции почек, постоянная выраженная боль. Р.: операции после появления литотрипсии стали редки --- нужны при крупных (коралловидных) камнях и вторичном камнеобразовании при аномалиях мочевых путей;</p>
<p style="margin:0 0 10px">• <b>операции</b> (И.): пиелолитотомия (разрез лоханки), каликотомия (чашки), нефролитотомия (паренхимы),</p>
<p style="margin:0 0 10px">уретеролитотомия; при полной потере функции --- нефрэктомия. При аномалиях --- камень удаляют и одновременно делают реконструктивную операцию (рецидивов практически нет, Р.);</p>
<p style="margin:0 0 10px">• <b>малоинвазивные методы</b> : дистанционная ударноволновая и контактная литотрипсия (цистоскоп, гибкий</p>
<p style="margin:0 0 10px">уретеропиелоскоп), трансуретральное дробление камней пузыря, извлечение мелких камней мочеточника петлями Дормиа и Цейсса (И., Р.);</p>
<p style="margin:0 0 10px">• кальциноз мочевого пузыря --- иссечение изменённой стенки с мышечным слоем, при необходимости</p>
<p style="margin:0 0 10px">неоимплантация мочеточника (Р.).</p>

<p style="margin:0 0 10px">## <b>Профилактика (метафилактика)</b></p>
<p style="margin:0 0 10px">• <b>Исаков, с. 533</b> : удаление камня не равно излечению, рецидивы частые. Для предупреждения нужны:</p>
<p style="margin:0 0 10px">постоянная диетотерапия, поддержание нужного pH мочи, периодическая антибактериальная терапия, нормализация работы ЖКТ, контроль уродинамики верхних и нижних мочевых путей, контроль суточной кристаллурии;</p>
<p style="margin:0 0 10px">• <b>из интернета</b> : профилактику начинают сразу после постановки диагноза и продолжают после операции; в</p>
<p style="margin:0 0 10px">неё входят обильное питьё, диета по типу камня, подщелачивание или окисление мочи, лечение инфекции и диспансерное наблюдение (источник: клинические рекомендации «Мочекаменная болезнь у детей», Союз педиатров России; статья Хакимовой Л.Р., Самаркандский медуниверситет). Точные суточные объёмы жидкости по возрастам проверь в рекомендациях --- я их не переписывал;</p>
<p style="margin:0 0 10px">• первичная профилактика (из причин, Р., И.): лечить инфекцию мочевых путей и обструктивные уропатии,</p>
<p style="margin:0 0 10px">учитывать эндемичность региона (жара, состав питьевой воды, дефицит витамина А, избыток витамина D).</p>
<p style="margin:0 0 10px"><b>Группа</b>               <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Самой болезни (Р.)</b>   острый и хронический калькулёзный пиелонефрит, гидронефроз, нефрогенная артериальная гипертензия, острая и хроническая почечная недостаточность (особенно при двустороннем поражении)</p>
<p style="margin:0 0 10px"><b>Лечения (Р.)</b>         травматизация паренхимы почки и мочевых путей при операциях и литотрипсии; при их развитии --- стентирование мочевых путей</p>
<p style="margin:0 0 10px"><b>Общие (И.)</b>           рецидивы нефролитиаза после операций; вторичный цистит; терминальная гематурия при камне пузыря</p>

<p style="margin:0 0 10px">## <b>Эпидемиология и причины</b></p>
<p style="margin:0 0 10px">• травмы груди составляют около 4--8 % всех детских травм; в основном (около 85 %) это <b>закрытая (тупая)</b></p>
<p style="margin:0 0 10px"><b>травма</b> , чаще при ДТП (пешеход, велосипедист) и падении с высоты;</p>
<p style="margin:0 0 10px">• у детей грудная клетка эластична, рёбра хрящевые: тяжёлые повреждения лёгких, сердца и сосудов</p>
<p style="margin:0 0 10px">возможны <b>без переломов рёбер</b> , поэтому их легко пропустить;</p>
<p style="margin:0 0 10px">• подвижное средостение: при пневмо- или гемотораксе оно быстро смещается и нарушает дыхание и</p>
<p style="margin:0 0 10px">кровообращение;</p>
<p style="margin:0 0 10px">• перелом рёбер у ребёнка --- признак тяжёлой травмы; у детей до 3 лет с переломами рёбер нужно</p>
<p style="margin:0 0 10px">исключить жестокое обращение;</p>
<p style="margin:0 0 10px">• частая причина смерти --- сочетанная травма (в серии из 472 детей Mansoura летальность 7,2 %, в</p>
<p style="margin:0 0 10px">большинстве случаев при множественной травме).</p>
<p style="margin:0 0 10px"><b>Признак</b>                              <b>Виды</b></p>
<p style="margin:0 0 10px"><b>По механизму</b>                         закрытая (тупая) и открытая (проникающая: колотая, огнестрельная)</p>
<p style="margin:0 0 10px"><b>По отношению к плевральной полости</b>   проникающая и непроникающая</p>
<p style="margin:0 0 10px"><b>Грудная стенка</b>                       ушиб, переломы рёбер и грудины, «окончатый» (флотирующий) перелом --- у детей редко</p>
<p style="margin:0 0 10px"><b>Плевра и лёгкие</b>                      ушиб лёгкого, разрыв лёгкого; пневмоторакс (закрытый, открытый, напряжённый); гемоторакс; гемопневмоторакс; подкожная эмфизема и эмфизема средостения</p>
<p style="margin:0 0 10px"><b>Средостение и другие органы</b>          повреждения трахеи и бронхов, сердца (ушиб, тампонада), крупных сосудов, пищевода, диафрагмы (в т.ч. травматическая диафрагмальная грыжа, И. с. 258)</p>
<p style="margin:0 0 10px"><b>По сочетанию</b>                         изолированная, сочетанная (с ЧМТ, травмой живота, конечностей), множественная</p>
<p style="margin:0 0 10px">## <b>Классификация</b></p>
<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• боль в груди, усиливающаяся при дыхании и кашле; щадящее поверхностное дыхание; одышка, <b>тахипноэ</b></p>
<p style="margin:0 0 10px">(обычно раньше всего), цианоз;</p>
<p style="margin:0 0 10px">• <b>ушиб лёгкого</b> : может быть без внешних признаков и без переломов рёбер, кровохарканье, нарастание</p>
<p style="margin:0 0 10px">дыхательной недостаточности в первые часы;</p>
<p style="margin:0 0 10px">• <b>пневмоторакс</b> (И.): одышка, гипоксия; коробочный перкуторный звук над половиной грудной клетки,</p>
<p style="margin:0 0 10px">ослабление дыхания; при напряжённом --- смещение средостения, шок, падение АД;</p>
<p style="margin:0 0 10px">• <b>гемоторакс</b> : притупление перкуторного звука, признаки кровопотери; массивный --- шок;</p>
<p style="margin:0 0 10px">• <b>подкожная эмфизема</b> , затруднённое дыхание, продолжающееся поступление воздуха по дренажу ---</p>
<p style="margin:0 0 10px">признаки повреждения бронха или трахеи;</p>
<p style="margin:0 0 10px">• <b>признаки повреждения средостения на рентгенограмме</b> : смещение зонда (НГ) вправо, левый</p>
<p style="margin:0 0 10px">плевральный «колпак», левосторонний гемоторакс, переломы верхних рёбер.</p>

<p style="margin:0 0 10px">## <b>Диагностика</b></p>
<p style="margin:0 0 10px">## <b>Дифференциальная диагностика</b></p>
<p style="margin:0 0 10px">Составлена мной по Исакову и общим принципам --- отдельной таблицы в книгах нет.</p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                              <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Ушиб грудной стенки без внутригрудных повреждений</b>                                  дыхание и рентген без патологии; боль локальная</p>
<p style="margin:0 0 10px"><b>Спонтанный пневмоторакс (разрыв буллы или кисты, деструктивная пневмония --- И.)</b>   нет травмы в анамнезе; у грудных --- гидропневмоторакс при пневмонии</p>

<p style="margin:0 0 10px"><b>Важно!</b> В твоих книгах про лечение травмы груди есть только строки про напряжённый пневмоторакс (Исаков). Остальное --- из интернета: проверь по лекции кафедры.</p>
<p style="margin:0 0 10px">## <b>Общие принципы</b></p>
<p style="margin:0 0 10px">• большинство травм груди у детей лечат без операции: кислород, обезболивание, инфузия (кровь при</p>
<p style="margin:0 0 10px">кровопотере) и при необходимости плевральный дренаж;</p>
<p style="margin:0 0 10px">• сначала лечат угрожающее жизни (по схеме ABCDE), потом уточняют; при <b>напряжённом пневмотораксе</b></p>
<p style="margin:0 0 10px">лечение начинают до рентгена;</p>
<p style="margin:0 0 10px">• обезболивание --- основа лечения при переломах рёбер и ушибе лёгкого (глубокое дыхание, откашливание,</p>
<p style="margin:0 0 10px">нет ателектаза и пневмонии).</p>
<p style="margin:0 0 10px"><b>Повреждение</b>                                                      <b>Лечение</b></p>
<p style="margin:0 0 10px"><b>Переломы рёбер (простые)</b>                                         обезболивание, кислород при тяжёлом состоянии, наблюдение; множественные и первого-второго ребра --- признак тяжёлой травмы, нужно искать внутренние повреждения</p>
<p style="margin:0 0 10px"><b>Ушиб лёгкого</b>                                                     кислород, обезболивание, контроль дыхания; при тяжёлой дыхательной недостаточности --- неинвазивная или искусственная вентиляция</p>
<p style="margin:0 0 10px"><b>Напряжённый пневмоторакс (И., интернет)</b>                          <b>экстренная пункция с аспирацией воздуха</b> ; при постоянном поступлении воздуха --- дренирование плевральной полости, лучше с активной аспирацией; потом устраняют причину</p>
<p style="margin:0 0 10px"><b>Открытый пневмоторакс (интернет)</b>                                 рану закрывают окклюзионной повязкой, фиксируя три стороны (получается клапан), затем плевральный дренаж через отдельный прокол вдали от раны</p>
<p style="margin:0 0 10px"><b>Гемоторакс, гемопневмоторакс, пневмоторакс более 20 %</b>            дренирование плевральной полости; при массивной подкожной эмфиземе с ИВЛ --- тоже дренаж (серия Mansoura)</p>
<p style="margin:0 0 10px"><b>Малый («скрытый») пневмоторакс, скрытый гемопневмоторакс</b>         в ряде работ дренаж удаётся не ставить при наблюдении, но нужен контроль</p>
<p style="margin:0 0 10px"><b>Разрыв лёгкого</b>                                                   дренаж; при продолжающемся поступлении воздуха и нерасправлении лёгкого --- консультация торакального хирурга, второй дренаж</p>
<p style="margin:0 0 10px"><b>Повреждения трахеи, бронхов, пищевода, сердца, крупных сосудов</b>   <b>срочная операция</b> (торакотомия); подтверждённые повреждения средостения направляют на срочную операцию</p>
<p style="margin:0 0 10px">## <b>Тактика по виду повреждения</b></p>
<p style="margin:0 0 10px">В серии из 472 детей (Mansoura, 1997--2007): консервативно лечили 29,9 %, дренировали плевру 58,1 %, торакотомия понадобилась 12,1 %. Консервативно лечили простые переломы рёбер, часть ушибов лёгких, минимальные разрывы лёгкого и часть случаев подкожной эмфиземы.</p>
<p style="margin:0 0 10px">## <b>Осложнения</b></p>

<p style="margin:0 0 10px"><b>Острые (интернет)</b>                                           напряжённый пневмоторакс; тампонада сердца; массивный гемоторакс и геморрагический шок; острая дыхательная недостаточность; асфиксия при повреждении бронха</p>
<p style="margin:0 0 10px"><b>Ранние</b>                                                      сохраняющаяся утечка воздуха и неполное расправление лёгкого (признак повреждения бронха); подкожная эмфизема; ателектаз; пневмония; нагноение или инфицирование гематомы, эмпиема плевры (по общим учебникам)</p>

<p style="margin:0 0 10px">## <b>Эпидемиология</b></p>
<p style="margin:0 0 10px">• закрытая травма органов брюшной полости --- около <b>3 %</b> всех повреждений у детей (Р.);</p>
<p style="margin:0 0 10px">• чаще страдают <b>паренхиматозные органы</b> --- селезёнка, печень, почки, поджелудочная железа; из полых</p>
<p style="margin:0 0 10px">• <b>двенадцатиперстная кишка</b> ;</p>
<p style="margin:0 0 10px">• чаще у детей 9--12--13 лет, у мальчиков; больше случаев весной и осенью;</p>
<p style="margin:0 0 10px">• повреждения желудка и кишечника --- 9,0--19,8 % всех абдоминальных повреждений; открытые</p>
<p style="margin:0 0 10px">проникающие повреждения полых органов у детей очень редки.</p>
<p style="margin:0 0 10px">## <b>Причины</b></p>
<p style="margin:0 0 10px">• неорганизованный досуг и нарушение правил дорожного движения (главные причины, Р.);</p>
<p style="margin:0 0 10px">• сильный удар по животу или спине, автомобильная травма, падение с большой высоты, сдавление;</p>
<p style="margin:0 0 10px">• <b>от чего зависит тяжесть</b> : активное напряжение мышц передней брюшной стенки защищает органы;</p>
<p style="margin:0 0 10px">наполненный полый орган легко разрывается, и содержимое изливается в свободную брюшную полость; изменённый патологически орган (например, увеличенная селезёнка) повреждается даже при небольшой травме;</p>
<p style="margin:0 0 10px">• механизм повреждения полых органов: резкое сдавление, прямой удар или противоудар,</p>
<p style="margin:0 0 10px">гидродинамическое воздействие содержимого кишки и желудка.</p>
<p style="margin:0 0 10px"><b>Признак</b>                                 <b>Виды (Р.)</b></p>
<p style="margin:0 0 10px"><b>Паренхиматозные органы --- по глубине</b>   ушибы с субсерозными и подкапсульными гематомами; внутриорганные гематомы; трещины и разрывы паренхимы с нарушением капсулы; размозжение; отрыв части или целого органа</p>
<p style="margin:0 0 10px"><b>По характеру травмы</b>                     тупая и открытая; проникающая и непроникающая; без повреждения или с повреждением полых либо паренхиматозных органов</p>
<p style="margin:0 0 10px"><b>По кровотечению</b>                         с внутрибрюшным кровотечением или без; кровотечение остановилось или продолжается к моменту госпитализации</p>
<p style="margin:0 0 10px"><b>Разрыв полого органа</b>                    с развитием калового или мочевого перитонита (желудок, кишка, мочевой пузырь)</p>
<p style="margin:0 0 10px"><b>Стенка желудка и кишки</b>                  <b>не проникающие в просвет</b> : разрыв слизистой, разрыв серозной и мышечной оболочек, гематомы стенки; <b>проникающие в просвет</b> : полные (по всей окружности) и неполные</p>
<p style="margin:0 0 10px"><b>По числу и месту</b>                        одиночные и множественные; ДПК, тощая, подвздошная, толстая кишка, брыжейка; изолированные, множественные, сочетанные</p>
<p style="margin:0 0 10px">## <b>Классификация</b></p>
<p style="margin:0 0 10px">## <b>Степени тяжести повреждения печени и селезёнки (интернет)</b></p>
<p style="margin:0 0 10px">По шкале AAST (по КТ) повреждения делят на степени I--V (для печени есть и VI). Это нужно для оценки тяжести, но по современным данным тактику определяет в основном гемодинамика, а не степень.</p>
<p style="margin:0 0 10px">• <b>степень I</b> --- самая лёгкая: например, подкапсульная гематома менее 10 % поверхности или разрыв</p>
<p style="margin:0 0 10px">капсулы глубиной менее 1 см;</p>
<p style="margin:0 0 10px">• <b>селезёнка</b> : IV --- разрыв сегментарных или воротных сосудов с лишением кровоснабжения более 25 %</p>
<p style="margin:0 0 10px">органа; V --- «раздробленная» селезёнка или повреждение сосудов ворот;</p>
<p style="margin:0 0 10px">• <b>печень</b> : VI --- отрыв печени от сосудистой ножки. Промежуточные степени (II--IV) я здесь не расписывал, чтобы не ошибиться в цифрах: возьми их из лекции или учебника, если спросят.</p>
<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• <b>паренхиматозные органы</b> (Р.): чаще тяжёлое состояние при поступлении --- шок и признаки кровопотери;</p>
<p style="margin:0 0 10px">осматривают наружные повреждения (гематомы, ссадины, следы шин, раны);</p>
<p style="margin:0 0 10px">• дыхание поверхностное, ребёнок щадит живот; болезненность в зоне повреждения (селезёнка --- левые</p>
<p style="margin:0 0 10px">верхние отделы, печень --- правое подреберье); при кровотечении в брюшную полость и разрыве полого органа --- раздражение брюшины и напряжение мышц; рвота может быть рефлекторной;</p>
<p style="margin:0 0 10px">• <b>полые органы</b> : непроникающие и прикрытые повреждения на первых этапах дают скудные симптомы,</p>
<p style="margin:0 0 10px">позже --- рвота и перитонеальные признаки; проникающие дают яркую картину: локальная боль, многократная рвота, нарастающий перитонит, часто шок и коллапс;</p>
<p style="margin:0 0 10px">• особенно тяжело --- проникающее повреждение ДПК: содержимое изливается в брюшную полость,</p>
<p style="margin:0 0 10px">стремительно развивается «острый живот»: резкая боль вверху живота, рвота, бледность, частый слабый пульс, шок.</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 2</b></span><span><b>ШАГ 3</b> | <b>ШАГ 1</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Ушиб, гематома, разрыв паренхимы / разрыв полого органа</span><span>Внутрибрюшное кровотечение / перитонит | Удар по животу, ДТП, падение | Шок, кровопотеря, «острый живот»</span></div>`},
  {n:176, t:"Травмы органов брюшной полости. Диагностика и диф. диагностика", a:`<p style="margin:0 0 10px">Разумовский, гл. 23 (с. 365--369); интернет: рекомендации APSA, обзоры по FAST и КТ у детей (Children\\'s Hospital Colorado, UNMC, AAST). Дифференциальная диагностика составлена по общим принципам.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   обзорная рентгенография · УЗИ · FAST · КТ с контрастом · лапароскопия · свободный газ</p>
<p style="margin:0 0 10px">## <b>Диагностика --- общий протокол (Р.)</b></p>
<p style="margin:0 0 10px">Диагностика при травме живота должна быть максимально быстрой и информативной.</p>
<p style="margin:0 0 10px"><b>Метод</b>                            <b>Что показывает / когда</b></p>
<p style="margin:0 0 10px"><b>Осмотр, анамнез</b>                  механизм травмы, наружные повреждения (гематомы, ссадины, следы шин), поверхностное дыхание, локальная болезненность, раздражение брюшины, шок</p>
<p style="margin:0 0 10px"><b>Обзорная рентгенография живота</b>   <b>свободный газ</b> в брюшной полости --- достоверный признак повреждения полого органа и абсолютное показание к операции; отсутствие газа не исключает разрыва --- тогда нужно динамическое наблюдение</p>
<p style="margin:0 0 10px"><b>УЗИ брюшной полости</b>              свободная жидкость или газ, повреждения печени, селезёнки, ПЖ</p>
<p style="margin:0 0 10px"><b>КТ с контрастом</b>                  при тяжёлой травме (автотравма, падение с высоты) и при изменениях по другим методам; уточняет повреждения, показывает изменения позвоночника, рёбер, костей таза</p>
<p style="margin:0 0 10px"><b>Лапароскопия</b>                     самый надёжный метод при неясной картине: подтверждает или исключает внутрибрюшное кровотечение, находит источник, часто сразу останавливает кровотечение</p>
<p style="margin:0 0 10px"><b>Анализы (интернет)</b>               общий анализ крови (Hb, Ht), группа крови, печёночные ферменты, амилаза, липаза; анализ мочи (гематурия --- повреждение почки или пузыря)</p>
<p style="margin:0 0 10px">## <b>Лапароскопия при травме живота</b></p>
<p style="margin:0 0 10px">• <b>показания</b> (Р.): неясность клиники и данных других методов; невозможность исключить повреждение</p>
<p style="margin:0 0 10px">внутренних органов при наблюдении, особенно при сочетанной травме (ЧМТ, перелом, травма груди --- симптомы живота стёрты);</p>
<p style="margin:0 0 10px">• <b>противопоказание</b> : выраженная гипотензия, когда давление держится только на инфузии крови и</p>
<p style="margin:0 0 10px">кристаллоидов --- таким детям показана срочная лапаротомия;</p>
<p style="margin:0 0 10px">• <b>что видно</b> (Р.): свободная кровь (много --- в малом тазу и обоих боковых каналах); над разрывом органа ---</p>
<p style="margin:0 0 10px">сгустки (точно показывают источник); разрыв кишки видно трудно --- смотрят косвенные признаки: парез петли, подтянутый к месту разрыва сальник, мутный выпот; поэтому начинают с панорамного осмотра;</p>
<p style="margin:0 0 10px">• забрюшинная гематома в боковом канале: лапароскопия не отвечает, есть ли повреждение почки --- нужны</p>
<p style="margin:0 0 10px">УЗИ, урография, изотопное исследование.</p>
<p style="margin:0 0 10px">## <b>FAST и КТ у детей (интернет)</b></p>
<p style="margin:0 0 10px">• ультразвуковой скрининг (FAST) у детей имеет <b>низкую чувствительность</b> : в крупных исследованиях он</p>
<p style="margin:0 0 10px">пропускал значительную часть повреждений печени и селезёнки, в том числе тяжёлых; поэтому <b>отрицательный FAST не исключает травму</b> , а положительный нужно подтвердить КТ;</p>
<p style="margin:0 0 10px">• при стабильной гемодинамике и подозрении на повреждение выполняют КТ живота и таза с внутривенным</p>
<p style="margin:0 0 10px">контрастом; показания --- наружные повреждения брюшной стенки, боль, механизм высокой энергии;</p>
<p style="margin:0 0 10px">• степень повреждения печени и селезёнки оценивают по КТ (шкала AAST).</p>
<p style="margin:0 0 10px">## <b>Дифференциальная диагностика</b></p>
<p style="margin:0 0 10px">Составлена по общим принципам детской хирургии --- в Разумовском отдельной таблицы нет.</p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                                        <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Ушиб брюшной стенки</b>                                                                          боль локальная, нет перитонита и свободной жидкости; УЗИ без патологии</p>
<p style="margin:0 0 10px"><b>Разрыв паренхиматозного органа и разрыв полого органа</b>                                        кровопотеря и шок --- паренхиматозный; свободный газ, перитонит --- полый; различают по рентгену, УЗИ, КТ, лапароскопии</p>
<p style="margin:0 0 10px"><b>Травма почки, мочевого пузыря, ПЖ</b>                                                            гематурия, боль в поясничной области; УЗИ, КТ, цистография, амилаза, липаза</p>
<p style="margin:0 0 10px"><b>Переломы нижних рёбер, таза, позвоночника</b>                                                    боль может быть «абдоминальной»; нет перитонита; рентгенография и КТ</p>
<p style="margin:0 0 10px"><b>ЧМТ и сочетанная травма</b>                                                                      нарушение сознания и сильная боль в другом месте «стирают» симптомы живота --- поэтому лапароскопия и КТ</p>
<p style="margin:0 0 10px"><b>Острые хирургические болезни живота (аппендицит, непроходимость), если нет ясного анамнеза</b>   расспрос, динамика, УЗИ</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 3</b></span><span><b>ШАГ 4</b> | <b>ШАГ 1</b> | <b>ШАГ 2</b></span></div>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   неоперативное ведение · лапароскопия · лапаротомия · гемостаз · страховой дренаж</p>
<p style="margin:0 0 10px"><b>Ситуация</b>                                                                                  <b>Тактика</b></p>
<p style="margin:0 0 10px"><b>Стабильная гемодинамика, нет перитонита, повреждение паренхиматозного органа (интернет)</b>   <b>неоперативное ведение</b> --- стандарт: наблюдение, постельный режим, контроль Hb/Ht и гемодинамики, по показаниям УЗИ/КТ; успешно примерно в 90 % случаев; ЧМТ не противопоказание</p>
<p style="margin:0 0 10px"><b>Артериальное давление держится только на инфузии крови и кристаллоидов (Р.)</b>               <b>срочная лапаротомия</b> и остановка кровотечения; лапароскопия противопоказана</p>
<p style="margin:0 0 10px"><b>Свободный газ в брюшной полости, перитонит (полый орган) (Р.)</b>                             <b>лапаротомия</b> --- абсолютное показание</p>
<p style="margin:0 0 10px"><b>Неясная картина, сочетанная травма (Р.)</b>                                                   диагностическая и лечебная лапароскопия</p>
<p style="margin:0 0 10px"><b>Небольшие линейные надрывы печени/селезёнки, кровь не нарастает (Р.)</b>                      консервативно; лапароскопию заканчивают страховочным силиконовым дренажом к органу или в малый таз</p>
<p style="margin:0 0 10px"><b>Множественные мелкие подкапсульные гематомы (Р.)</b>                                          опасности не представляют, операция не нужна</p>
<p style="margin:0 0 10px"><b>Крупная одиночная напряжённая подкапсульная гематома (Р.)</b>                                 риск спонтанного разрыва, боль --- пункция под контролем зрения + страховой катетер</p>
<p style="margin:0 0 10px">## <b>Выбор тактики</b></p>
<p style="margin:0 0 10px">## <b>Лапароскопия --- особенности (Р.)</b></p>
<p style="margin:0 0 10px">• перед введением газа --- внутривенно полиионные солевые растворы 15--28 мл/кг в час; после</p>
<p style="margin:0 0 10px">пневмоперитонеума скорость снижают до 10--12 мл/кг в час (чтобы выровнять влияние давления на кровообращение);</p>
<p style="margin:0 0 10px">• сначала аспирируют кровь (в малом тазу или между правой долей печени и боковой стенкой), затем</p>
<p style="margin:0 0 10px">осматривают печень и селезёнку; <b>сгустки над разрывом не снимают</b> --- кровотечение усилится;</p>
<p style="margin:0 0 10px">• стабильная фиксация большого сальника к органу в \\~90 % случаев говорит, что спонтанный гемостаз</p>
<p style="margin:0 0 10px">завершён;</p>
<p style="margin:0 0 10px">• риски: исходный шок, гипотермия из-за охлаждённого газа; <b>при повреждении диафрагмы</b></p>
<p style="margin:0 0 10px"><b>пневмоперитонеум может привести к напряжённому пневмотораксу</b> --- нужен набор для плевральной декомпрессии.</p>
<p style="margin:0 0 10px">## <b>Эндоскопический гемостаз (Р.)</b></p>
<p style="margin:0 0 10px"><b>Способ</b>                                                                                <b>Когда</b></p>
<p style="margin:0 0 10px"><b>Моно- или биполярная коагуляция</b>                                                       небольшие поверхностные разрывы с малым кровотечением; при глубоких повреждениях неэффективна и может усилить кровотечение</p>
<p style="margin:0 0 10px"><b>Медицинский клей, гемостатический порошок Percol, тампонада разрыва прядью сальника</b>   разрыв осушают, наносят гемостатик вокруг раны, прядь сальника фиксируют на клей; контроль гемостаза 10--15 мин</p>
<p style="margin:0 0 10px"><b>Коллагеновая пластина Tachocomb, аргоноплазменная коагуляция + порошок Percol</b>         высокая эффективность при кровотечении из паренхиматозных органов</p>
<p style="margin:0 0 10px"><b>Интракорпоральный шов</b>                                                                 небольшие повреждения кишки без вскрытия просвета</p>
<p style="margin:0 0 10px">Лапароскопия позволяет сделать меньше лишних лапаротомий и чаще выполнять органосохраняющие операции (Р.). Если эндоскопический гемостаз не удаётся, переходят на лапаротомию (срединный доступ). Спленэктомию выполняют как крайнюю меру --- по общим учебникам.</p>
<p style="margin:0 0 10px">## <b>Режим после травмы (интернет, APSA)</b></p>
<p style="margin:0 0 10px">• после выписки ограничивают физическую активность: ориентир APSA --- степень повреждения + 2 недели;</p>
<p style="margin:0 0 10px">нормальная активность --- это возвращение в школу и ходьба;</p>
<p style="margin:0 0 10px">• более новые данные: сокращённый протокол по гемодинамике (а не по степени на КТ) укорачивает</p>
<p style="margin:0 0 10px">госпитализацию без потери безопасности.</p>
<p style="margin:0 0 10px"><b>Осложнение</b>                                    <b>Комментарий</b></p>
<p style="margin:0 0 10px"><b>Продолжающееся или отсроченное кровотечение</b>   неоперативное ведение не удаётся примерно у 8 % детей (из них только 4,4 % из-за кровотечения); риск выше при высокой степени, повреждении ПЖ и нескольких органов (Colorado, Holmes 2005)</p>
<p style="margin:0 0 10px"><b>Пропущенное повреждение кишки, перитонит</b>      каловый перитонит при разрыве полого органа; признаки --- парез петли, мутный выпот (Р.)</p>
<p style="margin:0 0 10px"><b>Осложнения лапароскопии</b>                       гипотермия, нарушения гемодинамики и дыхания, напряжённый пневмоторакс при повреждении диафрагмы (Р.)</p>
<p style="margin:0 0 10px"><b>Поздние (по общим учебникам)</b>                  абсцесс, псевдокиста ПЖ, спаечная непроходимость, после спленэктомии --- риск тяжёлых инфекций</p>

<p style="margin:0 0 10px">## <b>Консервативное лечение</b></p>
<p style="margin:0 0 10px">• серьёзные повреждения, требующие экстренной операции, встречаются редко --- около 1 : 20;</p>
<p style="margin:0 0 10px">• дети со стабильной гемодинамикой, обследованные контрастной КТ, чаще всего могут избежать ревизии</p>
<p style="margin:0 0 10px">почки;</p>
<p style="margin:0 0 10px">• <b>режим</b> : госпитализация, <b>строгий постельный режим</b> , контроль лабораторных, клинических и</p>
<p style="margin:0 0 10px">гемодинамических показателей; когда исчезает макрогематурия --- больного активизируют; при повторной гематурии постельный режим возвращают;</p>
<p style="margin:0 0 10px">• <b>мочевой затёк</b> без повреждения или разрыва чашечек можно вести консервативно: самоизлечение более</p>
<p style="margin:0 0 10px">чем у 80 % при адекватном дренировании собирательной системы (обычно эндоскопический стент).</p>
<p style="margin:0 0 10px"><b>Абсолютные</b>                                                                             <b>Относительные (сочетание --- показание)</b></p>
<p style="margin:0 0 10px">продолжающееся кровотечение; снижение АД; растущая и пульсирующая околопочечная гематома   мочевой затёк; нежизнеспособный участок почки менее 20 %; неполная организация гематомы</p>
<p style="margin:0 0 10px">## <b>Хирургическое лечение: показания к ревизии</b></p>
<p style="margin:0 0 10px">Недостаточная оснащённость диагностикой может сама стать причиной активной тактики; при критическом состоянии экскреторную урографию делают на операционном столе, затем лапаротомия и ревизия.</p>
<p style="margin:0 0 10px">## <b>Техника ревизии и операции</b></p>
<p style="margin:0 0 10px">• <b>доступ</b> --- срединная лапаротомия (одновременно осматривают органы брюшной полости: при</p>
<p style="margin:0 0 10px">проникающих ранениях сочетанные повреждения --- более 90 %);</p>
<p style="margin:0 0 10px">• <b>сначала почечная ножка</b> : сосуды выделяют и берут на зажим до вскрытия фасции Героты --- это снижает</p>
<p style="margin:0 0 10px">частоту нефрэктомий (почечное кровотечение --- главная причина удаления почки);</p>
<p style="margin:0 0 10px">• <b>ушивание разрывов</b> : выделение почки, удаление нежизнеспособных тканей, гемостаз, герметичность и</p>
<p style="margin:0 0 10px">дренирование собирательной системы (нефростома или внутренний стент), ушивание и тампонада дефектов паренхимы;</p>
<p style="margin:0 0 10px">• невозможно сохранить полюс --- <b>резекция полюса</b> с тампонадой прядью сальника на ножке (быстрее</p>
<p style="margin:0 0 10px">заживает, меньше риск кровотечения и затёка);</p>
<p style="margin:0 0 10px">• <b>сосуды</b> : разрывы главных сосудов --- нерассасывающийся шов 5/0--6/0; тромбоз почечной артерии при</p>
<p style="margin:0 0 10px">тупой травме --- вторичный (надрыв интимы); КТ или ангиография в первые 8 ч помогают избежать нефрэктомии; для профилактики реноваскулярной гипертензии резецируют повреждённые сосуды в пределах здоровых тканей;</p>
<p style="margin:0 0 10px">• <b>нефрэктомия</b> : нестабильное состояние, гипотермия, нарушения свёртывания при здоровой второй почке;</p>
<p style="margin:0 0 10px">обширные сочетанные повреждения, когда восстановить почку невозможно.</p>
<p style="margin:0 0 10px">## <b>Осложнения</b></p>

<p style="margin:0 0 10px"><b>Уринома</b>              бывает менее чем в 1 % случаев; небольшие и стабильные не лечат, большие --- эндоскопическое или чрескожное дренирование</p>

<p style="margin:0 0 10px">## <b>Причины и механизм</b></p>
<p style="margin:0 0 10px">• у детей преобладает <b>тупая травма</b> : транспортные происшествия, падение с высоты, нападения; реже ---</p>
<p style="margin:0 0 10px">огнестрельные и колото-резаные раны;</p>
<p style="margin:0 0 10px">• у детей при тупой травме живота почки повреждаются <b>чаще, чем у взрослых</b> ;</p>
<p style="margin:0 0 10px">• от механизма (тупая/проникающая, закрытая/открытая) зависит тактика.</p>
<p style="margin:0 0 10px"><b>Степень</b>   <b>Тип</b>                  <b>Описание</b></p>
<p style="margin:0 0 10px"><b>I</b>         Контузия, гематома       микро- или макрогематурия при нормальных данных исследования; субкапсулярная гематома без распространения и без разрыва паренхимы</p>
<p style="margin:0 0 10px"><b>II</b>        Гематома, разрыв         нераспространяющаяся околопочечная гематома внутри околопочечной клетчатки; глубина разрыва коркового слоя менее 1 см, без повреждения собирательной системы</p>
<p style="margin:0 0 10px"><b>III</b>       Разрыв                   глубина более 1 см, без разрыва собирательной системы</p>
<p style="margin:0 0 10px"><b>IV</b>        Разрыв, травма сосудов   глубокий разрыв паренхимы с повреждением собирательной системы; повреждение почечной вены или артерии с продолжающимся кровотечением</p>
<p style="margin:0 0 10px"><b>V</b>         Разрыв, травма сосудов   полное разрушение почки; отрыв почки от почечной ножки</p>
<p style="margin:0 0 10px">## <b>Классификация (AAST, 1989; Р., табл. 53.1)</b></p>
<p style="margin:0 0 10px">При двустороннем повреждении присваивают следующую по тяжести степень (Р.). Контрастная КТ позволяет точно определить степень; экскреторная урография менее чувствительна.</p>
<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• <b>осмотр</b> : нужен полный осмотр --- часто сочетанные повреждения; при подозрении на травму шейного</p>
<p style="margin:0 0 10px">отдела --- иммобилизация; осматривают живот, грудную клетку, спину; <b>переломы нижних рёбер</b> нередко сопровождаются повреждением почки; шок;</p>
<p style="margin:0 0 10px">• <b>гематурия --- самый достоверный признак</b> : микрогематурия (более 5 эритроцитов в поле зрения) и</p>
<p style="margin:0 0 10px">макрогематурия; мочу берут первой порцией; уровень гематурии <b>не соответствует</b> степени повреждения --- при повреждении почечной ножки гематурии нет в каждом третьем случае; у детей значимые повреждения обычно при более чем 50 эритроцитах в поле зрения; при проникающих ранениях гематурия лишь у половины;</p>
<p style="margin:0 0 10px">• у детей катехоламины после травмы поддерживают АД при потере до 50 % ОЦК: <b>нормальное давление</b></p>
<p style="margin:0 0 10px"><b>не исключает тяжёлое повреждение</b> ;</p>
<p style="margin:0 0 10px">• огнестрельные раны: маленькое входное отверстие может скрывать множественные повреждения; при</p>
<p style="margin:0 0 10px">рентгенографии на входное и выходное отверстия ставят металлические метки.</p>
<p style="margin:0 0 10px">## <b>Диагностика</b></p>
<p style="margin:0 0 10px"><b>Метод</b>                    <b>Роль (Р.)</b></p>
<p style="margin:0 0 10px"><b>Общий анализ мочи</b>        гематурия; берут первую порцию (при микции или катетеризации)</p>
<p style="margin:0 0 10px"><b>УЗИ</b>                      срочная диагностика: наличие второй почки, забрюшинная гематома; не всегда точно определяет глубину разрыва и отличает гематому от мочевого затёка</p>
<p style="margin:0 0 10px"><b>Экскреторная урография</b>   основной метод во многих учреждениях; при забрюшинной гематоме во время операции --- один снимок через 10 мин после 2 мл/кг контраста</p>
<p style="margin:0 0 10px"><b>КТ с контрастом</b>          <b>наиболее информативный метод</b> : разрывы паренхимы, мочевые затёки, сочетанные повреждения кишки, печени, ПЖ, объём гематомы; минус --- плохо видит повреждение почечной вены</p>
<p style="margin:0 0 10px"><b>Артериография</b>            при подозрении на повреждение артерий; можно сразу сделать эмболизацию</p>
<p style="margin:0 0 10px">• показания к обследованию у детей <b>шире</b> , чем у взрослых (из-за скрытой кровопотери); изолированную</p>
<p style="margin:0 0 10px">микрогематурию можно наблюдать без дополнительных исследований;</p>
<p style="margin:0 0 10px">• <b>обязательно обследуют</b> : проникающие ранения, шок с микрогематурией, любую макрогематурию.</p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                      <b>Отличие</b></p>

<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• боль внизу живота (трудно отличить от боли при переломе таза); отёк, припухлость, экхимозы и ссадины</p>

<p style="margin:0 0 10px">## <b>Дифференциальная диагностика</b></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                     <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Разрыв органов живота (кровотечение, каловый перитонит)</b>   УЗИ, КТ, лапароскопия; нет затёка контраста из пузыря</p>
<p style="margin:0 0 10px"><b>Острая задержка мочи</b>                                      при задержке по катетеру получают мочу, при разрыве --- мочи нет или мало</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Перелом таза / удар по животу при полном пузыре</span><span>Разрыв: внутри- или внебрюшинный | Боль, гематурия, нет мочи по катетеру | Цистография (КТ) → тактика</span></div>`},
  {n:181, t:"Травма мочевого пузыря у детей. Лечение и осложнение", a:`<p style="margin:0 0 10px">Разумовский, гл. 53.3 (с. 714--715). Схема разрывов --- в вопросе 180.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   ушивание пузыря · цистостомия · страховой дренаж · контрольная цистография · антибиотики</p>
<p style="margin:0 0 10px"><b>Вид</b>                            <b>Частота</b>              <b>Лечение (Р.)</b></p>
<p style="margin:0 0 10px"><b>Ушиб (контузия)</b>                30--60 %                 гематурия, другие органы целы, цистограмма не изменена → специальное лечение не нужно</p>
<p style="margin:0 0 10px"><b>Экстраперитонеальн ый разрыв</b>   25--72 %                 <b>катетеризация и наблюдение</b> (по мнению ряда авторов). <b>Ревизия показана</b> : внедрение костного фрагмента в стенку, открытый перелом таза, перфорация прямой кишки, закупорка катетера сгустками в течение 24--48 ч. Часть авторов считает оправданным ушивать все полные разрывы; при сочетанных повреждениях ревизию делают во время абдоминальной операции</p>
<p style="margin:0 0 10px"><b>Внутрибрюшинный разрыв</b>         ≈ 1/4 (изолир ованные)   <b>всегда операция</b> : двухслойный шов пузыря + страховой дренаж в околопузырном пространстве; самостоятельно не заживает, при консервативном ведении --- затёк в брюшную полость и перитонит</p>
<p style="margin:0 0 10px">## <b>Тактика по виду повреждения</b></p>
<p style="margin:0 0 10px">Если экстраперитонеальные разрывы не были ушиты при ревизии живота, возможно образование мочевых свищей.</p>
<p style="margin:0 0 10px">## <b>Послеоперационное ведение</b></p>
<p style="margin:0 0 10px">• <b>антибиотики</b> для профилактики септических осложнений --- со дня травмы и до 7--14 дней после удаления</p>
<p style="margin:0 0 10px">катетера;</p>
<p style="margin:0 0 10px">• <b>контрольная цистография</b> после ушивания экстраперитонеального разрыва --- на 10--14-е сутки; дефект</p>
<p style="margin:0 0 10px">заживает у большинства к 10-м суткам, практически у всех --- к 21-м;</p>
<p style="margin:0 0 10px">• нет затёков мочи на цистограмме --- катетер удаляют; иначе повторная цистография на 21-е сутки;</p>
<p style="margin:0 0 10px">• после надёжного восстановления герметичности контрольную цистографию можно сделать уже на 7--10-е</p>
<p style="margin:0 0 10px">сутки.</p>
<p style="margin:0 0 10px"><b>Группа</b>    <b>Осложнения (Р.)</b></p>
<p style="margin:0 0 10px"><b>Ранние</b>    выделение мочи через швы (обычно устраняют дренированием пузыря); расхождение раны; кровотечение (вскрытие тазовой гематомы); тазовый абсцесс (гематома может быть контаминирована бактериями или грибами); перитонит; инфекция мочевых путей; мочевые свищи при неушитом разрыве</p>
<p style="margin:0 0 10px"><b>Поздние</b>   уменьшение ёмкости пузыря, императивные позывы, недержание мочи; со временем симптомы могут исчезнуть, так как пузырь хорошо растяжим (результат расширенной хирургической обработки раны)</p>
<p style="margin:0 0 10px">## <b>Осложнения</b></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 2</b></span><span><b>ШАГ 3</b> | <b>ШАГ 4</b> | <b>ШАГ 1</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Внутрибрюшинный → операция, 2-слойный шов + дренаж</span><span>Внебрюшинный → катетер / ревизия по показаниям | Антибиотики; цистография на 10--14 сутки | Цистография: вид разрыва</span></div>`},
  {n:182, t:"Травма уретры у детей. Причины, классификация, диагностика, лечение и осложнение", a:`<p style="margin:0 0 10px">Разумовский, гл. 53.4 (с. 716--719). Интернет: классификация Голдмана (Goldman, J Urol 1997) по обзорам JCDR и PMC; сроки отсроченной пластики --- Frontiers in Pediatrics 2019 (Podesta) и Urology Annals 2016.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   перелом таза · задняя уретра · уретроррагия · уретрография · эпицистостома · стриктура</p>
<p style="margin:0 0 10px">Код МКБ-10: <b>S37.3</b> --- травма мочеиспускательного канала. Повреждения от ушиба и надрыва до полного разрыва.</p>
<p style="margin:0 0 10px">## <b>Эпидемиология</b></p>
<p style="margin:0 0 10px">• встречаются достаточно часто, в основном у <b>мальчиков</b> ; преобладают закрытые повреждения;</p>
<p style="margin:0 0 10px">• у девочек --- значительно реже, чаще в допубертатном возрасте (в постпубертате уретра и связки</p>
<p style="margin:0 0 10px">подвижнее и эластичнее);</p>
<p style="margin:0 0 10px">• самый частый и тяжёлый вид у детей --- <b>разрыв задней уретры при переломе костей таза</b> или во время</p>
<p style="margin:0 0 10px">проктологических операций; ятрогенные (несоразмерные металлические инструменты) и бытовые травмы --- легче.</p>
<p style="margin:0 0 10px"><b>Механизм</b>                                                                                                            <b>Какая уретра</b>              <b>Особенности</b></p>
<p style="margin:0 0 10px"><b>Перелом костей таза (ДТП, падение с высоты)</b>                                                                         задняя                        самое тяжёлое; шок, острая анемия, часто разрыв пузыря; летальность при переломах таза 10--20 %</p>
<p style="margin:0 0 10px"><b>Падение промежностью на острый предмет; огнестрельные ранения (Р.)</b>                                                  открытые повреждения задней   первичную пластику не делают</p>
<p style="margin:0 0 10px"><b>Удар по промежности «верхом» (по общим учебникам)</b>                                                                   передняя                      гематома, урогематома мошонки</p>
<p style="margin:0 0 10px"><b>Ятрогенные: катетер, бужи и инструменты несоразмерного калибра, проктологические и гинекологические операции (Р.)</b>   любая                         чаще надрывы и частичные разрывы</p>
<p style="margin:0 0 10px">## <b>Причины</b></p>
<p style="margin:0 0 10px">## <b>Классификация</b></p>
<p style="margin:0 0 10px">• по характеру: <b>закрытые и открытые</b> ; <b>изолированные и сочетанные</b> ; по локализации (передняя/задняя)</p>
<p style="margin:0 0 10px">и наличию осложнений (Р.);</p>
<p style="margin:0 0 10px">• по виду: ушиб, надрыв, частичный и полный разрыв, слепое и сквозное ранение (с повреждением или без</p>
<p style="margin:0 0 10px">повреждения всех слоёв стенки); для выбора тактики важно <b>смещение концов уретры</b> (диастаз) (Р.).</p>
<p style="margin:0 0 10px"><b>Классификация Голдмана</b> (модификация Колапинто и Маккалума) --- из интернета:</p>
<p style="margin:0 0 10px"><b>Тип</b>   <b>Описание</b></p>
<p style="margin:0 0 10px"><b>I</b>     задняя уретра растянута, но целостность сохранена</p>
<p style="margin:0 0 10px"><b>II</b>    разрыв простатомембранозного отдела выше мочеполовой диафрагмы</p>
<p style="margin:0 0 10px"><b>III</b>   частичный или полный разрыв и задней, и передней уретры с повреждением мочеполовой диафрагмы</p>
<p style="margin:0 0 10px"><b>IV</b>    повреждение шейки мочевого пузыря с переходом на уретру (IVa --- повреждение дна пузыря с околоуретральным затёком, имитирует травму задней уретры)</p>
<p style="margin:0 0 10px"><b>V</b>     частичное или полное изолированное повреждение передней уретры</p>

<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• <b>уретроррагия</b> (кровь из наружного отверстия) и <b>боль при попытке мочеиспускания</b> --- основные</p>
<p style="margin:0 0 10px">симптомы; надрыв слизистой даёт кровотечение и задержку мочи;</p>
<p style="margin:0 0 10px">• частичные разрывы передней уретры --- гематомы и урогематомы (в том числе большие, в области</p>
<p style="margin:0 0 10px">мошонки);</p>
<p style="margin:0 0 10px">• разрывы задней уретры --- <b>внутритазовые урогематомы</b> , которые оттесняют пузырь вверх и увеличивают</p>
<p style="margin:0 0 10px">расстояние между концами уретры;</p>
<p style="margin:0 0 10px">• при переломе таза --- шок, продолжающееся кровотечение, острая анемия, сочетание с другими органами,</p>
<p style="margin:0 0 10px">особенно с разрывом пузыря;</p>
<p style="margin:0 0 10px">• классическая триада при разрыве задней уретры (интернет): кровь из меатуса + невозможность</p>
<p style="margin:0 0 10px">помочиться + перелом таза с гематомой;</p>
<p style="margin:0 0 10px">• без лечения: урогематомы нагнаиваются, промежуток между краями заполняется рубцом → <b>стриктура</b></p>
<p style="margin:0 0 10px"><b>или облитерация</b> .</p>
<p style="margin:0 0 10px"><b>Метод</b>                                                       <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Механизм травмы, осмотр</b>                                     позволяет предположить уровень повреждения; урогематома, кровь из уретры</p>
<p style="margin:0 0 10px"><b>Обзорный снимок таза</b>                                        переломы костей таза</p>
<p style="margin:0 0 10px"><b>Восходящая (ретроградная) уретрография</b>                      основной метод: затёк контраста, уровень и вид повреждения</p>
<p style="margin:0 0 10px"><b>Нисходящая или встречная уретрография 15--20 % контрастом</b>   при тяжёлых повреждениях --- оценка расстояния между концами</p>
<p style="margin:0 0 10px"><b>Ненасильственная катетеризация мягким катетером</b>             по показаниям, осторожно; при подозрении на травму уретры катетер «вслепую» не вводят</p>
<p style="margin:0 0 10px"><b>Уретроскопия</b>                                                при ятрогенных повреждениях (надрывы, частичные разрывы): определяет место и вид, сразу позволяет оставить постоянный катетер</p>
<p style="margin:0 0 10px">## <b>Диагностика (Р.)</b></p>
<p style="margin:0 0 10px">## <b>Лечение</b></p>
<p style="margin:0 0 10px">Тактика зависит от состояния ребёнка, вида повреждения, сочетанных повреждений и квалификации хирурга (Р.).</p>
<p style="margin:0 0 10px"><b>Ситуация</b>                                                      <b>Что делают</b></p>
<p style="margin:0 0 10px"><b>Перелом таза, закрытый разрыв задней уретры (острый период)</b>   противошоковые мероприятия, коррекция гиповолемии и анемии, гемостаз. <b>До выведения из шока уретру не ушивают</b> : дренируют пузырь <b>цистостомой</b> (иногда + уретральный катетер); при кровотечении и подозрении на травму живота --- лапаротомия или лапароскопия с цистостомией; при полном пузыре --- пункционная цистостома под лапароскопией</p>
<p style="margin:0 0 10px"><b>Установка уретрального катетера при разрыве задней уретры</b>     по проводнику или за нить (метод встречных бужей, буж введён ретроградно под контролем пальца); катетер с микроотверстиями (промывание при неполном, дренаж при полном разрыве); невозможно --- промежностный доступ и катетер под контролем зрения</p>
<p style="margin:0 0 10px"><b>После выведения из шока</b>                                       отсроченная ревизия, дренирование урогематом, первично-отсроченный шов, если нет натяжения и размозжения; при нагноении гематомы шов не накладывают --- постоянный катетер и дренирование затёков</p>
<p style="margin:0 0 10px"><b>Первичный шов</b>                                                 при полном разрыве --- в первые 6 ч, малом диастазе, без размозжения. У детей с переломами таза после шва частота стриктур высока, поэтому лучше сопоставить концы на катетере, дренировать урогематомы и вернуть пузырь на место</p>
<p style="margin:0 0 10px"><b>Открытые повреждения задней уретры</b>                            первичная пластика не показана: высокое сечение пузыря, катетер под контролем пальца, эпицистостома (катетер удаляют через 1--2 нед после заживления раны на промежности); при ране прямой кишки --- колостома, ушивание кишки и прокладка из сальника или мышцы; при повреждении во время операции --- шов или анастомоз на катетере</p>
<p style="margin:0 0 10px"><b>Передняя уретра</b>                                               первые 6 ч, полный разрыв --- первичная пластика; неполный --- катетер по струне под эндоскопическим контролем; огнестрельные раны и большой диастаз --- щадящая хирургическая обработка и двойная уретростома, затем операция Йоханссона (тубуляризация кожного лоскута) через 6--8 мес</p>
<p style="margin:0 0 10px"><b>Девочки</b>                                                       первичная пластика нежелательна (повреждено влагалище, плохие ткани): катетер, эпицистостома, дренирование урогематом, реконструкция через \\~6 мес, когда сформируется стриктура</p>
<p style="margin:0 0 10px"><b>Интернет: полный разрыв задней уретры у детей</b>                 стандарт --- цистостомия и <b>отсроченная уретропластика</b> через 3--6 мес; ранняя репозиция (реалайнмент) --- при разрыве шейки пузыря, ране прямой кишки, длинном диастазе</p>
<p style="margin:0 0 10px"><b>Когда</b>       <b>Осложнения (Р.)</b></p>
<p style="margin:0 0 10px"><b>Ранние</b>      <b>инфекция</b> --- главное: нагноение урогематомы, абсцесс; распространение по фасциальным пространствам на брюшную полость, грудную клетку, промежность; уретрокожные свищи, периуретральные дивертикулы, некротический фасциит (гангрена Фурнье). Профилактика --- ранняя диагностика, быстрое отведение мочи, антибиотики</p>
<p style="margin:0 0 10px"><b>Поздние</b>     <b>рецидивирующая стриктура</b> (после стандартных методов --- до 15 %; большинство лечат дилатацией и рассечением, 1--2 % нужны повторные реконструкции); облитерация; недержание мочи и импотенция (чем проксимальнее повреждение, тем выше риск); мочевые свищи</p>
<p style="margin:0 0 10px"><b>У девочек</b>   стриктуры влагалища, уретровлагалищные свищи</p>
<p style="margin:0 0 10px">## <b>Осложнения</b></p>

function renderQuestions(list) {
  document.getElementById('qList').innerHTML = list.map(q => `
    <li class="q-item" data-title="${q.t.toLowerCase()}">
      <div class="q-header" onclick="toggleQ(this)">
        <span class="q-num">${q.n}</span>
        <span class="q-title">${q.t}</span>
        <span class="q-toggle">▼</span>
      </div>
      <div class="q-body">${q.a}</div>
    </li>`).join('');
  document.getElementById('qCount').textContent = list.length;
}
function toggleQ(h) {
  const item = h.parentElement;
  const open = item.classList.contains('open');
  document.querySelectorAll('.q-item.open').forEach(e => e.classList.remove('open'));
  if (!open) item.classList.add('open');
}
renderQuestions(fullQuestions);
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  let n = 0;
  document.querySelectorAll('.q-item').forEach(item => {
    const ok = !q || item.getAttribute('data-title').includes(q);
    item.style.display = ok ? '' : 'none';
    if (ok) n++;
  });
  document.getElementById('qCount').textContent = n;
});
</script>
