<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   острый · подострый · хронический · атипичные формы · фазы · абсцесс Броди · склерозирующий Гарре</p>
<p style="margin:0 0 10px">## <b>Классификация остеомиелита (Р., И.)</b></p>
<p style="margin:0 0 10px"><b>Признак</b>                                          <b>Виды</b></p>
<p style="margin:0 0 10px"><b>По течению (Р.)</b>                                  <b>острый, подострый, хронический</b> и <b>атипичные формы</b> (И.: острая и хроническая стадии, атипичные формы; подострая стадия --- начало репарации, заканчивается выздоровлением или переходит в хроническую)</p>
<p style="margin:0 0 10px"><b>Формы острого гематогенного остеомиелита</b>         Р.: <b>локальная и генерализованная</b> ; И.: <b>токсическая (адинамическая), септико-пиемическая и местная</b></p>
<p style="margin:0 0 10px"><b>Фазы и стадии (Р., дополнение к классификации)</b>   в каждую форму включают: <b>интрамедуллярную и экстрамедуллярную фазы</b> , острую и подострую стадии, <b>острое и рецидивирующее течение</b></p>
<p style="margin:0 0 10px"><b>Хроническое течение (Р.)</b>                         две стадии --- <b>ранняя и поздняя</b> ; переход в хроническую стадию, если за 4--6 мес процесс не закончился, сохраняются обострения, свищи и гноетечение; происходит в 10--30 % случаев</p>
<p style="margin:0 0 10px"><b>Атипичные формы (Р., И.)</b>                         <b>абсцесс Броди</b> ; <b>склерозирующий остеомиелит Гарре</b> ; <b>альбуминозный остеомиелит Олье</b> ; <b>антибиотический</b> остеомиелит (развивается при высоких иммунобиологических свойствах: острую стадию часто не регистрируют; название «первично-хронический» неправильное)</p>
<p style="margin:0 0 10px"><b>По возрасту</b>                                      остеомиелит новорождённых и грудных (метаэпифизарный/эпифизарный: местная, токсическая, септикопиемическая формы --- вопросы 132--133); остеомиелит детей старшего возраста (чаще метафиз и диафиз)</p>
<p style="margin:0 0 10px"><b>По локализации очага в кости (общие учебники)</b>    эпифизарный, метафизарный, диафизарный, тотальный (паностит); по сегменту (бедро, голень, плечо и т.д.)</p>
<p style="margin:0 0 10px"><b>По пути проникновения</b>                            гематогенный (основной) и контактный (одонтогенный, остеомиелит ребра при эмпиеме, фаланг при панариции)</p>
<p style="margin:0 0 10px">## <b>Хронический остеомиелит --- структура процесса (Р.)</b></p>
<p style="margin:0 0 10px">• <b>секвестры</b> --- омертвевшие участки кости: от обширных до мелких, единичные и множественные;</p>
<p style="margin:0 0 10px"><b>кортикальные</b> (участок компактного слоя) и <b>центральные</b> (из глубины кости);</p>
<p style="margin:0 0 10px">• <b>секвестральная полость</b> и <b>секвестральная коробка</b> (капсула из пери- и эндоста и уплотнённой кости;</p>
<p style="margin:0 0 10px">между капсулой и секвестром --- грануляции и гной);</p>
<p style="margin:0 0 10px">• течение с ремиссиями и обострениями, свищи; <b>факторы хронизации</b> : позднее начало лечения,</p>
<p style="margin:0 0 10px">неправильная по направленности, объёму и длительности терапия, низкий или быстро истощаемый защитный потенциал организма (два--три фактора предопределяют хронизацию).</p>
<p style="margin:0 0 10px">## <b>Атипичные формы кратко (Р.)</b></p>
<p style="margin:0 0 10px"><b>Форма</b>                  <b>Характеристика</b></p>
<p style="margin:0 0 10px"><b>Абсцесс Броди</b>          длительное течение, слабая ноющая боль, умеренная температура; метафиз большеберцовой, бедренной, плечевой кости; на рентгене округлая зона деструкции с перифокальным склерозом, секвестров и свищей нет; лечение --- трепанация кости и выскабливание грануляций</p>
<p style="margin:0 0 10px"><b>Склерозирующий Гарре</b>   клиника как при абсцессе Броди; утолщение кости со склерозом костномозгового канала; лечение --- антибиотики, УВЧ; при секвестрах --- выскабливание, краевая резекция</p>
<p style="margin:0 0 10px"><b>Альбуминозный Олье</b>     очень редкий; склероз кости, сужение канала, в нём беловатая/желтоватая жидкость; трепанация кости и удаление жидкости</p>
<p style="margin:0 0 10px"><b>Антибиотический</b>        абортивное течение и стёртая рентген-картина; трудно отличить от остеоид-остеомы, остеолитической саркомы, эозинофильной гранулёмы</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 3</b> | <b>ШАГ 4</b> | <b>ШАГ 2</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Острый (интрамедуллярная → экстрамедуллярная фаза)</span><span>Хронический (через 4--6 мес): секвестры, свищи | Остаточные явления / атипичные формы | Подострый: репарация</span></div>`},
  {n:137, t:"Гематогенный остеомиелит у детей. Диагностика и диф. диагностика", a:`<p style="margin:0 0 10px">Разумовский, гл. 59 (с. 771--773, 776--777); Исаков, 7.9.1--7.9.2 (с. 561--563, 570, рис. 7-7).</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   МРТ · рентген (14--21 день) · линейный периостит · остеоперфорация · внутрикостное давление · ревматизм · флегмона</p>
<p style="margin:0 0 10px">## <b>Диагностика острого гематогенного остеомиелита</b></p>
<p style="margin:0 0 10px"><b>Метод</b>                                                                                                                                                                                                                                                                                         <b>Что находят (Р., И.)</b></p>
<p style="margin:0 0 10px"><b>Осмотр, физикальные данные</b>                                                                                                                                                                                                                                                                    припухлость, инфильтрация, усиление венозного рисунка; <b>резкая локальная болезненность при пальпации и перкуссии</b> ; контрактура; гиперемия и флюктуация --- поздно</p>
<p style="margin:0 0 10px"><b>Кровь</b>                                                                                                                                                                                                                                                                                         <b>лейкоцитоз 30--40×10⁹/л</b> со сдвигом влево, токсическая зернистость; <b>СОЭ до 60 мм/ч</b> и долго держится; диспротеинемия (↑ глобулины, гипоальбуминемия); при длительном течении --- анемия; коагулограмма: ↑ фибриноген и фибринолитическая активность, ↑ протромбиновый индекс, ускорение рекальцификации, ↓ время свёртывания</p>
<p style="margin:0 0 10px"><b>МРТ (Р.)</b>                                                                                                                                                                                                                                                                                      <b>единственный неинвазивный метод ранней диагностики</b> : отёк и деструкция костного мозга, вовлечение надкостницы и тканей; минус --- 30--40 мин, неподвижность (седация, наркоз у малышей)</p>
<p style="margin:0 0 10px"><b>Радионуклидное сканирование (И.)</b>                                                                                                                                                                                                                                                              раннее и точное определение локализации и распространённости (технеций), компьютерная обработка</p>
<p style="margin:0 0 10px"><b>Рентгенография</b>                                                                                                                                                                                                                                                                                признаки <b>не ранее 14--21-го дня</b> : разрежение и смазанность кости, остеопороз, крупнопятнистый рисунок (рассасывание трабекул), расплывчатость контуров кортикального слоя; <b>наиболее достоверный --- линейный периостит</b> (тонкая полоска или вуалеподобная тень вдоль кортикального слоя; сильнее при диафизарном, слабее при метафизарном и эпифизарном очаге); далее некроз и лизис с замещением гноем и грануляциями --- от метафиза к диафизу</p>
<p style="margin:0 0 10px"><b>Внутрикостное давление (И.)</b>                                                                                                                                                                                                                                                                   повышение подтверждает диагноз даже без гноя под надкостницей и в канале</p>
<p style="margin:0 0 10px"><b>Диагностическая костная пункция (И.)</b>                                                                                                                                                                                                                                                          в сомнительных случаях, цитология пунктата; при эпифизарном остеомиелите --- <b>лечебно-диагностическая пункция сустава</b> (решающее значение, Р.)</p>
<p style="margin:0 0 10px"><b>Важно!</b> Динамическое наблюдение для уточнения диагноза <b>противопоказано</b> и на догоспитальном этапе, и в стационаре. Предположительный диагноз --- показание к <b>ранней поисковой остеоперфорации</b> ; <b>стандарт диагностики --- 48 ч</b> от начала болезни; подготовка не более 2--3 ч (Р.).</p>
<p style="margin:0 0 10px">![](media/image139.jpg){width="1.2499989063867016in" height="2.887697944006999in"}</p>
<p style="margin:0 0 10px">*Рис. 7-7 (И., с. 563). Острый гематогенный остеомиелит большеберцовой кости. Рентгенограмма.*</p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                                      <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Ревматизм</b>                                                                                  «летучие» боли в суставах, изменения сердца на ЭКГ; боль и припухлость <b>над суставом, а не над костью</b></p>
<p style="margin:0 0 10px"><b>Флегмона</b>                                                                                   гиперемия и поверхностная флюктуация появляются <b>гораздо раньше</b> ; контрактура около сустава менее стойкая, расправляется при осторожных пассивных движениях; иногда диагноз --- только при вскрытии очага</p>
<p style="margin:0 0 10px"><b>Костный туберкулёз (редко)</b>                                                                 постепенное начало; ребёнок продолжает пользоваться конечностью; симптом Александрова (утолщение кожной складки), атрофия мышц; на рентгене остеопороз («тающий сахар»), нечёткая периостальная реакция; «острые» формы --- при прорыве гноя в сустав (специфическая флора в пунктате)</p>
<p style="margin:0 0 10px"><b>Травма костей</b>                                                                              анамнез, нет септических проявлений, рентген; подднадкостничные переломы --- на повторном снимке через 6--8 дней нежная костная мозоль</p>
<p style="margin:0 0 10px"><b>Гнойный артрит (И.)</b>                                                                        сустав увеличен больше, выпот гнойный, контрактура раньше; процесс в суставе без остеомиелита</p>
<p style="margin:0 0 10px"><b>Хронический остеомиелит: туберкулёз, саркома Юинга, остеогенная саркома, остеоид-остеома</b>   туберкулёз --- вялый, без больших секвестров; Юинг --- волнообразное, диафиз, луковичный периостит; остеогенная --- козырёк, спикулы; остеоид-остеома --- ночная боль, ободок склероза, часто решает биопсия</p>
<p style="margin:0 0 10px">## <b>Дифференциальная диагностика острого остеомиелита</b></p>
<p style="margin:0 0 10px">Диагностика хронического остеомиелита (Р.): свищи и рубцы, утолщение кости, атрофия мягких тканей; рентген --- остеопороз наряду с остеосклерозом, секвестральная капсула с секвестрами; КТ уточняет объём; радиоизотопное исследование --- активность процесса и отличие от опухоли.</p>`},
  {n:138, t:"Гематогенный остеомиелит у детей. Лечение", a:`<p style="margin:0 0 10px">Разумовский, гл. 59 (с. 773--779); Исаков, 7.9.1--7.9.3 (с. 563--575, рис. 7-8, 7-10).</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   остеоперфорация · антибиотики · дезинтоксикация · иммунотерапия · дренажно-промывная система · некрэктомия</p>
<p style="margin:0 0 10px">Три направления (Р., И.): <b>воздействие на макроорганизм</b> (интоксикация, гомеостаз), <b>на возбудитель</b> и <b>своевременная санация местного очага</b> . Только <b>раннее комплексное лечение в острой фазе</b> предупреждает переход в хронический остеомиелит.</p>
<p style="margin:0 0 10px">## <b>1. Воздействие на макроорганизм</b></p>
<p style="margin:0 0 10px">• <b>дезинтоксикация</b> : 10 % раствор декстрозы с инсулином, декстран (средняя мол. масса 50 000--70 000),</p>
<p style="margin:0 0 10px">аминофиллин, нативная плазма; контроль электролитов, КОС, функции почек; регуляция белкового и углеводного обмена;</p>
<p style="margin:0 0 10px">• <b>десенсибилизация</b> , нормализация проницаемости: препараты кальция, хлоропирамин;</p>
<p style="margin:0 0 10px">• <b>иммунотерапия</b> (пассивная иммунизация): гипериммунная стафилококковая плазма, нормальный</p>
<p style="margin:0 0 10px">иммуноглобулин, антистафилококковый гамма-глобулин (Пентаглобин, Габриглобин --- Р.);</p>
<p style="margin:0 0 10px">• при тяжёлых формах (угнетение коры надпочечников) --- <b>гидрокортизон/преднизолон коротким</b></p>
<p style="margin:0 0 10px"><b>курсом до 7 дней</b> (И.);</p>
<p style="margin:0 0 10px">• внутрисосудистые и экстракорпоральные методы детоксикации (лазерное и УФО крови, дискретный</p>
<p style="margin:0 0 10px">плазмаферез и др.) (Р.).</p>
<p style="margin:0 0 10px">## <b>2. Воздействие на возбудитель</b></p>
<p style="margin:0 0 10px">• выбор антибиотика --- по микроскопии мазка (по Граму) из костного мозга или гнойных очагов;</p>
<p style="margin:0 0 10px">• <b>комбинация оксациллин + нетилмицин</b> или препараты широкого спектра --- <b>цефалоспорины III(--IV)</b></p>
<p style="margin:0 0 10px"><b>поколения</b> ; при неэффективной предшествующей терапии --- цефалоспорины + <b>ванкомицин, линезолид или рифампицин</b> (линезолид по И. --- 10 мг/кг 2 раза в сутки; эффективность антибиотиков выше в сочетании с протеолитическими ферментами);</p>
<p style="margin:0 0 10px">• <b>второй курс --- противорецидивный</b> после стихания процесса: препараты с хорошей биодоступностью и</p>
<p style="margin:0 0 10px">тропностью к кости (фузидиевая кислота, линкомицин, клиндамицин) <b>2--3 недели</b> ;</p>
<p style="margin:0 0 10px">• антибиотики отменяют при <b>стойкой нормализации температуры</b> , исчезновении воспаления в очаге и</p>
<p style="margin:0 0 10px">нормализации общего анализа крови.</p>
<p style="margin:0 0 10px">## <b>3. Санация очага --- остеоперфорация</b></p>
<p style="margin:0 0 10px">• тяжёлые формы в большинстве обусловлены внутрикостной гипертензией → <b>первостепенное значение</b></p>
<p style="margin:0 0 10px"><b>имеет раннее оперативное вмешательство --- остеоперфорация</b> ;</p>
<p style="margin:0 0 10px">• <b>техника</b> : разрез мягких тканей <b>не менее 10--15 см</b> , продольное рассечение надкостницы; на границе со</p>
<p style="margin:0 0 10px">здоровой костью наносят <b>2--3 перфоративных отверстия диаметром 3--5 мм</b> ; при длительности 2--3 дня содержимое канала может быть серозно-гнойным; на 5--6-е сутки гной обнаруживают и под надкостницей (субпериостальный абсцесс);</p>
<p style="margin:0 0 10px">• <b>промывание</b> костномозгового канала через отверстия антисептиками (И.: нитрофурал 1:5000 с</p>
<p style="margin:0 0 10px">антибиотиками, рис. 7-8); в тяжёлых случаях --- <b>костный диализ</b> первые 2--3 суток (капельное внутрикостное введение антисептика или ванкомицина, И.);</p>
<p style="margin:0 0 10px">• после операции боль уменьшается --- <b>иммобилизация не нужна</b> , ранние движения в постели улучшают</p>
<p style="margin:0 0 10px">кровообращение и восстановление функции сустава; <b>глубокая гипсовая лонгета</b> --- только при явных признаках деструкции кости;</p>
<p style="margin:0 0 10px">• <b>консервативный вариант</b> (Р.): при подтверждении МРТ и отсутствии распространения процесса за</p>
<p style="margin:0 0 10px">пределы кости --- антибиотики без операции (оксациллин, цефалоспорины II поколения; при риске MRSA --- ванкомицин или линезолид); нет улучшения за 48 ч → повторная МРТ: не вышел за кость --- смена антибиотика, иначе --- операция; <b>распространение на надкостницу и мягкие ткани --- экстренная операция</b> .</p>

<p style="margin:0 0 10px">## <b>Этапное лечение и диспансерное наблюдение (Р., И.)</b></p>
<p style="margin:0 0 10px">• лечение <b>длительное, упорное, этапное</b> : острая → подострая → хроническая → стадия остаточных</p>
<p style="margin:0 0 10px">явлений;</p>
<p style="margin:0 0 10px">• после выписки --- диспансерный учёт, <b>контроль не реже 1 раза в 2 мес в течение полугода</b> с</p>
<p style="margin:0 0 10px">рентгеном;</p>
<p style="margin:0 0 10px">• <b>подострая стадия</b> : повторное иммуностимулирующее лечение, УВЧ (до 15 сеансов), десенсибилизация (14</p>
<p style="margin:0 0 10px">дней), антибиотики (14 дней), анаболические гормоны (21 день, И.), белковая диета, осторожная разработка сустава; курсы --- в общей сложности в течение года; <b>санаторно-курортное лечение</b> (Крым, Северный Кавказ, Средняя Азия).</p>
<p style="margin:0 0 10px">## <b>Лечение хронического остеомиелита (Р., И.)</b></p>
<p style="margin:0 0 10px">• основной метод --- <b>некрэктомия с пластикой остаточной костной полости</b> (наиболее рациональна ---</p>
<p style="margin:0 0 10px">аутогенная остеопластика): широкий разрез с иссечением свищей, вскрытие секвестральной полости, удаление секвестров, гноя, выскабливание грануляций, антисептик, послойное ушивание;</p>
<p style="margin:0 0 10px">• рецидивы --- из-за нерадикальности, омертвения стенок полости, скопления детрита и крови; при</p>
<p style="margin:0 0 10px">обширном поражении --- <b>корытообразная резекция</b> (меньше секвестрации краёв, лучше трофика, рецидивы реже); капельное промывание полости 3--5 суток; антибиотики с антианаэробной активностью, хорошие результаты --- <b>рифампицин + метронидазол</b> (3--4 дня до операции, 7--10 после);</p>
<p style="margin:0 0 10px">• осложнения и последствия --- вопрос 139.</p>

<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Диагноз, дезинтоксикация, антибиотики, предоперационная подготовка 2--3 ч</span><span>Остеоперфорация + промывание; консервативно --- только при МРТ без выхода за кость | 2--3 нед второй курс антибиотиков, иммунотерапия | Диспансер, ЛФК, санаторий; хронический --- некрэктомия</span></div>`},
  {n:139, t:"Гематогенный остеомиелит у детей. Осложнение", a:`<p style="margin:0 0 10px">Разумовский, гл. 59 (с. 768--779, 59.1--59.4); Исаков, 7.9 (с. 557--578, рис. 7-7--7-13).</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   внутрикостная гипертензия · субпериостальный абсцесс · флегмона · хронизация · патологический перелом · амилоидоз</p>
<p style="margin:0 0 10px"><b>Гематогенный остеомиелит</b> --- гнойно-некротическое воспаление кости, начинающееся в метафизе. Основной возбудитель --- стафилококк (до 90 %) или его ассоциации с энтеробактериями (Р.). Осложнения делят на <b>общие</b> (генерализация инфекции), <b>местные в острой фазе</b> и <b>отдалённые последствия</b> (хронический остеомиелит).</p>
<p style="margin:0 0 10px">## <b>Механизм: как возникают осложнения (Р.)</b></p>
<p style="margin:0 0 10px">• воспаление замкнуто ригидными стенками костной трубки: давление в кости достигает 300--500 мм вод. ст.</p>
<p style="margin:0 0 10px">(у здоровых детей 60--100), сдавливаются вены, затем артерии --- боль и нарастание некроза;</p>
<p style="margin:0 0 10px">• если процесс не диагностируют на стадии внутрикостного воспаления, то <b>с 4--5-х суток</b> гной по</p>
<p style="margin:0 0 10px">гаверсовым и фолькмановским каналам выходит <b>под надкостницу</b> и отслаивает её; <b>с 8--10-х суток</b> прорывается в мягкие ткани --- запущенный остеомиелит, лечение которого трудно.</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 2</b></span><span><b>ШАГ 1</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">4--5 сут: гной под надкостницу, субпериостальный абсцесс</span><span>Гнойное воспаление в метафизе, внутрикостная гипертензия | 8--10 сут: прорыв в мягкие ткани --- флегмоны | Септические метастазы или хронизация, секвестры, свищи</span></div>
<p style="margin:0 0 10px"><b>Группа</b>                           <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Общие (Р., И.)</b>                   <b>септические осложнения</b> от метастазирования гнойных очагов в лёгкие, сердце, почки и другие кости; генерализованная форма --- молниеносный <b>сепсис и шок</b> , часто резистентные к интенсивной терапии (высокая летальность); токсическая реакция, напоминающая анафилактический шок</p>
<p style="margin:0 0 10px"><b>Местные в острой фазе</b>            <b>субпериостальный абсцесс</b> ; <b>межмышечные и подкожные флегмоны</b> (с 8--10-х суток); при очаге близко к суставу --- стойкая <b>контрактура</b> ; <b>гнойный артрит</b> (особенно метаэпифизарный у грудных: инфекция переходит на ростковую зону и эпифиз внутри сустава); остеомиелит тазобедренного сустава и позвонков протекает тяжело (И., Р.)</p>
<p style="margin:0 0 10px"><b>Переход в хронический (Р., И.)</b>   при позднем начале лечения или неполной санации: <b>секвестры, свищи, периодические обострения</b> ; хронический остеомиелит делят на раннюю и позднюю стадии; «только раннее комплексное лечение в острой фазе предупреждает хронизацию» (И.)</p>
<p style="margin:0 0 10px"><b>Атипичные формы (Р., И.)</b>         абсцесс Броди, склерозирующий остеомиелит Гарре, альбуминозный Олье, антибиотический --- вариант стёртого, абортивного течения</p>
<p style="margin:0 0 10px"><b>Местные последствия (Р., И.)</b>     <b>патологические переломы и вывихи</b> (после остеомиелита проксимального эпифиза бедра --- патологический вывих, coxa vara; для профилактики применяют повязки-распорки), <b>ложные суставы</b> , деформации, <b>нарушение роста и укорочение конечности</b></p>
<p style="margin:0 0 10px"><b>Общие последствия (Р.)</b>           <b>амилоидоз внутренних органов</b> : при хроническом течении нужно думать о предамилоидных состояниях --- ↓ концентрационной функции почек, протеинурия, анемия, сублейкоцитоз, сдвиг влево, лимфопения → иммуноэлектрофорез</p>
<p style="margin:0 0 10px"><b>Рецидивы после операций (Р.)</b>     нерадикальность операции (остались гной, грануляции), омертвение и секвестрация стенок полости, накопление детрита и крови в остаточной полости</p>
<p style="margin:0 0 10px">## <b>Осложнения</b></p>
<p style="margin:0 0 10px">![](media/image142.jpg){width="2.7777766841644795in" height="2.364773622047244in"}</p>

<p style="margin:0 0 10px">## <b>Профилактика осложнений</b></p>
<p style="margin:0 0 10px">Ранняя диагностика, раннее хирургическое вмешательство (остеоперфорация, дренирование), антибиотики и иммобилизация; восстановление функции (ЛФК, тепловые процедуры) при выписке; диспансерное наблюдение ортопеда или хирурга; при последствиях --- ортопедическая коррекция (компрессионно-дистракционный остеосинтез, костная пластика).</p>`},
  {n:140, t:"Деструктивная пневмония у детей. Этиология и патогенез", a:`<p style="margin:0 0 10px">Разумовский, 8.8 (с. 133--138, рис. 8.9--8.11); Исаков, 4.7 (с. 207--213, рис. 4-31). Коды МКБ-10: J13--J15, J85, J86.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   бактериальная деструкция · стафилококк · аэробронхогенный путь · абсцесс · булла · эмпиема · пиопневмоторакс</p>
<p style="margin:0 0 10px"><b>Деструктивные пневмонии (бактериальные деструкции лёгких)</b> --- хирургические гнойно-воспалительные заболевания лёгких и плевры, являющиеся вариантами течения бактериальных пневмоний разной этиологии (Р., И.). Термин «стафилококковая деструкция» появился в 60-е гг. XX века: из группы острых пневмоний выделили формы с самым тяжёлым течением, высокой летальностью, абсцессами лёгких и плевральными осложнениями.</p>
<p style="margin:0 0 10px">## <b>Этиология</b></p>
<p style="margin:0 0 10px">• <b>стафилококк</b> по-прежнему на первом месте в этиологии тяжёлых деструктивных пневмоний;</p>
<p style="margin:0 0 10px">• растёт роль <b>грамотрицательной флоры</b> (протей, кишечная палочка, синегнойная палочка, клебсиелла) и</p>
<p style="margin:0 0 10px">её ассоциаций со стафилококком --- поэтому термин «бактериальная деструкция»;</p>
<p style="margin:0 0 10px">• очень часто пневмония развивается <b>на фоне вирусной или микоплазменной инфекции</b> ;</p>
<p style="margin:0 0 10px">• в абсцессах чаще находят <b>анаэробы</b> (Peptostreptococcus, Peptococcus, Bacteroides melaninogenicus,</p>
<p style="margin:0 0 10px">Bacteroides fragilis), иногда с аэробами;</p>
<p style="margin:0 0 10px">• при эмпиеме у детей: золотистый стафилококк, пневмококк, Haemophilus influenzae, пиогенный</p>
<p style="margin:0 0 10px">стрептококк, Klebsiella pneumoniae, бактероиды, фузобактерии; у детей с пневмонией, вызванной стафилококком, стрептококком или H. influenzae, внелёгочный выпот появляется в 50--95 % случаев.</p>
<p style="margin:0 0 10px">## <b>Патогенез</b></p>
<p style="margin:0 0 10px">• <b>путь инфицирования</b> : первичный <b>аэробронхогенный</b> --- в подавляющем большинстве (до 83 %, Р.; до 80</p>
<p style="margin:0 0 10px">%, И.); вторичный <b>гематогенный</b> --- при гнойном омфалите, пиодермии, остром гематогенном остеомиелите (септическая форма);</p>
<p style="margin:0 0 10px">• возраст: в любом, но преимущественно <b>дети первых 3 лет</b> --- отсюда тяжесть;</p>
<p style="margin:0 0 10px">• <b>этапы</b> : в субплевральном слое паренхимы образуется <b>инфильтрат</b> → при обратном развитии ---</p>
<p style="margin:0 0 10px">микроабсцессы с разрывом стенок мелких бронхов и нагнетанием воздуха в паренхиму → <b>буллы</b> (самый благоприятный исход) или при поздней диагностике/неэффективном лечении --- <b>абсцессы</b> ;</p>
<p style="margin:0 0 10px">• <b>плевральные осложнения</b> : при абсцедировании висцеральная плевра реагирует --- плащевидный</p>
<p style="margin:0 0 10px">плеврит, за 2--3 суток <b>эмпиема плевры</b> ; при несостоятельности плевры гной выходит в плевральную полость; полость абсцесса сообщается с мелкими бронхами → воздух в плевре → <b>пиопневмоторакс</b> ;</p>
<p style="margin:0 0 10px">• почему он чаще <b>напряжённый</b> : мелкие бронхи в зоне воспаления лишены хрящевого каркаса, теряют</p>
<p style="margin:0 0 10px">тонус и пропускают воздух только на периферию --- <b>клапанный механизм</b> (И.); ненапряжённый возникает при однократном попадании воздуха и тампонировании полости фибрином или отёке свищей; пневмоторакс «в чистом виде» в остром периоде практически не встречается;</p>
<p style="margin:0 0 10px">• <b>три стадии эмпиемы</b> (Р.): экссудативная (острая; выпот прозрачный, pH ниже 7,2), фибринозно-гнойная</p>
<p style="margin:0 0 10px">(много лейкоцитов, фибрин, ↓ pH и глюкозы, множественные полости), стадия организации (густой экссудат, фибрин прорастает фибробластами); острая фаза переходит в хроническую через 4--6 недель.</p>

<p style="margin:0 0 10px"><b>Группа</b>                               <b>Варианты</b></p>
<p style="margin:0 0 10px"><b>I. Острая бактериальная деструкция</b>   <b>по генезу</b> : первичная (аэробронхогенная), вторичная (гематогенная); <b>по клинико-рентгенологическим формам</b> : деструкция с внутрилёгочными осложнениями (абсцессы, буллы) и с плевральными осложнениями --- пиоторакс (плащевидный, тотальный \\[эмпиема\\], отграниченный), пиопневмоторакс и пневмоторакс (напряжённый, ненапряжённый, отграниченный); <b>течение</b> : острое, затяжное, септическое</p>
<p style="margin:0 0 10px"><b>II. Хронические формы (исходы)</b>       хронический абсцесс; хроническая эмпиема плевры; приобретённые кисты плевры</p>
<p style="margin:0 0 10px">## <b>Классификация (Р., И.)</b></p>
<p style="margin:0 0 10px"><b>Форма</b>                                      <b>Клиника</b></p>
<p style="margin:0 0 10px"><b>Инфильтрация (начало)</b>                      быстрое ухудшение, высокая лихорадка, тяжёлая интоксикация; лейкоцитоз с нейтрофильным сдвигом, ↑ СОЭ; нередко <b>абдоминальный, нейротоксический или астмоидный</b> синдромы; <b>физикально скудно</b> : хрипов как при очаговой пневмонии нет, небольшое ослабление дыхания, притупление --- только при обширной инфильтрации; решает рентген</p>
<p style="margin:0 0 10px"><b>Булла (благоприятный исход)</b>                тонкостенные воздушные полости без гноя; лихорадка прекращается, аппетит улучшается, кровь нормализуется, дыхательных нарушений обычно нет; со временем исчезают --- нужно наблюдение с рентгеном</p>
<p style="margin:0 0 10px"><b>Абсцесс (деструкция)</b>                       наиболее тяжёлая клиника: состояние прогрессивно ухудшается, температура гектическая, нарастает интоксикация, умеренная дыхательная недостаточность; кашель сухой, при прорыве в бронх --- влажный (но редко «полным ртом»); варианты: абсцесс, заполненный гноем, и абсцесс с уровнем жидкости</p>
<p style="margin:0 0 10px"><b>Плащевидный плеврит</b>                        усиление интоксикации; сглаженность межрёберных промежутков, увеличение полуокружности грудной клетки на стороне поражения, дыхательная асимметрия, ослабление дыхания, притупление над нижне-задними отделами</p>
<p style="margin:0 0 10px"><b>Тотальная эмпиема</b>                          интоксикация + дыхательная недостаточность (пропорциональна объёму экссудата, коллапсу лёгкого и смещению средостения); выраженное притупление, дыхание ослаблено до отсутствия, смещение средостения в здоровую сторону</p>
<p style="margin:0 0 10px"><b>Напряжённый пиопневмоторакс</b>                внезапное тяжёлое ухудшение: беспокойство, выраженная одышка, тахикардия, цианоз, асимметрия дыхания (вздутие стороны поражения); коробочный звук сверху, притупление от уровня жидкости; дыхания нет, средостение смещено; у малышей быстро --- кардиопульмональный шок; вздутие живота (парез) усиливает ДН</p>
<p style="margin:0 0 10px"><b>Отграниченные формы (завершающая стадия)</b>   общее состояние нормализуется, лихорадки нет, формула крови нормальная (СОЭ повышена); плащевидный фибриноторакс, отграниченный пиоторакс</p>
<p style="margin:0 0 10px"><b>Хронические</b>                                фибриновый «панцирь», сколиоз, сближение рёбер, бронхиальный свищ, остаточная полость, свищ на грудной стенке; возможен напряжённый пневмоторакс на фоне фибриноторакса</p>

<p style="margin:0 0 10px">![](media/image145.jpg){width="1.9444444444444444in" height="1.4916283902012248in"}   |   ![](media/image146.jpg){width="1.9444444444444444in" height="1.571537620297463in"}</p>

<p style="margin:0 0 10px">## <b>Диагностика</b></p>
<p style="margin:0 0 10px"><b>Метод</b>                                    <b>Что находят (Р., И.)</b></p>
<p style="margin:0 0 10px"><b>Общий анализ крови</b>                       лейкоцитоз с нейтрофильным сдвигом, ↑ СОЭ (при отграничении СОЭ остаётся повышенной)</p>
<p style="margin:0 0 10px"><b>Обзорная рентгенограмма грудной клетки</b>   <b>решающий метод ранней диагностики</b> (физикальных данных мало): инфильтрат; <b>булла</b> --- воздушная полость без стенок; <b>абсцесс</b> --- округлость формы, более интенсивное затенение в центре, при дренировании --- уровень жидкости; плеврит --- затенение гемиторакса, смещение средостения; <b>пиопневмоторакс --- уровень жидкости</b> в плевре (в вертикальном положении), лёгкое коллабировано у корня</p>
<p style="margin:0 0 10px"><b>УЗИ плевральных полостей</b>                 высокоточно определяет <b>объём и характер выпота</b> , отличает жидкость от инфильтрации лёгкого, показывает спайки и фибрин; помогает выбрать место пункции</p>
<p style="margin:0 0 10px"><b>КТ грудной клетки</b>                        при затенении всей половины грудной клетки; локализует ограниченную эмпиему; уточняет абсцесс (даёт «более наглядную картину»)</p>
<p style="margin:0 0 10px"><b>Плевральная пункция</b>                      характер содержимого сразу отличает выпот от эмпиемы; материал --- на аэробы и анаэробы; эмпиема: pH ниже 7,2, глюкоза ниже 2,6 ммоль/л (по книге ЛДГ выше 100 ЕД/л --- в тексте опечатка «ЛГ»); мутный выпот с pH выше 7,2 и глюкозой выше 2,2 --- ещё реактивный; на ранних стадиях бактериология неинформативна</p>
<p style="margin:0 0 10px"><b>Бактериологическое исследование</b>          у маленьких мокроту взять трудно --- посев из зева и ануса (бактериальный фон, чувствительность)</p>
<p style="margin:0 0 10px"><b>Бронхоскопия</b>                             устье бронха воспалено, сужено, выделяется гной; диагностическая и лечебная</p>

<p style="margin:0 0 10px"><b>С чем</b>                                            <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Нагноившаяся врождённая киста лёгкого (Р., И.)</b>   при абсцессе --- выраженная перифокальная инфильтрация; при нагноившейся кисте --- тонкая, чётко выраженная оболочка, более лёгкое течение; КТ</p>
<p style="margin:0 0 10px"><b>Эхинококковая киста лёгкого (Р., рис. 8.11)</b>      двусторонность, чёткая оболочка, слабая перифокальная инфильтрация (вопросы 151--153)</p>
<p style="margin:0 0 10px"><b>Обычная очаговая пневмония (Р.)</b>                  при деструкции физикальные данные скудны, хрипы очаговой пневмонии отсутствуют; тяжесть интоксикации непропорциональна</p>
<p style="margin:0 0 10px">## <b>Дифференциальная диагностика</b></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                                                  <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Абсцесс vs инфильтрат (Р.)</b>                                                                             при абсцессе, заполненном гноем (без бронха) на рентгене трудно отличить от инфильтрата --- помогают округлость и интенсивность затенения в центре</p>
<p style="margin:0 0 10px"><b>Реактивный плевральный выпот и эмпиема (Р.)</b>                                                            по результатам пункции: pH, глюкоза</p>
<p style="margin:0 0 10px"><b>Спонтанный пневмоторакс, врождённые пороки, диафрагмальная грыжа, туберкулёз, инородное тело (общие)</b>   анамнез, рентген/КТ, пункция, бронхоскопия</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   антибиотики · бронхоскопическая санация · плевральная пункция · дренаж по Бюлау · торакоскопия · бронхоблокатор</p>
<p style="margin:0 0 10px"><b>Форма</b>                           <b>Лечение (Р., И.)</b></p>
<p style="margin:0 0 10px"><b>Ранняя стадия (инфильтрация)</b>    <b>адекватная терапия на ранних стадиях</b> предупреждает самые тяжёлые формы; антибиотики широкого спектра по результатам посева; в тяжёлых случаях --- защищённые пенициллины (амоксициллин + клавулановая кислота), макролиды (азитромицин); бронхолитики и муколитики</p>
<p style="margin:0 0 10px"><b>Абсцесс</b>                         парентерально (лучше в/в) <b>цефалоспорины II--III поколения</b> до результатов посева; хорошие результаты --- имипенем; инфузия при интоксикации --- <b>примерно 2/3</b> возрастной нормы; <b>бронхоскопическая санация</b> (удаление гноя, катетеризация полости абсцесса, промывание антисептиками), постуральный дренаж + перкуторный/вибрационный массаж, ингаляции; торакотомия (до удаления поражённой части лёгкого) --- в редких случаях при неэффективности, у детей до 1 года</p>
<p style="margin:0 0 10px"><b>Буллы</b>                           лечения не требуют; длительное диспансерное наблюдение с рентгеном до выздоровления</p>
<p style="margin:0 0 10px"><b>Плащевидный плеврит и эмпиема</b>   <b>повторные плевральные пункции</b> (6--7 межреберье по лопаточной линии под местной анестезией; УЗИ для выбора места); если фибрин забивает иглу --- <b>дренирование плевры</b> (6 межреберье по заднеподмышечной линии), санация через дренаж по Бюлау; при неэффективности и фибриногораксе --- <b>торакоскопическая санация</b> (удаляет выпот и фибрин, расправляет лёгкое, разделяет спайки; сокращает пребывание в стационаре)</p>
<p style="margin:0 0 10px"><b>Напряжённый пиопневмоторакс</b>     <b>срочно снять внутригрудное напряжение</b> : игольчатый дренаж (игла большого диаметра, 3--4 межреберье по переднеподмышечной линии, наклон книзу, фиксация пластырем) --- перевести закрытый в открытый на время транспортировки; затем плевральный дренаж (если нет банки Боброва --- конец в ёмкость с водой)</p>
<p style="margin:0 0 10px"><b>Пиопневмоторакс в стационаре</b>    цель --- как можно раньше <b>расправить лёгкое</b> : пассивный дренаж по Бюлау → <b>активная аспирация</b> (вакуум-отсос); при большом сбросе воздуха --- <b>временная окклюзия бронха</b> (бронхоблокатор --- поролоновый шарик, смоченный антисептиками, под бронхоскопией; удаляют через 7--10 сут, за это время образуются спайки)</p>
<p style="margin:0 0 10px"><b>Хронические формы</b>               <b>радикальная декортикация лёгкого</b> (удаление фибринозного мешка --- плеврэктомия) с ушиванием бронхиальных свищей или резекция лёгкого с дренированием плевры</p>
<p style="margin:0 0 10px">## <b>Лечение по формам</b></p>
<p style="margin:0 0 10px">Успех зависит от микрофлоры и иммунного статуса, но основа --- своевременная диагностика, рациональная антибактериальная терапия и правильный выбор операции на каждом этапе. Исход при своевременном лечении --- полное выздоровление у подавляющего большинства.</p>

<p style="margin:0 0 10px">## <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                                               <b>Комментарий (Р., И.)</b></p>
<p style="margin:0 0 10px"><b>Напряжённый пиопневмоторакс</b>                              самое частое и тяжёлое осложнение (И.); кардиопульмональный шок, особенно у малышей</p>
<p style="margin:0 0 10px"><b>Эмпиема плевры</b>                                           через 2--3 сут после плащевидного плеврита; хронизация через 4--6 нед</p>
<p style="margin:0 0 10px"><b>Фибриноторакс</b>                                            уменьшение объёма половины грудной клетки, сближение рёбер, <b>сколиоз</b> , стойкий коллапс лёгкого</p>
<p style="margin:0 0 10px"><b>Бронхиальный свищ, остаточная полость</b>                    постоянное поступление воздуха; свищевой ход на грудной стенке в месте дренажа; напряжённый пневмоторакс после острого процесса</p>
<p style="margin:0 0 10px"><b>Хронический абсцесс, хроническая эмпиема, кисты плевры</b>   исходы острой деструкции</p>
<p style="margin:0 0 10px"><b>Сепсис, летальный исход</b>                                  у детей младшего возраста с тяжёлым септическим процессом и сопутствующими хроническими заболеваниями</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   расширение бронхов · пневмосклероз · рецидивирующий бронхит · синдром Картагенера · инородные тела</p>
<p style="margin:0 0 10px"><b>Бронхоэктазии (бронхоэктатическая болезнь)</b> --- хроническое заболевание лёгких: патологическое <b>расширение бронхов</b> , в которых локализуется гнойный процесс; в паренхиме развивается пневмосклероз (Р.). Распространённость у детей 0,5--1,7 %; после появления антибиотиков резко снизилась.</p>
<p style="margin:0 0 10px"><b>Причина</b>                                                <b>Пояснение (Р.)</b></p>
<p style="margin:0 0 10px"><b>Воспалительные заболевания органов дыхания (главная)</b>   прежде всего <b>рецидивирующий бронхит</b> : перибронхит и интерстициальное воспаление нарушают дренажную функцию; затяжные и часто рецидивирующие пневмонии у детей раннего возраста; у малышей --- бактериальная или вирусная инфекция</p>
<p style="margin:0 0 10px"><b>Врождённые пороки лёгких</b>                               теория врождённых бронхоэктазий (XIX в.); <b>Картагенер (1933): синусит + обратное расположение органов + бронхоэктазы</b> ; около 20 % больных с situs inversus и декстрокардией имеют бронхоэктазы (в популяции 0,5 %); они существуют при рождении или формируются в первые годы из-за эмбриональных нарушений, задержки формирования стенок бронхов и хрящевых пластинок (гипоплазия)</p>
<p style="margin:0 0 10px"><b>Инородные тела бронхов</b>                                 органические и растительные вызывают бронхоэктазию быстрее, чем пластмассовые, металлические и стеклянные (иммунная реакция на белок); обтурация → ателектаз → инфицирование; важна не локализация, а степень обструкции и природа тела</p>
<p style="margin:0 0 10px"><b>Другие</b>                                                 аллергический лёгочный аспергиллёз, недостаточность α-антитрипсина, агаммаглобулинемия и дисгаммаглобулинемия, саркоидоз, опухоли, локализованные кисты, астма и аллергии; муковисцидоз; ГЭР вызывает рецидивирующую инфекцию, но бронхоэктазы при нём редки</p>
<p style="margin:0 0 10px">## <b>Этиология</b></p>
<p style="margin:0 0 10px">## <b>Патогенез (Р.)</b></p>
<p style="margin:0 0 10px">• <b>основные звенья</b> : врождённая функциональная и морфологическая неполноценность паренхимы и стенок</p>
<p style="margin:0 0 10px">бронхов; воспаление в постнатальном периоде; нарушение дренажной функции бронхов с ателектазом или без него; эндобронхит, переходящий в панбронхит; перибронхит с переходом воспаления на паренхиму;</p>
<p style="margin:0 0 10px">• длительное воспалительно-деструктивное поражение мерцательного эпителия и перибронхиальных</p>
<p style="margin:0 0 10px">тканей; потеря мышечной эластичности → дыхательные пути не освобождаются от слизи → <b>деформация бронхов</b> (цилиндрическая или мешотчатая);</p>
<p style="margin:0 0 10px">• бронхи не переходят в бронхиолы, а слепо заканчиваются → ателектаз или эмфизема; участок <b>не</b></p>
<p style="margin:0 0 10px"><b>участвует в вентиляции и газообмене</b> ; застой гнойного секрета → рецидивы пневмонии, дальнейшая деструкция → <b>источник интоксикации</b> ;</p>
<p style="margin:0 0 10px">• гистологически врождённые бронхоэктазы нельзя отличить от приобретённых (изменения от нагноения);</p>
<p style="margin:0 0 10px">• <b>формы расширения</b> : цилиндрические, веретенообразные, мешотчатые; для хирургов важна мешотчатая;</p>
<p style="margin:0 0 10px">цилиндрические после острой пневмонии могут подвергаться обратному развитию.</p>

<p style="margin:0 0 10px">## <b>Классификация (Р.)</b></p>
<p style="margin:0 0 10px"><b>Признак</b>                       <b>Виды</b></p>
<p style="margin:0 0 10px"><b>По генезу</b>                     врождённые и приобретённые</p>
<p style="margin:0 0 10px"><b>По форме</b>                      цилиндрические, мешотчатые, кистозные (веретенообразные); для хирургов важна <b>мешотчатая</b></p>
<p style="margin:0 0 10px"><b>По распространённости</b>         односторонние и двусторонние; в детском возрасте нередки комбинированные поражения (например, доли и сегменты другой доли)</p>
<p style="margin:0 0 10px"><b>По течению (общие учебники)</b>   период ремиссии и период обострения</p>
<p style="margin:0 0 10px">Типичная локализация у детей --- <b>нижние доли</b> , но не реже страдают язычковые сегменты слева и средняя доля справа (Р.).</p>
<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• <b>общие жалобы</b> : вялость, слабость, быстрая утомляемость;</p>
<p style="margin:0 0 10px">• <b>самый характерный симптом --- влажный кашель, больше по утрам</b> , с мокротой (слизистой,</p>
<p style="margin:0 0 10px">слизисто-гнойной, гнойной); у детей <b>младше 5 лет</b> этот симптом трудно определить --- они проглатывают мокроту, родители её не замечают;</p>
<p style="margin:0 0 10px">• <b>кровохарканье</b> у детей редко --- чаще при инородном теле (грануляции выше предмета);</p>
<p style="margin:0 0 10px">• жалобы усиливаются при процессах объёмом в долю и более и в период обострения;</p>
<p style="margin:0 0 10px">• <b>перкуссия</b> : укорочение звука над поражённым участком --- только при бронхоэктазии с ателектазом доли;</p>
<p style="margin:0 0 10px">границы сердца могут смещаться в сторону ателектаза;</p>
<p style="margin:0 0 10px">• <b>аускультация --- наиболее показательна</b> : <b>локализованные</b> хрипы (чаще влажные, разнокалиберные,</p>
<p style="margin:0 0 10px">иногда крупнопузырчатые), при ограниченном процессе исчезают после откашливания; громкие хрипы проводятся и на здоровую сторону, особенно до 5 лет; ослабление или бронхиальный характер дыхания; исследовать лучше неоднократно, в том числе утром после сна;</p>
<p style="margin:0 0 10px">• при длительном течении (общие учебники, Р.) --- отставание в развитии, деформация концевых фаланг</p>
<p style="margin:0 0 10px">(«барабанные палочки»), признаки дыхательной недостаточности.</p>
<p style="margin:0 0 10px">*Пункт про «барабанные палочки» и дыхательную недостаточность в тексте Р. не приведён --- это общая клиническая картина хронических нагноительных заболеваний лёгких.*</p>
<p style="margin:0 0 10px"><b>Форма</b>           <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Лёгкая</b>          редкие обострения (1--2 раза в год), кашель с небольшим количеством мокроты, общее состояние удовлетворительное</p>
<p style="margin:0 0 10px"><b>Среднетяжёлая</b>   частые обострения, постоянная гнойная мокрота, интоксикация, отставание в физическом развитии</p>
<p style="margin:0 0 10px"><b>Тяжёлая</b>         постоянная интоксикация, выраженное отставание, дыхательная недостаточность, осложнения</p>
<p style="margin:0 0 10px">## <b>Клинические формы (по тяжести --- общие учебники)</b></p>
<p style="margin:0 0 10px">Деление по тяжести составлено по общим учебникам (в Р. и И. нет); проверь по лекции.</p>`},
  {n:146, t:"Бронхоэктатическая болезнь у детей. Диагностика и диф. диагностика", a:`<p style="margin:0 0 10px">Разумовский, 8.7 (с. 130--132, рис. 8.8); Исаков, 4.6 (с. 203--205, рис. 4-28, 4-29).</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   КТ лёгких · бронхография · бронхоскопия · потовая проба · астматический бронхит · муковисцидоз</p>
<p style="margin:0 0 10px">## <b>Диагностика</b></p>
<p style="margin:0 0 10px">• <b>анамнез</b> (особенно у детей 1-го года) и симптоматика локализованного бронхита; окончательный диагноз</p>
<p style="margin:0 0 10px">• только после <b>комплексного исследования</b> : рентген, КТ, бронхоскопия, бронхография, радиоизотопное исследование;</p>
<p style="margin:0 0 10px">• <b>показания к бронхоскопии</b> : длительный, месяцами, кашель; рецидивирующие локализованные бронхиты</p>
<p style="margin:0 0 10px">и пневмонии, резистентные к обычной терапии.</p>
<p style="margin:0 0 10px"><b>Метод</b>                                   <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Обзорная рентгенография</b>                 усиление бронхососудистого рисунка (прикорневая зона), инфильтрация, фиброз, эмфизема, ателектазы от сегмента до всего лёгкого; признаки не всегда специфичны, <b>нормальный снимок не исключает</b> бронхоэктазы (локальная форма)</p>
<p style="margin:0 0 10px"><b>КТ лёгких</b>                               <b>стандартное высокоинформативное исследование</b> : наличие и локализация бронхоэктазов, объём поражения, состояние окружающей паренхимы</p>
<p style="margin:0 0 10px"><b>Бронхоскопия</b>                            гнойный или катарально-гнойный бронхит в зоне поражения (даже в ремиссии --- гнойная мокрота); локальный эндобронхит в пределах доли --- долевой процесс; <b>диффузный гнойный эндобронхит --- двусторонний</b> ; мокроту на микрофлору, иногда на туберкулёз</p>
<p style="margin:0 0 10px"><b>Бронхография</b>                            выявляет бронхоэктазы, их характер (цилиндрические/мешотчатые), протяжённость, состояние здоровых отделов; выполняют <b>после санационной бронхоскопии</b> для лучшего контрастирования</p>
<p style="margin:0 0 10px"><b>Радиоизотопное исследование кровотока</b>   функция отделов лёгкого; накопление ниже 60 % нормы --- необратимые изменения паренхимы</p>
<p style="margin:0 0 10px"><b>Потовая проба</b>                           исключить муковисцидоз</p>

<p style="margin:0 0 10px">## <b>Дифференциальная диагностика (Р., И.)</b></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                     <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Астматический бронхит (на ранних этапах, в поликлинике)</b>   приступообразная дыхательная недостаточность; хрипы над обоими лёгкими, быстро исчезают после приступа</p>
<p style="margin:0 0 10px"><b>Рецидивирующая затяжная пневмония</b>                         процесс в интерстициальной ткани, бронхит на заднем плане; показательна обзорная рентгенограмма</p>
<p style="margin:0 0 10px"><b>Туберкулёз</b>                                                анамнез: контакт, неясная температура без картины пневмонии; туберкулиновые пробы (больных бронхоэктазией раньше нередко необоснованно лечили от туберкулёза)</p>
<p style="margin:0 0 10px"><b>Пороки бронхолёгочной системы с нагноением</b>                нагноившаяся киста лёгкого --- обзорные снимки; внутрилёгочная секвестрация --- бронхография и ангиография</p>
<p style="margin:0 0 10px"><b>Системные заболевания (особенно на 1-м году)</b>              муковисцидоз (потовая проба), иммунодефициты, <b>синдром Хаммена---Рича</b> (расширение и деформация бронхов + мелкие тени, диффузная эмфизема, усиление бронхососудистого рисунка)</p>
<p style="margin:0 0 10px"><b>Инородное тело бронха</b>                                     анамнез аспирации, кровохарканье, бронхоскопия</p>`},
  {n:147, t:"Бронхоэктатическая болезнь у детей. Лечение и осложнение", a:`<p style="margin:0 0 10px">Разумовский, 8.7 (с. 132--133); Исаков, 4.6 (с. 205--207, рис. 4-30). Часть осложнений --- по общим учебникам.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   резекция лёгкого · лобэктомия · экстирпация бронхов по Степанову · торакоскопия · легочное сердце</p>
<p style="margin:0 0 10px">## <b>Хирургическое лечение (Р.)</b></p>
<p style="margin:0 0 10px">• <b>наиболее эффективное</b> лечение бронхоэктазии у детей --- <b>радикальная операция: удаление</b></p>
<p style="margin:0 0 10px"><b>поражённой части лёгкого</b> (лобэктомия, сегментэктомия, пульмонэктомия при необходимости);</p>
<p style="margin:0 0 10px">• при поражении отдельных сегментов --- <b>резекция и экстирпация бронхов сегмента по Э.А. Степанову</b> :</p>
<p style="margin:0 0 10px">не травмируются здоровые части, нет раневой поверхности; оставленный участок без бронхов быстро пневматизируется через поры Кона и служит «хорошим биологическим протезом» (рис. 4-30, И.);</p>
<p style="margin:0 0 10px">• при двустороннем процессе --- интервал между операциями <b>не менее 2--3 мес</b> ; сначала оперируют более</p>
<p style="margin:0 0 10px">тяжёлую сторону; нередко после первой операции вторая не нужна;</p>
<p style="margin:0 0 10px">• <b>видеоторакоскопические операции</b> --- хорошая альтернатива стандартным лобэктомиям.</p>
<p style="margin:0 0 10px">## <b>Консервативное лечение</b></p>
<p style="margin:0 0 10px">• <b>консервативная терапия сформированных распространённых бронхоэктазов неэффективна</b> :</p>
<p style="margin:0 0 10px">снимает кашель, но причину (поражение лёгкого) не устраняет;</p>
<p style="margin:0 0 10px">• <b>показано</b> (Р.): при деформирующем бронхите; при обострении воспаления; при временных или</p>
<p style="margin:0 0 10px">окончательных противопоказаниях к операции при распространённой двусторонней форме; для подготовки к плановой операции;</p>
<p style="margin:0 0 10px">• <b>санация бронхиального дерева</b> : ЛФК, активный кашель, постуральный дренаж, ингаляции для</p>
<p style="margin:0 0 10px">снижения вязкости мокроты, повторные бронхоскопии; антибиотики при обострении; дезинтоксикационная, десенсибилизирующая и общеукрепляющая терапия; санаторно-курортное лечение.</p>

<p style="margin:0 0 10px">## <b>Прогноз и диспансерное наблюдение (Р.)</b></p>
<p style="margin:0 0 10px">• качество жизни после операции зависит от объёма удалённого лёгкого и степени бронхита в «здоровых»</p>
<p style="margin:0 0 10px">участках;</p>
<p style="margin:0 0 10px">• при локализованном процессе хорошие результаты у <b>80 %</b> ; при удалении не более двух долей ---</p>
<p style="margin:0 0 10px">благоприятно; нередко даже пульмонэктомия при здоровом втором лёгком приводит к выздоровлению;</p>
<p style="margin:0 0 10px">• более обширные резекции чреваты <b>гипертензией малого круга кровообращения с формированием</b></p>
<p style="margin:0 0 10px"><b>лёгочного сердца</b> ;</p>
<p style="margin:0 0 10px">• при диффузном двустороннем поражении лишь <b>36 %</b> детей без клинических проявлений, улучшение --- у ≈</p>
<p style="margin:0 0 10px">50 %;</p>
<p style="margin:0 0 10px">• <b>обязательное диспансерное наблюдение</b> : контрольные бронхоскопия и бронхография, санаторное</p>
<p style="margin:0 0 10px">лечение, санация очагов хронического воспаления, ЛФК; выбор профессии без химического производства и пыли.</p>
<p style="margin:0 0 10px">## <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Группа</b>                              <b>Осложнения</b></p>
<p style="margin:0 0 10px"><b>Самой болезни</b>                       рецидивы пневмонии, обострения гнойного бронхита; <b>пневмосклероз</b> , ателектаз и эмфизема; хронический гнойный процесс --- источник интоксикации (Р.); <b>лёгочное сердце</b> при обширных поражениях (Р.); по общим учебникам --- кровохарканье и лёгочное кровотечение, абсцесс лёгкого, эмпиема плевры, амилоидоз, дыхательная недостаточность</p>
<p style="margin:0 0 10px"><b>После операции (общие учебники)</b>     остаточная полость и эмпиема, бронхиальный свищ, кровотечение, ателектаз, пневмония, гнойный бронхит в оставшихся отделах лёгкого, <b>лёгочное сердце</b> после обширных резекций (Р.)</p>
<p style="margin:0 0 10px"><b>Исход при диффузном процессе (Р.)</b>   полное излечение маловероятно (36 %), нужно длительное консервативное лечение</p>

<p style="margin:0 0 10px"><b>Эхинококкоз</b> --- личиночная (пузырная) стадия развития ленточного гельминта <b>Echinococcus granulosus</b> в ткани печени и лёгких (Разумовский и др., 2021). Кроме кистозного эхинококкоза бывает альвеолярный (E. multilocularis, альвеококкоз) --- это другое заболевание.</p>
<p style="margin:0 0 10px">## <b>Эпидемиология</b></p>
<p style="margin:0 0 10px">• печень --- <b>самое частое</b> место поражения; лёгкие --- на втором месте;</p>
<p style="margin:0 0 10px">• в российской серии (81 ребёнок, 3--17 лет, средний возраст 14,3 года) <b>мальчиков 77,8 %</b> ; кисты в правой</p>
<p style="margin:0 0 10px">доле у 70,9 % детей с солитарными кистами; множественные кисты в печени у 29,6 %; кисты и в других органах у 14,8 % (лёгкие --- у 6,2 %);</p>
<p style="margin:0 0 10px">• эндемичны овцеводческие районы (в том числе Средняя Азия); в Центральной России эхинококкоз печени у</p>
<p style="margin:0 0 10px">детей выявляют <b>с постоянной частотой</b> , без тенденции к снижению (Разумовский и др.).</p>
<p style="margin:0 0 10px">## <b>Этиология и жизненный цикл</b></p>
<p style="margin:0 0 10px">• <b>окончательный хозяин</b> --- собака (и другие псовые): взрослый червь в тонкой кишке; яйца выделяются с</p>
<p style="margin:0 0 10px">калом и <b>остаются заразными до года во влажной среде</b> ;</p>
<p style="margin:0 0 10px">• <b>промежуточные хозяева</b> --- овцы, козы, крупный рогатый скот, свиньи; собаки заражаются, поедая</p>
<p style="margin:0 0 10px">внутренности убитых животных; <b>человек --- случайный хозяин</b> , в цикле передачи не участвует;</p>
<p style="margin:0 0 10px">• заражение ребёнка: фекально-оральное --- загрязнённые вода и овощи, контакт с инфицированными</p>
<p style="margin:0 0 10px">домашними собаками (шерсть, руки).</p>
<p style="margin:0 0 10px">## <b>Патогенез</b></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 2</b></span><span><b>ШАГ 1</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Проникает через слизистую, током крови/лимфы → печень (портальный ток)</span><span>Проглатывание яиц; в кишке выходит онкосфера | Развивается жидкостная киста с хитиновой оболочкой, капсулой | Медленный рост (годы), давление на ткань, нагноение/разрыв</span></div>
<p style="margin:0 0 10px">• киста растёт <b>медленно</b> , поэтому диагноз у детей чаще ставят в подростковом возрасте;</p>
<p style="margin:0 0 10px">• стенка кисты: наружная хитиновая оболочка, внутренний зародышевый слой с выводковыми капсулами</p>
<p style="margin:0 0 10px">(протосколексы) и <b>фиброзная капсула</b> из ткани хозяина;</p>
<p style="margin:0 0 10px">• в печени преимущественно правая доля (особенности портального кровотока).</p>
<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• <b>бессимптомное течение --- основное</b> : у большинства детей диагноз устанавливают при диспансерном</p>
<p style="margin:0 0 10px">обследовании ( <b>УЗИ случайно</b> ); в серии Разумовского у остальных, кроме одного ребёнка, клинических проявлений не было;</p>
<p style="margin:0 0 10px">• <b>абдоминальный болевой синдром</b> --- у 71,6 % детей серии Разумовского; тяжесть в правом подреберье,</p>
<p style="margin:0 0 10px">тошнота --- по общим учебникам;</p>
<p style="margin:0 0 10px">• <b>механическая желтуха</b> --- при множественных крупных кистах, сдавливающих протоки (у 1 ребёнка из</p>
<p style="margin:0 0 10px">81);</p>
<p style="margin:0 0 10px">• аллергические проявления (кожный зуд, крапивница) и <b>эозинофилия</b> --- по общим учебникам;</p>
<p style="margin:0 0 10px">биохимические показатели функции печени у детей серии <b>не изменены и неспецифичны</b> (кроме желтухи);</p>
<p style="margin:0 0 10px">• стадии по Ордабекову: бессимптомная, клиническая, стадия осложнений (нагноение, разрыв, прорыв</p>

<p style="margin:0 0 10px">• при осложнениях: лихорадка, озноб, интоксикация (нагноение); острая боль, шок, аллергические реакции</p>

<p style="margin:0 0 10px">## <b>Классификация</b></p>
<p style="margin:0 0 10px"><b>1. По Ордабекову</b> (у детей; цитирует Разумовский и др., 2021): по <b>локализации</b> , <b>числу кист</b> , <b>осложнениям</b> , <b>стадиям</b> (бессимптомная, клиническая, стадия осложнений) и по <b>размерам</b> : мелкие --- до 5--10 мл; малые --- до 100 мл; средние --- 100--500 мл; большие --- 500--1500 мл; гигантские --- более 1500 мл (в статье опечатка «110--100 мл»).</p>

<p style="margin:0 0 10px">## <b>Профилактика</b></p>
<p style="margin:0 0 10px">• заражение происходит при проглатывании яиц Echinococcus granulosus (собаки выделяют яйца с калом;</p>
<p style="margin:0 0 10px">яйца сохраняют заразность до года во влажной среде); человек --- случайный хозяин;</p>
<p style="margin:0 0 10px">• <b>профилактика</b> (общие принципы): санитарно-ветеринарный контроль убоя, <b>не кормить собак</b></p>
<p style="margin:0 0 10px"><b>внутренностями</b> убитых животных, регулярная дегельминтизация собак; детям --- мыть руки после контакта с собаками и землёй, мыть овощи, ягоды, зелень, пить чистую воду;</p>
<p style="margin:0 0 10px">• у детей из эндемичных районов (овцеводство, сельская местность, в том числе Средняя Азия) --- <b>плановый</b></p>
<p style="margin:0 0 10px"><b>осмотр и УЗИ печени</b> : чаще всего эхинококкоз у детей выявляют случайно (бессимптомная киста).</p>
<p style="margin:0 0 10px">## <b>Лечение</b></p>
<p style="margin:0 0 10px">Консервативное и хирургическое лечение дополняют друг друга; <b>химиотерапия албендазолом обязательна</b> для профилактики рецидива (Каниев и др.). Выбор по стадии кисты (классификация ВОЗ-IWGE):</p>
<p style="margin:0 0 10px"><b>Стадия (УЗИ)</b>   <b>Характеристика</b>                                       <b>Тактика (Barlybay и др.)</b></p>
<p style="margin:0 0 10px"><b>CE1</b>            одиночная гидатидная киста, активная                     менее 5 см --- албендазол; более 5 см --- PAIR + албендазол</p>
<p style="margin:0 0 10px"><b>CE2</b>            многокамерная, дочерние пузыри, перегородки (активная)   хирургия + албендазол или не-PAIR чрескожная терапия + албендазол</p>
<p style="margin:0 0 10px"><b>CE3a</b>           отслоение хитиновой оболочки (переходная)                менее 5 см --- албендазол; более 5 см --- PAIR + албендазол</p>
<p style="margin:0 0 10px"><b>CE3b</b>           с дочерними пузырями в плотной массе                     хирургия + албендазол</p>
<p style="margin:0 0 10px"><b>CE4, CE5</b>       неактивные (дегенерация, кальциноз)                      наблюдение («watch and wait»)</p>
<p style="margin:0 0 10px">• <b>албендазол</b> назначают за 4 дня до вмешательства и 1 месяц после (Barlybay);</p>
<p style="margin:0 0 10px">• <b>PAIR</b> --- пункция, аспирация содержимого, введение противопаразитарного средства, повторная</p>
<p style="margin:0 0 10px">аспирация; после процедуры пациент обычно может быть выписан в тот же день (Cochrane). Стандартная катетеризация --- похожий метод с катетером большего диаметра;</p>
<p style="margin:0 0 10px">• <b>хирургически</b> (Р., с. 295 --- на примере кисты селезёнки): вскрытие кисты, <b>удаление хитиновой</b></p>
<p style="margin:0 0 10px"><b>оболочки</b> , обработка полости 2 % раствором формальдегида на глицероле; при больших кистах --- радикальные операции; для профилактики рецидива --- албендазол. У детей применяют <b>лапароскопическую фенестрацию и эхинококкэктомию</b> (описания случаев), перицистэктомию, резекцию печени (обзоры);</p>
<p style="margin:0 0 10px">• при множественных кистах и сомнительных данных --- исключить внепечёночные очаги (лёгкие, головной</p>
<p style="margin:0 0 10px">мозг); лёгкие --- второй по частоте орган (см. вопросы 151--153).</p>

<p style="margin:0 0 10px">## <b>Эпидемиология</b></p>
<p style="margin:0 0 10px">• лёгкие --- <b>второй после печени</b> орган по частоте поражения (около 18 % всех локализаций); правое</p>
<p style="margin:0 0 10px">лёгкое поражается вдвое чаще левого, чаще нижние доли;</p>
<p style="margin:0 0 10px">• эндемичны овцеводческие регионы; в РФ чаще болеют на Юге и Дальнем Востоке; доля детей среди</p>
<p style="margin:0 0 10px">заболевших около 12 %; у детей и молодых гидатидные кисты лёгких встречаются часто;</p>
<p style="margin:0 0 10px">• у многих больных болезнь долго протекает <b>бессимптомно</b> и выявляется случайно на рентгенограмме.</p>
<p style="margin:0 0 10px">## <b>Этиология и жизненный цикл</b></p>
<p style="margin:0 0 10px">• возбудитель --- личиночная стадия ленточного червя <b>Echinococcus granulosus</b> (кистозный эхинококкоз);</p>
<p style="margin:0 0 10px">окончательный хозяин --- собака (взрослый червь в тонкой кишке), промежуточные --- овцы, козы, крупный рогатый скот, свиньи; <b>человек --- случайный хозяин</b> ;</p>
<p style="margin:0 0 10px">• заражение: яйца с калом собак попадают на шерсть, землю, воду, овощи; ребёнок проглатывает их через</p>
<p style="margin:0 0 10px">рот; возможно и непосредственное попадание яиц в дыхательные пути.</p>
<p style="margin:0 0 10px">## <b>Патогенез</b></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Яйца в ЖКТ → онкосферы проникают через стенку кишки</span><span>С током крови --- в печень (барьер), реже --- в лёгкие | Формируется киста с хитиновой оболочкой и фиброзной капсулой | Рост, давление на ткань, прорыв, нагноение</span></div>
<p style="margin:0 0 10px">• в лёгкие попадают те зародыши, которые <b>проходят печёночный барьер</b> (через нижнюю полую вену и</p>
<p style="margin:0 0 10px">правое сердце в лёгочные артерии);</p>
<p style="margin:0 0 10px">• эхинококковый пузырь заполнен прозрачной жидкостью; стенка двухслойная: зародышевый слой с</p>
<p style="margin:0 0 10px">выводковыми капсулами и наружная хитиновая оболочка; вокруг образуется тонкая фиброзная капсула, не связанная прочно с хитиновой оболочкой; вокруг --- ателектаз, пневмосклероз, воспаление;</p>
<p style="margin:0 0 10px">• при периферическом расположении --- плевральные сращения;</p>
<p style="margin:0 0 10px">• <b>прорыв в бронх или сосуд</b> → бронхогенная или гематогенная диссеминация и вторичный эхинококкоз.</p>
<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">Выделяют <b>два периода</b> : период закрытого пузыря (обычно без осложнений) и период вскрытия в бронх (появляются осложнения).</p>
<p style="margin:0 0 10px"><b>Период</b>             <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Закрытого пузыря</b>   часто бессимптомно (находка на рентгене); боли в груди разного характера, сухой кашель, иногда скудная слизистая мокрота с прожилками крови; слабость, потливость, периодическая температура, одышка (непостоянны); иногда крапивница (токсико-аллергические реакции); при больших периферических кистах --- укорочение перкуторного звука и ослабление дыхания; эозинофилия</p>
<p style="margin:0 0 10px"><b>Вскрытия в бронх</b>   приступ кашля с отхождением большого количества <b>прозрачной жидкости с обрывками оболочек</b> («виноградной кожурой»), кровохарканье, одышка, аллергические реакции вплоть до асфиксии; затем картина как при абсцессе лёгкого (лихорадка, гнойная мокрота, влажные хрипы)</p>
<p style="margin:0 0 10px"><b>Прорыв в плевру</b>    острая дыхательная недостаточность, плевральный шок, иногда напряжённый пневмоторакс, затем эмпиема плевры</p>`},
  {n:152, t:"Эхинококк лёгких у детей. Классификация, диагностика и диф. диагностика", a:`<p style="margin:0 0 10px">Разумовский, рис. 8.11 (с. 136, дифференциальная диагностика с абсцессом); Исаков, с. 197 (кистозные образования и УЗИ печени). Остальное --- методические рекомендации ВолгГМУ (2018), Perm (2026), обзоры диагностики осложнённых кист.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   рентгенография · КТ · УЗИ печени · серология · симптом Вотчала · абсцесс · туберкулёма</p>
<p style="margin:0 0 10px">## <b>Классификация</b></p>
<p style="margin:0 0 10px">Единой «книжной» классификации по лёгким в твоих книгах нет --- ниже по общим принципам из источников:</p>
<p style="margin:0 0 10px"><b>Признак</b>                <b>Виды</b></p>
<p style="margin:0 0 10px"><b>По течению (ВолгГМУ)</b>   <b>период закрытого пузыря</b> (неосложнённый) и <b>период вскрытия в бронх</b> (осложнённый)</p>
<p style="margin:0 0 10px"><b>По происхождению</b>       первичный и вторичный (метастатический, после прорыва кисты в бронх или сосуд)</p>
<p style="margin:0 0 10px"><b>По числу и стороне</b>     одиночные и множественные; одно- и двусторонние; правое лёгкое поражается вдвое чаще левого, нижние доли чаще</p>
<p style="margin:0 0 10px"><b>Осложнения</b>             нагноение, разрыв и вскрытие в бронх, плевральную полость, перикард, брюшную полость; гибель паразита с кальцинозом</p>
<p style="margin:0 0 10px"><b>Вид возбудителя</b>        кистозный эхинококкоз (E. granulosus) и альвеококкоз (E. multilocularis; в лёгкие прорастает из печени или метастазирует)</p>
<p style="margin:0 0 10px"><b>Метод</b>                                <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Рентгенография и КТ грудной клетки</b>   <b>округлая гомогенная чётко очерченная тень</b> с ровным контуром; форма может меняться при дыхании; у диафрагмы --- симптом Вотчала (участки просветления); серповидное просветление над тенью --- отслойка хитиновой оболочки; после прорыва --- полость с уровнем жидкости</p>
<p style="margin:0 0 10px"><b>УЗИ печени (И.)</b>                      обязательно при подозрении на эхинококкоз лёгкого --- частое <b>сочетанное поражение</b></p>
<p style="margin:0 0 10px"><b>Серология</b>                            реакция агглютинации, ИФА (IgG к антигенам эхинококка); реакция Касони --- устарела, не абсолютно специфична</p>
<p style="margin:0 0 10px"><b>Общий анализ крови</b>                   эозинофилия (абсолютная, десятки и сотни клеток/мкл)</p>
<p style="margin:0 0 10px"><b>Бронхоскопия</b>                         при осложнённой кисте: обрывки оболочек в бронхе; рентген при осложнениях может быть малоинформативным</p>
<p style="margin:0 0 10px"><b>Анамнез</b>                              пребывание в эндемичном районе (И.), контакт с собаками, сельское хозяйство</p>
<p style="margin:0 0 10px">## <b>Диагностика</b></p>
<p style="margin:0 0 10px">![](media/image155.jpg){width="2.3611100174978126in" height="1.6161964129483815in"}</p>
<p style="margin:0 0 10px">*Рис. 8.11 (Р., с. 136). Нагноившиеся эхинококковые кисты лёгких. Дифференциальная диагностика с абсцессом --- двусторонность, чёткая оболочка кисты, слабая перифокальная инфильтрация. Скопировано из книги.*</p>
<p style="margin:0 0 10px"><b>С чем</b>                                                             <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Абсцесс лёгкого (Р.)</b>                                              при абсцессе --- выраженная перифокальная инфильтрация; при нагноившейся эхинококковой кисте --- тонкая, чёткая оболочка, слабая инфильтрация, двусторонность; клинически проще</p>
<p style="margin:0 0 10px"><b>Врождённая киста лёгкого (И., Р.)</b>                                 нагноившаяся киста протекает легче; гомогенное затенение с чёткими контурами требует исключения паразитарной кисты (чаще эхинококковой) и опухоли</p>
<p style="margin:0 0 10px"><b>Опухоли и метастазы, гамартома</b>                                    серология, КТ, биопсия; по подозрению --- дифференцируют «в первую очередь»</p>
<p style="margin:0 0 10px"><b>Туберкулёма</b>                                                       анамнез, проба Манту/Диаскинтест; возможно сочетание с эхинококкозом (2,5 %)</p>
<p style="margin:0 0 10px"><b>Заболевания средостения (дермоидные кисты, тератомы, невриномы)</b>   КТ</p>
<p style="margin:0 0 10px"><b>Ограниченный плеврит, релаксация диафрагмы, аневризма аорты</b>       рентген, УЗИ, КТ с контрастом</p>
<p style="margin:0 0 10px">## <b>Дифференциальная диагностика</b></p>`},
  {n:153, t:"Эхинококк лёгких у детей. Профилактика, лечение и осложнение", a:`<p style="margin:0 0 10px">Исаков, с. 197 (плановое оперативное лечение кист); Разумовский, с. 295 (албендазол и формалин). Остальное --- методические рекомендации ВолгГМУ (2018), диссертационный и журнальный обзоры детской торакальной хирургии.</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   эхинококкэктомия · торакоскопия · резекция · албендазол · прорыв в плевру · профилактика</p>
<p style="margin:0 0 10px">## <b>Профилактика</b></p>
<p style="margin:0 0 10px">• та же, что при эхинококкозе печени (вопрос 150): дегельминтизация собак, санитарно-ветеринарный</p>
<p style="margin:0 0 10px">контроль, не кормить собак внутренностями, гигиена рук, мытьё овощей, чистая вода;</p>
<p style="margin:0 0 10px">• обследование детей из эндемичных районов (УЗИ печени, рентген груди при кашле и боли в груди); при</p>
<p style="margin:0 0 10px">кистах других органов --- исключить лёгкие.</p>
<p style="margin:0 0 10px">## <b>Лечение</b></p>
<p style="margin:0 0 10px">• <b>основной метод --- оперативный, как можно раньше после диагноза</b> (ВолгГМУ); Исаков: сложность</p>
<p style="margin:0 0 10px">дифференциальной диагностики с опухолью, риск роста, нагноения и разрыва --- основание для плановой операции; операции --- органосохраняющие, у детей лёгкое стараются сохранить;</p>
<p style="margin:0 0 10px">• <b>три группы операций</b> (ВолгГМУ): 1) <b>открытая эхинококкэктомия</b> --- вскрытие кисты и удаление</p>
<p style="margin:0 0 10px">оболочек; 2) <b>закрытая</b> --- удаление паразита без вскрытия кисты; 3) <b>резекция</b> поражённого отдела или всего лёгкого (при гибели лёгочной ткани, множественных нагноившихся кистах);</p>
<p style="margin:0 0 10px">• в детской торакальной хирургии применяют <b>видеоторакоскопическую эхинококкэктомию</b></p>
<p style="margin:0 0 10px">(журнальные и диссертационные обзоры); <b>PAIR</b> при лёгких обсуждается в обзорах как возможный метод;</p>
<p style="margin:0 0 10px">• обработка полости --- противопаразитарными растворами (Р., с. 295: 2 % формальдегид на глицероле --- на</p>
<p style="margin:0 0 10px">примере селезёнки); после операции --- <b>албендазол</b> курсами (у детей описаны курсы около месяца с повторением), контроль эозинофилии и рентгена;</p>
<p style="margin:0 0 10px">• смертность после операций по поводу эхинококкоза лёгких около 1 %, отдалённые результаты хорошие</p>
<p style="margin:0 0 10px">(ВолгГМУ);</p>
<p style="margin:0 0 10px">• при осложнениях: нагноение --- дренирование и антибиотики по общим принципам лечения абсцесса;</p>
<p style="margin:0 0 10px">прорыв в плевру --- срочное дренирование и операция.</p>
<p style="margin:0 0 10px"><b>Осложнение</b>                        <b>Комментарий</b></p>
<p style="margin:0 0 10px"><b>Нагноение кисты</b>                   по типу абсцесса лёгкого; лихорадка, гнойная мокрота</p>
<p style="margin:0 0 10px"><b>Прорыв в бронх</b>                    отхождение жидкости и обрывков оболочек; кровохарканье, <b>асфиксия</b> , аллергические реакции; при неполном отхождении оболочки --- абсцесс; после полного отхождения полость спадается и заживает</p>
<p style="margin:0 0 10px"><b>Прорыв в плевру</b>                   плевральный шок, острая дыхательная недостаточность, напряжённый пневмоторакс, <b>эмпиема плевры</b> ; возможен прорыв в перикард, брюшную полость, наружу через грудную стенку</p>
<p style="margin:0 0 10px"><b>Диссеминация</b>                      бронхогенная или гематогенная --- <b>вторичный эхинококкоз</b> других отделов лёгких и органов</p>
<p style="margin:0 0 10px"><b>Гибель паразита</b>                   сморщивание кисты, кальциноз или нагноение; интоксикация при больших пузырях</p>
<p style="margin:0 0 10px"><b>После операции (общие учебники)</b>   остаточная полость, бронхиальный свищ, эмпиема, пневмония, рецидив</p>
<p style="margin:0 0 10px">## <b>Осложнения</b></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 3</b></span><span><b>ШАГ 4</b> | <b>ШАГ 1</b> | <b>ШАГ 2</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Эхинококкэктомия (торакоскопически) или резекция</span><span>Албендазол, контроль рентгеном и эозинофилией | Диагноз: рентген/КТ, серология, УЗИ печени | Плановая операция сразу после диагноза</span></div>`},
  {n:154, t:"Некротическая флегмона новорождённых. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">Разумовский, гл. 40.1 (с. 530--531, рис. 40.1); Исаков, 7.3 (с. 545--546).</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА:</b>   флегмона новорождённых · подкожная клетчатка · стафилококк · потовые железы · гиалуронидаза · некроз</p>
<p style="margin:0 0 10px"><b>Некротическая флегмона новорождённого</b> --- острое гнойно-некротическое воспаление подкожно-жировой клетчатки (Р.); у новорождённых особая форма гнойного поражения кожи и клетчатки с быстрым распространением (И.). Типичная локализация: <b>задняя и боковая поверхности грудной клетки, поясничная и крестцовая области</b> (Р.); по Исакову --- крестцово-копчиковая и лопаточная области, передняя и боковая поверхности груди; реже ягодицы, конечности.</p>
<p style="margin:0 0 10px">## <b>Этиология</b></p>
<p style="margin:0 0 10px">• возбудитель --- <b>золотистый стафилококк</b> , реже стрептококк; в процессе лечения возбудитель может</p>
<p style="margin:0 0 10px">смениться (Р.); далее может присоединиться грамотрицательная или смешанная флора (И.);</p>
<p style="margin:0 0 10px">• проникновению инфекции через кожу способствует её повреждение при несоблюдении гигиены ухода и</p>
<p style="margin:0 0 10px">правил асептики при манипуляциях (Р., И.).</p>
<p style="margin:0 0 10px">## <b>Предрасполагающие особенности кожи новорождённого (И.)</b></p>
<p style="margin:0 0 10px">• лёгкая ранимость эпидермиса;</p>
<p style="margin:0 0 10px">• слабое развитие базальной мембраны;</p>
<p style="margin:0 0 10px">• относительно большое содержание межклеточной жидкости;</p>
<p style="margin:0 0 10px">• богатая сосудистая сеть;</p>
<p style="margin:0 0 10px">• недоразвитие соединительнотканных перемычек в жировой клетчатке;</p>
<p style="margin:0 0 10px">• несовершенство иммунных реакций --- воспаление <b>не отграничивается</b> .</p>
<p style="margin:0 0 10px">## <b>Патогенез</b></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 3</b></span><span><b>ШАГ 1</b> | <b>ШАГ 2</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Тромбоз сосудов, отёк, гиалуронидаза → быстрое распространение</span><span>Повреждённая кожа, нарушение ухода → стафилококк | Воспаление вокруг потовых желёз, глубокие слои клетчатки | Некроз клетчатки и кожи, обширные дефекты</span></div>
<p style="margin:0 0 10px">• <b>воспаление начинается вокруг потовых желёз</b> , наиболее резкие изменения --- в глубоких слоях</p>
<p style="margin:0 0 10px">подкожной клетчатки (Р., И.);</p>
<p style="margin:0 0 10px">• быстро тромбируются околоочаговые сосуды (эндо- и периартериит), «молниеносно» распространяющийся</p>
<p style="margin:0 0 10px">отёк резко нарушает питание клетчатки и кожи → <b>некроз</b> ;</p>
<p style="margin:0 0 10px">• стафилококк вырабатывает <b>гиалуронидазу</b> , повышающую проницаемость тканей (Р.); процесс может</p>
<p style="margin:0 0 10px">охватить значительную поверхность за несколько часов;</p>
<p style="margin:0 0 10px">• при патоморфологическом исследовании преобладают некротические процессы (И.).</p>
<p style="margin:0 0 10px">## <b>Клиническая картина</b></p>
<p style="margin:0 0 10px">• <b>начало с общих симптомов</b> : ребёнок вялый, беспокойный, плохо спит, отказывается от груди,</p>
<p style="margin:0 0 10px">температура 38--39 °С (Р., И.);</p>
<p style="margin:0 0 10px">• на участке поражения --- <b>красное пятно</b> , которое за несколько часов быстро увеличивается; кожа сначала</p>
<p style="margin:0 0 10px">багровая, затем <b>цианотичная</b> ; уплотнение и отёк мягких тканей;</p>
<p style="margin:0 0 10px">• <b>ко 2-м суткам</b> --- флюктуация в центре очага; нарастает токсикоз; местный процесс может</p>
<p style="margin:0 0 10px">распространиться на значительное протяжение;</p>
<p style="margin:0 0 10px">• в тяжёлых случаях кожа отслаивается, некротизируется, образуются <b>обширные дефекты</b> мягких тканей</p>
<p style="margin:0 0 10px">(рис. 40.1);</p>
<p style="margin:0 0 10px">• при вскрытии --- мутная серозная жидкость или жидкий гной обычно вместе с кусочками ткани серого</p>
<p style="margin:0 0 10px">цвета; иногда клетчатка отторгается большими участками.</p>
