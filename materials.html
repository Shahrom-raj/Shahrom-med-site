<p style="margin:0 0 10px"><b>Преимущества:</b> меньшая травматичность, меньше послеоперационных осложнений ( <b>раневые осложнения практически исключены</b> ), хороший косметический результат, раннее восстановление функций, <b>меньше спаечный процесс</b> , короче срок в стационаре; <b>наиболее эффективна при осложнённых формах</b> (исключается широкая лапаротомия) --- Р., И.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дополнительно</b></h4></p>
<p style="margin:0 0 10px">• при распространённом перитоните --- санация брюшной полости, дренирование, антибиотики широкого спектра с метронидазолом;</p>
<p style="margin:0 0 10px">• при плотном инфильтрате --- тактика по осложнениям (вопрос 107);</p>
<p style="margin:0 0 10px">• антибактериальная терапия по показаниям; инфузионная терапия при токсикозе (по учебникам).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Прогноз</b></h4></p>
<p style="margin:0 0 10px">При ранней диагностике прогноз благоприятный; <b>летальность 0,2--0,3 %</b> ; при поздней диагностике, особенно в раннем возрасте, значительно выше (Р., И.).</p>`},
  {n:107, t:"Аппендицит у детей. Осложнения", a:`<p style="margin:0 0 10px">*Разумовский, гл. 20.2 (с. 315--326); Исаков, с. 601--606 (7.12.2). Послеоперационные осложнения --- частично по общим учебникам.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: аппендикулярный перитонит периаппендикулярный инфильтрат абсцесс</b></p>
<p style="margin:0 0 10px"><b>парез кишечника спаечная непроходимость</b></p>
<p style="margin:0 0 10px"><b>Осложнения острого аппендицита</b> у детей --- прежде всего <b>аппендикулярный перитонит</b> (воспаление брюшины с последующим формированием инфильтратов и абсцессов), частота которого значительно выше, чем у взрослых, из-за слабого отграничения процесса (слабые пластические свойства брюшины, недоразвитый сальник).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация осложнений: аппендикулярный перитонит (Р.)</b></h4></p>
<p style="margin:0 0 10px"><b>Вид</b>                       <b>Формы</b></p>
<p style="margin:0 0 10px"><b>Местный</b> отграниченный     <b>периаппендикулярный инфильтрат</b> ( <b>рыхлый</b> в первые 2--3 сут: сращения легко разделить; <b>плотный</b> : разделить без риска повредить кишку нельзя); <b>периаппендикулярный абсцесс</b> (деструкция отростка в толще инфильтрата)</p>
<p style="margin:0 0 10px"><b>Местный</b> неотграниченный   затёк экссудата по правому латеральному каналу и в малый таз</p>
<p style="margin:0 0 10px"><b>Распространённый</b>          <b>диффузный</b> , <b>разлитой</b> , <b>общий</b> перитонит</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения подробнее</b></h4></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                                                                        <b>Суть, клиника, лечение (Р., И.)</b></p>
<p style="margin:0 0 10px"><b>Аппендикулярный инфильтрат</b>                                                        у детей реже, чем у взрослых; чаще у 10--14 лет, при <b>поздней диагностике</b> и ретроцекальном отростке; поступают на 3--5-е сутки; у малышей инфильтрат «горячий» и склонен к быстрому абсцедированию; пальпируется болезненное округлое образование в правой подвздошной ямке, высокая температура, лейкоцитоз, ↑СОЭ; ретроцекальный --- бимануальное исследование; УЗИ. <b>Консервативная тактика у детей раннего возраста опасна</b> --- инфильтрат расценивают как отграниченный абсцесс (показание к операции); у старших --- антибиотики и физиотерапия: рассасывание за 10--15 сут, ≈ 15 % нагнаиваются</p>
<p style="margin:0 0 10px"><b>Периаппендикулярный абсцесс</b>                                                       нарастание боли, симптомов раздражения брюшины, <b>гектическая температура</b> ; УЗИ, КТ; цель операции --- <b>вскрытие, аспирация гноя, дренирование</b> ; аппендэктомия --- только если можно легко удалить, не разрушая спаек; иначе <b>дренирование, аппендэктомия через 3--4 мес</b></p>
<p style="margin:0 0 10px"><b>Разлитой (диффузный) перитонит</b>                                                    тяжёлая интоксикация, рвота с жёлчью, парез кишечника, вздутие, эксикоз; экстренная операция: санация, дренирование, лапароскопия или лапаротомия; антибиотики с метронидазолом, инфузионная терапия</p>
<p style="margin:0 0 10px"><b>Парез желудка и кишечника</b> (динамическая непроходимость)                           нарастает интоксикация, повторная рвота, одышка; лечение консервативное; нет эффекта → <b>это проявление перитонита</b> --- операция</p>
<p style="margin:0 0 10px"><b>Межпетлевые абсцессы</b> , инфильтраты брюшной полости, <b>кишечная непроходимость</b>   при тяжёлом течении в послеоперационном периоде</p>
<p style="margin:0 0 10px">Другие (по учебникам)                                                                 раневая инфекция (при открытой операции), кишечный свищ при несостоятельности культи, <b>спаечная кишечная непроходимость</b> (поздно), сепсис, внутрибрюшное кровотечение, эвентрация</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Прогноз и профилактика</b></h4></p>
<p style="margin:0 0 10px">• <b>Все дети, перенёсшие аппендикулярный перитонит, нуждаются в диспансерном наблюдении</b> --- риск <b>спаечных осложнений</b> : гастроэнтеролог, диета (ограничение грубой пищи, тщательная обработка продуктов с клетчаткой, мясом), физиотерапия;</p>
<p style="margin:0 0 10px">• прогноз для жизни благоприятный; летальные исходы крайне редки (чаще при запоздалой диагностике у малышей).</p>`},
  {n:108, t:"Особенности течения острого аппендицита у новорождённых и детей раннего возраста", a:`<p style="margin:0 0 10px">*Разумовский, гл. 20.1 (с. 306--309, 311--313); Исаков, с. 585--598, 599--601 (разд. 7.11 «Аппендицит у новорождённых»).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: новорождённые недоношенные некротический энтероколит</b></p>
<p style="margin:0 0 10px"><b>поведение ребёнка рвота 3--5 раз</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Новорождённые (Исаков, с. 599--601)</b></h4></p>
<p style="margin:0 0 10px"><b>Особенность</b>      <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Частота</b>          ранее редкость (до 1960 г. описано 24 случая --- операционные и патологоанатомические находки); сейчас всё чаще диагностируют и оперируют</p>
<p style="margin:0 0 10px"><b>Патогенез</b>        в отличие от старших --- <b>геморрагический либо септический инфаркт стенки отростка</b> из-за нарушения гомеостаза (перинатальная гипоксия, инфекция, незрелость); связь с <b>грамотрицательным дисбактериозом</b> ; реже --- инородные тела (пушковый волос), тяжи при незавершённом повороте, ущемление отростка при паховой грыже</p>
<p style="margin:0 0 10px"><b>Кто болеет</b>       <b>недоношенные</b> с массой 1--2 кг, в возрасте <b>7--20 дней</b> ; у всех --- перенесённая перинатальная гипоксия, инфицирование, нарушение мозгового кровообращения</p>
<p style="margin:0 0 10px"><b>Клиника</b>          острое начало, нарастание <b>инфекционного токсикоза</b> : рвота с жёлчью, вздутие живота, задержка стула; в первые 12 ч --- локальная болезненность справа, пассивное напряжение, Щёткин--Блюмберг, при отграничении --- инфильтрат; <b>температурной реакции, как правило, нет</b> ; лейкоциты 7--18×10⁹/л; позднее --- разлитой перитонит</p>
<p style="margin:0 0 10px"><b>Дифдиагностика</b>   <b>некротический энтероколит</b> : стадийное течение, частый жидкий стул со слизью, зеленью, кровью; на рентгене резкое снижение газонаполнения, гидропеританеум. Аппендицит --- острое начало, <b>задержка стула</b> ; на рентгене затенение в правой половине живота, паретически вздутые петли, нет утолщения стенок. Решает динамика за <b>3--6 ч</b> детоксикации и антибиотиков: нет улучшения → экстренная операция</p>
<p style="margin:0 0 10px"><b>Лечение</b>          правосторонний трансмускулярный или параректальный доступ 3--4 см (купол слепой кишки высоко под печенью); <b>лигатурная аппендэктомия</b> , дренаж; антибиотики --- цефалоспорины последних поколений (цефотаксим, цефепим), карбапенемы; прогноз благоприятный, если операция не позднее <b>12--18 ч</b> от начала ухудшения</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дети раннего возраста (первые годы жизни, Р., И.)</b></h4></p>
<p style="margin:0 0 10px"><b>Особенность</b>        <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Течение</b>            болеют редко; аппендицит развивается <b>быстро</b> ; деструкция и перитонит --- чаще; воспаление не отграничивается; <b>общие симптомы преобладают над местными</b></p>
<p style="margin:0 0 10px"><b>Жалобы на боль</b>     прямых указаний нет --- судят по <b>поведению</b> : вялый, капризный, малоконтактный (\\> 75 %); <b>нарушение сна</b> (≈ 1/3)</p>
<p style="margin:0 0 10px"><b>Температура</b>        повышена почти всегда ( <b>95 %</b> ), часто 38--39 °C</p>
<p style="margin:0 0 10px"><b>Рвота</b>              довольно постоянна ( <b>85 %</b> ), <b>многократная (3--5 раз)</b></p>
<p style="margin:0 0 10px"><b>Стул</b>               жидкий --- ≈ 15 % (при осложнённых формах и тазовом положении)</p>
<p style="margin:0 0 10px"><b>Локализация боли</b>   вокруг <b>пупка</b> (недостаточное развитие коры, иррадиация, близость солнечного сплетения к корню брыжейки); жалоб на правую подвздошную область почти нет</p>
<p style="margin:0 0 10px"><b>Осмотр</b>             локальную болезненность и пассивное напряжение найти <b>чрезвычайно трудно</b> из-за беспокойства; следят за поведением (двигательное беспокойство, мимика); применяют сравнительную пальпацию в обеих подвздошных областях, глубокую пальпацию на вдохе (во сне)</p>
<p style="margin:0 0 10px"><b>Анализы</b>            лейкоциты чаще 15--20×10⁹/л, нередко 25--30×10⁹/л и более</p>
<p style="margin:0 0 10px"><b>Дифдиагностика</b>     <b>ОРВИ</b> (1-е место ошибок), копростаз, мочевые пороки, отит, пневмония, инвагинация (вопрос 105)</p>
<p style="margin:0 0 10px"><b>Лечение</b>            лигатурная аппендэктомия (тонкая стенка кишки; баугиниева заслонка близко); у малышей <b>инфильтрат оперируют</b> (рассматривают как абсцесс); летальность выше</p>`},
  {n:109, t:"Особенности течения острого аппендицита у детей старшего возраста", a:`<p style="margin:0 0 10px">*Разумовский, гл. 20.1 (с. 306--307, 309--311); Исаков, с. 581--585, 592--598.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: дети школьного возраста боль в правой подвздошной девочки 11--15 лет</b></p>
<p style="margin:0 0 10px"><b>атипичные формы гипердиагностика</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Особенности у детей старшего возраста (школьники)</b></h4></p>
<p style="margin:0 0 10px"><b>Признак</b>                  <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Клиника</b>                  <b>более отчётлива</b> , чем у малышей: боль в животе, повышение температуры, рвота, иногда нарушение стула; <b>ребёнок может указать место боли</b> (чаще правая подвздошная область)</p>
<p style="margin:0 0 10px"><b>Боль</b>                     нерезкая, постоянная, непрерывная; сон поверхностный; при гнойном растяжении отростка сильная, вынужденное положение</p>
<p style="margin:0 0 10px"><b>Температура и рвота</b>      37,5--38 °C (в 15 % норма); рвота у 75 % (рефлекторная)</p>
<p style="margin:0 0 10px"><b>Местные симптомы</b>         выражены: локальная болезненность (симптом Филатова), защитное напряжение, Щёткин--Блюмберг; <b>диагностика обычно не вызывает трудностей</b> (И.)</p>
<p style="margin:0 0 10px"><b>Течение</b>                  у части детей --- стёртое, в 15 % атипичное положение отростка (тазовое, ретроцекальное, медиальное); на фоне антибиотиков --- абсцессы</p>
<p style="margin:0 0 10px"><b>Психологический фактор</b>   школьники нередко <b>скрывают боль</b> (боязнь операции) или <b>преувеличивают</b> ; поэтому диагностика требует осторожности; часть хирургов склонна к гипердиагностике</p>
<p style="margin:0 0 10px"><b>Осложнения</b>               <b>аппендикулярный инфильтрат</b> --- чаще у 10--14 лет при поздней диагностике; ретроцекальное положение; абсцесс</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика (Р., И.)</b></h4></p>
<p style="margin:0 0 10px">• <b>три основных симптома</b> --- болезненность, защитное напряжение, Щёткин--Блюмберг в правой подвздошной области; пальпация начинается с левой подвздошной области;</p>
<p style="margin:0 0 10px">• обязательно <b>ректальное бимануальное</b> исследование; УЗИ (аппендикс \\> 6--7 мм); лейкоцитоз 15--17×10⁹/л; в сомнительных случаях --- наблюдение в стационаре до суток, лапароскопия.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика, характерная для старших детей</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                               <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Желудочно-кишечные инфекции</b> , ЯК, гастродуоденит    диспепсия на первом плане; рвота даёт облегчение; Щёткин--Блюмберг отрицательный</p>
<p style="margin:0 0 10px"><b>Заболевания мочевыделительной системы</b>               боли приступообразные, иррадиация в пах; изменения в моче; УЗИ почек</p>
<p style="margin:0 0 10px"><b>Гинекологические</b> (девочки 11--15 лет)               нерегулярный цикл, предменструальные боли, <b>фолликулярные и лютеиновые кисты</b> , перекрут кисты; УЗИ и ректоабдоминальное исследование</p>
<p style="margin:0 0 10px"><b>Заболевания жёлчных путей</b>                           боли в правом подреберье, иррадиация; УЗИ</p>
<p style="margin:0 0 10px"><b>Копростаз</b>                                           задержка стула, температура до 37,6 °C, лейкоциты в норме, после клизмы --- мягкий живот</p>
<p style="margin:0 0 10px"><b>Первичный пельвиоперитонит у девочек</b> (И., 7.12.1)   острое начало с высокой температурой, жидкий стул, вздутие; диагноз при лапароскопии; (как и аппендикулярный) --- перитонит; лечение --- антибиотики, при необходимости операция</p>
<p style="margin:0 0 10px"><b>Лечение:</b> ранняя аппендэктомия (чаще лапароскопическая); при абсцессе --- дренирование, аппендэктомия позже; диспансерное наблюдение после перитонита.</p>`},
  {n:110, t:"Дивертикул Меккеля. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px">*Разумовский, гл. 13 (с. 197--200, рис. 13.5, 13.7--13.9); Исаков, с. 286--287, 343.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: дивертикул Меккеля желточный проток илеоцекальный клапан</b></p>
<p style="margin:0 0 10px"><b>эктопированная слизистая Q43.0</b></p>
<p style="margin:0 0 10px"><b>Дивертикул Меккеля</b> (дивертикул подвздошной кишки) --- <b>выпячивание участка подвздошной кишки, представляющее собой необлитерированную проксимальную часть желточного протока</b> , по форме напоминающее червеобразный отросток. Впервые описан немецким анатомом <b>Й. Меккелем в 1809 г.</b> Код МКБ-10: <b>Q43.0</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология и анатомия</b></h4></p>
<p style="margin:0 0 10px">• по секционным данным --- у <b>2--3 %</b> людей;</p>
<p style="margin:0 0 10px">• чаще выпячивание на <b>противобрыжеечной</b> стороне подвздошной кишки; возможно на брыжеечном крае и в толще брыжейки;</p>
<p style="margin:0 0 10px">• расстояние от илеоцекального клапана --- от 10--30 до <b>120 см</b> ; длина дивертикула 1--2 до 15--20 см; ширина 1--5 см;</p>
<p style="margin:0 0 10px">• обычно <b>свободно сообщается</b> с просветом кишки. <b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Желточный проток не облитерируется (3--5 мес)</span><span>Остаётся проксимальный отдел --- дивертикул | Дистопированная слизистая желудка/ПЖ | Язва, кровотечение, воспаление, непроходимость</span></div>
<p style="margin:0 0 10px">• этиология --- <b>нарушение облитерации желточного протока</b> (вопрос 94);</p>
<p style="margin:0 0 10px">• стенка дивертикула имеет строение <b>стенки тонкой кишки</b> , но в слизистой в <b>до 80 %</b> случаев --- <b>дистопированная слизистая желудка или ткань поджелудочной железы</b> ;</p>
<p style="margin:0 0 10px">• активная секреция атипично расположенных железистых клеток → <b>эрозивно-язвенный процесс</b> → <b>кишечное кровотечение</b> ;</p>
<p style="margin:0 0 10px">• формы осложнений (рис. 13.7): кровотечение, инвагинация, странгуляционная непроходимость, дивертикулит, заворот дивертикула на длинной ножке, заворот кишечника;</p>
<p style="margin:0 0 10px">• причины непроходимости: перекрут петель вокруг дивертикула, припаянного к брюшной стенке; ущемление при фиксации к брыжейке или петлям; внедрение дивертикула в кишку → тонкокишечная инвагинация; ущемление в паховой грыже ( <b>грыжа Литтре</b> ); опухоли --- исключительно редко.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                          <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Бессимптомная</b>                  чаще всего; находят случайно при лапаротомии (чаще по поводу <b>острого аппендицита</b> )</p>
<p style="margin:0 0 10px"><b>Кровотечение</b>                   остро, <b>на фоне полного здоровья, без болей</b> ; чаще у детей до 2--3 лет; стул тёмно-вишнёвый, многократный, повторяется; при массивном --- бледность, тахикардия, анемия, коллапс, ↓гемоглобина; иногда боли из-за раздражения кишки кровью; кровотечение может быть небольшим</p>
<p style="margin:0 0 10px"><b>Острый дивертикулит</b>            редко; клиника <b>как у острого аппендицита</b> (близость расположения); дооперационная диагностика практически невозможна</p>
<p style="margin:0 0 10px"><b>Инвагинация</b> с дивертикула      типично: внезапное начало, приступообразная боль, рвота, кишечное кровотечение; дивертикул находят после дезинвагинации</p>
<p style="margin:0 0 10px"><b>Кишечная непроходимость</b>        типичная, иногда медленное нарастание --- сначала частичная, затем полная</p>
<p style="margin:0 0 10px"><b>Заворот</b> дивертикула на ножке   острая боль, рвота; (рис. 13.8 --- лапароскопическая картина заворота)</p>

  {n:110, t:"Дивертикул Меккеля. Этиология, патогенез и клиника", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: желточный проток илеум гетеротопия слизистой кровотечение Q43.0</b></p>
<p style="margin:0 0 10px"><b>Дивертикул Меккеля</b> --- врождённое выпячивание подвздошной кишки, представляющее собой <b>необлитерированную проксимальную часть желточного (омфаломезентериального) протока</b> ; по форме напоминает червеобразный отросток. Описан Й. Меккелем в 1809 г. Код МКБ-10: <b>Q43.0</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• по секционным данным обнаруживают у <b>2--3 %</b> людей; у большинства носителей порок ничем не</p>
<p style="margin:0 0 10px">проявляется</p>
<p style="margin:0 0 10px">• осложнения чаще возникают в детском возрасте; кровотечение --- у детей до 2--3 лет</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• порок развития: нарушение обратного развития желточного протока, соединяющего в эмбриогенезе</p>
<p style="margin:0 0 10px">среднюю кишку с желточным мешком (в норме проток облитерируется к 5--7-й неделе внутриутробного развития)</p>
<p style="margin:0 0 10px">• при необлитерации только <b>кишечного конца</b> протока формируется дивертикул (другие варианты: киста</p>
<p style="margin:0 0 10px">протока, неполный и полный свищ пупка, фиброзный тяж)</p>
<p style="margin:0 0 10px">• причина, нарушающая облитерацию протока, точно не установлена</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Анатомия дивертикула</b></h4></p>
<p style="margin:0 0 10px"><b>Признак</b>                              <b>Характеристика</b></p>
<p style="margin:0 0 10px"><b>Расположение</b>                         чаще на <b>противобрыжеечной</b> стороне подвздошной кишки; возможно на брыжеечном крае и в толще брыжейки</p>
<p style="margin:0 0 10px"><b>Расстояние до баугиниевой заслонки</b>   от 10--30 до 120 см</p>
<p style="margin:0 0 10px"><b>Размеры</b>                              длина от 1--2 до 15--20 см; ширина 1--5 см; обычно свободно сообщается с просветом кишки</p>
<p style="margin:0 0 10px"><b>Стенка</b>                               как у тонкой кишки; в слизистой до <b>80 %</b> случаев --- дистопия слизистой желудка или ткани ПЖ</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b> Проток не облитерируется на кишечном конце</span><span><b>ШАГ 2</b> Слепой выступ подвздошной кишки | <b>ШАГ 3</b> Гетеротопия слизистой желудка / ПЖ | <b>ШАГ 4</b> Язва, воспаление, непроходимость</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Вариант</b>          <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Бессимптомный</b>    широкое сообщение с кишкой; случайная находка на лапаротомии (чаще при операции по поводу аппендицита)</p>
<p style="margin:0 0 10px"><b>Кровотечение</b>     остро, на фоне полного здоровья, <b>без боли</b> ; бледность, тахикардия, анемия, коллапс; стул тёмно-вишнёвого цвета, повторяется; рецидивирует</p>
<p style="margin:0 0 10px"><b>Дивертикулит</b>     протекает как острый аппендицит; до операции диагностика практически невозможна</p>
<p style="margin:0 0 10px"><b>Инвагинация</b>      внезапное начало, приступообразная боль, рвота, кровь в стуле; дивертикул находят после дезинвагинации</p>

  {n:111, t:"Дивертикул Меккеля. Классификация, диагностика и диф. диагностика", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: классификация 99mTc-сцинтиграфия лапароскопия ангиоматоз</b></p>
<p style="margin:0 0 10px"><b>ректальное исследование</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (по осложнениям)</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>                    <b>Формы</b></p>
<p style="margin:0 0 10px"><b>Дивертикулит</b>              <b>острый</b> (катаральный, флегмонозный, гангренозный); <b>хронический</b></p>
<p style="margin:0 0 10px"><b>Кишечная непроходимость</b>   странгуляция; инвагинация; ущемление в грыже (грыжа Литтре)</p>
<p style="margin:0 0 10px"><b>Кровотечение</b>              язвенное --- из дистопированной слизистой желудка/ПЖ</p>
<p style="margin:0 0 10px"><b>Опухоли</b>                   доброкачественные, злокачественные (возникают исключительно редко)</p>
<p style="margin:0 0 10px">По течению: бессимптомный (случайная находка) и осложнённый.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px">Диагностика дивертикула Меккеля вызывает <b>большие затруднения</b> ; о нём чаще всего думают при <b>рецидивирующих кишечных кровотечениях</b> .</p>
<p style="margin:0 0 10px"><b>Метод</b>                        | <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Осмотр, пальпация</b>            | живот правильной формы, не вздут, безболезнен при поверхностной и глубокой пальпации; симптомов раздражения брюшины нет</p>
<p style="margin:0 0 10px"><b>Ректальное исследование</b>      | кровь <b>тёмно-вишнёвого</b> цвета; такой стул многократно отходит самостоятельно</p>
<p style="margin:0 0 10px"><b>Анамнез</b>                      | гемостатическая терапия даёт лишь временный эффект, затем кровотечение возобновляется</p>
<p style="margin:0 0 10px"><b>Общий анализ крови</b>           | анемия, снижение гемоглобина</p>
<p style="margin:0 0 10px"><b>99m</b>                          | радиофармпрепарат накапливается в зоне дивертикула (дистопированная слизистая желудка); <b>ложноотрицательные результаты до 45 %</b></p>
<p style="margin:0 0 10px"><b>Сцинтиграфия с Tc</b>            |</p>
<p style="margin:0 0 10px"><b>Лапароскопия</b>                 | подтверждает или исключает дивертикул с точностью <b>до 100 %</b> ; одновременно возможна резекция</p>
<p style="margin:0 0 10px"><b>УЗИ, обзорная рентгенография</b> | при инвагинации и кишечной непроходимости (вспомогательно)</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                             <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Острый аппендицит</b>                 дивертикулит клинически неотличим; диагноз уточняют на операции (ревизия подвздошной кишки)</p>
<p style="margin:0 0 10px"><b>Ангиоматоз кишечника</b>              также даёт кишечные кровотечения; выявляют при лапароскопии/эндоскопии</p>
<p style="margin:0 0 10px"><b>Полипы толстой кишки</b>              алая кровь на поверхности кала, чаще у детей 3--7 лет; колоноскопия</p>
<p style="margin:0 0 10px"><b>Трещина, геморрой</b>                 видны при осмотре и пальцевом исследовании</p>
<p style="margin:0 0 10px"><b>Инфекционные колиты, дизентерия</b>   диарея, лихорадка, слизь; посев кала</p>
<p style="margin:0 0 10px"><b>Язвенная болезнь, ЯК</b>              ФЭГДС, колоноскопия; хроническое течение, боли</p>
<p style="margin:0 0 10px"><b>Инвагинация другой причины</b>        пальпируемое образование, УЗИ; дивертикул обнаруживают на операции</p>`},
  {n:112, t:"Дивертикул Меккеля. Лечение", a:`<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: резекция дивертикула клиновидное иссечение лапароскопия Endo GIA</b></p>
<p style="margin:0 0 10px">Лечение <b>только хирургическое</b> : при <b>всех заболеваниях дивертикула</b> выполняют его резекцию. Консервативная (гемостатическая) терапия при кровотечении даёт лишь временный эффект.</p>
<p style="margin:0 0 10px"><b>ШАГ 1</b> Подготовка: инфузия, гемотрансфузия при анемии                                                                                                                                 <b>ШАГ 4</b> Антибиотики, наблюдение</p>
<p style="margin:0 0 10px"><b>ШАГ 2 ШАГ 3</b> Лапароскопия или доступ Резекция дивертикула Волковича--Дьяконова</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Выбор способа резекции (определяется формой дивертикула)</b></h4></p>
<p style="margin:0 0 10px"><b>Ситуация</b>                        <b>Операция</b></p>
<p style="margin:0 0 10px"><b>Узкая ножка (до 1--1,5 см)</b>      перевязка ножки и погружение культи в стенку кишки --- как при аппендэктомии (лигатурный способ)</p>
<p style="margin:0 0 10px"><b>Широкое основание</b>               <b>клиновидное иссечение</b> с наложением поперечного шва на стенку кишки --- открыто или эндоскопически; альтернатива --- сшивающие аппараты <b>Endo GIA</b> 30 или 45 мм</p>
<p style="margin:0 0 10px"><b>Перфорация у брыжеечного края</b>   единственный вариант --- <b>резекция участка кишки</b> с анастомозом «конец в конец»</p>
<p style="margin:0 0 10px"><b>Инвагинация</b>                     дезинвагинация, затем резекция дивертикула; при некрозе --- резекция кишки</p>
<p style="margin:0 0 10px"><b>Странгуляция, заворот</b>           устранение заворота, оценка жизнеспособности кишки, резекция дивертикула или участка кишки</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Доступ и тактика</b></h4></p>
<p style="margin:0 0 10px">• в большинстве случаев диагноз ставят при <b>лапароскопии</b> --- при подозрении на острый аппендицит или</p>
