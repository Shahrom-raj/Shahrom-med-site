<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Стерильный пакет, кувез, зонд</span><span>Подготовка 2--3 ч | Первичная или отсроченная пластика | Декомпрессия, питание</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Догоспитальный этап (Разумовский)</b></h4></p>
<p style="margin:0 0 10px">• в родильном зале --- <b>стерильный пластиковый пакет</b> : эвентрированные органы помещают в него и сверху покрывают <b>сухой</b> стерильной ватно-марлевой повязкой (не влажной --- быстро остывает);</p>
<p style="margin:0 0 10px">• кувез <b>38 °С</b> , влажность около 100 %;</p>
<p style="margin:0 0 10px">• сразу постоянный <b>назо- или орогастральный зонд</b> (в желудке 30--100 мл), открыт при транспортировке; укладка на бок (рис. 27.4);</p>
<p style="margin:0 0 10px">• интубация и ИВЛ --- по показаниям; транспорт реанимобилем с врачом-реаниматологом, в кратчайшие сроки; противошоковые мероприятия, антибиотики (И.). <b><h4 style="margin:14px 0 8px;color:#0d7377">Предоперационная подготовка (2--3 ч)</b></h4></p>
<p style="margin:0 0 10px">• центральная и периферическая вена; ОЦК кристаллоидами и коллоидами, снижение гемоконцентрации, коррекция ацидоза, согревание;</p>
<p style="margin:0 0 10px">• <b>промывание желудка</b> и <b>высокое промывание толстой кишки</b> изотоническим NaCl (желудочный зонд № 8; объём введённого = выведенному) --- уменьшает диспропорцию; получение мекония из прямой кишки значит, что есть проходимость;</p>
<p style="margin:0 0 10px">• эффективна, если нормализовалась температура и улучшились показатели (Ht, ацидоз).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургические методы (Р.)</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>                                                                  <b>Суть</b></p>
<p style="margin:0 0 10px"><b>А. Первичная радикальная пластика</b> --- наиболее предпочтительный метод   иссечь кожную кайму, <b>последовательно погрузить петли</b> в брюшную полость (следить за брыжейкой --- не допустить подворота); расширить рану при необходимости; <b>нельзя вводить новокаин в корень брыжейки; нельзя снимать фибриновый футляр</b> с кишки (риск повреждения стенки и сосудов) --- фибрин рассасывается к 18--21-м суткам; сохранить пуповинный остаток для пупка. Возможна, если ушивается рана без натяжения и <b>внутрибрюшное давление не \\> 20 мм рт. ст.</b></p>
<p style="margin:0 0 10px"><b>Безнаркозное вправление по Бианки</b> (2002)                                изолированная форма <b>без диспропорции</b> , без плотного фибринового футляра, <b>в первые часы жизни</b> : не нужны ИВЛ и наркоз; стул на 4--6-й день, короче койко-день, хороший косметический результат</p>
<p style="margin:0 0 10px"><b>Б. Отсроченная радикальная пластика</b> (силопластика)                      при выраженной диспропорции: 1-й этап --- <b>пластиковый мешок</b> (силастиковый) как временная брюшная полость; 6--8 суток активная декомпрессия ЖКТ; затем удаление мешка и радикальная пластика</p>
<p style="margin:0 0 10px"><b>В. Этапное лечение</b> при сочетанных пороках кишки                         силопластика (или первичная пластика) + <b>энтеро-/колостома</b> (двойная стома на уровне атрезии); закрытие стом после восстановления пассажа; инфузия компенсирует потери</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Послеоперационный период (Р.)</b></h4></p>
<p style="margin:0 0 10px">• ИВЛ, инфузионная и антибактериальная терапия, <b>полное парентеральное питание с 4-х суток</b> ;</p>
<p style="margin:0 0 10px">• с 1-х суток каждые 6 ч промывание желудка смесью ферментов (панкреатин, ацетилцистеин); 2 раза в сутки высокое промывание толстой кишки той же смесью (100 мл/кг); с 3-х суток --- диадинамические токи с неостигмином;</p>
<p style="margin:0 0 10px">• самостоятельный стул на 4--6-е сутки, затем энтеральное питание (лучше грудное молоко; при мальабсорбции --- гидролизаты).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                                                                     <b>Суть (Разумовский)</b></p>
<p style="margin:0 0 10px"><b>Синдром сдавления нижней полой вены</b> + тромбоз сосудов брыжейки, некроз кишки   ранний период; из-за высокой диспропорции или неоправданной радикальной операции: отёки, венозный стаз, олигурия/анурия, ДВС, вздутие, интоксикация. Контроль: коагулограмма, ЦВД, УЗИ, допплер. Лечение --- повторная операция: переход к силопластике, резекция некроза, стомы</p>
<p style="margin:0 0 10px"><b>Спаечная кишечная непроходимость</b>                                               гипоперистальтика и псевдообструкция должны пройти к 15--16-м суткам; если нет --- обзорный рентген, контраст (5--10 мл; серия 2, 6, 12, 24 ч); контраст в толстой кишке за сутки --- консервативно; нет --- операция</p>
<p style="margin:0 0 10px"><b>Генерализация инфекции, НЭК, сепсис</b>                                            вторичная инфекция; профилактика --- антибиотики, иммунотерапия</p>
<p style="margin:0 0 10px">Другое (по учебникам)                                                              синдром короткой кишки при некрозе, длительная потребность в парентеральном питании, вентральная грыжа</p>
<p style="margin:0 0 10px">*Прогноз: порок абсолютно курабелен (Р.); осложнения связаны с кишечными атрезиями и некрозом кишки.*</p>`},
  {n:86, t:"Грыжи у детей. Этиология и патогенез", a:`<p style="margin:0 0 10px">*Разумовский, гл. 13 (с. 188--191) и гл. 51 (с. 681--682); Исаков, с. 511--514. Разобраны все основные грыжи у детей.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: паховая грыжа вагинальный отросток пупочное кольцо</b></p>
<p style="margin:0 0 10px"><b>грыжа белой линии вентральная грыжа</b></p>
<p style="margin:0 0 10px"><b>Грыжа</b> --- выпячивание органов брюшной полости (кишка, сальник, яичник) через слабое место брюшной стенки, чаще в паху и в области пупка. У детей --- преимущественно <b>врождённая природа</b> . Паховые грыжи составляют <b>95 %</b> всех грыж передней брюшной стенки (Р.), пупочные --- около 4 %, белой линии --- около 1 %.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез по видам</b></h4></p>
<p style="margin:0 0 10px"><b>Вид</b>                              <b>Причина и механизм</b></p>
<p style="margin:0 0 10px"><b>Паховая</b> (K40)                    основа --- <b>необлитерированный вагинальный отросток брюшины</b> : он появляется на 12-й неделе, на 7--8-м месяце мигрирует вместе с яичком через паховый канал в мошонку; к рождению облитерируется у 75 % детей. Наличие отростка ещё не значит грыжа: нужен <b>стойкий симптомокомплекс</b> . Суть --- перемещение содержимого брюшной полости (кишка, у девочек --- яичник, матка) при <b>повышении внутрибрюшного давления</b> (плач, кашель, натуживание) через отросток в паховый канал и мошонку. Мальчики болеют в <b>8--10 раз</b> чаще; 1--5 % населения</p>
<p style="margin:0 0 10px"><b>Прямая паховая</b>                   у детей крайне редка; чаще <b>врождённая или ятрогенная</b> слабость передней стенки; содержимое выходит медиальнее нижних надчревных сосудов</p>
<p style="margin:0 0 10px"><b>Скользящая</b> паховая               одной из стенок грыжевого мешка становится стенка органа (мочевой пузырь, восходящая кишка)</p>
<p style="margin:0 0 10px"><b>Пупочная</b> (K42)                   задержка замыкания пупочного кольца при заживлении пупочной ранки: кольцо плотно замыкается только в <b>нижней части</b> (там проходили 2 артерии и мочевой проток, образуется плотная фиброзная ткань), <b>верхний отдел</b> (пупочная вена) значительно слабее; недоразвитие брюшной фасции; повышение внутрибрюшного давления, нарушение тонуса мышц и тургора, длительные болезни, <b>недоношенность</b> . Чаще у девочек</p>
<p style="margin:0 0 10px"><b>Белой линии живота</b> (K43)         недоразвитие <b>апоневротического тяжа</b> (белой линии): у детей она относительно широка при малой толщине; <b>щелевидные дефекты</b> между пучками волокон, с ростом уменьшаются; через них проникает предбрюшинная клетчатка с брюшиной; кишка --- крайне редко</p>
<p style="margin:0 0 10px"><b>Вентральная</b> (K43)                развивается после лечения <b>омфалоцеле, гастрошизиса</b> , реже после коррекции больших диафрагмальных грыж; расхождение краёв операционной раны (перитонит, лапаростома); при малом объёме брюшной полости над органами ушивают только кожу</p>
<p style="margin:0 0 10px">Предрасполагающи е факторы (общие)   слабость соединительной ткани, недоношенность, повышение внутрибрюшного давления (запоры, кашель, плач), крипторхизм (необлитерированный отросток --- паховая грыжа у 25 %, И.), наследственность</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: классификация грыж вправимая / невправимая / ущемлённая</b></p>
<p style="margin:0 0 10px"><b>паховая и пахово-мошоночная проба кашлевого толчка</b></p>
<p style="margin:0 0 10px"><b>рвота при ущемлении</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px"><b>Критерий</b>                           <b>Виды</b></p>
<p style="margin:0 0 10px"><b>По локализации</b>                     <b>паховые</b> , <b>пупочные</b> , <b>белой линии</b> (параумбиликальные и эпигастральные), <b>вентральные</b> (послеоперационные, после омфалоцеле и гастрошизиса)</p>
<p style="margin:0 0 10px"><b>Паховые</b> : по строению              <b>косые</b> (необлитерированный вагинальный отросток) и <b>прямые</b> (редки); <b>скользящие</b> (одна из стенок --- стенка органа)</p>
<p style="margin:0 0 10px">Паховые: по уровню облитерации         <b>паховые</b> и <b>пахово-мошоночные</b> (содержимое достигает мошонки)</p>
<p style="margin:0 0 10px">Паховые: по стороне                    правосторонние, левосторонние, <b>двусторонние</b> (15 % всех грыж передней стенки)</p>
<p style="margin:0 0 10px"><b>По течению</b> (все грыжи)             <b>вправимые</b> (содержимое свободно вправляется), <b>невправимые</b> (не вправляются, но безболезненны; чаще у девочек --- яичник), <b>ущемлённые</b> (сдавление в апоневротическом кольце, нарушение кровоснабжения)</p>
<p style="margin:0 0 10px"><b>Вентральные</b> : по размеру дефекта   <b>небольшие</b> --- ≤ 8--10 см; <b>большие</b> --- более 10--12 см; <b>гигантские</b> --- более 15 см; вправимые (широкое основание) и невправимые; содержимое --- кишка, печень</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Грыжа</b>                   <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Паховая неосложнённая</b>   опухолевидное образование в паху, <b>мягко-эластичное</b> , безболезненное, <b>свободно вправляется</b> в живот; при содержимом-кишке вправляется с <b>урчанием</b> ; может достигать дна мошонки; появляется при плаче, беспокойстве, напряжении, в вертикальном положении; <b>проба кашлевого толчка положительная</b> ; боль не характерна</p>
<p style="margin:0 0 10px"><b>Невправимая</b> паховая     не вправляется, но пальпация безболезненна, нет отёка тканей и гиперемии; у девочек --- яичник (плотно-эластичная консистенция)</p>
<p style="margin:0 0 10px"><b>Ущемлённая</b> паховая      <b>острый симптомокомплекс</b> : боль в паху или яичке (старшие), беспокойство и плач (малыши); образование <b>плотное, резко болезненное, не вправляется</b> ; <b>рефлекторная рвота</b> (≈ 24 %); через 8--12 ч --- отёк, гиперемия кожи, интоксикация, кишечная непроходимость, рвота стойкая; без лечения --- некроз органа (кишка, яичко, яичник)</p>
<p style="margin:0 0 10px"><b>Пупочная</b>                с периода новорождённости округлое или овальное выпячивание; в покое и лёжа <b>легко вправляется</b> , прощупывается незамкнутое пупочное кольцо; при крике и беспокойстве появляется; ущемляются <b>крайне редко</b> ; боли нет</p>
<p style="margin:0 0 10px"><b>Белой линии</b>             обычно бессимптомно (находят случайно) --- округлое, гладкое, эластичное, чуть болезненное выбухание по средней линии; от давления не исчезает (если не только клетчатка, может немного уменьшаться); у тучных детей не выявляется (обследуют как гастродуоденит, холецистопатию, мезаденит); <b>ущемление</b> --- острая боль в эпигастрии, не вправлять</p>
<p style="margin:0 0 10px"><b>Вентральная</b>             с первых месяцев после лечения омфалоцеле или гастрошизиса; при росте, когда ребёнок встаёт и ходит, внутрибрюшное давление растягивает кожу --- грыжа увеличивается; в содержимом --- печень и кишка (рис. 13.2)</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика, дифференциальная диагностика и лечение (кратко)</b></h4></p>
<p style="margin:0 0 10px"><b>Вид</b>                     <b>Суть (Разумовский)</b></p>
<p style="margin:0 0 10px">Диагностика                 клинический осмотр (стоя, с напряжением, покашливанием; у малышей --- лёгкое надавливание на живот); УЗИ при сомнениях и ущемлении</p>
<p style="margin:0 0 10px">Дифдиагностика (паховая)    паховый лимфаденит, киста семенного канатика, водянка; при ущемлении --- воспаление органов мошонки, <b>заворот яичка</b> ; у девочек с двусторонней грыжей --- <b>кариотип</b> (исключить тестикулярную феминизацию); белой линии --- <b>диастаз прямых мышц</b> (лечения не требует)</p>
<p style="margin:0 0 10px">Лечение паховой             <b>активная хирургическая тактика</b> : неосложнённая --- после 6 мес; невправимая и ущемления в анамнезе --- без границ; <b>ущемлённая --- экстренная операция</b> ; способы: открытое грыжесечение (без пластики канала), видеоассистированное, лапароскопическая герниорафия</p>
<p style="margin:0 0 10px">Пупочная                    самоизлечение у 60 % к 2--3 годам; массаж и ЛФК с 1-го месяца, выкладывание на живот; операция после 5 лет (раньше --- при плотном крае или дефекте \\> 15--20 мм)</p>
<p style="margin:0 0 10px">Белой линии и вентральная   плановая операция; экстренно --- при ущемлении; вентральная --- этапная пластика</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: крипторхизм эктопия ретракция диагностическая лапароскопия</b></p>
<p style="margin:0 0 10px"><b>УЗИ мошонки и паха</b></p>
<p style="margin:0 0 10px"><b>Крипторхизм</b> --- аномалия положения яичка: одно или оба яичка <b>отсутствуют в мошонке</b> , задержавшись на пути из брюшной полости (в паховом канале --- <b>паховый</b> ; в брюшной полости --- <b>абдоминальный</b> ). Код МКБ-10: <b>Q53</b> . Встречается у 1--4 % доношенных, у 30--45 % недоношенных (Р.); одностороннее поражение --- 60--70 %.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (Р., И.)</b></h4></p>
<p style="margin:0 0 10px"><b>Критерий</b>                                                                          <b>Виды</b></p>
<p style="margin:0 0 10px"><b>Клиническая</b> (Р. --- самая удобная)                                                <b>пальпируемые</b> (80 %) и <b>непальпируемые</b> (20 %) яички: тактика определяется положением и наличием яичка</p>
<p style="margin:0 0 10px">По стороне и уровню                                                                   одно- и двусторонний; <b>паховый</b> и <b>абдоминальный</b> (ретенция); врождённый и <b>приобретённый</b> (яичко ранее было в мошонке; 5--8 лет)</p>
<p style="margin:0 0 10px"><b>Эктопия</b> (И.)                                                                      отклонение яичка от пути: <b>лонная, паховая (поверхностный карман), бедренная, промежностная, перекрёстная</b> (оба яичка в одной половине мошонки; рис. 6-61)</p>
<p style="margin:0 0 10px"><b>Ретракция</b> (псевдо-, ложный крипторхизм)                                           повышенный кремастерный рефлекс: яичко подтягивается, но свободно без натяжения низводится в мошонку и остаётся там</p>
<p style="margin:0 0 10px">Непальпируемые (Р.)                                                                   ≈ 50 % --- в брюшной полости, у внутреннего кольца или в канале; ≈ 30 % --- гипоплазированы; ≈ 20 % --- агенезия (monorchism/anorchism)</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px">Цели (Р.): выявить локализацию яичка; дать его анатомо-функциональную характеристику; уточнить причину. Обследование комплексное.</p>
<p style="margin:0 0 10px"><b>Метод</b>                                                     <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Анамнез</b>                                                   препараты и токсические воздействия у матери, срок рождения (доношенность), родство супругов, семейные случаи, бесплодие у родственников; опускалось ли яичко; ранее лечение</p>
<p style="margin:0 0 10px"><b>Осмотр и пальпация</b> (И., Р.)                               лёжа (новорождённые), стоя со скрещенными ногами (старшие); одной рукой мошонка, ладонью второй --- вдоль пахового канала <b>сверху вниз, снаружи внутрь</b> ; при паховой ретенции яичко подвижно, но <b>не низводится</b> (истинный); если легко низводится и остаётся --- ретракция (давление краем ладони на канатик подавляет кремастерный рефлекс). При эктопии --- эластичное малоболезненное образование в клетчатке, мошонка уплощена; перекрёстная дистопия --- два яичка в одной половине мошонки</p>
<p style="margin:0 0 10px">Оценка гениталий и пубертата                                  длина члена ≥ 2 см, отверстие уретры на головке, мошонка; половая формула G, P (шкала Таннера); у детей до 9 лет G1P1; признаки гипогонадизма, гинекомастия, евнухоидные пропорции</p>
<p style="margin:0 0 10px"><b>УЗИ</b> мошонки, паховых областей, малого таза                положение, размер, структура яичка в паховом канале; отсутствие яичка при УЗИ --- показание к лапароскопии (И.)</p>
<p style="margin:0 0 10px"><b>Гормоны, кариотип, консультации</b> (эндокринолог, генетик)   при <b>двустороннем</b> крипторхизме, сочетании с гипоспадией, микропенией, расщеплением мошонки: электролиты, 17-ОНП, тестостерон, ЛГ, ФСГ, АМГ, ингибин B, проба с ХГЧ; в периоде новорождённости исключают сольтеряющую ВГКН</p>
<p style="margin:0 0 10px"><b>Диагностическая лапароскопия</b> (Р., рис. 50.2)              <b>единственный достоверный метод при непальпируемом яичке</b> : осмотр пахового кольца, сосудов к почке; сосуды и проток уходят в канал --- ревизия канала; <b>слепо оканчивающиеся сосуды</b> --- «исчезающее яичко» (vanishing testis); гонада в животе --- оценка положения, размера, длины сосудов и протока; «выглядывающее яичко» (peeping testis); тракция до противоположного пахового кольца --- возможна одноэтапная орхиопексия</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                           <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Ретракция яичка</b> (ложный крипторхизм; И., Р.)                    при пальпации яичко низводится без натяжения и остаётся в мошонке; повышенный кремастерный рефлекс; наблюдение 2 раза в год до пубертата (30 % → приобретённый)</p>
<p style="margin:0 0 10px"><b>Эктопия яичка</b>                                                   яичко вне пути опускания (лобок, бедро, промежность, другая половина мошонки); подвижность ограничена</p>
<p style="margin:0 0 10px"><b>Монорхизм / анорхизм / «исчезающее» яичко</b>                       не пальпируется; лапароскопия: слепо оканчивающиеся сосуды; ХГЧ-тест, АМГ, ингибин B (наличие яичковой ткани)</p>
<p style="margin:0 0 10px"><b>Гипоплазированное или атрофичное яичко</b>                          мало, плотно; УЗИ</p>
<p style="margin:0 0 10px">Паховая грыжа, лимфоузел, киста семенного канатика (по учебникам)   УЗИ; грыжа часто сочетается с крипторхизмом (≈ 25 %, И.)</p>
<p style="margin:0 0 10px">Нарушения формирования пола                                         если пустая мошонка сочетается с гипоспадией, микропенией, расщеплённой мошонкой --- комплексное обследование сразу после рождения (вопросы 73--75)</p>`},
  {n:89, t:"Крипторхизм у детей. Лечение и осложнения", a:`<p style="margin:0 0 10px">*Разумовский, гл. 50 (с. 669--672); Исаков, с. 506--509. Послеоперационные осложнения --- частично по общим учебникам.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: орхиопексия операция Фаулера--Стефенса гормональная терапия</b></p>
<p style="margin:0 0 10px"><b>малигнизация перекрут яичка</b></p>
<p style="margin:0 0 10px"><b>Лечение хирургическое</b> --- низведение и фиксация яичка в мошонке. Цель --- сохранить потенциальную <b>фертильность</b> и снизить риск <b>малигнизации</b> . <b>Оптимальный срок --- 6--18 месяцев</b> (Р.): необратимые изменения герминативного эпителия возникают после 12 месяцев; нижняя граница --- мини-пубертат (возможно самопроизвольное опускание). По Исакову --- в 1--2 года.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургическое лечение</b></h4></p>
<p style="margin:0 0 10px">• около <b>250 операций</b> ; обязательные этапы: мобилизация элементов семенного канатика, выпрямление пути, восстановление общей влагалищной оболочки, создание ложа в мошонке, фиксация яичка, ушивание пахового канала;</p>
<p style="margin:0 0 10px">• доступы: <b>паховый</b> (чаще), расширенный паховый, <b>предбрюшинный</b> (при высоком паховом яичке, гипоплазии, отсутствии), мошоночный по <b>Bianchi</b> (при паховой форме);</p>
<p style="margin:0 0 10px">• мобилизация --- пересечение кремастера, выделение и перевязка вагинального отростка, предбрюшинная диссекция: <b>удлинение канатика без натяжения</b> .</p>

<p style="margin:0 0 10px">• <b>нарушение формирования коллагена</b> в стенках сосудов: отсутствие коллагена <b>IV типа</b> , нарушения коллагена <b>III типа</b> ;</p>

<p style="margin:0 0 10px">• изменения стенки вен (расширение, склероз, деструкция клапанов) --- <b>вторичные</b> , наслаиваются на врождённую патологию.</p>

<p style="margin:0 0 10px">• <b>ретроградный кровоток</b> --- из-за повышения давления в левой почечной вене (в том числе при <b>аортомезентериальном пинцете</b> ), отсутствия клапана в устье яичковой вены, повреждения клапанов;</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: классификация степени I--III первичное и симптоматическое</b></p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация (Разумовский): по нескольким признакам</b></h4></p>
<p style="margin:0 0 10px"><b>Признак</b>                                  <b>Виды</b></p>
<p style="margin:0 0 10px"><b>По стороне</b>                               левостороннее, правостороннее, двустороннее</p>
<p style="margin:0 0 10px"><b>По этиологии</b>                             <b>первичное (идиопатическое)</b> --- несостоятельность яичковой вены на фоне врождённых изменений стенки (нет коллагена IV и III типа); <b>симптоматическое (вторичное)</b> --- венозная гипертензия в почечной вене и обратный ток из почечной вены по яичковой (при стенозе почечной вены, опухоли, ренокавальном анастомозе)</p>
<p style="margin:0 0 10px">Промежуточное положение                      <b>функциональное варикоцеле</b> --- стеноз левой почечной вены между верхней брыжеечной артерией и аортой при остром угле ( <b>аортомезентериальный пинцет</b> ): в ортостазе венозный ток извращается и идёт вниз по яичковой вене; в положении лёжа вены спадаются; у 5--18 % детей с варикоцеле</p>
<p style="margin:0 0 10px"><b>По характеру рефлюкса</b> (Coolsaet, 1980)   <b>ренотестикулярный</b> (из почечной вены), <b>илеотестикулярный</b> (из подвздошной), <b>смешанный</b></p>
<p style="margin:0 0 10px"><b>По степени</b> (клинически)                  <b>I</b> --- расширение вен определяется только <b>пальпаторно при пробе Вальсальвы</b> стоя; <b>II</b> --- расширенные извитые вены видны и пальпируются стоя и без пробы, лёжа спадаются; <b>III</b> --- вены видны и пальпируются, <b>яичко уменьшено</b> (гипотрофия)</p>
<p style="margin:0 0 10px">По определяемости                            <b>клиническое</b> (видно при осмотре) и <b>субклиническое</b> (находят только на УЗИ --- при профилактических осмотрах)</p>
<p style="margin:0 0 10px">По гипертензии в почечной вене               с гипертензивным синдромом в почечной вене и без него</p>
<p style="margin:0 0 10px">*Разумовский: ранее применявшаяся классификация по стадиям утратила клиническое значение --- нет корреляции между стадией и нарушением сперматогенеза. Исаков делит варикоцеле также на три степени.*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px">• проявления обычно <b>скудны</b> ; варикоцеле выявляют при профилактических осмотрах в школах;</p>
<p style="margin:0 0 10px">• жалобы: <b>периодические тянущие боли</b> в соответствующей половине мошонки, усиливаются при физической нагрузке, половом возбуждении и стоя (повышение венозного давления);</p>
<p style="margin:0 0 10px">• жалобы на расширенные вены в мошонке (« <b>пучок червей</b> »), которые выявляют при самообследовании; особенно в период полового созревания;</p>
<p style="margin:0 0 10px">• ощущение тяжести, дискомфорта;</p>
<p style="margin:0 0 10px">• <b>симптоматическое</b> варикоцеле: боли в пояснице, макро- или микрогематурия, протеинурия (почечный генез), артериальная гипертензия --- тревожный признак;</p>
<p style="margin:0 0 10px">• при III степени --- уменьшение объёма яичка (варикозная орхопатия).</p>
<p style="margin:0 0 10px"><b>Важно!</b> Варикоцеле, <b>не спадающееся в положении лёжа</b> , или <b>правостороннее</b> --- повод исключить забрюшинное новообразование (экскреторная урография, КТ, МРТ).</p>`},

<p style="margin:0 0 10px"><b>Первичное и симптоматическое</b> варикоцеле                       симптоматическое: не спадается лёжа, правостороннее, гематурия, гипертензия, боль в пояснице --- искать стеноз почечной вены, опухоль почки или забрюшинного пространства</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: показания к операции операция Иванисевича операция Мармара</b></p>
<p style="margin:0 0 10px"><b>склеротерапия гидроцеле</b></p>
<p style="margin:0 0 10px"><b>Цель лечения</b> --- устранить венозный рефлюкс, восстановить интратестикулярный кровоток и уменьшить тканевую гипоксию, предупредить прогрессирование орхопатии и создать условия для нормального сперматогенеза. Лечение выбирают по результатам допплерографии.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Показания к хирургическому лечению (международные рекомендации по детской урологии, Р.)</b></h4></p>
<p style="margin:0 0 10px">1\\. <b>признаки орхопатии</b> --- уменьшение объёма яичка на 20 % и более по сравнению со здоровым; 2. <b>болевой синдром</b> или психологический дискомфорт; 3. изменения спермограммы у подростков <b>15 лет и старше</b> (облигатный признак).</p>
<p style="margin:0 0 10px">Дополнительный ориентир в России --- IR сосудов яичек (таблица в вопросе 92): при IR 0,59--0,6 и нормальной эхогенности хирургия не нужна.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Консервативное лечение</b></h4></p>
<p style="margin:0 0 10px">• без орхопатии и при сохранённом кровотоке (IR 0,59--0,6) --- <b>операция не нужна</b> ;</p>
<p style="margin:0 0 10px">• терапия венозной недостаточности: <b>венопротекторы, курсы антиоксидантов, гипербарическая оксигенация</b> (уровень доказательности D); контроль УЗИ-допплером;</p>
<p style="margin:0 0 10px">• при прогрессировании --- хирургия.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургическое лечение</b></h4></p>
<p style="margin:0 0 10px"><b>Группа</b>                                  <b>Операции</b></p>
<p style="margin:0 0 10px"><b>Окклюзирующие</b> (на тестикулярной вене)   высокое и низкое <b>лигирование</b> сосудов</p>
<p style="margin:0 0 10px">Микрохирургические                          вено-венозные анастомозы</p>
<p style="margin:0 0 10px"><b>Доступы</b>                                 <b>забрюшинный</b> (операции <b>Паломо, Иванисевича, Бернарди</b> ); <b>паховый и подпаховый</b> ( <b>Мармара</b> , Яковенко); <b>лапароскопический</b> ; <b>интервенционный</b> (селективная трансвенозная окклюзия)</p>
<p style="margin:0 0 10px"><b>Метод</b>                                                               <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Лапароскопическая перевязка левой яичковой вены</b>                     пневмоперитонеум, вскрытие брюшины, мобилизация сосудистого пучка, <b>сохранение лимфатических протоков</b> , выделение и сохранение артериальных стволов, лигирование остального; послойные швы</p>
<p style="margin:0 0 10px"><b>Высокая перевязка</b> сосудистого пучка (при отсутствии оборудования)   левая подвздошная область, разрез 5--6 см; забрюшинное пространство; <b>оптическое увеличение</b> --- найти лимфатические сосуды; отделить и сохранить лимфу и артерию, перевязать вены</p>
<p style="margin:0 0 10px"><b>Операция Мармара</b> (субингвинальная перевязка)                        под <b>микроскопом</b> : разрез у наружного кольца, канатик выводят в рану, разводят кремастер, лигируют вены и сохраняют лимфатические коллекторы и артерию</p>
<p style="margin:0 0 10px"><b>Эндоваскулярная склеротерапия</b> левой яичковой вены                   рентген-операционная; пункция правой бедренной вены; катетер в левую почечную, затем яичковую вену; флебография; <b>3 % вспененный тетрадецилсульфат натрия</b> при пережатом канатике; через 15 мин контроль --- отсутствие контрастирования дистальных отделов = эффект; не требует разреза</p>
<p style="margin:0 0 10px">Препятствия для эндоваскулярной склеротерапии: рассыпной тип впадения яичковой вены, невозможность селективной катетеризации, пороки и тромбозы нижней полой и подвздошных вен. Предпочтение --- <b>лимфатикощадящей</b> варикоцелэктомии (уровень доказательности А). Чаще применяют забрюшинный доступ (лапароскопически или открыто), операцию Мармара и эндоваскулярную окклюзию.</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: желточный проток ductus omphaloentericus облитерация K63.2</b></p>
<p style="margin:0 0 10px"><b>урахус</b></p>
<p style="margin:0 0 10px"><b>Врождённый свищ пупка</b> --- результат <b>нарушения облитерации желточного (омфаломезентериального) протока</b> или, реже, мочевого протока (урахуса): между кишкой (или мочевым пузырём) и пупком сохраняется канал, открывающийся в пупочной ямке. Код МКБ-10: <b>K63.2</b> (кишечный свищ).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эмбриология и этиология</b></h4></p>
<p style="margin:0 0 10px">• <b>желточный проток</b> (ductus omphaloentericus) входит в состав пупочного канатика и в первые недели развития <b>питает эмбрион</b> , соединяя кишечник с желточным мешком;</p>
<p style="margin:0 0 10px">• на <b>3--5-м месяце</b> внутриутробной жизни происходит <b>обратное развитие (облитерация) протока</b> ;</p>
<p style="margin:0 0 10px">• порок --- следствие <b>нарушения этой облитерации</b> на разных уровнях и в разной степени (Р., И.);</p>
<p style="margin:0 0 10px">• причины, как у большинства пороков, --- нарушение эмбриогенеза (мультифакториальные); точные факторы не установлены.</p>

<p style="margin:0 0 10px"><b>Полный свищ</b> (Р., И.)                      при рождении <b>утолщённый пупочный канатик</b> , расширенное пупочное кольцо; <b>отпадение пуповинного остатка задерживается</b> ; после этого в центре пупочной ямки --- <b>свищевое отверстие с ярко-красной слизистой оболочкой и кишечным отделяемым</b> (газ, кал, слизь; рис. 5-2); при широком и длинном свище при беспокойстве возникает <b>эвагинация (выворот) кишки</b> --- кишечная непроходимость; при раннем отсечении пуповины (2--3-и сутки) --- <b>эвентрация и ущемление петель</b></p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: зондирование пуговчатым зондом фистулография УЗИ фунгус пупка</b></p>
<p style="margin:0 0 10px"><b>цистография</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Форма</b>                                 <b>Методы и находки</b></p>
<p style="margin:0 0 10px"><b>Полный свищ</b>                           диагностика <b>достаточно проста</b> ; при широком свище --- по <b>характерным выделениям</b> (кишечное содержимое); <b>зондирование</b> : <b>пуговчатый зонд уходит вертикально вниз</b> , к брюшной полости; ценные приёмы --- <b>фистулография</b> и <b>УЗИ</b></p>
<p style="margin:0 0 10px"><b>Неполный свищ</b>                         осмотр пупочной ямки: среди необильных грануляций <b>точечное свищевое отверстие</b> со скудным отделяемым; <b>зондирование</b> подтверждает: пуговчатый зонд проходит на глубину <b>1--2 см</b></p>
<p style="margin:0 0 10px"><b>Урахальные свищи и кисты</b> (интернет)   УЗИ (киста по средней линии между пупком и пузырём), <b>цистография</b> и фистулография (контраст из свища попадает в пузырь), цистоскопия; моча из свища --- <b>по химии и креатинину</b> , окрашивание метиленовым синим</p>
<p style="margin:0 0 10px">Лаборатория                               анализ крови и мочи, посев отделяемого при воспалении</p>
<p style="margin:0 0 10px">Осмотр новорождённого                     утолщённый пупочный канатик, задержка отпадения пуповины, расширенное пупочное кольцо</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                                 <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Фунгус пупка</b> (Р., И.)                                                                 <b>разрастание грануляционной ткани</b> на дне пупочной ямки из-за инфицирования и задержки эпителизации; <b>гриб на ножке</b> --- розовое мягкое образование; <b>зонд не проходит</b> вглубь, нет отделяемого кишечного или мочи; лечение --- прижигание (ляпис) или лигирование ножки</p>
<p style="margin:0 0 10px"><b>Неполный и полный</b> свищ между собой                                                    полный: кишечное отделяемое, зонд уходит вниз и далеко; неполный: скудное, зонд 1--2 см</p>
<p style="margin:0 0 10px"><b>Омфалит</b> (по учебникам)                                                                воспаление кожи и пупочной ямки: гиперемия, отёк, серозно-гнойное отделяемое, нет свищевого хода; зонд в глубину не идёт</p>
<p style="margin:0 0 10px"><b>Желточные и урахальные</b> свищи (интернет)                                               моча (креатинин, цвет, количество при мочеиспускании), цистография; кишечное содержимое --- газ, слизь, фистулография с контрастом из свища</p>
<p style="margin:0 0 10px"><b>Пупочная грыжа, свищ при мезенхимальных пороках, гнойные заболевания</b> (по учебникам)   грыжа вправляется, покрыта кожей; гнойные заболевания --- воспалительные признаки, нет врождённого хода</p>
<p style="margin:0 0 10px"><b>Дивертикул Меккеля и энтерокистома</b>                                                    нет наружного свищевого отверстия; клиника кровотечения, воспаления, непроходимости (Р.)</p>`},
  {n:97, t:"Врождённый свищ пупка у детей. Лечение и осложнения", a:`<p style="margin:0 0 10px">*Разумовский, гл. 13 (с. 195--197); Исаков, с. 285--286. Урахальные свищи --- интернет.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: иссечение свищевого хода лапароскопическая операция</b></p>
<p style="margin:0 0 10px"><b>консервативное лечение ванны с перманганатом эвагинация</b></p>
<p style="margin:0 0 10px"><b>Полный свищ пупка --- только операция</b> , сразу после диагноза, чтобы избежать эвагинации, инфицирования и кровотечения (Р., И.). <b>Неполный свищ</b> у новорождённых и в первые месяцы лечат <b>консервативно</b> в надежде на самоизлечение.</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Полный свищ</b></h4></p>
<p style="margin:0 0 10px">• операция <b>сразу</b> после диагноза: <b>иссечение свищевого хода на всём протяжении от пупка до подвздошной кишки</b> (лапаротомным доступом, И.);</p>
<p style="margin:0 0 10px">• способ обработки основания зависит от толщины протока: <b>тонкий</b> (меньше диаметра кишки) --- <b>лигатурный способ</b> ; <b>широкий</b> --- полное <b>клиновидное иссечение</b> с поперечным ушиванием дефекта кишки (по Р.);</p>
<p style="margin:0 0 10px">• дистальный конец отсекают от пупочного кольца; рану брюшной стенки ушивают послойно;</p>
<p style="margin:0 0 10px">• свищ <b>диаметром менее 5 мм</b> --- целесообразна <b>лапароскопическая операция</b> ; она же показана при заворотах петель тонкой кишки вокруг протока.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Неполный свищ</b></h4></p>
<p style="margin:0 0 10px"><b>Этап</b>                                                           <b>Что делают (Разумовский)</b></p>
<p style="margin:0 0 10px"><b>Консервативно</b> --- в периоде новорождённости и первых месяцев   ежедневные <b>ванны со слабым раствором перманганата калия</b> ; обработка свищевого хода <b>3 % перекисью водорода</b> и <b>3 % раствором йода</b> ; повязки с антисептиками (1 % хлорофиллипт)</p>
<p style="margin:0 0 10px"><b>Операция</b> при неэффективности консервативного лечения           свищ <b>выделяют на всём протяжении</b> и <b>отсекают у места прикрепления без вскрытия брюшной полости</b> ; рану ушивают</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Урахальные свищи (интернет)</b></h4></p>
<p style="margin:0 0 10px">• при полном пузырно-пупочном свище консервативное лечение <b>неэффективно</b> --- операция: иссечение урахуса с участком верхушки пузыря (лапароскопическая или открытая);</p>
<p style="margin:0 0 10px">• киста урахуса --- удаление; при нагноении --- сначала дренирование и антибиотики, затем радикальная операция.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения</b></h4></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                                 <b>Комментарий</b></p>
<p style="margin:0 0 10px"><b>Болезни</b>                                    эвагинация кишки и кишечная непроходимость; эвентрация и ущемление при раннем отсечении пуповины; инфицирование (омфалит, флегмона), кровотечение, заворот петель вокруг протока (Р.)</p>
<p style="margin:0 0 10px"><b>После иссечения неполного свища</b> (Р.)       повреждение пупочных сосудов, <b>рецидив при неполном удалении</b> свищевого хода, <b>несостоятельность швов</b> , <b>сужение кишечного просвета</b></p>
<p style="margin:0 0 10px">После иссечения полного свища (по учебникам)   спаечная кишечная непроходимость, нагноение раны, несостоятельность швов кишки, эвентрация</p>
<p style="margin:0 0 10px">*Лигатурный метод --- только при тонком протоке; при его применении к широкому протоку возможно сужение кишки.*</p>`},

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: удвоение ЖКТ энтерокиста дупликационная киста</b></p>
<p style="margin:0 0 10px"><b>слизистая желудочного типа илеоцекальный угол</b></p>
<p style="margin:0 0 10px"><b>Энтерокистомы</b> (кистозное удвоение ЖКТ, энтерокиста, дупликационная киста) --- <b>врождённые полые образования шаровидной или цилиндрической формы</b> разной величины. Нередко имеют <b>общую с кишкой (или желудком) стенку</b> и <b>общие питающие сосуды</b> (Р., И.). Вариант аномалии желточного протока (Р., гл. 13) либо самостоятельное удвоение.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Строение и локализация</b></h4></p>
<p style="margin:0 0 10px">• <b>стенка</b> толстая, слоистая, из гладких мышц; <b>слизистая желудочного или кишечного типа</b> ;</p>
<p style="margin:0 0 10px">• содержимое: при желудочной слизистой --- водянистая, прозрачная, <b>кислая</b> жидкость, при изъязвлении --- геморрагическая; при кишечном эпителии --- <b>слизь</b> ;</p>
<p style="margin:0 0 10px">• <b>сообщение</b> с просветом ЖКТ бывает <b>редко</b> ;</p>
<p style="margin:0 0 10px">• образуются в любом месте, но чаще (≈ <b>50 %</b> ) на <b>подвздошной кишке в зоне илеоцекального угла</b> (Р., И.); по другим данным --- тощая и подвздошная в 45 % (интернет);</p>
<p style="margin:0 0 10px">• расположение относительно <b>брыжейки</b> несущей петли определяет тактику;</p>
<p style="margin:0 0 10px">• энтерокисты имеют <b>тенденцию к росту</b> за счёт внутренней секреции слизи, особенно <b>после начала кормления</b> .</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология</b></h4></p>
<p style="margin:0 0 10px">• <b>порок эмбриогенеза</b> ; единая причина не установлена; в интернет-источниках (справочник MSD) называют <b>теории</b> : аномалии реканализации, сосудистые нарушения, сохранение эмбриональных дивертикулов, частичное двойникование;</p>
<p style="margin:0 0 10px">• нередко <b>сочетается с другими аномалиями</b> --- расщеплением позвонков, спинномозговой грыжей, удвоениями мочеполовой системы (Исаков).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Порок развития: полость в стенке кишки</span><span>Секреция слизи, рост кисты | Сдавление просвета кишки или заворот петли | Непроходимость, ишемия, перфорация</span></div>
<p style="margin:0 0 10px">• киста растёт, сдавливает основную кишку <b>извне</b> → <b>частичная или полная непроходимость</b> ;</p>
<p style="margin:0 0 10px">• киста на длинной ножке (далеко от илеоцекального угла) --- наиболее опасна: возможен <b>заворот</b> петли;</p>
<p style="margin:0 0 10px">• при желудочной слизистой --- <b>изъязвление и кровотечение</b> , перфорация (по учебникам);</p>
<p style="margin:0 0 10px">• при нарушении транзита развивается энтероколит --- стул с кровью (Р.);</p>
<p style="margin:0 0 10px">• у новорождённых и грудных детей --- острая кишечная непроходимость (заворот либо сдавление просвета).</p>

<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: кистозная / тубулярная / дивертикулярная локализация</b></p>
<p style="margin:0 0 10px"><b>отношение к брыжейке острая непроходимость пальпируемая опухоль</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация</b></h4></p>
<p style="margin:0 0 10px"><b>Критерий</b>                                         <b>Виды</b></p>
<p style="margin:0 0 10px"><b>По морфологии</b> (интернет, обзоры; Смирнов А.Н.)   <b>кистозные</b> (замкнутая полость, не сообщается с просветом; <b>74--80 %</b> ); <b>тубулярные</b> (трубчатые, часто сообщаются с кишкой; ≈ 10--20 %); <b>дивертикулярные</b> (≈ 15 % в одной серии)</p>
<p style="margin:0 0 10px"><b>По локализации</b>                                   пищевод, <b>желудок</b> , ДПК, <b>тощая и подвздошная кишка</b> (до 45--50 %; илеоцекальный угол), толстая кишка, прямая кишка; торакоабдоминальные удвоения (по учебникам)</p>
<p style="margin:0 0 10px"><b>По отношению к брыжейке</b> (Р.)                     <b>по брыжеечному краю</b> (делит с кишкой кровоснабжение, чаще нужна резекция сегмента); <b>по боковой стенке или противобрыжеечному краю</b> (возможна цистэктомия)</p>
<p style="margin:0 0 10px"><b>Удвоение желудка</b> (Р.)                            <b>дупликационная киста</b> (чаще в стенке привратника) или <b>полное удвоение</b> со структурной стенкой (размер = желудку); полость никогда не сообщается с просветом</p>
<p style="margin:0 0 10px">По течению                                           бессимптомные и осложнённые (заворот, непроходимость, кровотечение, перфорация)</p>
<p style="margin:0 0 10px">По времени проявления                                антенатально выявляемые; у новорождённых и грудных; у старших детей</p>
<p style="margin:0 0 10px">*Деление на кистозные и тубулярные взято из клинических справочников и обзоров в интернете (в твоих книгах отдельной классификации нет); локализация и отношение к брыжейке --- по Разумовскому.*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Клиническая картина</b></h4></p>
<p style="margin:0 0 10px"><b>Период / форма</b>                                <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Новорождённые и грудные</b> (И., Р.)              симптомы <b>острой кишечной непроходимости</b> --- из-за заворота кишечной петли либо сдавления основного просвета кишки кистой; при частичной --- <b>вздутие живота, рвота жёлчью</b> ; при энтероколите --- <b>стул с примесью крови</b></p>
<p style="margin:0 0 10px"><b>Синдром пальпируемой опухоли</b> (И.)             реже --- энтерокистому находят при УЗИ плода и новорождённого: <b>подвижное округлое эластическое</b> образование в брюшной полости (в среднем этаже брюшной полости чаще энтерокистомы), безболезненное, ровные контуры; увеличенный живот</p>
<p style="margin:0 0 10px">Малоподвижные кисты у илеоцекального угла         могут долго не давать симптомов, прогрессивно растут вместе с ребёнком (Р.)</p>
<p style="margin:0 0 10px"><b>Расположенные далеко от илеоцекального угла</b>   <b>наиболее опасны</b> --- заворот при нарушении транзита</p>
<p style="margin:0 0 10px"><b>Удвоение желудка</b> (Р.)                         нарушение эвакуации, невозможность адекватного заполнения желудка при приёме пищи, рвота; изъязвление слизистой --- кровотечение</p>
<p style="margin:0 0 10px"><b>Антенатально</b>                                  анэхогенное округлое образование с <b>толстой капсулой</b> в брюшной полости плода (со 2-го УЗИ)</p>
<p style="margin:0 0 10px">Общие                                             в половине случаев сочетаются с другими пороками (позвоночник, спинной мозг, мочеполовая система --- И.)</p>`},

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                                                                                                                 <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Антенатальное УЗИ</b> (Р.)                                                                                                                с <b>2-го скрининга</b> : округлое <b>анэхогенное образование с толстой капсулой</b> в брюшной полости; по локализации можно предположить принадлежность кисты к ЖКТ; <b>достоверная верификация --- только после рождения</b></p>
<p style="margin:0 0 10px"><b>УЗИ новорождённого</b> (Р., рис. 36.1)                                                                                                    при бессимптомном течении или пальпируемом образовании: <b>слоистая стенка</b> кисты, по строению напоминает кишечную, <b>однородное содержимое</b> ; кисты в илеоцекальном углу малоподвижны; <b>важна квалификация специалиста</b></p>
<p style="margin:0 0 10px"><b>Рентгенография</b> брюшной полости (обзорная) и <b>контрастное исследование/ ирригография</b> в прямой и боковой проекциях (Р., рис. 36.2)   локализация образования (в том числе <b>забрюшинно</b> ); смещение петель; при больших размерах --- решающий метод; сразу определяет тактику; <b>признаки непроходимости</b></p>
<p style="margin:0 0 10px"><b>МСКТ / МРТ</b>                                                                                                                            дополнительные; <b>часто не позволяют точно определить принадлежность</b> кистозного образования конкретному органу; при удвоении желудка --- предпочтительнее МРТ/МСКТ, при сомнениях --- с в/в контрастом</p>
<p style="margin:0 0 10px">Диагностика <b>осложнений</b>                                                                                                                рентген: уровни жидкости (непроходимость); УЗИ --- заворот, свободная жидкость; кровь в стуле, анемия</p>
<p style="margin:0 0 10px">Лапароскопия / операция (И.)                                                                                                              окончательный диагноз и лечение одновременно</p>

<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика (Исаков, с. 324--325; Разумовский)</b></h4></p>
<p style="margin:0 0 10px">Пальпируемые образования брюшной полости у новорождённых --- по этажам:</p>
<p style="margin:0 0 10px"><b>Этаж</b>                                                                            <b>Образования</b></p>
<p style="margin:0 0 10px"><b>Верхний</b>                                                                         плотные неподвижные, чаще из <b>печени</b> : <b>солитарная киста печени</b> , <b>киста общего жёлчного протока</b> , доброкачественная или злокачественная опухоль, подкапсульная гематома, абсцесс пупочной вены</p>
<p style="margin:0 0 10px"><b>Средний</b>                                                                         <b>подвижные округлые эластические</b> --- чаще всего <b>энтерокистомы</b> ; также забрюшинные образования: гидронефроз, мультикистозная почка, нейробластома, нефробластома (по учебникам)</p>
<p style="margin:0 0 10px"><b>Нижний</b>                                                                          патология малого таза: <b>киста яичника</b> (солитарная или тератоидная, осложнённая и нет), <b>гидрокольпос и гематометра</b> (атрезия влагалища и девственной плевы), нейрогенный мочевой пузырь, <b>киста урахуса</b></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                                                                                                                                                                                                                                             <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Киста брыжейки, лимфангиома</b> (по учебникам)                                                                                                                                                                                                                                                        нет слоистой стенки, как у кишки; содержимое --- лимфа, перегородки</p>
<p style="margin:0 0 10px"><b>Удвоение</b> и <b>дивертикул Меккеля</b>                                                                                                                                                                                                                                                                 дивертикул --- выпячивание стенки кишки с широким сообщением; клиника кровотечения, дивертикулита</p>
<p style="margin:0 0 10px"><b>Киста холедоха, кисты печени</b>                                                                                                                                                                                                                                                                      верхний этаж, связь с печенью, УЗИ</p>
<p style="margin:0 0 10px"><b>Кисты яичника у девочек</b>                                                                                                                                                                                                                                                                           нижний этаж, связь с придатками, подвижные; гормональные</p>
<p style="margin:0 0 10px"><b>Кишечная непроходимость</b> другого генеза (атрезия, заворот, болезнь Гиршпрунга)                                                                                                                                                                                                                     при энтерокисте --- внешнее сдавление, пальпируемое образование; контрастное исследование</p>
<p style="margin:0 0 10px">Опухоли забрюшинного пространства, кисты почек                                                                                                                                                                                                                                                        УЗИ, урография, КТ</p>`},
  {n:101, t:"Энтерокистомы у детей. Лечение и осложнения", a:`<p style="margin:0 0 10px">*Разумовский, гл. 36 (с. 507--509, рис. 36.3); Исаков, с. 320--321, 324--325.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: цистэктомия резекция сегмента кишки плановая операция</b></p>
<p style="margin:0 0 10px"><b>удвоение желудка перитонит</b></p>
<p style="margin:0 0 10px"><b>Лечение хирургическое.</b> При подтверждении диагноза «кистозное удвоение» показана операция. <b>Предпочтительно оперировать в плановом порядке</b> , до развития хирургических осложнений (Р.): даже бессимптомные энтерокисты лучше удалить в бессимптомном периоде, так как они растут и могут вызвать непроходимость или заворот.</p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Диагноз: УЗИ, рентген, ирригография</span><span>Плановая операция до осложнений | Цистэктомия или резекция кишки | Энтеральная пауза, питание</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Выбор операции (Разумовский)</b></h4></p>
<p style="margin:0 0 10px"><b>Расположение</b>                                        <b>Операция</b></p>
<p style="margin:0 0 10px"><b>Большие кисты</b> и/или по <b>брыжеечному краю</b> кишки   <b>резекция участка кишки</b> , несущего удвоение: при выделении кисты травмируются сосуды брыжейки (общее кровоснабжение со стенкой кишки) → нарушение питания стенки</p>
<p style="margin:0 0 10px">На <b>боковой стенке</b> или <b>противобрыжеечном крае</b>    <b>резекция кисты --- цистэктомия</b> ; сегодня выполнима и у новорождённых</p>
<p style="margin:0 0 10px"><b>Удвоение желудка</b>                                    <b>удаление дупликатуры</b> , главное --- сохранить герметичность стенки желудка; сейчас предпочтительно <b>эндоскопически</b></p>
<p style="margin:0 0 10px">Осложнённые формы                                       заворот, непроходимость --- экстренная операция по показаниям</p>
<p style="margin:0 0 10px"><b>Основные этапы:</b> ревизия брюшной полости для обнаружения участка кишки с удвоением → удаление оболочек кисты → восстановление проходимости кишечника (Р.). Исаков: при энтерокистоме в среднем этаже --- операция после УЗИ и контраста; мелкие кисты удаляют, при неясности --- лапароскопия.</p>
<p style="margin:0 0 10px">![](media/image119.jpg){width="2.2976192038495187in" height="1.9446511373578304in"}</p>
<p style="margin:0 0 10px">*Рис. 36.3 (Р., с. 508). Энтерокиста больших размеров, удалена вместе с сегментом кишки*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Подготовка и послеоперационный период</b></h4></p>
<p style="margin:0 0 10px">• специальной подготовки обычно не требуется; сохраняют небольшую <b>энтеральную нагрузку</b> , назначают профилактическую антибактериальную терапию;</p>
<p style="margin:0 0 10px">• <b>энтеральная пауза</b> до появления регулярного стула, антибиотики, парентеральное питание; затем молоко малыми порциями до возрастного объёма --- выписка домой.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Осложнения (Разумовский, с. 509)</b></h4></p>
<p style="margin:0 0 10px"><b>Осложнение</b>                                                 <b>Суть</b></p>
<p style="margin:0 0 10px"><b>Несостоятельность швов</b> на кишке при удалении энтерокисты   попадание кишечного содержимого в брюшную полость → <b>перитонит</b> : вздутие живота, лихорадка, интоксикация</p>
<p style="margin:0 0 10px"><b>Повреждение стенки желудка</b> при удалении дупликатуры        утечка желудочного содержимого → перитонит</p>
<p style="margin:0 0 10px">Парез кишечника                                                множественные уровни на рентгенограмме</p>
<p style="margin:0 0 10px"><b>Диагностика осложнений:</b> обзорная рентгенограмма стоя (свободный газ и жидкость, множественные уровни), УЗИ с оценкой перистальтики и жидкости. <b>Свободный газ = экстренная операция</b> с ревизией брюшной полости; при отсутствии пневмоперитонеума --- динамическое наблюдение, при неэффективности терапии за 12 ч --- операция. После удаления энтерокисты, расположенной на кишке, предпочтение --- <b>выведение кишечной стомы</b> ; при нарушении герметичности желудка --- ушивание и энтеральная пауза. <b>В любом случае операцию завершают дренированием брюшной полости.</b></p>`},
  {n:102, t:"Аппендицит у детей. Этиология и патогенез", a:`<p style="margin:0 0 10px">*Разумовский, гл. 20.1 (с. 305--306); Исаков, с. 578--580 (рис. 7-14).*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: червеобразный отросток фолликулярный аппарат каловый камень</b></p>
<p style="margin:0 0 10px"><b>деструктивные формы K35</b></p>
<p style="margin:0 0 10px"><b>Острый аппендицит</b> --- острое воспаление червеобразного отростка слепой кишки. Код МКБ-10: <b>K35</b> . Самое распространённое хирургическое заболевание живота у детей, приводящее к необходимости <b>экстренного</b> оперативного вмешательства; аппендэктомия составляет до <b>75 %</b> всех экстренных операций на органах брюшной полости у детей (Исаков).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Эпидемиология</b></h4></p>
<p style="margin:0 0 10px">• аппендицитом может заболеть ребёнок любого возраста, даже грудной и новорождённый, но <b>в первые 2 года --- редко</b> ; затем частота растёт и достигает <b>пика в 9--12 лет</b> ;</p>
<p style="margin:0 0 10px">• общая заболеваемость <b>3--6 на 1000 детей</b> ; девочки и мальчики болеют одинаково часто;</p>
<p style="margin:0 0 10px">• у детей аппендицит развивается <b>быстрее</b> , деструктивные изменения и аппендикулярный перитонит встречаются <b>значительно чаще, чем у взрослых</b> --- особенно в первые годы жизни.</p>
<p style="margin:0 0 10px">![](media/image120.jpg){width="2.5887095363079613in" height="1.9431955380577428in"}</p>
<p style="margin:0 0 10px">*Рис. 7-14 (И., с. 579). Заболеваемость аппендицитом у детей по возрасту: пик в 9--12 лет*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Этиология и патогенез</b></h4></p>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px"><b>ШАГ 1</b></span><span><b>ШАГ 2</b> | <b>ШАГ 3</b> | <b>ШАГ 4</b></span></div>
<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Собственная микрофлора отростка и кишки</span><span>Нарушение сосудистой трофики, обструкция | Инфицирование стенки, воспаление | Быстрая деструкция, перфорация</span></div>
<p style="margin:0 0 10px"><b>Фактор</b>                        <b>Суть (Р., И.)</b></p>
<p style="margin:0 0 10px"><b>Микрофлора</b>                    ведущая роль --- <b>собственная микрофлора</b> червеобразного отростка или кишечника; у небольшой группы детей нельзя исключить гематогенное или лимфогенное инфицирование</p>
<p style="margin:0 0 10px"><b>Возраст</b>                       чем младше ребёнок, тем <b>быстрее</b> развиваются деструктивно-некротические изменения в стенке отростка</p>
<p style="margin:0 0 10px"><b>Фолликулярный аппарат</b>         редкость аппендицита в первые годы жизни связывают с <b>малым количеством фолликулов</b> ; у грудных --- молочная жидкая пища</p>
<p style="margin:0 0 10px"><b>Слизистая</b>                     более проницаема для микрофлоры и токсических веществ, чем у взрослых: при нарушении сосудистой трофики → быстрое инфицирование и деструктивные формы</p>
<p style="margin:0 0 10px"><b>Предрасполагающие факторы</b>     перенесённые соматические и инфекционные болезни, <b>врождённые аномалии отростка</b> (перекруты, перегибы), <b>инородные тела и паразиты</b> , <b>каловые камни</b> ; особенности питания; <b>наследственный фактор</b> (Р.)</p>
<p style="margin:0 0 10px"><b>Особенности брюшной полости</b>   короткий и малоподвижный сальник, слабые пластические свойства брюшины → слабое отграничение процесса (поэтому перитонит чаще)</p>`},
  {n:103, t:"Аппендицит у детей. Клиника", a:`<p style="margin:0 0 10px">*Разумовский, гл. 20.1 (с. 306--307); Исаков, с. 580--583.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: боль в животе рвота температура атипичная локализация</b></p>
<p style="margin:0 0 10px"><b>тазовый аппендицит</b></p>
<p style="margin:0 0 10px">Клинические проявления аппендицита у детей <b>вариабельны</b> и зависят от реактивности организма, положения отростка и возраста. Общая характеристика: <b>преобладание общих неспецифических симптомов над местными</b> (незрелость ЦНС и вегетативной нервной системы; чем младше ребёнок, тем выраженнее).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Основные жалобы (старший возраст)</b></h4></p>
<p style="margin:0 0 10px"><b>Симптом</b>                            <b>Проявления</b></p>
<p style="margin:0 0 10px"><b>Боль в животе</b>                      нерезкая, но <b>постоянная</b> , чаще в правой подвздошной области; непрерывная, не исчезает, лишь стихает на время; нарушает сон (хуже всего --- первая ночь); при растяжении отростка гноем --- сильная, беспокойство, вынужденное положение; старшие дети указывают локализацию</p>
<p style="margin:0 0 10px"><b>Температура</b>                        вскоре после боли 37,5--38 °C; при осложнённых формах (перитонит, абсцесс) 39 °C и выше; <b>нормальная в ≈ 15 %</b> --- у 1/3 из них на операции грубая деструкция</p>
<p style="margin:0 0 10px"><b>Рвота</b>                              почти у <b>75 %</b> , рефлекторная; при разлитом перитоните многократная, с жёлчью</p>
<p style="margin:0 0 10px">Язык                                   вначале чистый, при токсикозе и эксикозе --- сухой, обложенный</p>
<p style="margin:0 0 10px"><b>Стул</b>                               задержка --- 35 %; жидкий (не ранее 2-х суток) --- ≈ 7 %</p>
<p style="margin:0 0 10px"><b>Диссоциация пульса и температуры</b>   редко (5--7 %), при запоздалом диагнозе с перитонитом</p>
<p style="margin:0 0 10px">Поведение                              ребёнок менее активен, отказывается от еды</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Атипичная локализация отростка (15 %): клиника меняется</b></h4></p>
<p style="margin:0 0 10px"><b>Положение отростка</b>              <b>Клиника</b></p>
<p style="margin:0 0 10px"><b>Низкое (тазовое)</b>                боль над лоном или правее, <b>схваткообразная</b> , <b>тенезмы</b> , жидкий стул (при проктите --- «плевки» слизи ± кровь), частое болезненное мочеиспускание</p>
<p style="margin:0 0 10px"><b>Ретроцекальное</b>                  боль умеренная (поздно вовлекается париетальная брюшина), особенно при толстом жировом слое</p>
<p style="margin:0 0 10px"><b>Медиальное</b> (у корня брыжейки)   сильная приступообразная боль, многократная рвота, жидкий стул, иногда вздутие кишечника</p>
<p style="margin:0 0 10px">На фоне <b>антибиотиков</b>            клиника стёрта, но деструкция продолжается → часто образуются <b>аппендикулярные абсцессы</b></p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Местные симптомы при осмотре</b></h4></p>
<p style="margin:0 0 10px">• <b>три основных симптома</b> в правой подвздошной области: <b>болезненность</b> при пальпации (симптом Филатова --- «локальная болезненность»), <b>защитное мышечное напряжение</b> (defense musculaire) и <b>симптом Щёткина--Блюмберга</b> ; остальные --- вспомогательные;</p>
<p style="margin:0 0 10px">• пальпацию начинают с левой подвздошной области против часовой стрелки; различают активное и пассивное напряжение;</p>
<p style="margin:0 0 10px">• ректальное исследование --- болезненность стенки справа и спереди, нависание свода.</p>`},
  {n:104, t:"Аппендицит у детей. Классификация", a:`<p style="margin:0 0 10px">*Разумовский, гл. 20.1 (с. 305), 20.2 (с. 315--316); Исаков, с. 579. Деление по морфологии и коды МКБ --- общие учебники.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: деструктивные формы катаральный флегмонозный гангренозный</b></p>
<p style="margin:0 0 10px"><b>аппендикулярный перитонит</b></p>
<p style="margin:0 0 10px">Предложено несколько клинико-морфологических классификаций; <b>в клинической практике целесообразно выделение двух основных групп изменений в отростке</b> (Р., И.):</p>
<p style="margin:0 0 10px"><b>Группа</b>                                     <b>Формы</b></p>
<p style="margin:0 0 10px"><b>1. Деструктивно-гнойные</b> формы воспаления   <b>флегмонозный</b> (ригидный, утолщённый, гиперемированный отросток с фибрином, рис. 20.1); <b>гангренозный</b> (некроз стенки, рис. 20.2); <b>гангренозно-перфоративный</b></p>
<p style="margin:0 0 10px"><b>2. Недеструктивные</b> изменения               <b>катаральные</b> формы; а также <b>хронический аппендицит</b> или обострение хронического</p>
<p style="margin:0 0 10px">*Недеструктивные формы --- наибольшая сложность для клинициста и морфолога: макроскопическая оценка субъективна; чаще за ними скрываются другие заболевания, симулирующие аппендицит (ОРВИ, кишечные инфекции, мезаденит).*</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Классификация по течению и осложнениям</b></h4></p>
<p style="margin:0 0 10px"><b>Критерий</b>                                 <b>Виды</b></p>
<p style="margin:0 0 10px"><b>По течению</b>                               <b>неосложнённый</b> и <b>осложнённый</b> (аппендикулярный инфильтрат, абсцесс, перитонит)</p>
<p style="margin:0 0 10px"><b>Аппендикулярный перитонит</b> (Р., с. 315)   <b>местный</b> : <b>отграниченный</b> (периаппендикулярный <b>инфильтрат</b> --- рыхлый (2--3 сут) и плотный; периаппендикулярный <b>абсцесс</b> ) и <b>неотграниченный</b> (затёк экссудата в правый латеральный канал и малый таз); <b>распространённый</b> : диффузный, разлитой, общий</p>
<p style="margin:0 0 10px"><b>По расположению отростка</b>                 типичное; <b>атипичное</b> (≈ 15 %): тазовое (низкое), ретроцекальное, медиальное, подпечёночное, левостороннее (при незавершённом повороте кишечника)</p>
<p style="margin:0 0 10px"><b>По возрасту</b> (Р., И.)                     аппендицит <b>новорождённых</b> , <b>раннего возраста</b> (первые годы), <b>старшего возраста</b> (школьники) --- различаются клиникой и тактикой</p>
<p style="margin:0 0 10px"><b>По морфологии</b> (общие учебники)           катаральный (поверхностный), флегмонозный, гангренозный, перфоративный; <b>МКБ-10</b> : K35.2 --- с генерализованным перитонитом, K35.3 --- с локализованным перитонитом, K35.8 --- другие и неуточнённые формы</p>
<p style="margin:0 0 10px"><b>Хронический</b> (Р., 20.3)                   первичный и вторичный (рецидивирующий, остаточный)</p>
<p style="margin:0 0 10px">*Деление на катаральный, флегмонозный, гангренозный и перфоративный --- классическая морфологическая схема из общих учебников; коды МКБ-10 даны по справочнику. В Разумовском и Исакове подчёркнуто, что эта схема менее важна в детском возрасте, чем деление на деструктивные и недеструктивные формы.*</p>`},
  {n:105, t:"Аппендицит у детей. Диагностика и дифференциальная диагностика", a:`<p style="margin:0 0 10px">*Разумовский, гл. 20.1 (с. 307--313); Исаков, с. 583--598.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: УЗИ аппендикса ректальное исследование лейкоцитоз</b></p>
<p style="margin:0 0 10px"><b>диагностическая лапароскопия ОРВИ, копростаз</b></p>
<p style="margin:0 0 10px"><b>Важно!</b> Диагноз острого аппендицита должен быть <b>подтверждён или исключён в течение суток</b> с момента госпитализации (Р.). У детей <b>никогда нельзя рассчитывать на отграничение</b> воспаления в отростке.</p>

<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Осмотр, пальпация, ректальное исследование</span><span>Анализ крови, УЗИ | Динамическое наблюдение в стационаре | Лапароскопия при неясности</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Диагностика</b></h4></p>
<p style="margin:0 0 10px"><b>Метод</b>                                       <b>Что находят</b></p>
<p style="margin:0 0 10px"><b>Осмотр и пальпация</b>                          болезненность в правой подвздошной области, защитное напряжение, Щёткин--Блюмберг; у малышей --- поведение ребёнка, мимика; сон; при беспокойстве --- осмотр во сне или после седации</p>
<p style="margin:0 0 10px"><b>Ректальное бимануальное</b> исследование        в трудных случаях (обязательно в И.): болезненность стенки справа и спереди, нависание свода, <b>аппендикулярный инфильтрат</b> ; у девочек --- киста яичника, перекрут, неустановившийся цикл</p>
<p style="margin:0 0 10px"><b>Анализ крови</b>                                ≈ 65 % --- лейкоцитоз 15--17×10⁹/л со сдвигом влево; гиперлейкоцитоз 20--30×10⁹/л у 7 %; остальные --- норма или ниже; у малышей чаще 15--20 и более ×10⁹/л</p>
<p style="margin:0 0 10px"><b>УЗИ</b> --- наиболее информативный метод (Р.)   <b>диаметр аппендикса \\> 5--6 мм</b> (до 6 лет), <b>\\> 6--7 мм</b> (школьники), <b>утолщение стенки</b> , <b>каловый камень</b> в просвете, <b>свободная жидкость</b> вокруг отростка и в брюшной полости; ценность \\> 90 %; инфильтрат и абсцесс</p>
<p style="margin:0 0 10px"><b>КТ</b> брюшной полости                          в диагностически сложных случаях, детально</p>
<p style="margin:0 0 10px"><b>Диагностическая лапароскопия</b>                если УЗИ не визуализирует отросток при клинике --- <b>окончательный диагноз в сложных случаях</b> ; одновременно лечебная</p>
<p style="margin:0 0 10px">Другие (И.)                                     электротермометрия, тепловидение, ЭМГ --- не достоверны; уровень диагностических ошибок остаётся высоким</p>
<p style="margin:0 0 10px"><b>Трудности:</b> дети школьного возраста иногда скрывают боль из страха операции или, наоборот, преувеличивают --- поэтому часть хирургов оперирует по расширенным показаниям (гипердиагностика, не всегда оправданная).</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика у детей старшего возраста (Р.)</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                                                                                                    <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>Желудочно-кишечные болезни</b> (кишечные инфекции, дизентерия, ЯК, гастродуоденит) --- 1-е место в ошибках   на первом плане диспепсия, быстрая интоксикация; <b>рвота приносит облегчение</b> ; живот мягкий, возможно активное напряжение, проходящее при осторожной пальпации; <b>Щёткин--Блюмберг отрицательный</b> ; ФЭГДС, колоноскопия</p>
<p style="margin:0 0 10px"><b>Болезни жёлчных путей</b>                                                                                    приступообразные боли в правом подреберье с иррадиацией; УЗИ</p>
<p style="margin:0 0 10px"><b>Заболевания мочевыделительной системы</b> (\\> 15 % ошибок)                                                   непродолжительные приступообразные боли (70 %), иррадиация в пах и половые органы; симптом Пастернацкого --- у ≈ 25 %; изменения в моче; УЗИ почек, урография</p>
<p style="margin:0 0 10px"><b>Гинекологические</b> (11--15 лет)                                                                            нерегулярные менструации, предменструальные боли, кисты яичников (боль в период овуляции, 2--3 дня до менструации); напряжение исчезает при осторожной пальпации; УЗИ, ректоабдоминальное исследование</p>
<p style="margin:0 0 10px"><b>Копростаз</b>                                                                                                задержка стула \\> 2 сут, общее состояние удовлетворительное, температура 37,3--37,6 °C, лейкоцитов норма; после клизмы живот мягкий</p>
<p style="margin:0 0 10px"><b>Мезаденит</b> , ОРВИ (Исаков)                                                                                катаральные симптомы, лимфоузлы на УЗИ</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Дифференциальная диагностика у детей раннего возраста (Р.)</b></h4></p>
<p style="margin:0 0 10px"><b>С чем</b>                       <b>Отличие</b></p>
<p style="margin:0 0 10px"><b>ОРВИ</b> --- 1-е место ошибок   острое начало, одутловатость, ринит, гиперемия зева; интоксикация не соответствует местным симптомам; живот мягкий</p>
<p style="margin:0 0 10px"><b>Копростаз</b>                   равномерное вздутие, боль чаще слева; после клизмы кал, газы, живот мягкий</p>
<p style="margin:0 0 10px"><b>Мочевые пороки и ИМП</b>        патология в моче</p>
<p style="margin:0 0 10px"><b>Острый отит</b>                 беспокойство ночью, крутит головой, давление на козелок вызывает плач; живот мягкий</p>
<p style="margin:0 0 10px"><b>Пневмония</b>                   дыхательные симптомы, срочный рентген грудной клетки</p>
<p style="margin:0 0 10px"><b>Инвагинация</b>                 схваткообразная боль, кровянистые выделения из прямой кишки; УЗИ, пневмоирригография</p>`},
  {n:106, t:"Аппендицит у детей. Лечение", a:`<p style="margin:0 0 10px">*Разумовский, гл. 20.1 (с. 313--315, рис. 20.3--20.7); Исаков, с. 598--599.*</p>
<p style="margin:0 0 10px"><b>КЛЮЧЕВЫЕ СЛОВА: аппендэктомия лигатурный способ лапароскопическая аппендэктомия</b></p>
<p style="margin:0 0 10px"><b>доступы петля Редера</b></p>
<p style="margin:0 0 10px"><b>Тактика активно хирургическая</b> --- принцип <b>ранней операции</b> : аппендэктомия (Р., И.). Обезболивание у детей, особенно раннего возраста, <b>только общее</b> ; важна психологическая подготовка (И.).</p>

<div style="display:flex;gap:12px;margin:4px 0;font-size:0.92em"><span style="font-weight:600;min-width:120px">Диагноз, подготовка, наркоз</span><span>Аппендэктомия: открытая / лапароскопическая | Лигатурный способ, санация | Антибиотики, наблюдение</span></div>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Хирургические доступы</b></h4></p>
<p style="margin:0 0 10px">• <b>Мак-Бернея--Волковича--Дьяконова</b> (косой разрез в правой подвздошной области) --- основной;</p>
<p style="margin:0 0 10px">• <b>Леннандера</b> (трансректальный) --- по показаниям;</p>
<p style="margin:0 0 10px">• <b>срединная лапаротомия</b> --- при очень запущенных аппендикулярных перитонитах у детей старшего возраста.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Способ обработки культи</b></h4></p>
<p style="margin:0 0 10px">• у детей обоснована <b>лигатурная аппендэктомия</b> (без погружения культи в кисетный шов): <b>не опаснее</b> погружного, но <b>короче по времени</b> и снижает риск перфорации стенки слепой кишки при наложении кисета --- у детей раннего возраста стенка тонкая;</p>
<p style="margin:0 0 10px">• избегают <b>деформации баугиниевой заслонки</b> (у малышей расположена близко к основанию отростка): кисет может вызвать недостаточность или стеноз.</p>
<p style="margin:0 0 10px"><b><h4 style="margin:14px 0 8px;color:#0d7377">Лапароскопическая аппендэктомия --- «золотой стандарт» (Р.)</b></h4></p>
<p style="margin:0 0 10px"><b>Этап (рис. 20.3--20.7)</b>   <b>Суть</b></p>
<p style="margin:0 0 10px">Электрокоагуляция брыжейки   биполярным коагулятором (рис. 20.3)</p>
<p style="margin:0 0 10px">Скелетизация отростка        от брыжейки до основания (рис. 20.4)</p>
<p style="margin:0 0 10px">Петли Редера                 на основание отростка (рис. 20.5)</p>
<p style="margin:0 0 10px">Облитерация просвета         биполярным коагулятором на 1 см выше места двух петель (рис. 20.6)</p>
<p style="margin:0 0 10px">Пересечение                  вне зоны коагуляции; <b>культя около 0,5 см</b> (рис. 20.7)</p>
